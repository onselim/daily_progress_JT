  await backToOverview(id); end3(id); legTags();
}
async function playOne3(mid) { if (!g3.data) return; const m = g3.data.meas.find((x) => x.id === mid); if (!m) return; const id = begin3(); setStep(m.ph); clearGhost(); if (!(await measure3(m, id, true))) return; await backToOverview(id); end3(id); legTags(); }

function loop3() {
  const f = () => { requestAnimationFrame(f); if (!g3.anim) { g3.ctrl.autoRotate = true; g3.ctrl.update(); } if (g3.tape) updateTape(g3.tape.k); updateTags(); g3.ren.render(g3.scene, g3.cam); };
  requestAnimationFrame(f);
}
for (const id of ['selProf']) $(id).addEventListener('change', () => { if (g3.ok) { stop3(); buildModel(); legTags(); } });
$('btnFree3').addEventListener('click', () => { stop3(); overviewNow(); });

// test hook: freeze one frame of a measurement (ph 'A' start close-up, 'F' follow shot at tape fraction k, 'B' end close-up, 'W' wide shot with the ΔH dimension)
window.__g3 = g3;
window.__g3t = { frame(mid, ph, k = 0.5) {
  const m = g3.data.meas.find((x) => x.id === mid), P = poses(m); g3.run++; g3.anim = true; g3.ctrl.enabled = false; makeTape(m); clearTags(); setHud('<b>' + m.name + '</b>');
  let pos = ph === 'A' ? P.cA : ph === 'B' ? P.cB : ph === 'W' ? P.wide : P.follow(k);
  g3.cam.position.copy(pos.pos); g3.ctrl.target.copy(pos.tgt); g3.cam.lookAt(pos.tgt); const kk = ph === 'A' ? 0 : ph === 'F' ? k : 1; const L = updateTape(kk); setRead(m, fmt(L, 1), true);
  if (ph === 'F') addTag(g3.tape.hp, `<b style="color:${hex6(KCOL3[m.kind])}">${fmt(L, 1)}</b> mm`, 'rd', null, true);
  if (ph === 'W' || ph === 'B') { const dim = dhDim(m); if (dim.length) addTag(dim.mid, `<b>ΔH = ${dHm(m.d)} m</b><br><span class="sub2">${tx('dhTag')}</span>`, 'h', [70, -30]); } return L; } };

// ------------------------------------------------------------------ boot (optional deep link: ?tip=B30&govde=12&le=0,1.5,0,-1.5  or  ?slug=...&kod=...)
(async function () {
  applyStatic();
  const q = new URLSearchParams(location.search);
  if ((q.get('slug') && q.get('kod')) || q.get('tip')) document.body.classList.add('deeplink');
  try { await ensureThree(); } catch (e) { $('note3').textContent = tx('libFail', { x: e.message }); }
  if (q.get('slug') && q.get('kod')) { $('tabProject').click(); $('inSlug').value = q.get('slug'); $('inCode').value = q.get('kod'); syncControls(); fetchTower(q.get('slug'), q.get('kod')); return; }
  if (q.get('tip') && TABLES[q.get('tip')]) S.type = q.get('tip');
  if (q.get('govde') != null) S.body = Number(q.get('govde'));
  if (q.get('le')) { const v = q.get('le').split(',').map(Number); if (v.length === 4 && v.every((x) => !isNaN(x))) S.le = v; }
  syncControls(); render(); setStep(0);
})();

</script>
