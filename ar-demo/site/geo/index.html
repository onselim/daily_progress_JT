<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR Konum Demo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
  :root { --bg:#0f1720; --panel:#16202b; --line:#2a3846; --fg:#e6edf3; --dim:#9fb0c0; --acc:#2f81f7; --warn:#ffb020; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; }
  #app { display:flex; flex-direction:column; height:100dvh; }
  #map { flex:1; min-height:200px; }
  #panel { background:var(--panel); border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); max-height:52%; overflow:auto; }
  .row { display:flex; gap:8px; margin-bottom:8px; }
  label { flex:1; font-size:11px; color:var(--dim); display:flex; flex-direction:column; gap:3px; }
  input { width:100%; background:#0d141b; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:9px 8px; font-size:15px; }
  button { font:inherit; color:#fff; background:#2a3846; border:0; border-radius:10px; padding:12px 14px; font-size:15px; }
  button.primary { background:var(--acc); font-weight:600; }
  .row button { flex:1; }
  #status { font-size:12px; color:var(--dim); line-height:1.5; }
  .pin { width:22px; height:22px; border-radius:50%; background:var(--warn); border:3px solid #fff; box-shadow:0 0 0 2px #0008; }

  /* AR overlay */
  #overlay { display:none; position:fixed; inset:0; pointer-events:none; font-size:14px; color:#fff; text-shadow:0 1px 3px #000; }
  #hud { position:absolute; top:calc(8px + env(safe-area-inset-top)); left:8px; right:8px; background:#000a; border-radius:10px; padding:8px 10px; line-height:1.45; }
  #cross { position:absolute; left:50%; top:50%; width:26px; height:26px; margin:-13px 0 0 -13px; border:2px solid #fff8; border-radius:50%; }
  #ctl { position:absolute; left:8px; right:8px; bottom:calc(8px + env(safe-area-inset-bottom)); pointer-events:auto; }
  #ctl .bar { display:flex; gap:8px; }
  #ctl button { flex:1; background:#000b; padding:11px 6px; font-size:14px; }
  #adjust { display:none; background:#000c; border-radius:10px; padding:8px; margin-bottom:8px; }
  #adjust .r { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  #adjust .r span { width:92px; font-size:12px; }
  #adjust .r button { padding:9px 0; font-size:13px; background:#2a3846; }
  #adjust .full { width:100%; margin-bottom:6px; padding:9px; font-size:13px; background:#2a3846; }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="panel">
    <div class="row">
      <label>Enlem (lat)<input id="lat" inputmode="decimal"></label>
      <label>Boylam (lng)<input id="lng" inputmode="decimal"></label>
    </div>
    <div class="row">
      <label>En (m)<input id="w" inputmode="decimal"></label>
      <label>Boy (m)<input id="d" inputmode="decimal"></label>
      <label>Yükseklik (m)<input id="h" inputmode="decimal"></label>
      <label>Yön (°)<input id="rot" inputmode="decimal"></label>
    </div>
    <div class="row">
      <button id="btnHere">📍 Konumuma koy</button>
      <button id="btnAR" class="primary">▶ AR'ı başlat</button>
    </div>
    <div id="status">GPS bekleniyor…</div>
  </div>
</div>

<div id="overlay">
  <div id="hud">Hazırlanıyor…</div>
  <div id="cross"></div>
  <div id="ctl">
    <div id="adjust">
      <div class="r"><span>Yön (°)</span><button data-k="rot" data-v="-5">-5</button><button data-k="rot" data-v="-1">-1</button><button data-k="rot" data-v="1">+1</button><button data-k="rot" data-v="5">+5</button></div>
      <div class="r"><span>Doğu-Batı (m)</span><button data-k="e" data-v="-5">-5</button><button data-k="e" data-v="-1">-1</button><button data-k="e" data-v="1">+1</button><button data-k="e" data-v="5">+5</button></div>
      <div class="r"><span>Kuzey-Güney (m)</span><button data-k="n" data-v="-5">-5</button><button data-k="n" data-v="-1">-1</button><button data-k="n" data-v="1">+1</button><button data-k="n" data-v="5">+5</button></div>
      <div class="r"><span>Yükseklik (m)</span><button data-k="up" data-v="-1">-1</button><button data-k="up" data-v="-0.1">-0.1</button><button data-k="up" data-v="0.1">+0.1</button><button data-k="up" data-v="1">+1</button></div>
      <button class="full" id="btnGround">Zemine oturt (artıyı zemine tut, bas)</button>
      <button class="full" id="btnNorth">Şu an tam kuzeye bakıyorum</button>
    </div>
    <div class="bar">
      <button id="btnRecal">Yeniden kalibre</button>
      <button id="btnAdj">Ayarlar ▴</button>
      <button id="btnExit">Çık</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

const R = 6378137, rad = Math.PI / 180, deg = 180 / Math.PI;
const $ = (id) => document.getElementById(id);

// ---------- state ----------
const DEFAULT = { lat: 41.0082, lng: 28.9784, w: 15, d: 15, h: 25, rot: 0 };
const S = { ...DEFAULT };
let hadSaved = false;
try {
  const saved = JSON.parse(localStorage.getItem('arGeoState') || 'null');
  if (saved && isFinite(saved.lat) && isFinite(saved.lng)) { Object.assign(S, saved); hadSaved = true; }
} catch (e) {}
const save = () => { try { localStorage.setItem('arGeoState', JSON.stringify(S)); } catch (e) {} };

// ---------- geo math ----------
const enuFrom = (lat0, lng0, lat, lng) => ({
  e: (lng - lng0) * rad * R * Math.cos(lat0 * rad),
  n: (lat - lat0) * rad * R,
});
const offsetLatLng = (lat, lng, e, n) => [lat + n / (rad * R), lng + e / (rad * R * Math.cos(lat * rad))];
const wrapPi = (a) => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };

// ---------- GPS ----------
let fix = null;
if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition((p) => {
    fix = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() };
    if (!hadSaved && !userMarkerInit) { hadSaved = true; const [la, ln] = offsetLatLng(fix.lat, fix.lng, 0, 30); setPos(la, ln, true); }
    updateUser(); updateStatus();
  }, (err) => { $('status').textContent = 'GPS hatası: ' + err.message; },
  { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}
let userMarkerInit = false;

// ---------- compass ----------
let heading = null, headingT = 0, haveAbs = false;
function compassHeading(alpha, beta, gamma) {
  const x = beta * rad, y = gamma * rad, z = alpha * rad;
  const cY = Math.cos(y), cZ = Math.cos(z), sX = Math.sin(x), sY = Math.sin(y), sZ = Math.sin(z);
  const Vx = -cZ * sY - sZ * sX * cY;
  const Vy = -sZ * sY + cZ * sX * cY;
  let h = Math.atan(Vx / Vy);
  if (Vy < 0) h += Math.PI; else if (Vx < 0) h += 2 * Math.PI;
  return h * deg;
}
function onOrient(ev) {
  if (ev.alpha == null || ev.beta == null || ev.gamma == null) return;
  heading = compassHeading(ev.alpha, ev.beta, ev.gamma);
  headingT = performance.now();
}
window.addEventListener('deviceorientationabsolute', (e) => { haveAbs = true; onOrient(e); }, true);
window.addEventListener('deviceorientation', (e) => { if (!haveAbs && e.absolute) onOrient(e); }, true);

// ---------- map ----------
const map = L.map('map', { zoomControl: true }).setView([S.lat, S.lng], 17);
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Esri' });
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
sat.addTo(map);
L.control.layers({ 'Uydu': sat, 'Harita': osm }, null, { position: 'topright' }).addTo(map);

const marker = L.marker([S.lat, S.lng], { draggable: true, icon: L.divIcon({ className: '', html: '<div class="pin"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(map);
const footprint = L.polygon([], { color: '#ffb020', weight: 2, fillOpacity: 0.25 }).addTo(map);
const userDot = L.circleMarker([0, 0], { radius: 7, color: '#fff', weight: 2, fillColor: '#2f81f7', fillOpacity: 1 });
const userAcc = L.circle([0, 0], { radius: 1, color: '#2f81f7', weight: 1, fillOpacity: 0.1 });

function updateUser() {
  if (!fix) return;
  if (!userMarkerInit) { userDot.addTo(map); userAcc.addTo(map); userMarkerInit = true; }
  userDot.setLatLng([fix.lat, fix.lng]); userAcc.setLatLng([fix.lat, fix.lng]).setRadius(fix.acc);
}
function updateFootprint() {
  const hw = S.w / 2, hd = S.d / 2, r = S.rot * rad;
  const pts = [[-hw, -hd], [hw, -hd], [hw, hd], [-hw, hd]].map(([x, y]) => {
    const e = x * Math.cos(r) + y * Math.sin(r), n = -x * Math.sin(r) + y * Math.cos(r);
    return offsetLatLng(S.lat, S.lng, e, n);
  });
  footprint.setLatLngs(pts);
}
function refreshInputs() {
  $('lat').value = S.lat.toFixed(7); $('lng').value = S.lng.toFixed(7);
  $('w').value = S.w; $('d').value = S.d; $('h').value = S.h; $('rot').value = S.rot;
}
function setPos(lat, lng, recenter) {
  S.lat = lat; S.lng = lng; marker.setLatLng([lat, lng]);
  if (recenter) map.setView([lat, lng], Math.max(map.getZoom(), 18));
  refreshInputs(); updateFootprint(); save(); updateStatus();
}
marker.on('dragend', () => { const p = marker.getLatLng(); setPos(p.lat, p.lng, false); });
map.on('click', (e) => setPos(e.latlng.lat, e.latlng.lng, false));

const num = (id, fb) => { const v = parseFloat(String($(id).value).replace(',', '.')); return isFinite(v) ? v : fb; };
$('lat').addEventListener('change', () => {
  const m = $('lat').value.trim().match(/^(-?\d+(?:[.,]\d+)?)\s*[,; ]\s*(-?\d+(?:[.,]\d+)?)$/);
  if (m) { setPos(parseFloat(m[1].replace(',', '.')), parseFloat(m[2].replace(',', '.')), true); return; }
  setPos(num('lat', S.lat), S.lng, true);
});
$('lng').addEventListener('change', () => setPos(S.lat, num('lng', S.lng), true));
for (const k of ['w', 'd', 'h', 'rot']) {
  $(k).addEventListener('change', () => { S[k] = Math.max(k === 'rot' ? -360 : 0.1, num(k, S[k])); refreshInputs(); updateFootprint(); save(); });
}
$('btnHere').addEventListener('click', () => {
  if (!fix) { alert('GPS konumu henüz alınamadı. Konum iznini ve GPS\'i kontrol et.'); return; }
  setPos(fix.lat, fix.lng, true);
});

let xrSupported = false;
function updateStatus() {
  const parts = [];
  parts.push(fix ? `GPS: ±${fix.acc.toFixed(0)} m` : 'GPS bekleniyor…');
  if (fix) { const o = enuFrom(fix.lat, fix.lng, S.lat, S.lng); parts.push(`Binaya uzaklık: ${Math.hypot(o.e, o.n).toFixed(0)} m`); }
  parts.push(xrSupported ? 'AR: hazır' : 'AR: bu tarayıcıda yok (Android Chrome kullan)');
  $('status').textContent = parts.join(' · ');
}
refreshInputs(); updateFootprint(); updateStatus();
if (navigator.xr) navigator.xr.isSessionSupported('immersive-ar').then((ok) => { xrSupported = ok; updateStatus(); }).catch(() => {});

// ---------- AR ----------
let renderer, scene, camera, group, session = null, hitSource = null;
let cal = null, origin = null, thetaN = 0, calQuality = null, noCompass = false;
let groundY = 0, wantGround = false, lastHitY = null;
const adj = { e: 0, n: 0, up: 0, rot: 0 };
const q = new THREE.Quaternion(), fwd = new THREE.Vector3();
let camYaw = 0, camPos = { x: 0, y: 0, z: 0 }, level = false, lastHud = 0;

function buildModel() {
  group.clear();
  const { w, d, h } = S;
  const box = new THREE.BoxGeometry(w, h, d); box.translate(0, h / 2, 0);
  group.add(new THREE.Mesh(box, new THREE.MeshBasicMaterial({ color: 0xffb020, transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false })));
  group.add(new THREE.LineSegments(new THREE.EdgesGeometry(box), new THREE.LineBasicMaterial({ color: 0xffd166 })));
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ color: 0x2f81f7, transparent: true, opacity: 0.45, side: THREE.DoubleSide, depthWrite: false }));
  plate.rotation.x = -Math.PI / 2; plate.position.y = 0.03; group.add(plate);
  const red = new THREE.LineBasicMaterial({ color: 0xff3b30 });
  const line = (a, b) => new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a), new THREE.Vector3(...b)]), red);
  group.add(line([-3, 0.05, 0], [3, 0.05, 0]), line([0, 0.05, -3], [0, 0.05, 3]), line([0, 0, 0], [0, h + 15, 0]));
}

function initThree() {
  if (renderer) return;
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local-floor');
  const c = renderer.domElement;
  Object.assign(c.style, { position: 'fixed', left: '0', top: '0', width: '1px', height: '1px', opacity: '0', pointerEvents: 'none' });
  document.body.appendChild(c);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, 1, 0.1, 3000);
  group = new THREE.Group(); scene.add(group);
}

function startCal() {
  cal = { t0: performance.now(), tDate: Date.now(), n: 0, sx: 0, sy: 0, gw: 0, glat: 0, glng: 0, lastFix: 0 };
  origin = null; calQuality = null; noCompass = false;
}

function finishCal() {
  let lat, lng;
  if (cal.gw > 0) { lat = cal.glat / cal.gw; lng = cal.glng / cal.gw; } else { lat = fix.lat; lng = fix.lng; }
  if (cal.n >= 15) {
    thetaN = Math.atan2(cal.sy, cal.sx);
    calQuality = Math.hypot(cal.sx, cal.sy) / cal.n;
  } else { thetaN = camYaw; noCompass = true; }
  origin = { lat, lng, x: camPos.x, z: camPos.z };
  cal = null;
}

function frame(t, xrFrame) {
  if (!xrFrame) return;
  const ref = renderer.xr.getReferenceSpace();
  const pose = xrFrame.getViewerPose(ref);
  if (pose) {
    const o = pose.transform.orientation, p = pose.transform.position;
    q.set(o.x, o.y, o.z, o.w); fwd.set(0, 0, -1).applyQuaternion(q);
    camYaw = Math.atan2(fwd.x, -fwd.z); level = Math.abs(fwd.y) < 0.6;
    camPos = { x: p.x, y: p.y, z: p.z };
  }
  if (hitSource) {
    const res = xrFrame.getHitTestResults(hitSource);
    lastHitY = res.length ? res[0].getPose(ref).transform.position.y : null;
    if (wantGround && lastHitY != null) { groundY = lastHitY; wantGround = false; }
  }

  const now = performance.now();
  if (cal && pose) {
    if (level && heading != null && now - headingT < 500) {
      const off = camYaw - heading * rad; cal.sx += Math.cos(off); cal.sy += Math.sin(off); cal.n++;
    }
    if (fix && fix.t > cal.tDate && fix.t !== cal.lastFix) {
      const w = 1 / Math.max(fix.acc, 3) ** 2; cal.gw += w; cal.glat += fix.lat * w; cal.glng += fix.lng * w; cal.lastFix = fix.t;
    }
    const el = (now - cal.t0) / 1000;
    if (fix && (el >= 6 && cal.n >= 15 || el >= 10)) finishCal();
  }

  let rel = 0, dist = 0, bearing = 0;
  if (origin) {
    const en = enuFrom(origin.lat, origin.lng, S.lat, S.lng);
    const e = en.e + adj.e, n = en.n + adj.n, tn = thetaN + adj.rot * rad;
    dist = Math.hypot(e, n); bearing = Math.atan2(e, n);
    const yaw = tn + bearing;
    group.position.set(origin.x + dist * Math.sin(yaw), groundY + adj.up, origin.z - dist * Math.cos(yaw));
    group.rotation.y = -(tn + S.rot * rad);
    group.visible = true;
    rel = wrapPi(yaw - camYaw);
  } else group.visible = false;

  renderer.render(scene, camera);

  if (now - lastHud > 250) {
    lastHud = now;
    let s;
    if (cal) {
      const el = Math.min(6, (now - cal.t0) / 1000);
      s = `Kalibrasyon… ${el.toFixed(0)}/6 sn. Telefonu dik tut, ufka bak, kıpırdama.<br>GPS: ${fix ? '±' + fix.acc.toFixed(0) + ' m' : 'yok'} · Pusula: ${heading != null ? 'var' : 'yok'}`;
    } else {
      const dir = Math.abs(rel) < 0.35 ? 'önünde' : (rel > 0 ? `sağında ${(rel * deg).toFixed(0)}°` : `solunda ${(-rel * deg).toFixed(0)}°`);
      s = `Bina ${dist.toFixed(0)} m uzakta, ${dir}<br>GPS ±${fix ? fix.acc.toFixed(0) : '?'} m · ` +
        (noCompass ? '⚠ Pusula yok: kuzeye bakıp Ayarlar › "Şu an tam kuzeye bakıyorum"' : `Pusula tutarlılığı %${(calQuality * 100).toFixed(0)}${calQuality < 0.9 ? ' ⚠ düşük, yeniden kalibre et' : ''}`);
    }
    $('hud').innerHTML = s;
  }
}

async function startAR() {
  if (!xrSupported) { alert('Bu tarayıcı/telefon AR desteklemiyor. Android\'de Chrome ile aç.'); return; }
  if (!fix) { alert('GPS konumu henüz alınamadı. Birkaç saniye bekle ve tekrar dene.'); return; }
  initThree(); buildModel();
  const overlay = $('overlay');
  try {
    session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['local-floor'], optionalFeatures: ['hit-test', 'dom-overlay'], domOverlay: { root: overlay },
    });
  } catch (err) { alert('AR başlatılamadı: ' + err.message); return; }
  overlay.style.display = 'block';
  session.addEventListener('end', onEnd);
  await renderer.xr.setSession(session);
  try {
    const vs = await session.requestReferenceSpace('viewer');
    hitSource = await session.requestHitTestSource({ space: vs });
  } catch (e) { hitSource = null; }
  groundY = 0; wantGround = false; adj.e = adj.n = adj.up = adj.rot = 0;
  startCal();
  renderer.setAnimationLoop(frame);
}
function onEnd() {
  renderer.setAnimationLoop(null); session = null; hitSource = null;
  $('overlay').style.display = 'none'; $('adjust').style.display = 'none'; $('btnAdj').textContent = 'Ayarlar ▴';
  if (renderer) renderer.xr.setSession(null);
  updateStatus();
}

$('btnAR').addEventListener('click', startAR);
$('btnExit').addEventListener('click', () => { if (session) session.end(); });
$('btnRecal').addEventListener('click', () => { startCal(); });
$('btnAdj').addEventListener('click', () => {
  const a = $('adjust'), open = a.style.display === 'block';
  a.style.display = open ? 'none' : 'block'; $('btnAdj').textContent = open ? 'Ayarlar ▴' : 'Ayarlar ▾';
});
$('btnGround').addEventListener('click', () => { if (hitSource) wantGround = true; else alert('Bu telefonda zemin ölçümü yok; yükseklik düğmelerini kullan.'); });
$('btnNorth').addEventListener('click', () => { if (origin) { thetaN = camYaw; adj.rot = 0; noCompass = false; calQuality = 1; } });
$('adjust').addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-k]'); if (!b) return;
  adj[b.dataset.k] = +(adj[b.dataset.k] + parseFloat(b.dataset.v)).toFixed(2);
});
$('overlay').addEventListener('beforexrselect', (e) => e.preventDefault());

// exposed for offline math checks
window.__geo = { enuFrom, offsetLatLng, compassHeading };
</script>
</body>
</html>
