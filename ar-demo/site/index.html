<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Direk Demo</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0f1720; color: #e6edf3; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 14px 16px 6px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0; font-size: 14px; color: #9fb0c0; }
  model-viewer { flex: 1; width: 100%; --poster-color: transparent; }
  .ar-btn {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #2f81f7; color: #fff; border: 0; border-radius: 999px;
    padding: 14px 26px; font-size: 16px; font-weight: 600;
  }
</style>
</head>
<body>
<header>
  <h1>500 kV direk &ndash; AR demo</h1>
  <p>Parmakla döndür, iki parmakla yakınlaştır. Alttaki butonla kameranda gör.</p>
</header>

<model-viewer
  src="tower.glb"
  alt="Enerji nakil hattı direği 3D modeli"
  ar
  ar-modes="scene-viewer webxr"
  ar-scale="auto"
  ar-placement="floor"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  environment-image="neutral"
  exposure="1.1"
  camera-orbit="30deg 75deg auto">
  <button slot="ar-button" class="ar-btn">AR'da göster (kamerayı aç)</button>
</model-viewer>
</body>
</html>
