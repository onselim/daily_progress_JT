<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR Sinema</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
  :root { --bg:#08121a; --panel:#111e29; --line:#22384a; --fg:#e8f1f7; --dim:#9db4c4; --acc:#2f9bf7; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; overflow:hidden; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center; gap:14px; padding:24px; max-width:520px; margin:0 auto;
    background:radial-gradient(ellipse at 50% 20%, #12384b 0%, #08121a 70%); }
  h1 { margin:0; font-size:26px; } p { margin:0; color:var(--dim); font-size:14px; line-height:1.5; }
  button { font:inherit; color:#fff; background:#22384a; border:0; border-radius:12px; padding:14px 16px; font-size:16px; }
  button.primary { background:var(--acc); font-weight:600; }
  label { font-size:12px; color:var(--dim); display:flex; flex-direction:column; gap:4px; }
  select, input[type=file] { background:#0c1720; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:14px; }
  #canvasHost { position:fixed; inset:0; z-index:0; }
  #start { z-index:10; }
  #overlay { z-index:30; display:none; position:fixed; inset:0; pointer-events:none; color:#fff; text-shadow:0 1px 3px #000; font-size:14px; }
  #hint { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:10px; right:10px; background:#000a; border-radius:10px; padding:8px 10px; transition:opacity 1s; }
  #bar { position:absolute; left:8px; right:8px; bottom:calc(8px + env(safe-area-inset-bottom)); display:flex; gap:6px; pointer-events:auto; }
  #bar button { flex:1; background:#000b; padding:12px 2px; font-size:13px; }
  #pv { z-index:20; display:none; position:fixed; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); gap:6px; }
  #pv button { flex:1; background:#000b; padding:11px 4px; font-size:13px; }
  #pvHint { z-index:20; pointer-events:none; display:none; position:fixed; top:10px; left:10px; right:10px; background:#000a; border-radius:10px; padding:8px 10px; font-size:13px; }
</style>
</head>
<body>
<div id="start">
  <h1>🌊 AR Sinema</h1>
  <p>Ortada dur. Etrafında <b>360°'lik silindir bir perde</b> belirir. Telefonu çevirerek çevreni seyret.</p>
  <label>Perde
    <select id="mode">
      <option value="fall">Şelale (üretilmiş, gerçek zamanlı)</option>
      <option value="video">Kendi 360° videom ya da fotoğrafım</option>
    </select>
  </label>
  <div id="vidBox" style="display:none;flex-direction:column;gap:10px">
    <label>Video ya da fotoğraf dosyası<input type="file" id="vidFile" accept="video/*,image/*"></label>
    <label>Görüntü türü
      <select id="vidKind">
        <option value="sphere">360° eşdikdörtgen (2:1), tam küre: yukarı ve aşağı da görünür (önerilen)</option>
        <option value="equi">360° eşdikdörtgen, silindir perde (orta bant)</option>
        <option value="pano">Geniş panorama (tüm kare silindire sarılır)</option>
      </select>
    </label>
  </div>
  <label>Görüntü kalitesi
    <select id="quality">
      <option value="high" selected>Yüksek: ekranın tam çözünürlüğü (önerilen)</option>
      <option value="ultra">En yüksek: tam çözünürlükten de yüksek (güçlü telefon)</option>
      <option value="std">Standart: hızlı, daha düşük çözünürlük</option>
    </select>
  </label>
  <button class="primary" id="btnAR">▶ AR'da başlat</button>
  <button id="btnPreview">🖥 Önizleme (kamerasız, sürükleyerek bak)</button>
  <p id="msg"></p>
  <p id="ready" style="font-size:11px;opacity:.6">yükleniyor…</p>
</div>
<script>window.addEventListener("error",function(e){var m=document.getElementById("msg");if(m)m.textContent="⚠ Hata: "+(e.message||"betik yüklenemedi");});</script>

<div id="canvasHost"></div>
<div id="pvHint">Sürükleyerek çevrene bak.</div>
<div id="pv"><button id="pvSound">🔊 Ses</button><button id="pvExit">Çık</button></div>

<div id="overlay">
  <div id="stat" style="position:absolute;left:10px;bottom:calc(64px + env(safe-area-inset-bottom));font-size:11px;opacity:.75;background:#0007;border-radius:6px;padding:2px 6px"></div>
  <div id="hint">Perdenin tam ortasındasın. Etrafına bak. Ortada durursan en iyisi.</div>
  <div id="bar">
    <button id="bSound">🔊 Ses</button>
    <button id="bCenter">⟲ Ortala</button>
    <button id="bDown">Zemin −</button>
    <button id="bUp">Zemin +</button>
    <button id="bExit">Çık</button>
  </div>
</div>

<script type="module" onerror="document.getElementById('msg').textContent='⚠ Betik yüklenemedi (internet / CDN engeli olabilir).'">
import * as THREE from 'three';
const $ = (id) => document.getElementById(id);
const R = 8, H = 9.5, EYE_DEFAULT = 1.5, SPHERE_YAW = Math.PI / 2;   // SPHERE_YAW turns the video's centre to the front

// ---------------------------------------------------------------- shaders
const NOISE = /* glsl */`
float hash13(vec3 p3){ p3 = fract(p3 * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float n3(vec3 p){
  vec3 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(hash13(i), hash13(i+vec3(1,0,0)), f.x), mix(hash13(i+vec3(0,1,0)), hash13(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(hash13(i+vec3(0,0,1)), hash13(i+vec3(1,0,1)), f.x), mix(hash13(i+vec3(0,1,1)), hash13(i+vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm3(vec3 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * n3(p); p = p*2.02 + vec3(3.1,1.7,5.3); a *= 0.5; } return s; }
vec3 hsv2rgb(vec3 c){ vec3 p = abs(fract(c.xxx + vec3(1.0,2.0/3.0,1.0/3.0))*6.0 - 3.0); return c.z * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), c.y); }
`;
const uni = {
  uTime: { value: 0 }, uSun: { value: new THREE.Vector3(0, 0.5, 0.866).normalize() }, uR: { value: R },
  uFalls: { value: [[0.0, 3.2], [0.95, 1.0], [1.75, 1.7], [2.65, 1.1], [3.5, 2.1], [4.35, 1.0], [5.4, 1.8]].map(([a, w]) => new THREE.Vector2(a, w)) },
};
const vs = /* glsl */`varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;

const SKY_FS = /* glsl */`
precision highp float; varying vec3 vP; uniform float uTime; uniform vec3 uSun;
${NOISE}
void main(){
  vec3 d = normalize(vP); float e = d.y;
  vec3 hor = vec3(0.99,0.78,0.60), mid = vec3(0.46,0.69,0.96), zen = vec3(0.07,0.22,0.60);
  vec3 sky = mix(hor, mid, smoothstep(0.0, 0.32, e)); sky = mix(sky, zen, smoothstep(0.28, 0.9, e));
  float sd = max(dot(d, uSun), 0.0);
  sky += vec3(1.0,0.86,0.62) * (pow(sd, 900.0) * 6.0 + pow(sd, 14.0) * 0.30);
  vec2 uv = d.xz / (e + 0.28) * 1.3 + vec2(uTime * 0.012, 0.0);
  float cl = smoothstep(0.50, 0.88, fbm3(vec3(uv * 1.2, uTime * 0.02))) * smoothstep(0.02, 0.28, e);
  sky = mix(sky, vec3(1.0,0.97,0.93) * (0.88 + 0.35 * pow(sd, 3.0)), cl * 0.8);
  sky = mix(sky, vec3(0.08,0.20,0.24), 1.0 - smoothstep(-0.25, 0.0, e));
  gl_FragColor = vec4(sky, 1.0);
}`;

const WALL_FS = /* glsl */`
precision highp float; varying vec3 vP; uniform float uTime, uR; uniform vec3 uSun; uniform vec2 uFalls[7];
${NOISE}
void main(){
  vec3 p = vP; float y = p.y;
  float th = atan(p.x, -p.z); vec2 c = vec2(sin(th), cos(th));
  float top = 5.7 + 3.0 * fbm3(vec3(c * 1.4, 3.7));

  // nearest waterfall
  float bd = 40.0, halfW = 1.0;   // distance to the nearest fall centre (always tracked, so nothing jumps at the edge)
  for (int i = 0; i < 7; i++) {
    float d = abs(atan(sin(th - uFalls[i].x), cos(th - uFalls[i].x))) * uR;
    if (d < bd) { bd = d; halfW = uFalls[i].y; }
  }
  float best = 1.0 - smoothstep(halfW * 0.55, halfW * 1.15, bd);
  top -= 0.9 * best;
  float alpha = smoothstep(0.0, 0.07, top - y);
  if (alpha < 0.01) discard;

  // rock with fake relief lighting
  vec3 sc = vec3(1.1, 1.7, 1.1); float e = 0.09;
  vec3 rad = normalize(vec3(p.x, 0.0, p.z)), tg = vec3(-rad.z, 0.0, rad.x);
  float r = fbm3(p * sc), rT = fbm3((p + tg * e) * sc), rY = fbm3((p + vec3(0.0, e, 0.0)) * sc);
  vec3 n = normalize(-rad - tg * (rT - r) / e * 1.1 - vec3(0.0, 1.0, 0.0) * (rY - r) / e * 1.1);
  float light = 0.55 + 0.65 * pow(clamp(dot(n, uSun) * 0.5 + 0.5, 0.0, 1.0), 1.3) + 0.12 * n.y;
  float strata = n3(vec3(p.x * 0.3, y * 3.4, p.z * 0.3));
  vec3 rock = mix(vec3(0.15,0.13,0.12), vec3(0.50,0.44,0.37), r) * (0.72 + 0.55 * strata) * (0.85 + 0.15 * n3(p * vec3(6.0, 9.0, 6.0)) + 0.14 * n3(p * vec3(19.0, 27.0, 19.0)));
  float moss = smoothstep(0.52, 0.76, n3(p * 0.85 + 7.0)) * (0.35 + 0.65 * smoothstep(0.0, top, y));
  rock = mix(rock, vec3(0.08,0.27,0.10), moss * 0.75);
  float veg = smoothstep(top - 1.7, top - 0.1, y);
  rock = mix(rock, vec3(0.05,0.20,0.07) * (0.55 + 0.9 * n3(p * 2.3)), veg * 0.85);
  rock *= mix(1.0, 0.55, 1.0 - smoothstep(halfW * 0.5, halfW + 3.0, bd));            // wet near the falls
  vec3 col = rock * light * (0.55 + 0.45 * smoothstep(0.0, 2.5, y));

  // the falling water
  float x0 = bd / halfW;
  float wob = (n3(vec3(c * 6.0, y * 0.6 - uTime * 0.2)) - 0.5) * 0.4;
  float body = (1.0 - smoothstep(0.55, 1.0, x0 + wob * (0.4 + 0.6 * x0)));
  body *= (1.0 - smoothstep(top - 0.5, top + 0.05, y)) * smoothstep(-0.1, 0.25, y) * best;
  // + uTime: the noise pattern slides toward smaller y, i.e. the water falls
  float s1 = n3(vec3(p.x * 2.6, y * 0.55 + uTime * 3.2, p.z * 2.6));
  float s2 = n3(vec3(p.x * 8.0, y * 1.7 + uTime * 8.5, p.z * 8.0));
  float s3 = n3(vec3(p.x * 22.0, y * 4.0 + uTime * 15.0, p.z * 22.0));
  float streak = 0.5 * s1 + 0.3 * s2 + 0.2 * s3;
  vec3 deep = vec3(0.05,0.30,0.38), mid = vec3(0.46,0.80,0.88), foam = vec3(0.96,0.985,1.0);
  float f = clamp(streak * 1.3 - 0.20 + 0.26 * (1.0 - x0) * (0.4 + 0.6 * s1), 0.0, 1.0);
  vec3 wc = mix(deep, mid, smoothstep(0.20, 0.65, f)); wc = mix(wc, foam, smoothstep(0.66, 1.0, f));
  wc = mix(wc, foam, smoothstep(top - 1.1, top, y) * 0.55);
  float baseFoam = (1.0 - smoothstep(0.0, 1.6, y)) * (0.5 + 0.5 * n3(vec3(p.x * 4.0, y * 3.0 - uTime * 2.0, p.z * 4.0)));
  wc = mix(wc, foam, baseFoam);
  wc *= 0.78 + 0.5 * light; wc += pow(s3, 9.0) * 2.2;                             // sparkle
  col = mix(col, wc, clamp(body * 0.97, 0.0, 1.0));

  // spray / mist
  float prox = exp(-pow(max(bd - halfW * 0.3, 0.0) / 2.8, 2.0));
  float mn = fbm3(vec3(p.x * 0.35, y * 0.30 - uTime * 0.25, p.z * 0.35));
  float mist = clamp(prox * exp(-y * 0.36) * (0.30 + 0.9 * mn) * 1.0, 0.0, 0.70);
  col = mix(col, vec3(0.87,0.93,0.98) * (0.62 + 0.5 * light), mist);

  // rainbow opposite the sun, living in the spray
  vec3 dir = normalize(p - vec3(0.0, 1.5, 0.0));
  float ang = degrees(acos(clamp(dot(dir, -uSun), -1.0, 1.0)));
  float rb = smoothstep(39.8, 40.6, ang) * (1.0 - smoothstep(42.6, 43.6, ang));
  vec3 rc = hsv2rgb(vec3(0.76 * (1.0 - clamp((ang - 40.2) / 3.2, 0.0, 1.0)), 0.9, 1.0));
  col += rc * rb * (0.08 + 0.95 * mist) * 0.9;

  col = pow(clamp(col, 0.0, 1.0), vec3(0.95));
  gl_FragColor = vec4(col, alpha);
}`;

const FLOOR_FS = /* glsl */`
precision highp float; varying vec3 vP; uniform float uTime, uR; uniform vec3 uSun; uniform vec2 uFalls[7];
${NOISE}
void main(){
  vec2 p = vP.xz; float rr = length(p); if (rr > uR + 0.05) discard;
  vec3 col = mix(vec3(0.03,0.16,0.21), vec3(0.10,0.42,0.47), smoothstep(uR * 0.35, uR, rr));
  float w1 = n3(vec3(p.x * 1.4, uTime * 0.5, p.y * 1.4)), w2 = n3(vec3(p.x * 3.7 + 10.0, uTime * 0.9, p.y * 3.7));
  col += 0.12 * vec3(0.4,0.8,0.9) * pow(w1 * w2 * 2.0, 2.0);
  for (int i = 0; i < 7; i++) {
    vec2 b = uR * vec2(sin(uFalls[i].x), -cos(uFalls[i].x)); float d = distance(p, b);
    col += 0.07 * sin(d * 3.5 - uTime * 2.6) * exp(-d * 0.20) * vec3(0.6,0.9,1.0);
    col = mix(col, vec3(0.92,0.97,1.0), exp(-d * 0.65) * (0.35 + 0.65 * n3(vec3(p.x * 3.0, uTime * 2.0, p.y * 3.0))) * min(1.0, uFalls[i].y / 2.0));
  }
  vec3 view = normalize(vec3(p.x, -1.5, p.y));
  float fres = pow(1.0 - abs(view.y), 4.0) * 0.55 + 0.07;
  col = mix(col, vec3(0.62,0.78,0.95), fres);
  vec3 nrm = normalize(vec3(0.07 * (w1 - 0.5), 1.0, 0.07 * (w2 - 0.5)));
  col += pow(max(dot(reflect(view, nrm), uSun), 0.0), 220.0) * 2.5;
  if (rr < 1.4) {
    col = vec3(0.11,0.11,0.12) * (0.7 + 0.3 * n3(vec3(p * 4.0, 0.0)));
    col = mix(col, vec3(0.45,0.82,0.95), smoothstep(1.28, 1.4, rr) * 0.8);
  } else col = mix(col, vec3(0.45,0.82,0.95), (1.0 - smoothstep(1.4, 1.5, rr)) * 0.6);
  gl_FragColor = vec4(col, 1.0);
}`;

// ---------------------------------------------------------------- scene
let renderer, scene, camera, world, session = null, mode = 'fall', video = null, media = null, videoTex = null, audio = null, muted = false;
let fbScale = 1, frames = 0, lastStat = 0, eye = EYE_DEFAULT, needCenter = true, camPos = new THREE.Vector3(), camYaw = 0, preview = null;
const fwd = new THREE.Vector3(), quat = new THREE.Quaternion();

function initScene() {
  if (renderer) return;
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.xr.enabled = true;
  $('canvasHost').appendChild(renderer.domElement);
  scene = new THREE.Scene(); camera = new THREE.PerspectiveCamera(72, 1, 0.05, 200);
  world = new THREE.Group(); scene.add(world);
}
function disposeWorld() {
  world.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  world.clear();
}
function shader(fs, extra = {}) {
  return new THREE.ShaderMaterial({ vertexShader: vs, fragmentShader: fs, uniforms: uni, ...extra });
}
function buildWorld() {
  disposeWorld();
  const sky = new THREE.Mesh(new THREE.SphereGeometry(60, 48, 32), mode === 'fall' ? shader(SKY_FS, { side: THREE.BackSide, depthWrite: false }) : new THREE.MeshBasicMaterial({ color: 0x02050a, side: THREE.BackSide, depthWrite: false }));
  sky.renderOrder = -2; world.add(sky);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(R, 96), mode === 'fall' ? shader(FLOOR_FS, { side: THREE.DoubleSide }) : new THREE.MeshBasicMaterial({ color: 0x070b10 }));
  floor.geometry.rotateX(-Math.PI / 2); world.add(floor);
  if (mode === 'fall') {
    const wallG = new THREE.CylinderGeometry(R, R, H, 160, 1, true); wallG.translate(0, H / 2, 0);
    const wall = new THREE.Mesh(wallG, shader(WALL_FS, { side: THREE.BackSide, transparent: true })); wall.renderOrder = 1; world.add(wall);
  } else if (media) {
    const kind = $('vidKind').value, ar = media.w / media.h, crop = kind === 'equi' ? 0.5 : 1.0;
    let src = media.el;
    if (media.type === 'image') {   // some phones cap textures below 8192 px: downscale instead of showing black
      const mt = renderer.capabilities.maxTextureSize, k = Math.min(1, mt / Math.max(media.w, media.h));
      if (k < 1) { const c = document.createElement('canvas'); c.width = Math.floor(media.w * k); c.height = Math.floor(media.h * k); c.getContext('2d').drawImage(media.el, 0, 0, c.width, c.height); src = c; }
    }
    videoTex = media.type === 'video' ? new THREE.VideoTexture(media.el) : new THREE.Texture(src);
    videoTex.colorSpace = THREE.SRGBColorSpace; videoTex.wrapS = THREE.RepeatWrapping; videoTex.repeat.x = -1; videoTex.anisotropy = 8; videoTex.needsUpdate = true;
    const mat = new THREE.MeshBasicMaterial({ map: videoTex, side: THREE.BackSide, toneMapped: false });
    if (kind === 'sphere') {
      floor.visible = false;                                   // the sphere covers the floor too
      const sg = new THREE.SphereGeometry(40, 128, 64); sg.translate(0, eye, 0);
      const sm = new THREE.Mesh(sg, mat); sm.rotation.y = SPHERE_YAW; sm.renderOrder = -1; world.add(sm);
    } else {
      if (kind === 'equi') { videoTex.repeat.y = 0.5; videoTex.offset.y = 0.25; }
      const hh = Math.min(14, (2 * Math.PI * R) / (ar / crop));
      const g = new THREE.CylinderGeometry(R, R, hh, 160, 1, true); g.translate(0, eye, 0);   // vertically centred on eye height
      world.add(new THREE.Mesh(g, mat));
      const rg = new THREE.RingGeometry(R - 0.06, R, 128); rg.rotateX(-Math.PI / 2); const ring = new THREE.Mesh(rg, new THREE.MeshBasicMaterial({ color: 0x2f9bf7, side: THREE.DoubleSide })); ring.position.y = 0.01; world.add(ring);
    }
  }
}

// ---------------------------------------------------------------- audio (procedural waterfall noise)
function startAudio() {
  if (audio || mode !== 'fall') return;
  const ctx = new (window.AudioContext || window.webkitAudioContext)(), master = ctx.createGain(); master.gain.value = muted ? 0 : 0.7; master.connect(ctx.destination);
  const noise = (sec, brown) => {
    const b = ctx.createBuffer(1, ctx.sampleRate * sec, ctx.sampleRate), d = b.getChannelData(0); let last = 0;
    for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w * 0.5; }
    const s = ctx.createBufferSource(); s.buffer = b; s.loop = true; return s;
  };
  const roar = noise(4, true), lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 650; const g1 = ctx.createGain(); g1.gain.value = 1.0;
  roar.connect(lp).connect(g1).connect(master);
  const spray = noise(3, false), hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2600; const g2 = ctx.createGain(); g2.gain.value = 0.10;
  const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 0.15; lg.gain.value = 0.04; lfo.connect(lg).connect(g2.gain);
  spray.connect(hp).connect(g2).connect(master); roar.start(); spray.start(); lfo.start();
  audio = { ctx, master };
}
// browsers may refuse sound-on autoplay: fall back to muted playback instead of a frozen picture
function playVideo() { if (!video) return; video.play().catch(() => { setMuted(true); video.play().catch(() => {}); }); }
function setMuted(m) { muted = m; if (audio) audio.master.gain.value = m ? 0 : 0.7; if (video) video.muted = m; for (const id of ['bSound', 'pvSound']) $(id).textContent = m ? '🔇 Ses' : '🔊 Ses'; }

// ---------------------------------------------------------------- AR session
let xrOk = false;
function noAR() {
  $('btnAR').disabled = true; $('btnAR').style.opacity = 0.45; $('btnAR').textContent = '▶ AR bu cihazda yok';
  $('btnPreview').classList.add('primary');
  $('msg').textContent = 'Bu cihaz/tarayıcı AR desteklemiyor (AR için Android telefonda Chrome gerekir). Şimdilik "Önizleme" ile sürükleyerek izleyebilirsin.';
}
if (navigator.xr) navigator.xr.isSessionSupported('immersive-ar').then((ok) => { xrOk = ok; if (!ok) noAR(); }).catch(noAR);
else noAR();

window.addEventListener('error', (e) => { $('msg').textContent = '⚠ Hata: ' + (e.message || 'bilinmeyen'); });
window.addEventListener('unhandledrejection', (e) => { $('msg').textContent = '⚠ Hata: ' + ((e.reason && e.reason.message) || e.reason); });
$('mode').addEventListener('change', () => { $('vidBox').style.display = $('mode').value === 'video' ? 'flex' : 'none'; });
async function prepareMode() {
  mode = $('mode').value;
  if (mode === 'video') {
    const f = $('vidFile').files[0]; if (!f) { $('msg').textContent = 'Önce bir video ya da fotoğraf dosyası seç.'; return false; }
    if (video) { video.pause(); URL.revokeObjectURL(video.src); video = null; }
    if (f.type.startsWith('image/')) {
      const img = new Image(); img.src = URL.createObjectURL(f); await img.decode();
      media = { type: 'image', el: img, w: img.naturalWidth, h: img.naturalHeight };
    } else {
      video = document.createElement('video'); video.src = URL.createObjectURL(f); video.loop = true; video.playsInline = true; video.muted = muted; video.crossOrigin = 'anonymous';
      await new Promise((res, rej) => { video.onloadedmetadata = res; video.onerror = () => rej(new Error('Video okunamadı')); });
      media = { type: 'video', el: video, w: video.videoWidth, h: video.videoHeight };
      playVideo();
    }
  }
  initScene(); buildWorld(); return true;
}
async function startAR() {
  $('msg').textContent = 'Başlatılıyor…';
  if (!xrOk) { $('msg').textContent = 'AR bu cihazda/tarayıcıda yok. Önizlemeyi dene.'; return; }
  try { if (!(await prepareMode())) return; } catch (e) { $('msg').textContent = e.message; return; }
  try {
    session = await navigator.xr.requestSession('immersive-ar', { optionalFeatures: ['dom-overlay'], domOverlay: { root: $('overlay') } });
  } catch (e) { $('msg').textContent = 'AR başlatılamadı: ' + e.message; return; }
  renderer.xr.setReferenceSpaceType('local');
  renderer.xr.setFoveation(0);   // foveated rendering lowers resolution towards the edges
  const nat = (window.XRWebGLLayer && XRWebGLLayer.getNativeFramebufferScaleFactor) ? XRWebGLLayer.getNativeFramebufferScaleFactor(session) : 1;
  const q = $('quality').value; fbScale = q === 'std' ? 1 : q === 'ultra' ? Math.min(nat * 1.35, 2) : nat;
  renderer.xr.setFramebufferScaleFactor(fbScale);
  session.addEventListener('end', onEnd);
  await renderer.xr.setSession(session);
  $('start').style.display = 'none'; $('overlay').style.display = 'block'; $('hint').style.opacity = 1;
  setTimeout(() => { $('hint').style.opacity = 0; }, 7000);
  startAudio(); playVideo();
  needCenter = true; renderer.setAnimationLoop(frame);
}
function onEnd() {
  renderer.setAnimationLoop(null); renderer.xr.setSession(null); session = null;
  $('overlay').style.display = 'none'; $('start').style.display = 'flex';
  if (video) video.pause(); if (audio) { audio.ctx.close(); audio = null; }
}
function frame(t, xrFrame) {
  uni.uTime.value = t / 1000;
  if (xrFrame) {
    const pose = xrFrame.getViewerPose(renderer.xr.getReferenceSpace());
    if (pose) {
      const p = pose.transform.position, o = pose.transform.orientation;
      camPos.set(p.x, p.y, p.z); quat.set(o.x, o.y, o.z, o.w); fwd.set(0, 0, -1).applyQuaternion(quat); camYaw = Math.atan2(fwd.x, -fwd.z);
      if (needCenter) { needCenter = false; placeWorld(); }
    }
  }
  renderer.render(scene, camera);
  frames++;
  if (t - lastStat > 1000) {
    const fps = Math.round(frames * 1000 / (t - lastStat)); frames = 0; lastStat = t;
    const bl = session && session.renderState.baseLayer;
    $('stat').textContent = `${fps} FPS` + (bl ? ` · ${bl.framebufferWidth}×${bl.framebufferHeight} px (ölçek ${fbScale.toFixed(2)})` : '') + (fps < 24 ? ' · akıcı değil: kaliteyi düşür' : '');
  }
}
// centre the cylinder on the user and turn the main waterfall to face where they are looking
function placeWorld() { world.position.set(camPos.x, camPos.y - eye, camPos.z); world.rotation.y = -camYaw; }
$('bCenter').addEventListener('click', () => { needCenter = true; });
$('bUp').addEventListener('click', () => { eye = Math.max(0.5, eye - 0.1); needCenter = true; if (mode === 'video') buildWorld(); });
$('bDown').addEventListener('click', () => { eye = Math.min(2.5, eye + 0.1); needCenter = true; if (mode === 'video') buildWorld(); });
$('bSound').addEventListener('click', () => setMuted(!muted));
$('bExit').addEventListener('click', () => { if (session) session.end(); });
$('btnAR').addEventListener('click', startAR);

// ---------------------------------------------------------------- desktop / no-AR preview (drag to look around)
async function startPreview() {
  $('msg').textContent = 'Başlatılıyor…';
  try { if (!(await prepareMode())) return; } catch (e) { $('msg').textContent = e.message; return; }
  $('msg').textContent = ''; $('start').style.display = 'none'; $('pv').style.display = 'flex'; $('pvHint').style.display = 'block'; setTimeout(() => { $('pvHint').style.display = 'none'; }, 5000);
  world.position.set(0, 0, 0); world.rotation.y = 0; camera.position.set(0, eye, 0);
  preview = { yaw: 0, pitch: 0.12 };
  const cv = renderer.domElement, resize = () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
  resize(); addEventListener('resize', resize); startAudio(); playVideo();
  let down = false, lx = 0, ly = 0;
  cv.addEventListener('pointerdown', (e) => { down = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointerup', () => { down = false; });
  cv.addEventListener('pointermove', (e) => { if (!down) return; preview.yaw -= (e.clientX - lx) * 0.005; preview.pitch = Math.max(-1.2, Math.min(1.2, preview.pitch - (e.clientY - ly) * 0.005)); lx = e.clientX; ly = e.clientY; });
  renderer.setAnimationLoop((t) => { uni.uTime.value = t / 1000; camera.rotation.set(preview.pitch, preview.yaw, 0, 'YXZ'); renderer.render(scene, camera); });
}
$('btnPreview').addEventListener('click', startPreview);
$('pvSound').addEventListener('click', () => setMuted(!muted));
$('pvExit').addEventListener('click', () => location.reload());

$('ready').textContent = 'hazır ✓ · sürüm 2026-09-21';
window.__cinema = { get preview() { return preview; }, get video() { return video; }, get tex() { return videoTex; }, uni, setView: (yaw, pitch) => { if (preview) { preview.yaw = yaw; preview.pitch = pitch; } } };
</script>
