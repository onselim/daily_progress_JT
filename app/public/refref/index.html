<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Giriş</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#16181d; --muted:#6b7280; --line:#e3e5ea; --accent:#1f6feb; --accent-ink:#fff; --bad:#c5221f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0f1115; --card:#181b21; --ink:#e8eaee; --muted:#9aa1ad; --line:#2a2f38; --accent:#4c8dff; --accent-ink:#0b0d10; --bad:#ff6b63; } }
  :root[data-theme="dark"] { --bg:#0f1115; --card:#181b21; --ink:#e8eaee; --muted:#9aa1ad; --line:#2a2f38; --accent:#4c8dff; --accent-ink:#0b0d10; --bad:#ff6b63; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:400px; margin:0 auto; padding:18vh 16px 40px; }
  form { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
  h1 { font-size:20px; margin:0 0 14px; }
  input[type=password] { width:100%; font:inherit; font-size:17px; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .check { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted); margin:12px 0 0; }
  .check input { width:18px; height:18px; }
  button { width:100%; margin-top:14px; border:0; border-radius:12px; background:var(--accent); color:var(--accent-ink); font:inherit; font-weight:700; font-size:17px; padding:14px; cursor:pointer; }
  button:disabled { opacity:.6; }
  .err { color:var(--bad); font-size:14px; font-weight:600; min-height:20px; margin:10px 0 0; }
</style>
</head>

    <p class="err" id="e" role="alert"></p>
  </form>
</main>

  const KEY = "refref-login";
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const salt = b64(D.salt), iv = b64(D.iv), ct = b64(D.ct);
  const $ = id => document.getElementById(id);

  async function open(rawKey) {
    const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct));
    window.__refrefLocked = true;
    document.open(); document.write(html); document.close();
  }
  async function derive(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: D.iter }, base, 256));
  }

  if (!(window.crypto && crypto.subtle)) {
    $("e").textContent = "Bu sayfa sadece https linkinden açılınca çalışır."; $("b").disabled = true; return;
  }
  // daha önce "hatırla" denmişse parola sormadan aç
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (_) {}
  if (saved && saved.salt === D.salt) {
    open(b64(saved.key)).catch(() => { try { localStorage.removeItem(KEY); } catch (_) {} });
  }

  $("p").focus();
  $("f").onsubmit = async e => {
    e.preventDefault();
    const pw = $("p").value;
    if (!pw) return;
    $("b").disabled = true; $("b").textContent = "Kontrol ediliyor…"; $("e").textContent = "";
    try {
      const raw = await derive(pw);
      const remember = $("r").checked;
      await crypto.subtle.decrypt({ name: "AES-GCM", iv },
        await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]), ct);
      if (remember) {
        try { localStorage.setItem(KEY, JSON.stringify({ salt: D.salt, key: btoa(String.fromCharCode(...raw)) })); } catch (_) {}
      }
      await open(raw);
    } catch (_) {
      $("b").disabled = false; $("b").textContent = "Giriş";
      $("e").textContent = "Parola yanlış."; $("p").value = ""; $("p").focus();
    }
  };
})();
