<!doctype html>
<html lang="tr">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İstinat Duvarı Hesap Aracı</title>
<style>
:root{--navy:#1F4E78;--blue:#4C78A8;--orange:#F58518;--green:#2E8B57;--red:#D64541;--bg:#F4F6F9;--card:#fff;--line:#D9DEE5;--ink:#1C2733;--mut:#5B6B7B}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
header{background:var(--navy);color:#fff;padding:10px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:17px;margin:0;font-weight:600}
header .sp{flex:1}
header select,header button{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid #fff3;background:#ffffff1f;color:#fff}
header select option{color:#000}
header button{cursor:pointer}header button:hover{background:#ffffff40}
header button.go{background:var(--orange);border-color:var(--orange);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;background:#ffffff26}
.chip.ok{background:#2E8B5777}.chip.bad{background:#D6454199}
#desChip{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}#desChip b{color:#FFC36B}
#selDesign{max-width:270px}
main{padding:14px 18px;min-width:0;max-width:1700px;margin:0 auto}
details{border:1px solid var(--line);border-radius:8px;background:#fff}
details>summary{padding:8px 10px;cursor:pointer;font-weight:600;color:var(--navy);list-style:none}
details>summary::before{content:"▸ ";color:var(--mut)}details[open]>summary::before{content:"▾ "}
.fields{padding:4px 10px 10px;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.f{display:flex;flex-direction:column;font-size:12px;color:var(--mut)}
.f.w2{grid-column:1/3}
.f input,.f select{font:inherit;color:var(--ink);padding:5px 6px;border:1px solid var(--line);border-radius:5px;width:100%}
.f label{display:flex;justify-content:space-between;gap:4px}
.f .u{color:#8896A5}
.f.chk{flex-direction:row;align-items:center;gap:6px;grid-column:1/3;color:var(--ink)}
.f.chk input{width:auto}
.hint{grid-column:1/3;font-size:11.5px;color:var(--mut);background:#F2F6FB;border-radius:6px;padding:6px 8px;line-height:1.4}
.btnrow{grid-column:1/3;display:flex;gap:6px;flex-wrap:wrap}
.btn{font:inherit;font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer}
.btn:hover{background:#EAF1F8}.btn.p{background:var(--blue);color:#fff}.btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
nav.tabs button{font:inherit;padding:8px 14px;border:0;background:none;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:600}
nav.tabs button.on{color:var(--navy);border-bottom-color:var(--orange)}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 6px;color:var(--navy);font-size:15.5px;display:flex;align-items:center;gap:8px}
.card h3 .no{background:var(--navy);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.aim{margin:4px 0 8px;color:#33475B;line-height:1.5;background:#F7FAFD;border-left:3px solid var(--blue);padding:6px 10px;border-radius:0 6px 6px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:4px 7px;border-bottom:1px solid #E7EBF0;text-align:start;vertical-align:top}
th{background:#F0F4F8;color:var(--navy);font-weight:600;font-size:12px}
td.r,th.r{text-align:end;font-variant-numeric:tabular-nums}
td.f2{color:#556;font-size:12px}
tr.tot td{font-weight:700;background:#F7FAFD}
tr.bad td{background:#FCE9E8}
.res{margin-top:8px;padding:7px 10px;border-radius:7px;font-weight:600}
.res.ok{background:#E6F4EC;color:#1B6B3F}.res.bad{background:#FCE9E8;color:#A12622}.res.warn{background:#FFF4DE;color:#8A5A00}
.bar{height:9px;background:#E9EEF3;border-radius:5px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--green)}.bar i.hi{background:var(--orange)}.bar i.over{background:var(--red)}
.gov{outline:2px solid var(--orange)}
.note{font-size:12.5px;color:var(--mut);line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px;align-items:start}
.dsn{display:grid;grid-template-columns:minmax(290px,340px) 1fr;gap:14px;align-items:start}
.dctl{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;margin:0}
.sl{padding:5px 0 7px;border-bottom:1px dashed #E7EBF0}
.sl1{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.sl1 label{font-size:12.5px;color:#33475B}
.sl .sn{display:flex;align-items:center;gap:4px}.sl .sn em{font-style:normal;color:var(--mut);font-size:11.5px;min-width:16px}
.sl input[type=number]{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:5px;width:78px;text-align:right}
.sl input[type=range]{width:100%;accent-color:var(--blue);margin:0}
.chk2{display:flex;gap:6px;align-items:center;font-size:12.5px;margin-top:8px;color:#33475B}
@media(max-width:1000px){.dsn{grid-template-columns:1fr}.dctl{position:static;max-height:none}}
.g3d{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:12px;margin-top:12px}@media(max-width:1100px){.g3d{grid-template-columns:1fr}}
.cv3d{display:block;width:100%;height:500px;border:1px solid var(--line);border-radius:8px;touch-action:none;cursor:grab;background:#F7F9FB}.cv3d:active{cursor:grabbing}
.v3c{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}.v3g{display:inline-flex;gap:4px;align-items:center}.v3g em{font-style:normal;font-size:11.5px;color:var(--mut);margin-right:2px}
.v3leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;margin-top:6px}.v3leg>span{display:inline-flex;align-items:center;gap:4px}.v3leg i{display:inline-block;width:14px;height:4px;border-radius:2px}
table.tot td{padding:5px 6px}table.tot tr.tot td{border-top:2px solid var(--navy)}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.kpi{flex:1;min-width:130px;background:#F4F7FB;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.kpi b{display:block;font-size:19px;color:var(--navy)}.kpi span{font-size:11.5px;color:var(--mut)}
.kpi.ok{background:#E6F4EC}.kpi.bad{background:#FCE9E8}
.types{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/3}
.tcard{border:2px solid var(--line);border-radius:9px;background:#fff;padding:4px 8px 6px;cursor:pointer;text-align:center;font:inherit;font-size:12px;color:var(--ink);min-width:96px}
.tcard.on{border-color:var(--orange);background:#FFF8EE}.tcard span{display:block}
.prog{height:8px;background:#E9EEF3;border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--blue);width:0}
.sbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
svg text{user-select:none}
#selLang{max-width:150px}
html[dir=rtl] body{direction:rtl}
svg,input[type=range],input[type=number],.prog{direction:ltr}
html[dir=rtl] svg text{unicode-bidi:plaintext}
#dlg{position:fixed;inset:0;background:#0007;z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.dlgbox{background:#fff;border-radius:12px;padding:16px 18px;width:min(460px,100%);box-shadow:0 10px 40px #0005}
.dlgbox h3{margin:0 0 10px;color:var(--navy);font-size:16px}.dlgbox .btnrow{margin-top:12px}
#toast{position:fixed;right:18px;bottom:18px;background:#1B6B3F;color:#fff;padding:9px 14px;border-radius:8px;box-shadow:0 4px 18px #0004;z-index:70;opacity:0;pointer-events:none;transform:translateY(8px);transition:.2s}
#toast.show{opacity:1;transform:none}
#busy{position:fixed;inset:0;background:#F4F6F9E6;z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:15px;color:var(--navy)}
#busy .prog{width:min(360px,80vw)}
#tip{position:fixed;z-index:90;max-width:326px;background:#1C2B3A;color:#fff;font-size:12.5px;line-height:1.5;padding:8px 11px;border-radius:8px;box-shadow:0 6px 22px #0005;pointer-events:none;display:none}
[data-tip] label{cursor:help}
@media print{#tip{display:none!important}}
@page sheet{size:A3 landscape;margin:0}
#t-pafta .sheet{display:none}#t-pafta .sheet.on{display:block}
#t-pafta .sheet svg{width:100%;height:auto;display:block;background:#fff;box-shadow:0 1px 8px #0003}
@media print{header,nav.tabs,.btn,.sbar,#dlg,#toast{display:none!important}.tab{display:block!important;page-break-before:always}.tab:first-of-type{page-break-before:auto}main{padding:0}.card{break-inside:avoid}.dctl{display:none}
body.print-sheet .tab{display:none!important}body.print-sheet #t-pafta{display:block!important}body.print-sheet #t-pafta .ctrl{display:none}
body.print-sheet #t-pafta .sheet{display:block!important;page:sheet;break-after:page}body.print-sheet #t-pafta .sheet svg{width:420mm;height:297mm;box-shadow:none}}
</style>

<body>
<header>
  <h1>İstinat Duvarı Hesap Aracı</h1>
  <select id="selLang" title="Dil / Language / ენა / Язык / اللغة"></select>
  <select id="selType" title="Duvar tipi">
    <option value="T">T – ön ve arka ampatmanlı</option>
    <option value="L">L – yalnız arka ampatman (ön yüz sınırda)</option>
    <option value="RL">Ters L – yalnız ön ampatman (arka yüz sınırda)</option>
  </select>
  <div class="chips" id="chips"></div>
  <span class="chip" id="desChip" style="display:none"></span>
  <div class="sp"></div>
  <button id="btnSave" title="Güncel tasarımı bir adla kaydeder (Ctrl+S)">💾 Kaydet</button>
  <select id="selDesign" title="Kayıtlı bir tasarımı aç"></select>
  <button id="btnOpt" class="go" title="Yüklere göre en ekonomik boyutları bulur">⚙ Optimum tasarla</button>
  <button id="btnPrint">Yazdır / PDF</button>
</header>
<main>
  <nav class="tabs" id="tabs"></nav>
  <div id="t-girdi" class="tab"></div>
  <div id="t-tasarim" class="tab"></div>
  <div id="t-opt" class="tab"></div>
  <div id="t-adim" class="tab"></div>
  <div id="t-liste" class="tab"></div>
  <div id="t-pafta" class="tab"></div>
  <div id="t-kayit" class="tab"></div>
</main>
<div id="busy"><div id="busyTxt">Optimum tasarım hesaplanıyor…</div><div class="prog"><i id="busyProg"></i></div></div>
<input type="file" id="desOpenFile" accept=".json,application/json" style="display:none">
<script>
/* Çok dilli arayüz: kaynak dil Türkçe. Uygulama Türkçe metin üretir; bu modül görüntülenen metni seçili dile çevirir.
 *  - Sözlük anahtarı: Türkçe metin, sayılar '#' ile (ör. "Kesit (# cm)"); çeviri aynı sırayla '#' veya yeniden sıralamak için {1},{2}… kullanır.
 *  - Tam eşleşme yoksa metin içindeki bilinen ifadeler (en uzun önce) tek tek çevrilir.
 *  - DOM (HTML + SVG metinleri) MutationObserver ile otomatik çevrilir; dil değişince yeniden çevrilir.
 *  - Sayı biçimi dile göre (I18N.loc()); Arapça için sağdan sola yön. Eksik çeviri: İngilizce, sonra Türkçe.
 */
(function (root) {
  'use strict';
  const LANGS = [
    { code: 'tr', name: 'Türkçe', loc: 'tr-TR', dir: 'ltr' },
    { code: 'en', name: 'English', loc: 'en-US', dir: 'ltr' },
    { code: 'ka', name: 'ქართული', loc: 'ka-GE', dir: 'ltr' },
    { code: 'ru', name: 'Русский', loc: 'ru-RU', dir: 'ltr' },
    { code: 'ar', name: 'العربية', loc: 'ar-u-nu-latn', dir: 'rtl' },
    { code: 'de', name: 'Deutsch', loc: 'de-DE', dir: 'ltr' },
    { code: 'fr', name: 'Français', loc: 'fr-FR', dir: 'ltr' },
    { code: 'es', name: 'Español', loc: 'es-ES', dir: 'ltr' },
    { code: 'ku', name: 'Kurdî (Kurmancî)', loc: 'tr-TR', dir: 'ltr' },
  ];
  const KEYS = [], maps = {}, regs = {}, handlers = [], miss = new Set();
  let lang = 'tr', locOverride = null, codeOverride = null;
  const NUM = /\d+(?:[   ]\d{3})*(?:[.,]\d+)*/g;      // 8.094 · 8,094 · 8 094 (dar/ince boşluk binlik ayracı) · 0,1503
  const info = (c) => LANGS.find((l) => l.code === c) || LANGS[0];
  const ws = (s) => s.replace(/[ \t\r\n\f]+/g, ' ');      // dar/bölünmez boşluklar (sayı ayracı) korunur

  function setKeys(arr) { KEYS.length = 0; arr.forEach((k) => KEYS.push(k)); }
  function add(code, obj) {
    const m = maps[code] || (maps[code] = new Map());
    for (const i in obj) if (KEYS[i] != null) m.set(KEYS[i], obj[i]);
    for (const c in regs) delete regs[c];
  }
  /* "indeks|çeviri" satırları (düz metin biçimi; çeviri '#' veya {1},{2}… yer tutucu içerebilir) */
  function addText(code, text) {
    const o = {};
    text.split('\n').forEach((line) => { const i = line.indexOf('|'); if (i > 0) { const n = line.slice(0, i).trim(); if (/^\d+$/.test(n)) o[n] = line.slice(i + 1).trim(); } });
    add(code, o);
  }
  const lookup = (code, k) => { const m = maps[code]; let t = m && m.get(k); if (t == null && code !== 'en' && maps.en) t = maps.en.get(k); return t; };
  const fill = (tpl, nums) => { let i = 0; return tpl.replace(/#|\{(\d+)\}/g, (m, d) => (d !== undefined ? (nums[d - 1] != null ? nums[d - 1] : '') : (nums[i++] != null ? nums[i - 1] : '#'))); };
  const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  function frag(code) {
    if (regs[code] !== undefined) return regs[code];
    const ks = new Set([...(maps[code] ? maps[code].keys() : []), ...(code !== 'en' && maps.en ? maps.en.keys() : [])]);
    const arr = [...ks].filter((k) => k.length >= 3 && k.indexOf('#') < 0).sort((a, b) => b.length - a.length);
    regs[code] = arr.length ? new RegExp('(?<![\\p{L}\\p{N}])(?:' + arr.map(esc).join('|') + ')', 'gu') : null;
    return regs[code];
  }

  /* bir metni çevir (Türkçe kaynak → seçili dil) */
  function tr(s, code) {
    code = code || lang;
    if (code === 'tr' || !s) return s;
    const core0 = s.trim(); if (!core0) return s;
    const lead = s.slice(0, s.length - s.trimStart().length), trail = s.slice(s.trimEnd().length), core = ws(core0);
    if (!/[A-Za-zÇĞİÖŞÜçğıöşü]/.test(core)) return s;
    const nums = [], k = core.replace(NUM, (m) => { nums.push(m); return '#'; });
    if (root.__collect) root.__collect.add(k);
    const t = lookup(code, k);
    if (t != null) return lead + fill(t, nums) + trail;
    const re = frag(code);
    if (re) {
      let ch = false;
      const out = core.replace(re, (m) => { const r = lookup(code, m); if (r == null) return m; ch = true; return r; });
      if (ch) return lead + out + trail;
    }
    if (/[çğıöşüÇĞİÖŞÜ]/.test(core) || /^[A-ZÇĞİÖŞÜ][a-zçğıöşü]{3,}/.test(core)) miss.add(k);
    return s;
  }

  /* DOM çevirisi: metin düğümleri + title/placeholder/aria-label */
  const orig = new WeakMap(), origAttr = new WeakMap(), ATTRS = ['title', 'placeholder', 'aria-label'];
  function tText(n) {
    const p = n.parentNode; if (p && (p.nodeName === 'SCRIPT' || p.nodeName === 'STYLE')) return;
    let o = orig.get(n); if (o === undefined) { o = n.nodeValue; orig.set(n, o); }
    const v = tr(o); if (n.nodeValue !== v) n.nodeValue = v;
  }
  function tEl(el) {
    if (!el.getAttribute) return;
    for (const a of ATTRS) {
      const cur = el.getAttribute(a); if (cur == null) continue;
      let m = origAttr.get(el); if (!m) { m = {}; origAttr.set(el, m); }
      if (m[a] === undefined) m[a] = cur;
      const v = tr(m[a]); if (cur !== v) el.setAttribute(a, v);
    }
  }
  const skipEl = (e) => e && e.closest && e.closest('[data-nolang],[translate=no]');      // kendi diline önceden çevrilmiş alanlar (pafta setleri)
  function walk(node) {
    if (!node) return;
    if (node.nodeType === 3) { if (!skipEl(node.parentElement)) tText(node); return; }
    if (node.nodeType !== 1 && node.nodeType !== 9 && node.nodeType !== 11) return;
    if (node.nodeType === 1) { if (skipEl(node)) return; tEl(node); }
    const w = document.createTreeWalker(node, 1 | 4, { acceptNode: (n) => (n.nodeType === 1 && n.hasAttribute('data-nolang') ? 2 : 1) });
    let n; while ((n = w.nextNode())) { if (n.nodeType === 3) tText(n); else tEl(n); }
  }

  /* HTML/SVG metni (indirme, CSV): etiketler arasındaki metinleri çevirir */
  const dec = (s) => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');
  const enc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function markup(str, code) {
    code = code || lang; if (code === 'tr') return str;
    return str.replace(/(<[^<>]*>)([^<>]+)(?=<)/g, (m, tag, t) => tag + (tag.indexOf('data-nolang') >= 0 ? t : enc(tr(dec(t), code))));   // data-nolang: önceden çevrilmiş metin
  }

  let srcTitle = null;
  function setLang(code) {
    code = info(code).code; lang = code;
    try { localStorage.setItem('istinatLang', code); } catch (e) { /* yok */ }
    const L = info(code);
    document.documentElement.lang = code; document.documentElement.dir = L.dir;
    if (srcTitle == null) srcTitle = document.title;
    document.title = tr(srcTitle, code);
    const sel = document.getElementById('selLang'); if (sel) sel.value = code;
    handlers.forEach((h) => h(code));      // uygulama yeniden çizer (sayı biçimi dile bağlı)
    walk(document.body);
  }
  function init() {
    let c = 'tr';
    try { const q = new URLSearchParams(location.search).get('lang'); c = q || localStorage.getItem('istinatLang') || 'tr'; } catch (e) { /* yok */ }
    const sel = document.getElementById('selLang');
    if (sel) { sel.innerHTML = LANGS.map((l) => `<option value="${l.code}">${l.name}</option>`).join(''); sel.addEventListener('change', () => setLang(sel.value)); }
    new MutationObserver((muts) => { for (const m of muts) m.addedNodes.forEach((n) => { if (lang !== 'tr') walk(n); }); }).observe(document.body, { childList: true, subtree: true });
    if (info(c).code !== 'tr') setLang(c); else { lang = 'tr'; if (sel) sel.value = 'tr'; document.documentElement.dir = 'ltr'; }
  }

  root.I18N = { LANGS, setKeys, add, addText, tr, markup, walk, setLang, init, miss, keys: KEYS,
    lang: () => lang, curCode: () => codeOverride || lang, loc: () => locOverride || info(lang).loc, onChange: (h) => handlers.push(h),
    /* fn çalışırken sayı biçimi başka bir dile göre (pafta setleri için) */
    withLang: (code, fn) => { const prev = locOverride, prevC = codeOverride; locOverride = info(code).loc; codeOverride = info(code).code; try { return fn(); } finally { locOverride = prev; codeOverride = prevC; } } };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

83|# მმ (გრუნტთან კონტაქტში, რეკომენდებული)\n484|# მმ (მშრალი გარემო)\n485|მოსამზადებელი ბეტონი და მიწის სამუშაოები\n486|ძირის ქვეშ მოსამზადებელი ბეტონის ჩასხმა\n487|მოსამზადებელი ბეტონის გადმოშვერა (თითო მხარეს)\n488|მოსამზადებელი ბეტონი მხოლოდ მოცულობებსა და ღირებულებაში შედის; მდგრადობის ანგარიშში ძირი მის ზემოთ მიიჩნევა. ექსკავაცია: სიგანე (B + #·max(სამუშაო ადგილი, გადმოშვერა)), წინა გრუნტის ნიშნულიდან მოსამზადებელი ბეტონის ქვედა ზედაპირამდე; კბილის ექსკავაცია ცალკე ემატება.\n489|პარამეტრები\n490|ტანი (ფუძესთან კვეთი) – ბზარწარმოქმნა\n491|σs = # მპა · s # ≤ # მმ ან Φ# ≤ Φ# (wk = # მმ)\n492|წინა კონსოლი – ბზარწარმოქმნა\n493|უკანა კონსოლი – ბზარწარმოქმნა\n494|#D ხედი – ბეტონი და არმატურა\n495|იზომეტრია\n496|კვეთი (წინიდან)\n497|გვერდიდან\n498|ზემოდან\n499|ბეტონი:\n500|გამჭვირვალე\n501|მხოლოდ წიბოები\n502|დამალული\n503|ნაჩვენები სიგრძე:\n504|გადათრევა: ბრუნვა · Shift + გადათრევა: გადაადგილება · ბორბალი: მასშტაბი · ორმაგი დაწკაპუნება: საწყისი ხედი. ღეროები ნახაზზეა რეალური დიამეტრით, ბიჯითა და დამცავი ფენით; ნომრები არმატურის სპეციფიკაციის პოზიციებია.\n505|ჯამური მოცულობები – კედლის სიგრძე L = # მ\n506|ბეტონი (ტანი + ძირი + კბილი)\n507|ბეტონი (ტანი + ძირი)\n508|# ტ · # კგ/მ³\n509|t = # მ, გადმოშვერა # მ\n510|მოსამზადებელი ბეტონის გარეშე\n511|მიახლოებითი ღირებულება\n512|ერთეულის ფასები იცვლება ოპტიმიზაციის ჩანართში. სიგრძე L არის საწყის მონაცემებში › კედლის ტიპი და სიმაღლე.\n513|ოპტიმალური ვარიანტები: კბილით / კბილის გარეშე\n514|ვარიანტები: საუკეთესო ამოხსნა კბილით და კბილის გარეშე\n515|არჩეული კრიტერიუმით კბილიანი ამოხსნა\n516|არჩეული კრიტერიუმით უკბილო ამოხსნა\n517|უფრო ეკონომიურია. კბილის გარეშე ძირის სიგანეა # მ, კბილით – # მ. აირჩიეთ უკბილო ამოხსნა, თუ კბილის ამოთხრა და მოწყობა რთულია ან წინა გრუნტი შეიძლება მომავალში ამოითხაროს.\n518|ამ საზღვრებში კბილიანი მისაღები ამოხსნა ვერ მოიძებნა.\n519|კბილიანი ამოხსნა არ შემოწმებულა („ძვრის კბილის ცდაც“ გამორთულია).\n520|ამ საზღვრებში უკბილო მისაღები ამოხსნა ვერ მოიძებნა; ძვრისთვის კბილი საჭიროა.\n521|კბილით\n522|კბილის გარეშე\n523|წინა დახრილი\n524|უკანა დახრილი\n525|მუდმივი\n526|აირჩიე ტანის ფორმაც (წინა / უკანა დახრილი, მუდმივი)\n527|ტანის ზედა სისქე მინ. (მ)\n528|ფურცელი # – არმირების დეტალები\n529|არმირების დეტალები\n530|არმირების დეტალური კვეთი (# მ კედელი, ზომები სმ-ში)\n531|მოღუნვის სპეციფიკაცია (კედლის სიგრძე L = # მ)\n532|ფორმა (სმ)\n533|არმატურა დიამეტრების მიხედვით\n534|დიამეტრი\n535|ჯამური სიგრძე (მ)\n536|წონა (კგ)\n537|• დამცავი ფენა: ყალიბიანი ზედაპირები # მმ, გრუნტზე ჩასხმული ზედაპირები # მმ.\n538|• მოღუნვის შიდა დიამეტრი: #Φ, როცა Φ ≤ #, #Φ, როცა Φ > # (EC# #).\n539|• ჰორიზონტალურ და გრძივ არმატურაში გადაბმა #Φ, დაშორებით.\n540|• ფორმის ზომები ღეროს გარე ზომებია (სმ); სიგრძეებში გადაბმები შედის.\n541|• კვეთში წერტილები ნახაზის სიბრტყის მართობული ღეროებია.\n542|• მოსამზადებელი ბეტონის გარეშე · უკანა ყრილი დრენირებადი მარცვლოვანი მასალით (φ = #°, γ = # კნ/მ³); რეკომენდებულია სადრენაჟო ხვრელები და მილი.\n543|ტანის რომელი წახნაგია დახრილი. დახრილი წინა წახნაგი (ვერტიკალური უკანა) ყველაზე გავრცელებულია: ყალიბი მარტივია და ყრილი თანაბრად იტკეპნება. დახრილი უკანა წახნაგისას დახრის ზემოთ მდებარე ყრილის წონაც წინაღობას ემატება. მუდმივი სისქე პრაქტიკულია მცირე კედლებისთვის (H < # მ).\n544|სრული სიმაღლე ფუძის ძირიდან კედლის თავამდე (ფუძის სისქის ჩათვლით). დაწოლა იზრდება H²-ით, გადამაყირავებელი მომენტი – H³-ით: სიმაღლის #%-ით გაზრდა მომენტს დაახლოებით #%-ით ზრდის.\n545|წინა გრუნტის ზედაპირის სიმაღლე ფუძის ძირიდან (ჩაღრმავების სიღრმე). უნდა იყოს გაყინვის სიღრმის ქვემოთ (ჩვეულებრივ ≥ #–# მ). კბილის შემთხვევაში პასიური წინაღობა ამ სიღრმიდან იწყება; წინა ყრილი თავად მხოლოდ მაშინ ითვლება, თუ მონიშნულია „წინა ყრილის პასიური წინაღობის გათვალისწინება“.\n546|კედლის სიგრძე მხოლოდ მოცულობებისა და ღირებულებისთვის. გაანგარიშება სრულდება # მ კედელზე.\n547|კედლის თავზე მოქმედი ვერტიკალური ხაზოვანი დატვირთვა (მაგ. ზედნაშენი, მოაჯირის წონა). ითვლება დროებითად: ფუძის წნევაში ითვალისწინება, გადაყირავებასა და ძვრაში წინაღობად არ ითვლება (იცვლება პარამეტრებში).\n548|კედლის თავზე მოქმედი ჰორიზონტალური დატვირთვა (მოაჯირი, მანქანის დარტყმა, ქარის ეკრანი). ზრდის ტანის მომენტს Ht·Hs-ით და მრავლდება γQ-ზე.\n549|ფუძის ნაწილი ტანის წინ. ზრდის მხარს გადაყირავების წინააღმდეგ და ანაწილებს ფუძის წნევას. შეუძლებელია, თუ წინ საზღვარია (L ტიპი). ოპტიმუმი ჩვეულებრივ მოკლე წინა და გრძელი უკანა კონსოლია.\n550|ფუძის ნაწილი ტანის უკან, ყრილის ქვეშ. მასზე მდებარე ყრილის წონა აწონასწორებს კედელს: ყველაზე ეფექტური ზომაა ძვრისა და გადაყირავების წინააღმდეგ. დახრილი ყრილისას მისი დაგრძელებით დაწოლის სიბრტყეც მაღლდება.\n551|ფუძის ფილის სისქე. განსაზღვრავს კონსოლების ღუნვისა და (სამაგრების გარეშე) ძვრის უნარს. ტიპური H/# – H/#, მინიმუმ # მ.\n552|ტანის ზედა სისქე. ბეტონის ჩასხმისა და არმატურის განთავსებისთვის რეკომენდებულია მინიმუმ #–# მ.\n553|ტანის სისქე ფუძესთან შეერთებისას; აქაა უდიდესი მომენტი და ძვრა. თხელი ტანი მეტ არმატურას ნიშნავს, სქელი – მეტ ბეტონს. ტიპური H/# – H/#.\n554|ფუძის ქვეშ ჩასხმული ბეტონის კბილი. ააქტიურებს მის წინ მდებარე გრუნტის პასიურ წინაღობას ძვრის წინააღმდეგ. როცა ძვრა განმსაზღვრელია, ხშირად უფრო იაფია, ვიდრე უკანა კონსოლის დაგრძელება.\n555|კბილის სიღრმე ფუძის ქვემოთ. პასიური წინაღობა სიღრმის კვადრატის პროპორციულად იზრდება. ექსკავაციისა და მშენებლობის გამო ჩვეულებრივ #–# მ.\n556|კბილის სიგანე; იტანს კბილის ღუნვასა და ძვრას. ჩვეულებრივ #–# მ.\n557|ტანის ქვეშ: ტანის არმატურა შეიძლება კბილში გაგრძელდეს, ყველაზე გავრცელებული მდებარეობა. უკანა ბოლოში: ძვრის ზედაპირი უფრო ღრმა და გრძელია. წინა ბოლოში: ეფექტი შეიძლება დაიკარგოს, თუ წინ ამოთხრიან.\n558|ყრილის ბუნებრივი მოცულობითი წონა გრუნტის წყლის დონის ზემოთ. მით გამოითვლება დაწოლა (Ka·γ·z) და უკანა კონსოლზე მდებარე ყრილის მაწონასწორებელი წონა. დატკეპნილი მარცვლოვანი ყრილისთვის ტიპური #–# კნ/მ³.\n559|წყალგაჯერებული მოცულობითი წონა; გამოიყენება მხოლოდ გრუნტის წყლის არსებობისას. წყლის ქვეშ ყრილის წონა γsat-ით, დაწოლა კი ეფექტური γ′ = γsat − #-ით გამოითვლება. ტიპური #–# კნ/მ³.\n560|ყრილის შინაგანი ხახუნის კუთხე; განსაზღვრავს აქტიური დაწოლის კოეფიციენტს: φ = #° → Ka # · #° → # · #° → #. დრენირებადი, კარგად დატკეპნილი ღორღი / ქვიშა-ხრეში #–#°. თიხოვანი ყრილი არ არის რეკომენდებული (შეჭიდულობა უგულებელყოფილია).\n561|ყრილის ზედაპირის კუთხე ჰორიზონტთან, კედლის თავიდან უკან. ზრდის როგორც Ka-ს, ისე დაწოლის სიბრტყის სიმაღლეს (H + კონსოლი·tanβ); β = #°-ზე დაწოლა დაახლოებით #%-ით იზრდება. β უნდა იყოს φ-ზე ნაკლები; სეისმიკისას β ≤ φ − ψ.\n562|ყრილზე თანაბრად განაწილებული დატვირთვა (ტრანსპორტი, დასაწყობება, ტექნიკა). კედელს უმატებს მუდმივ (მართკუთხა) წნევას Ka·q. დროებითი დატვირთვაა (γQ = #); მისი წონა ყრილზე ძვრასა და გადაყირავებაში წინაღობად არ ითვლება. ქვეითი ≈ #, მსუბუქი ტრანსპორტი ≈ #, მძიმე ტრანსპორტი ≈ # კპა.\n563|გრუნტის წყლის სიმაღლე კედლის უკან ფუძის ძირიდან. # = დრენაჟი არსებობს (წყალგამტარი ხვრელები + დრენაჟის მილი). წყალს მოაქვს ჰიდროსტატიკური წნევა ½·γw·hw², ფუძის ამომტივტივება და წყლის ქვეშ გამსუბუქებული ყრილი. # მ წყალი საბაზისო კედლის ფუძეს დაახლოებით #%-ით აფართოებს: დრენაჟი თითქმის ყოველთვის ყველაზე ეკონომიური გადაწყვეტაა.\n564|ხახუნის კუთხე ბეტონის კედლის წახნაგსა და ყრილს შორის. გამოიყენება მხოლოდ მაშინ, როცა უკანა კონსოლზე ყრილი არ არის (შებრუნებული L, ვერტიკალური უკანა წახნაგი); ტიპური #/#·φ. დიდი δw ამცირებს დაწოლას და იძლევა ქვემოთ მიმართულ მაწონასწორებელ მდგენელს. კონსოლის არსებობისას დაწოლა აიღება ვირტუალურ სიბრტყეზე δ = β-ით და ეს მნიშვნელობა არ გამოიყენება.\n565|ფუძის გრუნტის მოცულობითი წონა; განსაზღვრავს პასიურ წინაღობას კედლისა და კბილის წინ (Kp·γ·z).\n566|ფუძის გრუნტის შინაგანი ხახუნის კუთხე. განსაზღვრავს ფუძის ხახუნს (δb = k·φ) და პასიურ კოეფიციენტს Kp = tan²(# + φ/#).\n567|ფუძის გრუნტის (დრენირებული) შეჭიდულობა. ძვრაში იძლევა ფუძის ადჰეზიას ca·B-ს და კბილის წინ პასიურ წინაღობას #c·√Kp-ს. ქვიშაში #; თიხებში გრძელვადიანი ანგარიშისთვის მცირე და ფრთხილი მნიშვნელობა აიღეთ.\n568|ფუძის დასაშვები წნევა საინჟინრო-გეოლოგიური კვლევიდან. სტატიკაში qmax ≤ qa, სეისმიკაში qmax ≤ qa × გაზრდის კოეფიციენტი.\n569|ფუძე–გრუნტის ხახუნის კუთხის შეფარდება გრუნტის შინაგანი ხახუნის კუთხესთან: δb = k·φ. ძვრის წინაღობის ძირითადი ნაწილია N·tan δb (N: ფუძეზე მოქმედი ვერტიკალური ძალა). ბეტონის უშუალოდ გრუნტზე ჩასხმისას ზედაპირი ხორკლიანია და შეიძლება k = #–#; მომზადების ბეტონზე ან გლუვ ზედაპირზე გავრცელებულია #/#.\n570|ადჰეზია არის წინაღობა, რომელიც წარმოიქმნება შეჭიდული (თიხოვანი) გრუნტის ბეტონის ფუძესთან მიკვრით: ca = k·c და იძლევა ca·B ძვრის წინაღობას (B: ფუძის სიგანე). ქვიშასა და ხრეშში c = #, ამიტომ ეფექტი არ აქვს. რადგან თიხა დროთა განმავლობაში შეიძლება დარბილდეს და ამოთხრისას დაირღვეს, k ≈ # ფრთხილი მნიშვნელობაა; გრძელვადიან ანგარიშში დრენირებული c′ მცირე აიღეთ.\n571|მონიშვნისას წინა ყრილის (Df სიმაღლე) პასიური წინაღობა ძვრაში ითვლება. არ მონიშნოთ (ნაგულისხმევი), თუ წინა მხარე შეიძლება მოგვიანებით ამოითხაროს ან დარბილდეს. კბილის ფუძის ქვემოთ მდებარე ნაწილი ყოველთვის ითვლება.\n572|პასიური წინაღობისთვის კედელმა მნიშვნელოვნად უნდა გადაადგილდეს (სიმაღლის დაახლოებით #–#%), რათა გრუნტი შეიკუმშოს და წინააღმდეგობა გაუწიოს, აქტიური დაწოლა კი ძალიან მცირე მოძრაობით წარმოიქმნება. ამიტომ გამოთვლილი პასიური წინაღობის მხოლოდ ნაწილი გამოიყენება; # გავრცელებული ფრთხილი მნიშვნელობაა.\n573|სეისმურ შემთხვევას ცალკე ამოწმებს მონონობე–ოკაბეს მეთოდით; სტატიკური შემოწმებები ძალაში რჩება.\n574|ჰორიზონტალური სეისმური კოეფიციენტი. თუ კედელს რამდენიმე სანტიმეტრით გადაადგილება შეუძლია, ჩვეულებრივ kh ≈ #·PGA/g; მოუცურებელი ხისტი კედლებისთვის kh ≈ PGA/g. უნდა აიღოთ ქვეყნის სეისმური ნორმებიდან.\n575|ვერტიკალური სეისმური კოეფიციენტი; ჩვეულებრივ # ან ±#·kh. ამცირებს წონებს (# − kv)-ით.\n576|ბეტონის მახასიათებელი ცილინდრული სიმტკიცე. გრუნტთან შეხებაში მყოფი ნაგებობებისთვის მინიმუმ C#/#, სასურველია C#/#.\n577|არმატურის ფოლადის დენადობის ზღვარი (B#: # მპა).\n578|ბეტონის საიმედოობის კოეფიციენტი (EC# მუდმივი: #).\n579|ფოლადის საიმედოობის კოეფიციენტი (EC#: #).\n580|რკინაბეტონის მოცულობითი წონა (ჩვეულებრივ # კნ/მ³).\n581|ბეტონის ნომინალური დამცავი ფენა ყალიბიან ზედაპირებზე (ყრილის მხარის ჩათვლით). ტიპური #–# მმ.\n582|ბეტონის დამცავი ფენა უშუალოდ გრუნტზე ჩასხმულ ზედაპირებზე (ფუძის ძირი, კბილი). EC#: # მმ.\n583|სტატიკური გადაყირავების მარაგის კოეფიციენტი (შემაკავებელი მომენტი / გადამაყირავებელი მომენტი). ტიპური #; ზოგიერთი ნორმა #.\n584|სტატიკური ძვრის მარაგის კოეფიციენტი (წინაღობა / ჰორიზონტალური ძალა). ტიპური #.\n585|თუ ტოლქმედი R ფუძის შუა მესამედში რჩება (e ≤ B/#), მთელ ფუძეზე წნევა კუმშვითია (ტრაპეციული განაწილება). გარეთ გასვლისას ფუძის ნაწილი გრუნტს სცილდება და კიდის წნევა სწრაფად იზრდება.\n586|გადაყირავების მარაგის კოეფიციენტი სეისმიკისას. ტიპური # (ზოგიერთ ნორმაში #).\n587|ძვრის მარაგის კოეფიციენტი სეისმიკისას. ტიპური #.\n588|შერბილებული ზღვარი ტოლქმედისთვის სეისმიკისას: e ≤ B/#.\n589|ფუძის დასაშვები წნევის გაზრდის კოეფიციენტი სეისმიკისას (ტიპური #).\n590|ზღვრული მდგომარეობის კოეფიციენტი მუდმივი ზემოქმედებისთვის (წონა, გრუნტისა და წყლის დაწოლა) (EC: #).\n591|ზღვრული მდგომარეობის კოეფიციენტი დროებითი ზემოქმედებისთვის (დამატებითი დატვირთვა, ზედა დატვირთვები) (EC: #).\n592|მიწისძვრისას არსებული დამატებითი დატვირთვის წილის დაშვება (ტრანსპორტისთვის #–#).\n593|მონიშვნისას წინა კონსოლზე მდებარე გრუნტის წონა წინაღობად ითვლება. ნაგულისხმევად გამორთულია, რადგან შეიძლება ამოითხაროს (ფრთხილი მიდგომა).\n594|მონიშვნისას დამატებითი და ზედა დატვირთვის ვერტიკალური წონა გადაყირავებასა და ძვრაში წინაღობად ითვლება. ნაგულისხმევად გამორთულია, რადგან დატვირთვა ყოველთვის შეიძლება არ იყოს.\n595|ძირი პირდაპირ გრუნტზე არ ისხმება; ჯერ თხელი, არაარმირებული მოსამზადებელი ბეტონი (C#/#–C#/#) ეწყობა. ის არმატურის დამცავ ფენას იცავს და ფუძეს სუფთად ინახავს. გამორთვისას ძირი პირდაპირ გრუნტზე ისხმება (გრუნტზე ჩასხმული ზედაპირების დამცავი ფენა მინიმუმ # მმ უნდა იყოს).\n596|მოსამზადებელი ბეტონის სისქე, ჩვეულებრივ #–# მ. შედის მოცულობებში და ექსკავაციას ამდენით აღრმავებს.\n597|მოსამზადებელი ბეტონის გადმოშვერა ძირის კიდიდან თითო მხარეს, რომ ყალიბი დაეყრდნოს, ჩვეულებრივ #–# მ.\n598|ექსკავაციის სამუშაო ადგილი ძირის გარეთ თითო მხარეს (ყალიბისა და გასასვლელისთვის, ჩვეულებრივ #–# მ). მხოლოდ მოცულობებისა და ღირებულებისთვის; ფერდები და სამაგრები არ შედის.\n599|ბზარის სიგანის ზღვარი EC# #-ის მიხედვით. კვაზიმუდმივი დატვირთვისას არმატურის ძაბვა ზღუდავს ან მაქსიმალურ დიამეტრს, ან მაქსიმალურ ბიჯს (ცხრილი #N / #N). უფრო მცირე ზღვარს უფრო ხშირი და წვრილი ღეროები ან უფრო სქელი კვეთი სჭირდება; ამიტომ ტანის ოპტიმალური სისქე დატვირთვასთან ერთად იცვლება.\n600|მონიშვნისას ოპტიმიზაცია ცალ-ცალკე ცდის წინა დახრილ, უკანა დახრილ და მუდმივი სისქის ტანს; ტანის ზედა და ქვედა სისქე ბზარისა და ძვრის შემოწმებებთან ერთად სკანირდება. გამორთვისას მხოლოდ არჩეული ფორმა გამოიყენება.\n601|ტანის ზედა სისქის ქვედა ზღვარი. ბეტონირების, ვიბრატორის შეყვანისა და ორი რიგი არმატურისთვის რეკომენდებულია მინიმუმ #–# მ.\n602|ავტომატური: ყოველ ცვლილებაზე ირჩევა ყველაზე მსუბუქი შესაფერისი დიამეტრი და ბიჯი. ხელით: გამოიყენება ცხრილის მნიშვნელობები, შემოწმებები აჩვენებს, საკმარისია თუ არა.");

</script>

выполняется на # м стены.\n547|Вертикальная погонная нагрузка на верх стены (например, надстройка, вес ограждения). Считается временной: учитывается в давлении под подошвой, но не как удерживающая при опрокидывании и сдвиге (меняется в параметрах).\n548|Горизонтальная нагрузка на верх стены (ограждение, удар автомобиля, ветровой экран). Увеличивает момент в стенке на Ht·Hs и умножается на γQ.\n549|Часть подошвы перед стенкой. Увеличивает плечо против опрокидывания и распределяет давление под подошвой. Невозможна, если спереди граница участка (тип L). Оптимум обычно – короткая передняя и длинная задняя консоль.\n550|Часть подошвы за стенкой, под засыпкой. Вес засыпки над ней удерживает стену: самый эффективный размер против сдвига и опрокидывания. При наклонной засыпке с удлинением консоли поднимается и плоскость давления.\n551|Толщина плиты подошвы. Определяет несущую способность консолей на изгиб и срез (без поперечной арматуры). Типично H/# – H/#, не менее # м.\n552|Толщина стенки вверху. Для бетонирования и размещения арматуры рекомендуется не менее #–# м.\n553|Толщина стенки в месте примыкания к подошве; здесь наибольшие момент и поперечная сила. Тонкая стенка – больше арматуры, толстая – больше бетона. Типично H/# – H/#.\n554|Бетонный зуб под подошвой. Включает пассивный отпор грунта перед ним против сдвига. Когда определяет сдвиг, часто дешевле, чем удлинение задней консоли.\n555|Глубина зуба ниже подошвы. Пассивный отпор растёт пропорционально квадрату глубины. Из-за выемки и производства работ обычно #–# м.\n556|Ширина зуба; воспринимает изгиб и срез зуба. Обычно #–# м.\n557|Под стенкой: арматура стенки может продолжаться в зуб, самое распространённое положение. На конце задней консоли: поверхность сдвига глубже и длиннее. На конце передней консоли: эффект может пропасть, если спереди выкопают грунт.\n558|Удельный вес засыпки выше уровня грунтовых вод. По нему вычисляются давление (Ka·γ·z) и удерживающий вес засыпки над задней консолью. Для уплотнённой зерни  û boriya drenajê tên pêşniyarkirin.\n543|Kîjan rûyê laşê dîwar xwar e. Rûyê pêşîn ê xwar (rûyê paşîn rast) herî zêde tê bikaranîn: qalib hêsan e û dagirtin bi rêkûpêk tê pestandin. Bi rûyê paşîn ê xwar, giraniya dagirtina li ser xwarbûnê jî dibe berxwedan. Stûriya domdar ji bo dîwarên biçûk (H < # m) guncav e.\n544|Bilindiya giştî ji binê bingehê heta serê dîwar (stûriya bingehê tê de). Pal bi H² û momenta wergerînê bi H³ mezin dibe: #% bilindiya zêdetir nêzîkî #% moment zêde dike.\n545|Bilindiya axa pêşîn ji binê bingehê (kûrahiya bicihkirinê). Divê di bin kûrahiya cemidinê de be (bi gelemperî ≥ #–# m). Bi diran, berxwedana pasîf ji vê kûrahiyê dest pê dike; dagirtina pêşîn bi xwe tenê dema “Berxwedana pasîf a dagirtina pêşîn bihesibîne” nîşankirî be tê hesibandin.\n546|Dirêjahiya dîwar tenê ji bo hejmar û lêçûnê. Hesab ji bo # m dîwar tê kirin.\n547|Barê xetî yê stûnî li ser serê dîwar (wek avahiya jorîn, giraniya parmaqê). Wek guherbar tê hesibandin: di zexta bingehê de heye, lê di wergerîn û şemitînê de wek berxwedêr nayê hesibandin (di Vebijarkan de tê guhertin).\n548|Barê asoyî li ser serê dîwar (parmaq, lêdana wesayîtê, perdeya bayê). Momenta laş bi Ht·Hs zêde dike û bi γQ tê zêdekirin.\n549|Beşa bingehê ya li pêşiya laş. Mila li dijî wergerînê dirêj dike û zexta bingehê belav dike. Heke li pêş sînor hebe (cureyê L) nabe. Çêtirîn bi gelemperî pêşeke kurt û paşeke dirêj e.\n550|Beşa bingehê ya li paş laş, di bin dagirtinê de. Giraniya dagirtina li ser wê dîwar aram dike: pîvana herî bandorker li dijî şemitîn û wergerînê. Bi dagirtina xwar, dema dirêj dibe rûyê palê jî bilind dibe.\n551|Stûriya plaka bingehê. Kapasîteya xwarbûn û birrînê (bê çember) ya pêş û paşa bingehê diyar dike. Asayî H/# – H/#, herî kêm # m.\n552|Stûriya jorîn a laş. Ji bo rijandina betonê û danîna hesin herî kêm #–# m tê pêşniyarkirin.\n553|Stûriya laş li cihê girêdana bi bingehê re; momenta û birrîna herî mezin li vir in. Laşê zirav hesinê zêdetir, laşê stûr betona zêdetir dixwaze. Asay . # m av bingehê dîwarê mînak nêzîkî #% firehtir dike: drenaj hema her tim çareseriya herî aborî ye.\n564|Goşeya xişandinê di navbera rûyê betonê yê dîwar û dagirtinê de. Tenê dema li ser paşa bingehê dagirtin tune be tê bikaranîn (L-ya berevajî, rûyê paşîn rast); asayî #/#·φ. δw ya mezintir palê kêm dike û beşeke aramker ber bi jêr ve dide. Bi paşa bingehê, pal li ser rûyê xeyalî bi δ = β tê girtin û ev nirx nayê bikaranîn.\n565|Giraniya taybet a axa bingehê; berxwedana pasîf a li pêşiya dîwar û diranê (Kp·γ·z) diyar dike.\n566|Goşeya xişandina navxweyî ya axa bingehê. Xişandina bingehê (δb = k·φ) û hejmarê pasîf Kp = tan²(# + φ/#) diyar dike.\n567|Kohezyona (drenajkirî) ya axa bingehê. Di şemitînê de pêvezeliqîna bingehê ca·B û #c·√Kp ji berxwedana pasîf a li pêşiya diranê re tîne. Di qûmê de #; di axa herî de ji bo demdirêj biçûk û bi hişyarî bigire.\n568|Zexta bingehê ya rê dayî ji lêkolîna axê. Statîk qmax ≤ qa, erdhej qmax ≤ qa × hejmarê zêdekirinê.\n569|Rêjeya goşeya xişandina bingeh–axê bi goşeya xişandina navxweyî ya axê re: δb = k·φ. Beşa sereke ya berxwedana şemitînê N·tan δb e (N: hêza stûnî li ser bingehê). Heke beton rasterast li ser axê were rijandin rû zivir e û k = #–# dikare were girtin; li ser betona paqijiyê an rûyekî nerm #/# gelemperî ye.\n570|Pêvezeliqîn berxwedana ku ji zeliqîna axa kohezîf (herî) bi bingeha betonê re çêdibe ye: ca = k·c, û ca·B berxwedana şemitînê dide (B: firehiya bingehê). Di qûm û xîçikê de c = #, ji ber vê bandora wê tune. Ji ber ku axa herî bi demê re dikare nerm bibe û di kolanê de xira dibe, k ≈ # bi hişyarî ye; ji bo demdirêj c′ ya drenajkirî biçûk bigire.\n571|Heke nîşankirî be, berxwedana pasîf a dagirtina pêşîn (bilindiya Df) di şemitînê de tê hesibandin. Heke dibe ku pêş paşê were kolan an nerm bibe, nîşan neke (pêşdanasîn). Beşa diranê ya di binê bingehê de her tim tê hesibandin.\n572|Berxwedana pasîf ji bo ku ax were pestandin û li ber xwe bide tevgereke berbiçav a dîwar (nêzîkî #–#% ya bilindiyê) dixwaze, lê pala çalak bi tevgereke pir biçûk çêdibe. Ji ber vê tenê beşek ji berxwedana pasîf a hesibandî tê bikaranîn; # nirxeke hişyar a gelemperî ye.\n573|Rewşa erdhejê bi rêbaza Mononobe–Okabe cuda kontrol dike; kontrolên statîk derbasdar dimînin.\n574|Hejmarê erdhejê yê asoyî. Heke dîwar dikare çend santîmetre bilive, bi gelemperî kh ≈ #·PGA/g; ji bo dîwarên hişk ên ku naşemitin kh ≈ PGA/g. Li gorî rêziknameya erdhejê ya welat were girtin.\n575|Hejmarê erdhejê yê stûnî; bi gelemperî # an ±#·kh. Giraniyan bi (# − kv) kêm dike.\n576|Hêza taybet a betonê ya silindirê. Ji bo avahiyên ku bi axê re têkildar in herî kêm C#/#, çêtir C#/#.\n577|Sînorê herikînê yê hesinê betonê (B#: # MPa).\n578|Hejmarê ewlehiyê yê betonê (EC# domdar: #).\n579|Hejmarê ewlehiyê yê hesin (EC#: #).\n580|Giraniya taybet a betona hesinî (bi gelemperî # kN/m³).\n581|Qada parastinê ya navîn li ser rûyên qalibkirî (aliyê dagirtinê jî tê de). Asayî #–# mm.\n582|Qada parastinê li ser rûyên ku rasterast li ser axê tên rijandin (binê bingehê, diran). EC#: # mm.\n583|Hejmarê ewlehiyê yê statîk li dijî wergerînê (momenta berxwedêr / momenta wergerînê). Asayî #; hin şert #.\n584|Hejmarê ewlehiyê yê statîk li dijî şemitînê (berxwedan / hêza asoyî). Asayî #.\n585|Heke encamdar R di sêyeka navîn a bingehê de bimîne (e ≤ B/#), tevahiya bingehê di bin pestinê de ye (belavbûna trapezoîd). Heke derkeve, beşek ji bingehê ji axê vediqete û zexta qiraxê zû zêde dibe.\n586|Hejmarê ewlehiyê li dijî wergerînê di rewşa erdhejê de. Asayî # (di hin rêziknameyan de #).\n587|Hejmarê ewlehiyê li dijî şemitînê di rewşa erdhejê de. Asayî #.\n588|Sînorê sivikkirî ji bo encamdarê di rewşa erdhejê de: e ≤ B/#.\n589|Hejmarê zêdekirina zexta bingehê ya rê dayî di rewşa erdhejê de (asayî #).\n590|Hejmarê rewşa sînorî ya dawî ji bo bandorên domdar (giranî, pala axê û avê) (EC: #).\n591|Hejmarê rewşa sînorî ya dawî ji bo bandorên guherbar (barê zêde, barên serî) (EC: #).\n592|Beşa texmînkirî ya barê zêde ku di dema erdhejê de heye (ji bo traf <script>
/* İstinat duvarı hesap motoru – betonarme konsol duvar (T, L, ters L), isteğe bağlı kayma dişi.
   Birimler: m, kN, kPa (kN/m²), kN/m³, derece; donatı Φ mm, aralık mm, alan mm²/m. Hesap duvarın 1 m boyu için yapılır.
   Stabilite: güvenlik sayıları (servis yükleri; deprem durumunda ayrı sınırlar).
   Toprak itkisi: sanal arka yüzde (topuk ucundan geçen düşey düzlem) Coulomb; topuk üstünde dolgu varsa δ = β (Rankine ile aynı).
   Deprem: Mononobe–Okabe (ΔPAE 0,6·H’de), duvar ve topuk üstü dolgu ataleti kh·W, düşey kv.
   Betonarme: EC2 (fcd = 0,85·fck/γc), etriyesiz kesme VRd,c; taşıma gücü katsayıları γG / γQ. */
(function (root) {
  'use strict';
  const PI = Math.PI, rad = (d) => (d * PI) / 180, deg = (r) => (r * 180) / PI;
  const GW = 9.81;                                   // su birim ağırlığı kN/m³
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const NF = {}, LOCF = () => (root.I18N ? root.I18N.loc() : 'tr-TR');
  const fm = (x, d = 0) => { if (!isFinite(x)) return '–'; const k = LOCF() + d; return (NF[k] || (NF[k] = new Intl.NumberFormat(LOCF(), { minimumFractionDigits: d, maximumFractionDigits: d }))).format(x); };

  /* ---------------- varsayılan girdiler ---------------- */
  const DEFAULTS = {
    type: 'T',                    // T: ön + arka ampatman · L: yalnız arka (ön yüz sınırda) · RL: yalnız ön (arka yüz sınırda)
    stemShape: 'front',           // front: ön yüz eğimli · back: arka yüz eğimli · none: sabit kalınlık
    geo: { H: 5.0, Df: 1.0, tb: 0.50, toe: 1.00, heel: 2.50, ttop: 0.25, tbot: 0.45 },
    key: { on: false, h: 0.50, b: 0.40, pos: 'stem' },
    back: { g: 18, gsat: 20, phi: 30, beta: 0, q: 10, hw: 0, dw: 20 },
    found: { g: 18, phi: 30, c: 0, qa: 200, kb: 0.67, kc: 0.5, front: false, fp: 0.5 },
    seis: { on: false, kh: 0.15, kv: 0 },
    top: { P: 0, Ht: 0 },
    mat: { fck: 30, fyk: 500, gc: 1.5, gs: 1.15, wc: 25, cover: 50, coverSoil: 75 },
    lim: { FSs: 1.5, FSo: 2.0, eDiv: 6, FSsE: 1.1, FSoE: 1.5, eDivE: 4, qaE: 1.33, wk: 0.3 },
    uls: { gG: 1.35, gQ: 1.5, psi2: 0.3 },
    opts: { soilOnToe: false, surchStab: false, leanOn: true, lean: 0.10, leanOver: 0.10, ws: 0.50 },
    L: 20,
    price: { conc: 120, steel: 1.2, form: 25, exc: 8, fill: 10, lean: 80 },
    rebarMode: 'auto',
    rebar: null,
    meta: { project: '', name: 'İstinat duvarı İD-1', drawn: '', checked: '', rev: 'A' },
  };

  /* ---------------- yardımcılar ---------------- */
  function polyAC(p) {
    let A = 0, cx = 0, cy = 0;
    for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length], c = a[0] * b[1] - b[0] * a[1]; A += c; cx += (a[0] + b[0]) * c; cy += (a[1] + b[1]) * c; }
    if (Math.abs(A) < 1e-12) return { A: 0, x: 0, y: 0 };
    return { A: Math.abs(A) / 2, x: cx / (3 * A), y: cy / (3 * A) };
  }
  function clipY(p, yc, below) {     // yatay çizgiyle kırp (below: y ≤ yc kısmı)
    const ins = (q) => (below ? q[1] <= yc + 1e-12 : q[1] >= yc - 1e-12), out = [];
    for (let i = 0; i < p.length; i++) {
      const a = p[i], b = p[(i + 1) % p.length], ia = ins(a), ib = ins(b);
      if (ia) out.push(a);
      if (ia !== ib) { const t = (yc - a[1]) / (b[1] - a[1]); out.push([a[0] + t * (b[0] - a[0]), yc]); }
    }
    return out;
  }
  /* Coulomb aktif katsayısı, düşey yüz (θ = 0); δ = β iken Rankine ile aynıdır */
  function kaC(phi, delta, beta) {
    const f = rad(phi), d = rad(delta), b = rad(beta);
    if (f - b < 0) return NaN;
    const r = (Math.sin(f + d) * Math.sin(f - b)) / (Math.cos(d) * Math.cos(b));
    return Math.cos(f) ** 2 / (Math.cos(d) * (1 + Math.sqrt(r)) ** 2);
  }
  /* Mononobe–Okabe, düşey yüz */
  function kaeMO(phi, delta, beta, kh, kv) {
    const f = rad(phi), d = rad(delta), b = rad(beta), psi = Math.atan(kh / (1 - kv));
    if (f - b - psi < 0) return NaN;
    const r = (Math.sin(f + d) * Math.sin(f - b - psi)) / (Math.cos(d + psi) * Math.cos(b));
    return Math.cos(f - psi) ** 2 / (Math.cos(psi) * Math.cos(d + psi) * (1 + Math.sqrt(r)) ** 2);
  }
  const kpR = (phi) => Math.tan(rad(45 + phi / 2)) ** 2;
  /* üçgen + su altı itki: düzlem boyu Hv, su seviyesi düzlem tabanından hw yukarıda; y düzlem tabanından */
  function soilForce(K, g, gsub, Hv, hw) {
    const h2 = clamp(hw, 0, Hv), zw = Hv - h2;
    const P1 = 0.5 * K * g * zw * zw, P2 = K * g * zw * h2, P3 = 0.5 * K * gsub * h2 * h2;
    const P = P1 + P2 + P3;
    return { P, y: P > 0 ? (P1 * (h2 + zw / 3) + P2 * (h2 / 2) + P3 * (h2 / 3)) / P : 0, sTop: 0, sWT: K * g * zw, sBot: K * g * zw + K * gsub * h2 };
  }

  /* ---------------- geometri ---------------- */
  function geom(s) {
    const g = s.geo, t = s.type;
    const toe = t === 'L' ? 0 : Math.max(0, +g.toe || 0), heel = t === 'RL' ? 0 : Math.max(0, +g.heel || 0);
    const ttop = +g.ttop, tbot = s.stemShape === 'none' ? ttop : Math.max(+g.tbot, ttop);
    const H = +g.H, tb = +g.tb, Hs = H - tb, B = toe + tbot + heel, dx = tbot - ttop;
    const err = !(H > 0) ? 'Duvar yüksekliği H sıfırdan büyük olmalı.' : !(tb > 0) ? 'Taban kalınlığı sıfırdan büyük olmalı.' : !(Hs > 0.2) ? 'Taban kalınlığı duvar yüksekliğinden küçük olmalı.' : !(ttop > 0.1) ? 'Gövde üst kalınlığı en az 0,10 m olmalı.' : !(B > 0) ? 'Taban genişliği sıfırdan büyük olmalı.' : '';
    const xf0 = toe, xb0 = toe + tbot;
    const xfT = s.stemShape === 'front' ? toe + dx : toe;
    const xbT = s.stemShape === 'back' ? xb0 - dx : xb0;
    const tanB = Math.tan(rad(+s.back.beta || 0));
    const ySurf = (x) => H + Math.max(0, x - xbT) * tanB;
    const Hv = ySurf(B);
    const stem = [[xf0, tb], [xb0, tb], [xbT, H], [xfT, H]];
    const base = [[0, 0], [B, 0], [B, tb], [0, tb]];
    const k = s.key, keyOn = !!k.on && k.h > 0 && k.b > 0;
    const kb = Math.min(+k.b, B), xk = !keyOn ? 0 : k.pos === 'heel' ? B - kb : k.pos === 'toe' ? 0 : clamp(toe + tbot / 2 - kb / 2, 0, B - kb);
    const key = keyOn ? [[xk, -k.h], [xk + kb, -k.h], [xk + kb, 0], [xk, 0]] : null;
    const soilHeel = [[xb0, tb], [B, tb], [B, Hv], [xbT, H]];
    const Df = Math.max(0, +g.Df || 0);
    const soilToe = Df > tb && toe > 0 ? [[0, tb], [toe, tb], [toe, Df], [0, Df]] : null;
    const thick = (y) => tbot + ((ttop - tbot) * (y - tb)) / Hs;
    return { ok: !err, err, toe, heel, ttop, tbot, H, tb, Hs, B, dx, xf0, xb0, xfT, xbT, tanB, ySurf, Hv, stem, base, key, keyOn, keyH: keyOn ? +k.h : 0, keyB: kb, xk, soilHeel, soilToe, Df, thick };
  }

  /* ---------------- toprak itkisi ---------------- */
  function pressure(s, gm) {
    const b = s.back, virt = gm.B - gm.xbT > 0.005;
    const dDeg = virt ? +b.beta : Math.min(+b.dw, +b.phi), d = rad(dDeg);
    const K = kaC(b.phi, dDeg, b.beta);
    const hw = clamp(+b.hw || 0, 0, gm.Hv), gsub = b.gsat - GW;
    const soil = soilForce(K, b.g, gsub, gm.Hv, hw);
    const q = { P: K * b.q * gm.Hv, y: gm.Hv / 2 };
    const w = { P: 0.5 * GW * hw * hw, y: hw / 3 };

  function dimV(x, y1, y2, txt, left) {

    return `<g stroke="${C.dim}" stroke-width="0.9"><line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/><line x1="${x - t}" y1="${y1}" x2="${x + t}" y2="${y1}"/><line x1="${x - t}" y1="${y2}" x2="${x + t}" y2="${y2}"/></g>` +
      (Math.abs(y2 - y1) > 14 ? `<text x="${tx}" y="${(y1 + y2) / 2 + 4}" text-anchor="${left ? 'end' : 'start'}" font-size="11" fill="${C.dim}">${txt}</text>` : '');
  }
  const arrow = (x1, y1, x2, y2, col, w = 1.6) => {
    const a = Math.atan2(y2 - y1, x2 - x1), L = 7, p1 = [x2 - L * Math.cos(a - 0.4), y2 - L * Math.sin(a - 0.4)], p2 = [x2 - L * Math.cos(a + 0.4), y2 - L * Math.sin(a + 0.4)];
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}"/><polygon points="${x2},${y2} ${p1[0]},${p1[1]} ${p2[0]},${p2[1]}" fill="${col}"/>`;
  };

  /* kesit: opt { w, h, press, bear, rebar, dims, forces } */
  function section(s, o, opt) {
    opt = Object.assign({ w: 760, h: 520, press: true, bear: true, rebar: false, dims: true, forces: true, pad: 46 }, opt || {});
    if (!o || !o.ok) return `<svg viewBox="0 0 ${opt.w} 120" width="100%"><text x="20" y="60" fill="#A12622">${(o && o.err) || 'Geometri hatalı'}</text></svg>`;
    const gm = o.gm, st = o.stat, ep = o.ep;
    const xL = -Math.max(1.1, 0.3 * gm.B), xR = gm.B + Math.max(1.0, 0.35 * gm.B) + (opt.press ? 0.18 * gm.H : 0);
    const yTop = Math.max(gm.Hv, gm.H) + 0.35 * gm.H * 0.25 + 0.3, yBot = -(gm.keyH || 0) - (opt.bear ? 0.28 * gm.H : 0.3) - 0.25;
    const k = Math.min((opt.w - 2 * opt.pad) / (xR - xL), (opt.h - 2 * opt.pad) / (yTop - yBot));
    const X = (x) => opt.pad + (x - xL) * k, Y = (y) => opt.h - opt.pad - (y - yBot) * k;
    const P = (pts) => pts.map((p) => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
    let g = '';
    // temel zemini, ön dolgu, arka dolgu
    const yFb = -(gm.keyH || 0) - 0.25;
    g += `<rect x="${X(xL)}" y="${Y(0)}" width="${(xR - xL) * k}" height="${(0 - yFb) * k}" fill="${C.found}"/>`;
    const Df = gm.Df;
    if (Df > 0) {
      const pts = Df > gm.tb ? [[xL, 0], [0, 0], [0, gm.tb], [gm.toe, gm.tb], [gm.xf0 + (gm.xfT - gm.xf0) * Math.max(0, (Df - gm.tb) / gm.Hs), Df], [xL, Df]] : [[xL, 0], [0, 0], [0, Df], [xL, Df]];
      g += `<polygon points="${P(pts)}" fill="${C.front}" stroke="${C.backL}" stroke-width="0.8"/>`;
    }
    const ys = gm.ySurf(xR);
    g += `<polygon points="${P([[gm.xbT, gm.H], [xR, ys], [xR, 0], [gm.B, 0], [gm.B, gm.tb], [gm.xb0, gm.tb]])}" fill="${C.back}" stroke="${C.backL}" stroke-width="0.8"/>`;
    // su
    if (ep.hw > 0) g += `<line x1="${X(gm.B)}" y1="${Y(ep.hw)}" x2="${X(xR)}" y2="${Y(ep.hw)}" stroke="${C.water}" stroke-width="1.4" stroke-dasharray="6 3"/><text x="${X(xR) - 4}" y="${Y(ep.hw) - 4}" text-anchor="end" font-size="11" fill="${C.water}">YAS ▽</text>`;
    // sürşarj
    if (s.back.q > 0) { const n = 7; for (let i = 0; i < n; i++) { const x = gm.xbT + ((xR - gm.xbT) * (i + 0.5)) / n, y = gm.ySurf(x); g += arrow(X(x), Y(y) - 22, X(x), Y(y) - 2, '#7F8C8D', 1.1); } g += `<text x="${X((gm.xbT + xR) / 2)}" y="${Y(gm.ySurf((gm.xbT + xR) / 2)) - 26}" text-anchor="middle" font-size="11" fill="#566573">q = ${f0(s.back.q)} kPa</text>`; }
    // beton
    g += `<polygon points="${P(gm.stem)}" fill="${C.conc}" stroke="${C.concL}" stroke-width="1.2"/><polygon points="${P(gm.base)}" fill="${C.conc}" stroke="${C.concL}" stroke-width="1.2"/>`;
    const lg = o.qty && o.qty.lean;
    if (lg && lg.on) g += `<rect x="${X(-lg.ov)}" y="${Y(0)}" width="${(gm.B + 2 * lg.ov) * k}" height="${Math.max(1.5, lg.t * k)}" fill="#C9CDD2" stroke="#8A929B" stroke-width="0.7"/>`;
    if (gm.key) g += `<polygon points="${P(gm.key)}" fill="${C.key}" stroke="${C.concL}" stroke-width="1.2"/>`;
    // donatı
    if (opt.rebar && o.rb) g += rebarLines(s, o, X, Y);
    // sanal arka yüz ve basınç diyagramı
    if (opt.press) {
      g += `<line x1="${X(gm.B)}" y1="${Y(0)}" x2="${X(gm.B)}" y2="${Y(gm.Hv)}" stroke="${C.press}" stroke-width="1" stroke-dasharray="4 3"/>`;
      const sBot = ep.K * s.back.q + ep.soil.sBot + 9.81 * ep.hw, sc = (0.16 * gm.H) / Math.max(1, sBot) ;
      const zw = gm.Hv - ep.hw, pts = [[gm.B, gm.Hv], [gm.B + ep.K * s.back.q * sc, gm.Hv]];
      if (ep.hw > 0) pts.push([gm.B + (ep.K * s.back.q + ep.soil.sWT) * sc, ep.hw]);
      pts.push([gm.B + sBot * sc, 0], [gm.B, 0]);
      g += `<polygon points="${P(pts)}" fill="${C.press}" fill-opacity="0.22" stroke="${C.press}" stroke-width="1"/>`;
      g += `<text x="${X(gm.B + sBot * sc) + 4}" y="${Y(0) - 3}" font-size="10.5" fill="${C.press}">${f0(sBot)} kPa</text>`;
      if (zw >= 0 && opt.forces) {
        const Ph = st.H, yR = o.A0.H.reduce((a, it) => a + it.h * it.y, 0) / Math.max(1e-9, o.A0.H.reduce((a, it) => a + it.h, 0));
        g += arrow(X(gm.B + 0.22 * gm.H), Y(yR), X(gm.B) + 3, Y(yR), C.press, 2.2) + `<text x="${X(gm.B + 0.22 * gm.H)}" y="${Y(yR) - 6}" font-size="11.5" font-weight="600" fill="${C.press}">ΣH = ${f0(Ph)} kN/m</text>`;
      }
    }
    // taban basıncı
    if (opt.bear && st.bp.ok) {
      const top = yFb - 0.08, sc = (0.18 * gm.H) / Math.max(1, st.bp.qmax), n = 24, pts = [[0, top]];
      for (let i = 0; i <= n; i++) { const x = (gm.B * i) / n; pts.push([x, top - st.bp.at(x) * sc]); }
      pts.push([gm.B, top]);
      g += `<polygon points="${P(pts)}" fill="${C.bear}" fill-opacity="0.18" stroke="${C.bear}" stroke-width="1"/>`;
      g += `<text x="${X(0)}" y="${Y(top - st.bp.qToe * sc) + 13}" font-size="10.5" fill="${C.bear}">${f0(st.bp.qToe)}</text><text x="${X(gm.B)}" y="${Y(top - st.bp.qHeel * sc) + 13}" text-anchor="end" font-size="10.5" fill="${C.bear}">${f0(st.bp.qHeel)} kPa</text>`;
    }
    // ölçüler
    if (opt.dims) {
      const y1 = Y(yBot) + 8, y2 = Y(yBot) + 30, seg = (a, b, t) => { const w = X(b) - X(a); return w > 1 ? dimH(X(a), X(b), y1, w < 34 ? '' : t) + (w < 34 && t ? `<text x="${(X(a) + X(b)) / 2}" y="${y1 - 6}" text-anchor="middle" font-size="10" fill="${C.dim}">${t}</text>` : '') : ''; };
      g += seg(0, gm.xf0, gm.toe > 0 ? f2(gm.toe) : '') + seg(gm.xf0, gm.xb0, f2(gm.tbot)) + seg(gm.xb0, gm.B, gm.heel > 0 ? f2(gm.heel) : '');
      g += dimH(X(0), X(gm.B), y2, 'B = ' + f2(gm.B));
      g += dimH(X(gm.xfT), X(gm.xbT), Y(gm.H) - 10, f2(gm.ttop), true) + (X(gm.xbT) - X(gm.xfT) < 18 ? `<text x="${X(gm.xbT) + 4}" y="${Y(gm.H) - 13}" font-size="10" fill="${C.dim}">${f2(gm.ttop)}</text>` : '');
      g += dimV(X(xL) + 12, Y(0), Y(gm.H), 'H = ' + f2(gm.H), false);
      g += dimV(X(gm.B) + 8, Y(0), Y(gm.tb), 'tb ' + f2(gm.tb), false);
      if (Df > 0) g += `<text x="${X(xL) + 4}" y="${Y(Df) - 5}" font-size="10.5" fill="#6E5A2E">▽ ön zemin · Df = ${f2(Df)}</text>`;
      if (gm.key) g += dimV(X(gm.xk) - 6, Y(0), Y(-gm.keyH), f2(gm.keyH), true);
    }
    const lab = `<text x="${X(gm.toe + gm.tbot / 2)}" y="${Y(gm.H) - 26}" text-anchor="middle" font-size="11" fill="#566573">${s.back.beta ? 'β = ' + f0(s.back.beta) + '°' : ''}</text>`;
    return `<svg viewBox="0 0 ${opt.w} ${opt.h}" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">${g}${lab}</svg>`;
  }

  /* donatı çizgileri (şematik) */
  function rebarLines(s, o, X, Y) {
    const gm = o.gm, c = s.mat.cover / 1000, cs = s.mat.coverSoil / 1000, rb = o.rb;
    const ln = (pts, col, w) => `<polyline points="${pts.map((p) => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="${w}"/>`;
    const tag = (x, y, n) => `<circle cx="${X(x)}" cy="${Y(y)}" r="8" fill="#fff" stroke="${C.reb}" stroke-width="1"/><text x="${X(x)}" y="${Y(y) + 3.5}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${C.reb}">${n}</text>`;
    let g = '';
    const foot = Math.max(0.3, 15 * rb.stemB.phi / 1000);
    const bx = (y) => gm.xb0 + ((gm.xbT - gm.xb0) * (y - gm.tb)) / gm.Hs, fx = (y) => gm.xf0 + ((gm.xfT - gm.xf0) * (y - gm.tb)) / gm.Hs;
    // 1 arka düşey (ana) – tabana L ile iner, topuğa doğru ayak
    g += ln([[bx(gm.H - c) - c, gm.H - c], [gm.xb0 - c, gm.tb], [gm.xb0 - c, cs + 0.02], [Math.min(gm.B - c, gm.xb0 - c + foot), cs + 0.02]], C.reb, 2.2);
    // 2 ön düşey
    g += ln([[fx(gm.H - c) + c, gm.H - c], [gm.xf0 + c, gm.tb], [gm.xf0 + c, cs + 0.04], [Math.max(c, gm.xf0 + c - foot), cs + 0.04]], C.reb2, 1.6);
    // 5 taban alt, 6 taban üst (uçlar kıvrık)
    g += ln([[c, gm.tb - c], [c, cs], [gm.B - c, cs], [gm.B - c, gm.tb - c]], C.reb, 1.8);
    g += ln([[c, cs + 0.05], [c, gm.tb - c], [gm.B - c, gm.tb - c], [gm.B - c, cs + 0.05]], C.reb2, 1.8);
    // yatay (3, 4) ve boyuna (7, 8) noktalar
    const nH = Math.max(3, Math.min(14, Math.round(gm.Hs / (rb.stemH.s / 1000))));
    for (let i = 1; i < nH; i++) { const y = gm.tb + (gm.Hs * i) / nH; g += `<circle cx="${X(bx(y) - c - 0.03)}" cy="${Y(y)}" r="1.6" fill="${C.reb}"/><circle cx="${X(fx(y) + c + 0.03)}" cy="${Y(y)}" r="1.6" fill="${C.reb2}"/>`; }
    const nL = Math.max(3, Math.min(16, Math.round(gm.B / (rb.baseL.s / 1000))));
    for (let i = 1; i < nL; i++) { const x = (gm.B * i) / nL; g += `<circle cx="${X(x)}" cy="${Y(cs + 0.035)}" r="1.6" fill="${C.reb}"/><circle cx="${X(x)}" cy="${Y(gm.tb - c - 0.035)}" r="1.6" fill="${C.reb2}"/>`; }
    if (gm.key && rb.key) g += ln([[gm.xk + cs, gm.tb - c - 0.05], [gm.xk + cs, -gm.keyH + cs], [gm.xk + gm.keyB - cs, -gm.keyH + cs], [gm.xk + gm.keyB - cs, gm.tb - c - 0.05]], C.reb, 1.8) + tag(gm.xk + gm.keyB / 2, -gm.keyH / 2, 9);
    g += tag(bx(gm.tb + gm.Hs * 0.62) + 0.25, gm.tb + gm.Hs * 0.62, 1) + tag(fx(gm.tb + gm.Hs * 0.45) - 0.25, gm.tb + gm.Hs * 0.45, 2);
    g += tag(bx(gm.tb + gm.Hs * 0.3) + 0.25, gm.tb + gm.Hs * 0.3, 3) + tag(fx(gm.tb + gm.Hs * 0.25) - 0.25, gm.tb + gm.Hs * 0.25, 4);
    g += tag(gm.B * 0.25, -0.12, 5) + tag(gm.B * 0.75, gm.tb + 0.16, 6) + tag(gm.B * 0.55, -0.12, 7) + tag(gm.B * 0.9, gm.tb + 0.16, 8);
    return g;
  }

  /* tip simgesi (T / L / ters L) */
  function typeIcon(type, shape, on) {
    const s = { T: [18, 14, 36], L: [0, 14, 50], RL: [36, 14, 0] }[type] || [18, 14, 36];
    const toe = s[0], st = s[1], heel = s[2], B = toe + st + heel, x0 = (70 - B) / 2, top = 6, bot = 46, tb = 8;
    const sf = shape === 'front' ? 5 : 0, sb = shape === 'back' ? 5 : 0;
    const col = on ? '#1F4E78' : '#7D8794';
    return `<svg viewBox="0 0 70 52" width="70" height="52"><polygon points="${x0},${bot} ${x0 + B},${bot} ${x0 + B},${bot - tb} ${x0 + toe + st},${bot - tb} ${x0 + toe + st - sb},${top} ${x0 + toe + sf},${top} ${x0 + toe},${bot - tb} ${x0},${bot - tb}" fill="${on ? '#C9D8EA' : '#E5E8EC'}" stroke="${col}" stroke-width="1.5"/>` +
      `<line x1="${x0 + toe + st}" y1="${top}" x2="68" y2="${top}" stroke="#B39B62" stroke-width="1"/></svg>`;
  }

  root.WallDraw = { section, typeIcon, C };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* A3 paftalar (420 × 297 mm, SVG): 1 = kesit + donatı + donatı çizelgesi + metraj, 2 = hesap çizelgesi */
(function (root) {
  'use strict';
  const W = root.Wall, D = root.WallDraw;
  const f = (x, d = 0) => W.fm(x, d);
  const esc = (t) => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const TX = (x, y, t, o = {}) => `<text x="${x}" y="${y}" font-size="${o.s || 2.6}" ${o.b ? 'font-weight="700"' : ''} ${o.a ? `text-anchor="${o.a}"` : ''} fill="${o.c || '#1C2733'}">${esc(t)}</text>`;
  /* tablo: cols = [[başlık, genişlik, hizalama]], rows = [[...]] → { svg, h } */
  function tbl(x, y, cols, rows, o = {}) {
    const rh = o.rh || 4.6, fs = o.fs || 2.45, wTot = cols.reduce((a, c) => a + c[1], 0);
    let g = `<rect x="${x}" y="${y}" width="${wTot}" height="${rh}" fill="#E8EEF5"/>`, cx = x;
    cols.forEach((c) => { g += TX(c[2] === 'r' ? cx + c[1] - 1 : cx + 1, y + rh - 1.4, c[0], { s: fs, b: 1, a: c[2] === 'r' ? 'end' : null, c: '#1F4E78' }); cx += c[1]; });
    rows.forEach((r, i) => {
      const yy = y + rh * (i + 1); cx = x;
      if (r.head) { g += `<rect x="${x}" y="${yy}" width="${wTot}" height="${rh}" fill="#F4F6F9"/>` + TX(x + 1, yy + rh - 1.4, r.head, { s: fs, b: 1 }); return; }
      if (r.bad) g += `<rect x="${x}" y="${yy}" width="${wTot}" height="${rh}" fill="#FCE9E8"/>`;
      r.forEach((v, j) => { const c = cols[j]; g += TX(c[2] === 'r' ? cx + c[1] - 1 : cx + 1, yy + rh - 1.4, v, { s: fs, a: c[2] === 'r' ? 'end' : null, b: r.bold }); cx += c[1]; });
      g += `<line x1="${x}" y1="${yy + rh}" x2="${x + wTot}" y2="${yy + rh}" stroke="#D9DEE5" stroke-width="0.2"/>`;
    });
    g += `<rect x="${x}" y="${y}" width="${wTot}" height="${rh * (rows.length + 1)}" fill="none" stroke="#9AA7B5" stroke-width="0.3"/>`;
    return { svg: g, h: rh * (rows.length + 1) };
  }
  function frame(s, no, total, title) {
    const m = s.meta || {}, x = 238, y = 262, w = 172, h = 25;
    return `<rect x="0" y="0" width="420" height="297" fill="#fff"/><rect x="10" y="10" width="400" height="277" fill="none" stroke="#1C2733" stroke-width="0.6"/>` +
      `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff" stroke="#1C2733" stroke-width="0.4"/>` +
      `<line x1="${x}" y1="${y + 9}" x2="${x + w}" y2="${y + 9}" stroke="#1C2733" stroke-width="0.3"/><line x1="${x + 120}" y1="${y + 9}" x2="${x + 120}" y2="${y + h}" stroke="#1C2733" stroke-width="0.3"/>` +
      `<text x="${x + 2}" y="${y + 6}" font-size="3.2" font-weight="700" fill="#1C2733"><tspan>${esc(m.project || 'Proje')}</tspan><tspan> – </tspan><tspan>${esc(m.name || 'İstinat duvarı')}</tspan></text>` +
      TX(x + 2, y + 14, title, { s: 3.4, b: 1, c: '#1F4E78' }) + TX(x + 2, y + 19.5, `Betonarme konsol istinat duvarı · tip ${({ T: 'T', L: 'L', RL: 'ters L' })[s.type]} · H = ${f(s.geo.H, 2)} m · L = ${f(s.L, 1)} m`, { s: 2.4 }) +
      `<text x="${x + 2}" y="${y + 23.5}" font-size="2.2" fill="#5B6B7B"><tspan>Çizen:</tspan><tspan> ${esc(m.drawn || '–')} </tspan><tspan>· Kontrol:</tspan><tspan> ${esc(m.checked || '–')} </tspan><tspan>· Rev.</tspan><tspan> ${esc(m.rev || 'A')}</tspan></text>` +
      TX(x + 146, y + 16, `Pafta ${no} / ${total}`, { s: 3.2, b: 1, a: 'middle' }) + TX(x + 146, y + 22, 'A3 · ölçüler m, mm', { s: 2.2, a: 'middle', c: '#5B6B7B' });
  }
  const embed = (svg, x, y, w, h) => svg.replace(/^<svg viewBox="0 0 (\d+) (\d+)" width="100%"/, (m0, a, b) => `<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="0 0 ${a} ${b}"`);

  function sheet1(s, o, total) {
    let g = frame(s, 1, total, 'Kesit, donatı ve metraj');
    g += TX(16, 18, 'KESİT VE DONATI (1 m duvar)', { s: 3.4, b: 1, c: '#1F4E78' });
    g += embed(D.section(s, o, { w: 820, h: 640, rebar: true, press: false, bear: false, forces: false }), 12, 20, 222, 174);
    // malzeme ve notlar
    const m = s.mat, notes = [`Beton C${m.fck}/${Math.round(m.fck * 1.25 / 5) * 5} · Donatı B${m.fyk} · pas payı ${m.cover} mm (zemine dökülen yüzler ${m.coverSoil} mm)`,
      (o.qty.lean && o.qty.lean.on ? `Grobeton ${f(o.qty.lean.t * 100)} cm · Arka dolgu drenajlı granüler malzeme (φ = ${f(s.back.phi)}°, γ = ${f(s.back.g)} kN/m³), barbakan ve drenaj borusu önerilir.` : `Grobeton yok · Arka dolgu drenajlı granüler malzeme (φ = ${f(s.back.phi)}°, γ = ${f(s.back.g)} kN/m³), barbakan ve drenaj borusu önerilir.`),
      `Taban zemini izin verilen basınç ${f(s.found.qa)} kPa; uygulamada zemin etüdüyle doğrulanmalı.`,
      'Bindirmeler 50Φ; düşey ana donatı tabana L ile ankre edilir. Genleşme/derz aralığı en çok 10–12 m.'];
    notes.forEach((t, i) => { g += TX(16, 202 + i * 4.6, '• ' + t, { s: 2.35 }); });
    // donatı çizelgesi
    const bars = o.qty.bars;
    const t1 = tbl(240, 20, [['Poz', 10, 'l'], ['Tanım', 62, 'l'], ['Φ', 8, 'r'], ['Aralık', 13, 'r'], ['Adet', 13, 'r'], ['Boy (m)', 14, 'r'], ['Top. (m)', 16, 'r'], ['kg', 14, 'r']],
      bars.map((b) => [String(b.mark), b.desc, String(b.phi), b.s ? String(b.s) : '–', f(b.n), f(b.len, 2), f(b.tot, 1), f(b.kg, 0)]).concat([Object.assign(['', 'TOPLAM', '', '', '', '', '', f(o.qty.tot.steel, 0)], { bold: true })]));
    g += TX(240, 17, `DONATI ÇİZELGESİ (duvar boyu L = ${f(s.L, 1)} m)`, { s: 3.2, b: 1, c: '#1F4E78' }) + t1.svg;
    let y = 20 + t1.h + 10;
    const q = o.qty, p = s.price;
    const t2 = tbl(240, y, [['Kalem', 62, 'l'], ['1 m için', 28, 'r'], ['Toplam', 30, 'r'], ['Birim', 16, 'l']], [

  }

  /* çizim */
  function render(cv, s, o, view, opt) {

        const u = [q[1][0] - q[0][0], q[1][1] - q[0][1], q[1][2] - q[0][2]], v = [q[2][0] - q[0][0], q[2][1] - q[0][1], q[2][2] - q[0][2]];
        const nx = u[1] * v[2] - u[2] * v[1], ny = u[2] * v[0] - u[0] * v[2], nz = u[0] * v[1] - u[1] * v[0], nn = Math.hypot(nx, ny, nz) || 1;
        const sh = Math.abs((nx * L[0] + ny * L[1] + nz * L[2]) / (nn * ln));

    }
    // donatı (derinliğe göre sıralı)
    const B = M.bars.map((br) => { const q = br.pts.map(tf); return { q, br, zc: q.reduce((a, v) => a + v[2], 0) / q.length }; }).sort((a, b2) => a.zc - b2.zc);
    if (opt.bars !== false) B.forEach(({ q, br }) => {
      g.beginPath(); q.forEach((p, i) => (i ? g.lineTo(SX(p), SY(p)) : g.moveTo(SX(p), SY(p))));
      g.strokeStyle = BAR_COL[br.mark] || '#333'; g.lineWidth = Math.max(1.2, (br.phi / 1000) * k); g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke();
    });

    if (opt.bars !== false) {
      const grp = {}; B.forEach((e) => { (grp[e.br.mark] = grp[e.br.mark] || []).push(e); });
      const FR = { 1: 0.5, 2: 0.5, 3: 0.7, 4: 0.3, 5: 0.15, 6: 0.85, 7: 0.25, 8: 0.75, 9: 0.5, 10: 0 }, TT = { 1: 0.55, 2: 0.4, 3: 0.85, 4: 0.85, 5: 0.25, 6: 0.75, 7: 0.15, 8: 0.15, 9: 0.5, 10: 0.85 };
      Object.keys(grp).forEach((mk) => {
        const arr = grp[mk].slice().sort((a2, b2) => (a2.br.pts[0][2] - b2.br.pts[0][2]) || (a2.br.pts[0][1] - b2.br.pts[0][1]) || (a2.br.pts[0][0] - b2.br.pts[0][0]));
        const e = arr[Math.min(arr.length - 1, Math.floor((arr.length - 1) * (FR[mk] || 0.5) + 0.5))], br = e.br;
        let si = 0, sl = -1; for (let i = 0; i + 1 < br.pts.length; i++) { const l = Math.hypot(br.pts[i + 1][0] - br.pts[i][0], br.pts[i + 1][1] - br.pts[i][1], br.pts[i + 1][2] - br.pts[i][2]); if (l > sl) { sl = l; si = i; } }
        const t = TT[mk] == null ? 0.5 : TT[mk], p0 = br.pts[si], p1 = br.pts[si + 1], pm = tf([p0[0] + (p1[0] - p0[0]) * t, p0[1] + (p1[1] - p0[1]) * t, p0[2] + (p1[2] - p0[2]) * t]);
        const x = SX(pm), y = SY(pm); g.beginPath(); g.arc(x, y, 9, 0, 2 * Math.PI); g.fillStyle = '#fff'; g.fill(); g.strokeStyle = BAR_COL[br.mark]; g.lineWidth = 1.5; g.stroke();
        g.fillStyle = BAR_COL[br.mark]; g.font = 'bold 10px Segoe UI, Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(br.mark), x, y + 0.5); });
    }

    const ax = [[[0, 0, 0], [0.6, 0, 0], 'x'], [[0, 0, 0], [0, 0.6, 0], 'y'], [[0, 0, 0], [0, 0, 0.6], 'z']];
    g.font = '11px Segoe UI, Arial'; g.textAlign = 'center';

      g.fillStyle = '#566573'; g.fillText(t, ox + (qb[0] - qa[0]) * kk * 1.25, oy - (qb[1] - qa[1]) * kk * 1.25 + 4); });

  }

  function attach(cv, view, redraw) {

    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);

    cv.addEventListener('dblclick', () => { Object.assign(view, PRESET.iso, { zoom: 1, panX: 0, panY: 0 }); redraw(); });
  }

  const tipAttr = (k) => (TIPS[k] ? ` data-tip="${escH(TIPS[k])}" data-tipk="${k}"` : '');

  function typeCards() {
    return `<div class="types">${['T', 'L', 'RL'].map((t) => `<button class="tcard ${S.type === t ? 'on' : ''}" data-type="${t}">${D.typeIcon(t, S.stemShape, S.type === t)}<span>${TYPE_NAMES[t]}</span></button>`).join('')}</div>`;
  }
  function fieldHtml(fd) {
    if (fd.show && !fd.show(S)) return '';
    if (fd.types) return typeCards();
    if (fd.note) return `<div class="hint">${fd.note}</div>`;
    if (fd.rebar) {
      const rb = OUT && OUT.rb ? OUT.rb : {}, man = S.rebarMode === 'manual';
      return `<div class="f w2"><table><tr><th>Eleman</th><th>Φ (mm)</th><th>Aralık (mm)</th></tr>` + RB_ITEMS.filter((x) => x[0] !== 'key' || (OUT && OUT.gm && OUT.gm.keyOn)).map(([id, n]) => {
        const b = (man && S.rebar && S.rebar[id]) || rb[id] || { phi: 12, s: 200 };
        return `<tr><td>${n}</td><td><select data-rb="${id}.phi" ${man ? '' : 'disabled'}>${W.PHIS.map((p) => `<option ${p === b.phi ? 'selected' : ''}>${p}</option>`).join('')}</select></td><td><select data-rb="${id}.s" ${man ? '' : 'disabled'}>${W.SPS.map((p) => `<option ${p === b.s ? 'selected' : ''}>${p}</option>`).join('')}</select></td></tr>`;
      }).join('') + `</table></div>`;
    }
    const v = get(S, fd.k);
    const ta = tipAttr(fd.k);
    if (fd.t === 'txt') return `<div class="f ${fd.w2 ? 'w2' : ''}"${ta}><label>${fd.label}</label><input type="text" data-k="${fd.k}" value="${escH(v)}"></div>`;
    if (fd.t === 'chk') return `<label class="f chk"${ta}><input type="checkbox" data-k="${fd.k}" ${v ? 'checked' : ''}> ${fd.label}</label>`;
    if (fd.t === 'sel') return `<div class="f ${fd.w2 ? 'w2' : ''}"${ta}><label>${fd.label}</label><select data-k="${fd.k}">${fd.opts.map((o) => `<option value="${o[0]}" ${String(o[0]) === String(v) ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></div>`;
    return `<div class="f"${ta}><label><span>${fd.label}</span><span class="u">${fd.unit || ''}</span></label><input type="number" data-k="${fd.k}" step="${fd.step || 'any'}" value="${v}"></div>`;

  /* bu boyutlarla gereken en kısa arka (ya da ters L’de ön) ampatman */
  function needLen() {
    const w = clone(S), heelMode = S.type !== 'RL', k = heelMode ? 'heel' : 'toe';

  /* ---------------- OPTİMİZASYON ---------------- */

  function busy(on, txt) { const b = $('#busy'); b.style.display = on ? 'flex' : 'none'; if (txt) $('#busyTxt').textContent = txt; $('#busyProg').style.width = '0'; }

    if (OPT.running) return null; OPT.running = true; busy(true, txt || 'Optimum tasarım hesaplanıyor…');
    try {

      if (applyBest && res.best) { SV.apply(S, res.best); detachDesign(); renderSide(); }

  }

  /* dişli / dişsiz alternatifleri */
  function altCard(r, short) {
    if (!r || (!r.bestNoKey && !r.bestKey)) return '';
    const a = r.bestNoKey, b = r.bestKey, ob = r.cfg.objective;

  /* ---------------- HESAP ADIMLARI ---------------- */
  const rowsT = (arr) => `<table>${arr.map((r) => (r.head ? `<tr><th colspan="3">${r.head}</th></tr>` : `<tr class="${r.cls || ''}"><td>${r[0]}</td><td class="f2">${r[1] || ''}</td><td class="r">${r[2] == null ? '' : r[2]}</td></tr>`)).join('')}</table>`;

      ['Yatay / düşey bileşen', 'P·cosδ / P·sinδ', `${f((ep.soil.P + ep.q.P) * Math.cos(ep.d), 2)} / ${f((ep.soil.P + ep.q.P) * Math.sin(ep.d), 2)} kN/m`],
      ['Pasif direnç (ön)', `Kp = tan²(45 + φ/2) = ${f(A.pp.Kp, 3)}; derinlik ${f(A.pp.z1, 2)} → ${f(A.pp.z2, 2)} m`, `${f(A.pp.P, 2)} kN/m × ${f(fo.fp, 2)}`],
    ]));
    if (o.seis && o.A1.ep.E) {
      const E = o.A1.ep.E;
      h += card('2b', 'Deprem itkisi (Mononobe–Okabe)', 'Deprem sırasında artan itkiyi ve atalet kuvvetlerini bulmak.', rowsT([
        ['ψ = atan(kh / (1 − kv))', `kh = ${f(S.seis.kh, 2)}, kv = ${f(S.seis.kv, 2)}`, f(E.psi, 2) + '°'], ['KAE', 'Mononobe–Okabe', `<b>${f(E.KE, 4)}</b>`],
        ['İtki artışı', 'ΔPAE = ½·γ·Hv²·[(1 − kv)·KAE − Ka], 0,6·Hv’de', `${f(E.P, 2)} kN/m`], ['Sürşarj artışı', 'q·Hv·ΔK', `${f(E.Pq, 2)} kN/m`],

    }
    const stabCard = (no, t, c, lim) => card(no, t, 'Duvarın devrilmeye, kaymaya ve taban basıncına karşı güvenliğini göstermek.', rowsT([
      { head: 'Devrilme (ön uç etrafında)' }, ['Karşı koyan moment', 'ΣV·x (stabilitede sayılan)', f(c.MRst, 2) + ' kNm/m'], ['Devirici moment', 'ΣH·y + U·xU', f(c.MO + c.MU, 2) + ' kNm/m'],
      { cls: c.FSo >= lim.o ? 'tot' : 'bad', 0: 'FS devrilme', 1: '≥ ' + f(lim.o, 2), 2: f(c.FSo, 3), length: 3 },
      { head: 'Kayma' }, ['Düşey kuvvet N', 'ΣV − U', f(c.N, 2) + ' kN/m'], ['Sürtünme', `N·tan δb, δb = ${f(c.dB, 1)}°`, f(c.Rf, 2)], ['Adezyon', 'ca·B', f(c.Rc, 2)], ['Pasif (azaltılmış)', 'fp·Pp', f(c.Rp, 2)],
      ['Toplam direnç R / itici ΣH', '', `${f(c.R, 2)} / ${f(c.H, 2)} kN/m`], { cls: c.FSs >= lim.s ? 'tot' : 'bad', 0: 'FS kayma', 1: '≥ ' + f(lim.s, 2), 2: f(c.FSs, 3), length: 3 },
      { head: 'Taban basıncı' }, ['Bileşke yeri', 'x = (ΣV·x − ΣH·y − U·xU) / N', f(c.xr, 3) + ' m'], ['Eksantrisite', 'e = B/2 − x', f(c.e, 3) + ' m (sınır B/' + f(lim.e) + ' = ' + f(gm.B / lim.e, 2) + ')'],
      ['qmax / qmin', c.bp.full ? 'N/B·(1 ± 6e/B)' : 'çekme var: 2N / (3x)', `${f(c.bp.qmax, 1)} / ${f(c.bp.qmin, 1)} kPa`], { cls: c.bp.qmax <= lim.q ? 'tot' : 'bad', 0: 'qmax ≤ qa', 1: f(lim.q, 0) + ' kPa', 2: f(c.bp.qmax, 1), length: 3 },
    ]));
    h += stabCard(3, 'Stabilite – statik', st, { o: L.FSo, s: L.FSs, e: L.eDiv, q: fo.qa });
    if (o.seis) h += stabCard('3b', 'Stabilite – deprem', o.seis, { o: L.FSoE, s: L.FSsE, e: L.eDivE, q: fo.qa * L.qaE });
    const sr = o.sr, s0 = sr.st;
    h += card(4, 'Gövde (taban kesiti)', 'Gövdeyi dolgu itkisine karşı boyutlandırmak ve donatısını seçmek.', rowsT([
      ['Kalıcı (zemin + su) / değişken (sürşarj) momenti', '', `${f(s0.MG, 2)} / ${f(s0.MQ, 2)} kNm/m`], ['Statik ULS', `γG·MG + γQ·MQ`, f(s0.Ms, 2)], ['Deprem', 'MG + ψ2·MQ + ME', f(s0.Me, 2)],
      ['Tasarım momenti MEd', s0.seisGov ? 'deprem belirleyici' : 'statik belirleyici', `<b>${f(s0.MEd, 2)} kNm/m</b>`],
    ]) + rcBlock(o.rc.stem) + `<p class="note">Gövde boyunca moment: H/3’te ${f(sr.lev[0].MEd, 1)}, 2H/3’te ${f(sr.lev[1].MEd, 1)} kNm/m (ana donatının yarısı üst bölgede kesilebilir).</p>`);
    if (o.rc.toe) h += card(5, 'Ön ampatman', 'ULS taban basıncı altında ön ampatmanın eğilme ve kesmesini kontrol etmek (alt lif çekme).', rcBlock(o.rc.toe));
    if (o.rc.heel) h += card(6, 'Arka ampatman', 'Üstündeki dolgu ve sürşarj ile aşağı yüklenen arka ampatmanı kontrol etmek (üst lif çekme).', rcBlock(o.rc.heel));
    if (o.rc.key) h += card(7, 'Kayma dişi', 'Dişin önündeki pasif direnci taşıyabildiğini göstermek.', rowsT([['Dişe gelen pasif kuvvet', 'γG·fp·Pp,diş', f(sr.Vkey, 2) + ' kN/m'], ['Kol (diş kökünden)', '', f(A.pp.keyArm, 3) + ' m']]) + rcBlock(o.rc.key));
    return h;
  }
  function rcBlock(r) {
    if (!r) return '';
    return rowsT([
      ['MEd / VEd', '', `${f(r.M, 2)} kNm/m / ${f(r.VEd, 2)} kN/m`], ['Faydalı yükseklik', 'd = h − pas payı − Φ/2', f(r.d, 0) + ' mm'],
      ['μ = MEd / (b·d²·fcd)', '≤ 0,372', f(r.mu, 4)], ['Gerekli As', `max(hesap ${f(r.AsCalc, 0)} ; en az ${f(r.AsMin, 0)})`, f(r.AsReq, 0) + ' mm²/m'],
      { cls: r.uF <= 1 ? 'tot' : 'bad', 0: 'Seçilen donatı', 1: `Φ${r.bar.phi} / ${r.bar.s} mm`, 2: f(r.Ap, 0) + ' mm²/m', length: 3 },
      { cls: r.uV <= 1 ? 'tot' : 'bad', 0: 'Etriyesiz kesme VRd,c', 1: `k = ${f(r.vr.k, 2)}, ρ = ${f(r.vr.rho * 100, 2)} %`, 2: `${f(r.VEd, 1)} ≤ ${f(r.VRd, 1)} kN/m`, length: 3 },
    ]);
  }

  /* ---------------- KAYITLI TASARIMLAR ---------------- */
  let DESLIB = [], CURID = null, DESSIG = '';
  try { DESLIB = JSON.parse(localStorage.getItem(DES_KEY) || '[]').filter((x) => x && x.id && x.name && x.s && x.s.geo); } catch (e) { /* yok */ }
  try { CURID = localStorage.getItem(CUR_KEY) || null; } catch (e) { /* yok */ }
  if (CURID && !DESLIB.some((x) => x.id === CURID)) CURID = null;
  const saveLib = () => { try { localStorage.setItem(DES_KEY, JSON.stringify(DESLIB)); } catch (e) { toast('Kayıt yapılamadı: tarayıcı depolaması dolu ya da kapalı. Dosyaya kaydedin.', false); } };
  const setCur = (id) => { CURID = id; try { if (id) localStorage.setItem(CUR_KEY, id); else localStorage.removeItem(CUR_KEY); } catch (e) { /* sessiz */ } };
  const stable = (o) => JSON.stringify(o, (k, v) => (v && typeof v === 'object' && !Array.isArray(v) ? Object.keys(v).sort().reduce((a, x) => { a[x] = v[x]; return a; }, {}) : v));
  const skey = (s) => { const c = clone(s); delete c.rebar; return stable(c); };
  const curRec = () => DESLIB.find((x) => x.id === CURID) || null;
  const dirty = () => { const r = curRec(); return !!r && skey(S) !== skey(r.s); };
  const newId = () => 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const sorted = () => DESLIB.slice().sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
  const uniqueName = (n, ex) => { let x = n, i = 2; while (DESLIB.some((r) => r.id !== ex && r.name.toLowerCase() === x.toLowerCase())) x = `${n} (${i++})`; return x; };
  const defName = () => `${S.meta.name || 'İstinat'} · ${{ T: 'T', L: 'L', RL: 'ters L' }[S.type]} H${f(S.geo.H, 2)}`;
  function detachDesign() { if (CURID) setCur(null); }
  function renderDesignUi() {
    const list = sorted(), sig = list.map((r) => r.id + r.name).join(';') + CURID, sel = $('#selDesign');
    if (sig !== DESSIG) { DESSIG = sig; sel.innerHTML = `<option value="">📂 Kayıtlı tasarım aç (${list.length})</option>` + list.map((r) => `<option value="${escH(r.id)}">${r.id === CURID ? '✔ ' : ''}${escH(r.name)}</option>`).join('') + '<option value="__file">💻 Bilgisayardaki dosyadan aç…</option>'; }
    sel.value = '';
    const ch = $('#desChip'), r = curRec();
    if (r) { ch.style.display = ''; ch.innerHTML = `💾 ${escH(r.name)}` + (dirty() ? ' <b title="Kayıttan sonra değişiklik yapıldı">●</b>' : ''); } else ch.style.display = 'none';
  }
  const DLG = { mode: null, id: null, name: '', note: '', err: '' };
  function dlgOpen(mode, id) { const r = mode === 'edit' ? DESLIB.find((x) => x.id === id) : curRec(); if (mode === 'edit' && !r) return; Object.assign(DLG, { mode, id: id || null, name: r ? r.name : defName(), note: r ? r.note || '' : '', err: '' }); dlgRender(); }
  function dlgRender() {
    let box = $('#dlg'); if (!box) { box = document.createElement('div'); box.id = 'dlg'; document.body.appendChild(box); }
    if (!DLG.mode) { box.style.display = 'none'; box.innerHTML = ''; return; }
    const r = curRec(), ed = DLG.mode === 'edit';
    box.style.display = 'flex';
    box.innerHTML = `<div class="dlgbox"><h3>${ed ? 'Adı ve notu düzenle' : 'Tasarımı kaydet'}</h3><div class="f"><label>Tasarım adı</label><input type="text" id="dlgName" data-dl="name" value="${escH(DLG.name)}"></div>` +
      `<div class="f" style="margin-top:6px"><label>Not (isteğe bağlı)</label><input type="text" data-dl="note" value="${escH(DLG.note)}"></div>` +
      (ed ? '' : `<p class="note" style="margin:8px 0 0"><span>${TYPE_NAMES[S.type]}</span> · H = ${f(S.geo.H, 2)} m · B = ${OUT.ok ? f(OUT.gm.B, 2) : '–'} m · beton ${OUT.ok ? f(OUT.qty.per.conc, 2) : '–'} m³/m</p>` + (r ? `<p class="note" style="margin:6px 0 0">Açık kayıt: <b>${escH(r.name)}</b><br>“Güncelle” bu kaydın üzerine yazar; “Yeni kayıt olarak kaydet” ayrı bir kopya oluşturur.</p>` : '')) +
      (DLG.err ? `<div class="res bad">${DLG.err}</div>` : '') +
      `<div class="btnrow">${ed ? '<button class="btn p" data-act="dlgOk">Kaydet</button>' : (r ? '<button class="btn p" data-act="dlgUpd">Güncelle</button><button class="btn" data-act="dlgNew">Yeni kayıt olarak kaydet</button>' : '<button class="btn p" data-act="dlgNew">Kaydet</button>') + '<button class="btn" data-act="dlgFile">💻 Bilgisayara da kaydet</button>'}<button class="btn" data-act="dlgCancel">Vazgeç</button></div>` +
      (ed ? '' : '<p class="note" style="margin:8px 0 0">Kayıt bu tarayıcıda saklanır. Dosya olarak bilgisayarınıza yazmak için “Bilgisayara da kaydet”i kullanın.</p>') + `</div>`;
    setTimeout(() => { const i = $('#dlgName'); if (i) { i.focus(); i.select(); } }, 0);
  }
  const dlgClose = () => { DLG.mode = null; dlgRender(); };
  function dlgCommit(asNew) {
    const name = String(DLG.name || '').trim(), note = String(DLG.note || '').trim();
    if (!name) { DLG.err = 'Tasarım adı gerekli.'; dlgRender(); return; }
    const now = new Date().toISOString(); let msg, shown;
    if (DLG.mode === 'edit') { const r = DESLIB.find((x) => x.id === DLG.id); r.name = uniqueName(name, r.id); r.note = note; r.updatedAt = now; msg = 'Kaydedildi:'; shown = r; }
    else if (!asNew && curRec()) { const r = curRec(); r.name = uniqueName(name, r.id); r.note = note; r.s = clone(S); r.updatedAt = now; msg = 'Tasarım güncellendi:'; shown = r; }
    else { const r = { id: newId(), name: uniqueName(name), note, savedAt: now, updatedAt: now, s: clone(S) }; DESLIB.push(r); setCur(r.id); msg = 'Tasarım kaydedildi:'; shown = r; }

  }

  const FILETYPES = [{ description: 'İstinat duvarı tasarımı (.json)', accept: { 'application/json': ['.json'] } }];
  async function saveFile() {

    if (window.showSaveFilePicker) { try { const h = await window.showSaveFilePicker({ suggestedName: base + '.json', types: FILETYPES }); const w = await h.createWritable(); await w.write(body); await w.close(); toast('Dosyaya kaydedildi:', h.name); } catch (e) { if (e && e.name !== 'AbortError') toast('Dosya kaydedilemedi.', false); } }

  function exportJson(list, base) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: 'istinat-hesap', version: 1, designs: list }, null, 1)], { type: 'application/json' })); a.download = `${base || 'istinat_tasarimlari'}.json`; a.click(); }
