<!doctype html>
<html lang="tr">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İstinat Duvarı Hesap Aracı</title>
<style>
:root{--navy:#1F4E78;--blue:#4C78A8;--orange:#F58518;--green:#2E8B57;--red:#D64541;--bg:#F4F6F9;--card:#fff;--line:#D9DEE5;--ink:#1C2733;--mut:#5B6B7B}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
header{background:var(--navy);color:#fff;padding:10px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:17px;margin:0;font-weight:600}
header .sp{flex:1}
header select,header button{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid #fff3;background:#ffffff1f;color:#fff}
header select option{color:#000}
header button{cursor:pointer}header button:hover{background:#ffffff40}
header button.go{background:var(--orange);border-color:var(--orange);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;background:#ffffff26}
.chip.ok{background:#2E8B5777}.chip.bad{background:#D6454199}
#desChip{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}#desChip b{color:#FFC36B}
#selDesign{max-width:270px}
main{padding:14px 18px;min-width:0;max-width:1700px;margin:0 auto}
details{border:1px solid var(--line);border-radius:8px;background:#fff}
details>summary{padding:8px 10px;cursor:pointer;font-weight:600;color:var(--navy);list-style:none}
details>summary::before{content:"▸ ";color:var(--mut)}details[open]>summary::before{content:"▾ "}
.fields{padding:4px 10px 10px;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.f{display:flex;flex-direction:column;font-size:12px;color:var(--mut)}
.f.w2{grid-column:1/3}
.f input,.f select{font:inherit;color:var(--ink);padding:5px 6px;border:1px solid var(--line);border-radius:5px;width:100%}
.f label{display:flex;justify-content:space-between;gap:4px}
.f .u{color:#8896A5}
.f.chk{flex-direction:row;align-items:center;gap:6px;grid-column:1/3;color:var(--ink)}
.f.chk input{width:auto}
.hint{grid-column:1/3;font-size:11.5px;color:var(--mut);background:#F2F6FB;border-radius:6px;padding:6px 8px;line-height:1.4}
.btnrow{grid-column:1/3;display:flex;gap:6px;flex-wrap:wrap}
.btn{font:inherit;font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer}
.btn:hover{background:#EAF1F8}.btn.p{background:var(--blue);color:#fff}.btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
nav.tabs button{font:inherit;padding:8px 14px;border:0;background:none;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:600}
nav.tabs button.on{color:var(--navy);border-bottom-color:var(--orange)}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 6px;color:var(--navy);font-size:15.5px;display:flex;align-items:center;gap:8px}
.card h3 .no{background:var(--navy);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.aim{margin:4px 0 8px;color:#33475B;line-height:1.5;background:#F7FAFD;border-left:3px solid var(--blue);padding:6px 10px;border-radius:0 6px 6px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:4px 7px;border-bottom:1px solid #E7EBF0;text-align:start;vertical-align:top}
th{background:#F0F4F8;color:var(--navy);font-weight:600;font-size:12px}
td.r,th.r{text-align:end;font-variant-numeric:tabular-nums}
td.f2{color:#556;font-size:12px}
tr.tot td{font-weight:700;background:#F7FAFD}
tr.bad td{background:#FCE9E8}
.res{margin-top:8px;padding:7px 10px;border-radius:7px;font-weight:600}
.res.ok{background:#E6F4EC;color:#1B6B3F}.res.bad{background:#FCE9E8;color:#A12622}.res.warn{background:#FFF4DE;color:#8A5A00}
.bar{height:9px;background:#E9EEF3;border-radius:5px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--green)}.bar i.hi{background:var(--orange)}.bar i.over{background:var(--red)}
.gov{outline:2px solid var(--orange)}
.note{font-size:12.5px;color:var(--mut);line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px;align-items:start}
.dsn{display:grid;grid-template-columns:minmax(290px,340px) 1fr;gap:14px;align-items:start}
.dctl{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;margin:0}
.sl{padding:5px 0 7px;border-bottom:1px dashed #E7EBF0}
.sl1{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.sl1 label{font-size:12.5px;color:#33475B}
.sl .sn{display:flex;align-items:center;gap:4px}.sl .sn em{font-style:normal;color:var(--mut);font-size:11.5px;min-width:16px}
.sl input[type=number]{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:5px;width:78px;text-align:right}
.sl input[type=range]{width:100%;accent-color:var(--blue);margin:0}
.chk2{display:flex;gap:6px;align-items:center;font-size:12.5px;margin-top:8px;color:#33475B}
@media(max-width:1000px){.dsn{grid-template-columns:1fr}.dctl{position:static;max-height:none}}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.kpi{flex:1;min-width:130px;background:#F4F7FB;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.kpi b{display:block;font-size:19px;color:var(--navy)}.kpi span{font-size:11.5px;color:var(--mut)}
.kpi.ok{background:#E6F4EC}.kpi.bad{background:#FCE9E8}
.types{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/3}
.tcard{border:2px solid var(--line);border-radius:9px;background:#fff;padding:4px 8px 6px;cursor:pointer;text-align:center;font:inherit;font-size:12px;color:var(--ink);min-width:96px}
.tcard.on{border-color:var(--orange);background:#FFF8EE}.tcard span{display:block}
.prog{height:8px;background:#E9EEF3;border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--blue);width:0}
.sbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
svg text{user-select:none}
#dlg{position:fixed;inset:0;background:#0007;z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.dlgbox{background:#fff;border-radius:12px;padding:16px 18px;width:min(460px,100%);box-shadow:0 10px 40px #0005}
.dlgbox h3{margin:0 0 10px;color:var(--navy);font-size:16px}.dlgbox .btnrow{margin-top:12px}
#toast{position:fixed;right:18px;bottom:18px;background:#1B6B3F;color:#fff;padding:9px 14px;border-radius:8px;box-shadow:0 4px 18px #0004;z-index:70;opacity:0;pointer-events:none;transform:translateY(8px);transition:.2s}
#toast.show{opacity:1;transform:none}
#busy{position:fixed;inset:0;background:#F4F6F9E6;z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:15px;color:var(--navy)}
#busy .prog{width:min(360px,80vw)}
@page sheet{size:A3 landscape;margin:0}
#t-pafta .sheet{display:none}#t-pafta .sheet.on{display:block}
#t-pafta .sheet svg{width:100%;height:auto;display:block;background:#fff;box-shadow:0 1px 8px #0003}
@media print{header,nav.tabs,.btn,.sbar,#dlg,#toast{display:none!important}.tab{display:block!important;page-break-before:always}.tab:first-of-type{page-break-before:auto}main{padding:0}.card{break-inside:avoid}.dctl{display:none}
body.print-sheet .tab{display:none!important}body.print-sheet #t-pafta{display:block!important}body.print-sheet #t-pafta .ctrl{display:none}
body.print-sheet #t-pafta .sheet{display:block!important;page:sheet;break-after:page}body.print-sheet #t-pafta .sheet svg{width:420mm;height:297mm;box-shadow:none}}
</style>

<body>
<header>
  <h1>İstinat Duvarı Hesap Aracı</h1>
  <select id="selType" title="Duvar tipi">
    <option value="T">T – ön ve arka ampatmanlı</option>
    <option value="L">L – yalnız arka ampatman (ön yüz sınırda)</option>
    <option value="RL">Ters L – yalnız ön ampatman (arka yüz sınırda)</option>
  </select>
  <div class="chips" id="chips"></div>
  <span class="chip" id="desChip" style="display:none"></span>
  <div class="sp"></div>
  <button id="btnSave" title="Güncel tasarımı bir adla kaydeder (Ctrl+S)">💾 Kaydet</button>
  <select id="selDesign" title="Kayıtlı bir tasarımı aç"></select>
  <button id="btnOpt" class="go" title="Yüklere göre en ekonomik boyutları bulur">⚙ Optimum tasarla</button>
  <button id="btnPrint">Yazdır / PDF</button>
</header>
<main>
  <nav class="tabs" id="tabs"></nav>
  <div id="t-girdi" class="tab"></div>
  <div id="t-tasarim" class="tab"></div>
  <div id="t-opt" class="tab"></div>
  <div id="t-adim" class="tab"></div>
  <div id="t-liste" class="tab"></div>
  <div id="t-pafta" class="tab"></div>
  <div id="t-kayit" class="tab"></div>
</main>
<div id="busy"><div id="busyTxt">Optimum tasarım hesaplanıyor…</div><div class="prog"><i id="busyProg"></i></div></div>
<input type="file" id="desOpenFile" accept=".json,application/json" style="display:none">
<script>
/* İstinat duvarı hesap motoru – betonarme konsol duvar (T, L, ters L), isteğe bağlı kayma dişi.
   Birimler: m, kN, kPa (kN/m²), kN/m³, derece; donatı Φ mm, aralık mm, alan mm²/m. Hesap duvarın 1 m boyu için yapılır.
   Stabilite: güvenlik sayıları (servis yükleri; deprem durumunda ayrı sınırlar).
   Toprak itkisi: sanal arka yüzde (topuk ucundan geçen düşey düzlem) Coulomb; topuk üstünde dolgu varsa δ = β (Rankine ile aynı).
   Deprem: Mononobe–Okabe (ΔPAE 0,6·H’de), duvar ve topuk üstü dolgu ataleti kh·W, düşey kv.
   Betonarme: EC2 (fcd = 0,85·fck/γc), etriyesiz kesme VRd,c; taşıma gücü katsayıları γG / γQ. */
(function (root) {
  'use strict';
  const PI = Math.PI, rad = (d) => (d * PI) / 180, deg = (r) => (r * 180) / PI;
  const GW = 9.81;                                   // su birim ağırlığı kN/m³
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const NF = {}, LOCF = () => (root.I18N ? root.I18N.loc() : 'tr-TR');
  const fm = (x, d = 0) => { if (!isFinite(x)) return '–'; const k = LOCF() + d; return (NF[k] || (NF[k] = new Intl.NumberFormat(LOCF(), { minimumFractionDigits: d, maximumFractionDigits: d }))).format(x); };

  /* ---------------- varsayılan girdiler ---------------- */
  const DEFAULTS = {
    type: 'T',                    // T: ön + arka ampatman · L: yalnız arka (ön yüz sınırda) · RL: yalnız ön (arka yüz sınırda)
    stemShape: 'front',           // front: ön yüz eğimli · back: arka yüz eğimli · none: sabit kalınlık
    geo: { H: 5.0, Df: 1.0, tb: 0.50, toe: 1.00, heel: 2.50, ttop: 0.25, tbot: 0.45 },
    key: { on: false, h: 0.50, b: 0.40, pos: 'stem' },
    back: { g: 18, gsat: 20, phi: 30, beta: 0, q: 10, hw: 0, dw: 20 },
    found: { g: 18, phi: 30, c: 0, qa: 200, kb: 0.67, kc: 0.5, front: false, fp: 0.5 },
    seis: { on: false, kh: 0.15, kv: 0 },
    top: { P: 0, Ht: 0 },
    mat: { fck: 30, fyk: 500, gc: 1.5, gs: 1.15, wc: 25, cover: 50, coverSoil: 75 },
    lim: { FSs: 1.5, FSo: 2.0, eDiv: 6, FSsE: 1.1, FSoE: 1.5, eDivE: 4, qaE: 1.33 },
    uls: { gG: 1.35, gQ: 1.5, psi2: 0.3 },
    opts: { soilOnToe: false, surchStab: false, lean: 0.10, ws: 0.50 },
    L: 20,
    price: { conc: 120, steel: 1.2, form: 25, exc: 8, fill: 10, lean: 80 },
    rebarMode: 'auto',
    rebar: null,
    meta: { project: '', name: 'İstinat duvarı İD-1', drawn: '', checked: '', rev: 'A' },
  };

  /* ---------------- yardımcılar ---------------- */
  function polyAC(p) {
    let A = 0, cx = 0, cy = 0;
    for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length], c = a[0] * b[1] - b[0] * a[1]; A += c; cx += (a[0] + b[0]) * c; cy += (a[1] + b[1]) * c; }
    if (Math.abs(A) < 1e-12) return { A: 0, x: 0, y: 0 };
    return { A: Math.abs(A) / 2, x: cx / (3 * A), y: cy / (3 * A) };
  }
  function clipY(p, yc, below) {     // yatay çizgiyle kırp (below: y ≤ yc kısmı)
    const ins = (q) => (below ? q[1] <= yc + 1e-12 : q[1] >= yc - 1e-12), out = [];
    for (let i = 0; i < p.length; i++) {
      const a = p[i], b = p[(i + 1) % p.length], ia = ins(a), ib = ins(b);
      if (ia) out.push(a);
      if (ia !== ib) { const t = (yc - a[1]) / (b[1] - a[1]); out.push([a[0] + t * (b[0] - a[0]), yc]); }
    }
    return out;
  }
  /* Coulomb aktif katsayısı, düşey yüz (θ = 0); δ = β iken Rankine ile aynıdır */
  function kaC(phi, delta, beta) {
    const f = rad(phi), d = rad(delta), b = rad(beta);
    if (f - b < 0) return NaN;
    const r = (Math.sin(f + d) * Math.sin(f - b)) / (Math.cos(d) * Math.cos(b));
    return Math.cos(f) ** 2 / (Math.cos(d) * (1 + Math.sqrt(r)) ** 2);
  }
  /* Mononobe–Okabe, düşey yüz */
  function kaeMO(phi, delta, beta, kh, kv) {
    const f = rad(phi), d = rad(delta), b = rad(beta), psi = Math.atan(kh / (1 - kv));
    if (f - b - psi < 0) return NaN;
    const r = (Math.sin(f + d) * Math.sin(f - b - psi)) / (Math.cos(d + psi) * Math.cos(b));
    return Math.cos(f - psi) ** 2 / (Math.cos(psi) * Math.cos(d + psi) * (1 + Math.sqrt(r)) ** 2);
  }
  const kpR = (phi) => Math.tan(rad(45 + phi / 2)) ** 2;
  /* üçgen + su altı itki: düzlem boyu Hv, su seviyesi düzlem tabanından hw yukarıda; y düzlem tabanından */
  function soilForce(K, g, gsub, Hv, hw) {
    const h2 = clamp(hw, 0, Hv), zw = Hv - h2;
    const P1 = 0.5 * K * g * zw * zw, P2 = K * g * zw * h2, P3 = 0.5 * K * gsub * h2 * h2;
    const P = P1 + P2 + P3;
    return { P, y: P > 0 ? (P1 * (h2 + zw / 3) + P2 * (h2 / 2) + P3 * (h2 / 3)) / P : 0, sTop: 0, sWT: K * g * zw, sBot: K * g * zw + K * gsub * h2 };
  }

  /* ---------------- geometri ---------------- */
  function geom(s) {
    const g = s.geo, t = s.type;
    const toe = t === 'L' ? 0 : Math.max(0, +g.toe || 0), heel = t === 'RL' ? 0 : Math.max(0, +g.heel || 0);
    const ttop = +g.ttop, tbot = s.stemShape === 'none' ? ttop : Math.max(+g.tbot, ttop);
    const H = +g.H, tb = +g.tb, Hs = H - tb, B = toe + tbot + heel, dx = tbot - ttop;
    const err = !(H > 0) ? 'Duvar yüksekliği H sıfırdan büyük olmalı.' : !(tb > 0) ? 'Taban kalınlığı sıfırdan büyük olmalı.' : !(Hs > 0.2) ? 'Taban kalınlığı duvar yüksekliğinden küçük olmalı.' : !(ttop > 0.1) ? 'Gövde üst kalınlığı en az 0,10 m olmalı.' : !(B > 0) ? 'Taban genişliği sıfırdan büyük olmalı.' : '';
    const xf0 = toe, xb0 = toe + tbot;
    const xfT = s.stemShape === 'front' ? toe + dx : toe;
    const xbT = s.stemShape === 'back' ? xb0 - dx : xb0;
    const tanB = Math.tan(rad(+s.back.beta || 0));
    const ySurf = (x) => H + Math.max(0, x - xbT) * tanB;
    const Hv = ySurf(B);
    const stem = [[xf0, tb], [xb0, tb], [xbT, H], [xfT, H]];
    const base = [[0, 0], [B, 0], [B, tb], [0, tb]];
    const k = s.key, keyOn = !!k.on && k.h > 0 && k.b > 0;
    const kb = Math.min(+k.b, B), xk = !keyOn ? 0 : k.pos === 'heel' ? B - kb : k.pos === 'toe' ? 0 : clamp(toe + tbot / 2 - kb / 2, 0, B - kb);
    const key = keyOn ? [[xk, -k.h], [xk + kb, -k.h], [xk + kb, 0], [xk, 0]] : null;
    const soilHeel = [[xb0, tb], [B, tb], [B, Hv], [xbT, H]];
    const Df = Math.max(0, +g.Df || 0);
    const soilToe = Df > tb && toe > 0 ? [[0, tb], [toe, tb], [toe, Df], [0, Df]] : null;
    const thick = (y) => tbot + ((ttop - tbot) * (y - tb)) / Hs;
    return { ok: !err, err, toe, heel, ttop, tbot, H, tb, Hs, B, dx, xf0, xb0, xfT, xbT, tanB, ySurf, Hv, stem, base, key, keyOn, keyH: keyOn ? +k.h : 0, keyB: kb, xk, soilHeel, soilToe, Df, thick };
  }

  /* ---------------- toprak itkisi ---------------- */
  function pressure(s, gm) {
    const b = s.back, virt = gm.B - gm.xbT > 0.005;
    const dDeg = virt ? +b.beta : Math.min(+b.dw, +b.phi), d = rad(dDeg);
    const K = kaC(b.phi, dDeg, b.beta);
    const hw = clamp(+b.hw || 0, 0, gm.Hv), gsub = b.gsat - GW;
    const soil = soilForce(K, b.g, gsub, gm.Hv, hw);
    const q = { P: K * b.q * gm.Hv, y: gm.Hv / 2 };
    const w = { P: 0.5 * GW * hw * hw, y: hw / 3 };
    let E = null;
    if (s.seis.on) {
      const KE = kaeMO(b.phi, dDeg, b.beta, s.seis.kh, s.seis.kv), dK = (1 - s.seis.kv) * KE - K;
      E = { KE, dK, psi: deg(Math.atan(s.seis.kh / (1 - s.seis.kv))), P: 0.5 * b.g * gm.Hv * gm.Hv * dK, y: 0.6 * gm.Hv, Pq: b.q * gm.Hv * dK, yq: gm.Hv / 2 };
    }
    return { virt, dDeg, d, K, hw, gsub, soil, q, w, E };
  }
  function passive(s, gm) {
    const f = s.found, Kp = kpR(f.phi), Df = gm.Df, hk = gm.keyH;
    const z1 = f.front ? 0 : Df, z2 = Df + hk;
    const seg = (a, b) => {
      if (!(b > a + 1e-9)) return { P: 0, z: 0 };
      const P1 = 0.5 * Kp * f.g * (b * b - a * a), P2 = 2 * f.c * Math.sqrt(Kp) * (b - a), P = P1 + P2;
      const m = (Kp * f.g * (b ** 3 - a ** 3)) / 3 + f.c * Math.sqrt(Kp) * (b * b - a * a);
      return { P, z: m / P };
    };
    const all = seg(z1, z2), key = seg(Df, Df + hk);
    return { Kp, z1, z2, P: all.P, y: Df - all.z, keyP: key.P, keyArm: key.P ? key.z - Df : 0 };
  }

  /* ---------------- etkiler (1 m duvar) ----------------
     V: düşey (aşağı +), x tabanın ön ucundan · H: yatay (dolgudan dışa +), y taban altından.
     cat: G kalıcı · Q değişken (sürşarj, üst yükler) · E deprem.  stab: devrilme/kaymada sayılır · bear: taban basıncında sayılır */
  function actions(s, gm, seis) {
    const b = s.back, f = s.found, wc = s.mat.wc, V = [], H = [], W = {};
    const kv = seis ? +s.seis.kv : 0, kh = seis ? +s.seis.kh : 0;
    const addW = (id, n, poly, gam) => {
      const c = polyAC(poly); if (!c.A) return null;
      const w = c.A * gam; V.push({ n, v: w, x: c.x, cat: 'G', stab: true, bear: true });
      if (seis && kv) V.push({ n: n + ' – düşey deprem (−kv·W)', v: -kv * w, x: c.x, cat: 'E', stab: true, bear: true });
      if (seis && kh) H.push({ n: n + ' – atalet (kh·W)', h: kh * w, y: c.y, cat: 'E' });

  /* ---------------- taban basıncı dağılımı ---------------- */
  function bearing(N, xr, B) {

  /* bir yük birleşimi: fac(cat) çarpanı; stabilite büyüklükleri + taban basıncı */
  function combo(s, gm, A, fac) {

    A.V.forEach((it) => { const v = it.v * fac(it.cat); if (it.stab) { Vst += v; MRst += v * it.x; } if (it.bear) { Vb += v; MRb += v * it.x; } });

    const FSs = Hh > 0 ? R / Hh : Infinity;

    const bp = bearing(Nb, xr, gm.B);

  const FAC_STAT = () => (c) => (c === 'E' ? 0 : 1);
  const facSeis = (s) => (c) => (c === 'Q' ? s.uls.psi2 : 1);
  const facUls = (s) => (c) => (c === 'G' ? s.uls.gG : c === 'Q' ? s.uls.gQ : 0);

  /* ---------------- betonarme ---------------- */
  function mats(m) {
    const fcd = (0.85 * m.fck) / m.gc, fyd = m.fyk / m.gs, fctm = 0.3 * Math.pow(m.fck, 2 / 3);
    return { fcd, fyd, fctm, rhoMin: Math.max((0.26 * fctm) / m.fyk, 0.0013) };
  }
  /* eğilme (1 m genişlik): MEd kNm/m, h m, örtü mm, Φ mm → gereken As mm²/m */
  function flex(MEd, h, cov, phi, mt) {
    const d = h * 1000 - cov - phi / 2;
    if (!(d > 30)) return { d, mu: 99, AsReq: Infinity, AsMin: 0, over: true };
    const mu = (Math.abs(MEd) * 1e6) / (1000 * d * d * mt.fcd), over = mu > 0.372;
    const om = over ? NaN : 1 - Math.sqrt(1 - 2 * mu);
    const AsCalc = over ? Infinity : (om * 1000 * d * mt.fcd) / mt.fyd, AsMin = mt.rhoMin * 1000 * d;

  /* etriyesiz kesme dayanımı VRd,c (kN/m) */

  /* gövde kesit kuvvetleri, kesit kotu yc (taban altından) */

    const MQ = (Kh * b.q * h * h) / 2 + (+s.top.Ht || 0) * h, VQ = Kh * b.q * h + (+s.top.Ht || 0);

  }
  /* taban: ULS taban basıncı altında ön/arka ampatman kesit kuvvetleri */
  function baseCut(s, gm, A, fac, Gf, Qf) {

    const u = (x) => (hw > 0 ? (GW * hw * x) / gm.B * Gf : 0);
    const wBase = Gf * s.mat.wc * tb, wToeSoil = s.opts.soilOnToe && gm.soilToe ? Gf * s.found.g * (gm.Df - tb) : 0;
    const soilCol = (x) => { const top = gm.ySurf(x), h = Math.max(0, top - tb); if (!(hw > tb)) return b.g * h; const hs = clamp(hw - tb, 0, h); return b.gsat * hs + b.g * (h - hs); };

  /* ---------------- tüm betonarme + donatı ---------------- */
  function structure(s, gm, A0, A1) {
    const m = s.mat, mt = mats(m), ep = A0.ep;
    const st = stemCut(s, gm, ep, gm.tb);
    const lev = [gm.tb + gm.Hs / 3, gm.tb + (2 * gm.Hs) / 3].map((y) => stemCut(s, gm, ep, y));
    const bU = baseCut(s, gm, A0, facUls(s), s.uls.gG, s.uls.gQ);
    const bE = s.seis.on && A1 ? baseCut(s, gm, A1, facSeis(s), 1, s.uls.psi2) : null;
    const pick = (a, b) => (b && Math.abs(b) > Math.abs(a) ? b : a);
    const Mtoe = pick(bU.Mtoe, bE && bE.Mtoe), Mheel = pick(bU.Mheel, bE && bE.Mheel);
    const pp = A0.pp, Vkey = gm.keyOn ? s.uls.gG * s.found.fp * pp.keyP : 0, Mkey = Vkey * pp.keyArm;

  function autoRebar(s, gm, sr) {

  /* donatıyla kontroller (kullanım oranları) */

  }

  /* ---------------- metraj ve donatı listesi ---------------- */
  const unitW = (phi) => (phi * phi) / 162.2;
  function quantities(s, gm, rb) {
    const L = Math.max(0.5, +s.L || 1), c = s.mat.cover / 1000, cs = s.mat.coverSoil / 1000, bars = [];
    const lap = (phi, len) => { const n = Math.max(0, Math.ceil(len / 12) - 1); return len + n * 50 * phi / 1000; };
    const cnt = (len, sp) => Math.floor((len * 1000) / sp) + 1;
    const add = (mark, desc, b, n, len) => { if (!b) return; const tot = n * len; bars.push({ mark, desc, phi: b.phi, s: b.s, n, len, tot, kg: tot * unitW(b.phi) }); };
    const foot = (phi) => Math.max(0.30, (15 * phi) / 1000);
    const vLen = (phi) => gm.H - c - cs + foot(phi);
    add(1, 'Gövde arka yüz düşey (ana)', rb.stemB, cnt(L - 2 * c, rb.stemB.s), vLen(rb.stemB.phi));
    add(2, 'Gövde ön yüz düşey', rb.stemF, cnt(L - 2 * c, rb.stemF.s), vLen(rb.stemF.phi));
    add(3, 'Gövde yatay (arka yüz)', rb.stemH, cnt(gm.Hs - c, rb.stemH.s), lap(rb.stemH.phi, L - 2 * c));
    add(4, 'Gövde yatay (ön yüz)', rb.stemH, cnt(gm.Hs - c, rb.stemH.s), lap(rb.stemH.phi, L - 2 * c));
    const leg = Math.max(0.15, gm.tb - cs - c);
    add(5, 'Taban alt enine (ön ampatman ana)', rb.baseB, cnt(L - 2 * c, rb.baseB.s), gm.B - 2 * c + 2 * leg);
    add(6, 'Taban üst enine (arka ampatman ana)', rb.baseT, cnt(L - 2 * c, rb.baseT.s), gm.B - 2 * c + 2 * leg);
    add(7, 'Taban boyuna (alt)', rb.baseL, cnt(gm.B - 2 * c, rb.baseL.s), lap(rb.baseL.phi, L - 2 * c));
    add(8, 'Taban boyuna (üst)', rb.baseL, cnt(gm.B - 2 * c, rb.baseL.s), lap(rb.baseL.phi, L - 2 * c));

  /* donatısız hızlı metraj (optimizasyonda alt sınır için) */

    const form = Math.hypot(gm.xfT - gm.xf0, gm.Hs) + Math.hypot(gm.xbT - gm.xb0, gm.Hs) + 2 * gm.tb;
    const lean = +s.opts.lean || 0, ws = +s.opts.ws || 0, leanM = lean > 0 ? (gm.B + 0.2) * lean : 0;

  /* ---------------- kontrol listesi ---------------- */
  function checkList(s, o) {

    const fs = (n, F, lim, key) => out.push({ n, v: isFinite(F) && F > 0 ? lim / F : 9.99, ok: F >= lim, txt: `FS = ${fm(F, 2)} ≥ ${fm(lim, 2)}`, key });

    if (gm.key && rb.key) g += ln([[gm.xk + cs, gm.tb - c - 0.05], [gm.xk + cs, -gm.keyH + cs], [gm.xk + gm.keyB - cs, -gm.keyH + cs], [gm.xk + gm.keyB - cs, gm.tb - c - 0.05]], C.reb, 1.8) + tag(gm.xk + gm.keyB / 2, -gm.keyH / 2, 9);
    g += tag(bx(gm.tb + gm.Hs * 0.62) + 0.25, gm.tb + gm.Hs * 0.62, 1) + tag(fx(gm.tb + gm.Hs * 0.45) - 0.25, gm.tb + gm.Hs * 0.45, 2);
    g += tag(bx(gm.tb + gm.Hs * 0.3) + 0.25, gm.tb + gm.Hs * 0.3, 3) + tag(fx(gm.tb + gm.Hs * 0.25) - 0.25, gm.tb + gm.Hs * 0.25, 4);
    g += tag(gm.B * 0.25, -0.12, 5) + tag(gm.B * 0.75, gm.tb + 0.16, 6) + tag(gm.B * 0.55, -0.12, 7) + tag(gm.B * 0.9, gm.tb + 0.16, 8);
    return g;
  }

  function needLen() {

      kp(o.bad ? o.bad + ' ✘' : 'tümü ✔', o.bad ? 'sağlanmayan kontrol' : 'tüm kontroller sağlanıyor', o.bad ? 'bad' : 'ok') + `</div>` +

      `<div class="grid2"><section class="card"><h3>Kesit, itki ve taban basıncı</h3>${D.section(S, o, { w: 760, h: 560 })}<p class="note">Turuncu: sanal arka yüzdeki itki (zemin + sürşarj + su). Mor: taban basıncı (kPa). Ölçüler m.</p></section>` +
      `<section class="card"><h3>Kontroller</h3>${needH}${checksTable(o)}<p class="note">Doluluk = talep / kapasite (güvenlik sayılarında sınır / FS). Belirleyici kontrol en yüksek dolulukla çalışandır.</p></section></div>`;
  }

  /* ---------------- OPTİMİZASYON ---------------- */
  function cfgFor(types) {
    const c = OPT.cfg, d = SV.defaults(S), keys = d.keyHs.filter((h) => h <= c.keyMax + 1e-9);
    return { objective: c.objective, tryKey: c.tryKey, noKey: !!c.noKey, keyHs: keys.length ? keys : [0.3], tbMin: c.tbMin, tbMax: c.tbMax || d.tbMax, toeMax: c.toeMax || d.toeMax, step: c.step, types };
  }
  function busy(on, txt) { const b = $('#busy'); b.style.display = on ? 'flex' : 'none'; if (txt) $('#busyTxt').textContent = txt; $('#busyProg').style.width = '0'; }
  async function runOpt(types, applyBest, txt) {
    if (OPT.running) return null; OPT.running = true; busy(true, txt || 'Optimum tasarım hesaplanıyor…');
    try {
      const res = await SV.run(S, cfgFor(types), (p) => { $('#busyProg').style.width = Math.round(p.p * 100) + '%'; });
      if (applyBest && res.best) { SV.apply(S, res.best); detachDesign(); renderSide(); }
      return res;
    } finally { OPT.running = false; busy(false); }
  }
  async function optNow() {
    const res = await runOpt([S.type], true);
    OPT.res = res;
    if (res && res.best) { toast(`Optimum tasarım uygulandı (${{ cost: 'en az maliyet', conc: 'en az beton', steel: 'en az donatı', exc: 'en az kazı' }[OPT.cfg.objective]}):`, `B = ${f(res.best.B, 2)} m`); TAB = TAB === 'girdi' ? 'tasarim' : TAB; }
    else toast('Bu yükler ve sınırlarla uygun tasarım bulunamadı. Diş derinliği, taban kalınlığı ya da ampatman sınırlarını büyütün.', false);
    renderSide(); recalc();
  }
  async function optCompare() {
    const rows = [];
    for (const t of ['T', 'L', 'RL']) {
      for (const tk of [false, true]) {
        const keep = OPT.cfg.tryKey; OPT.cfg.tryKey = tk; OPT.cfg.noKey = !tk;
        const r = await runOpt([t], false, `${TYPE_NAMES[t]} · ${tk ? 'dişli' : 'dişsiz'} hesaplanıyor…`);
        OPT.cfg.tryKey = keep; OPT.cfg.noKey = false;
        rows.push({ t, tk, best: r && r.best });
      }
    }
    OPT.cmp = rows; renderTab();
  }
  const objName = { cost: 'en az maliyet', conc: 'en az beton', steel: 'en az donatı', exc: 'en az kazı' };
  const dRow = (d, act, i, lab) => `<tr><td>${{ T: 'T', L: 'L', RL: 'Ters L' }[d.type]}${lab ? ' <span class="note">' + lab + '</span>' : ''}</td><td class="r">${f(d.geo.toe, 2)}</td><td class="r">${f(d.geo.heel, 2)}</td><td class="r">${f(d.B, 2)}</td><td class="r">${f(d.geo.tb, 2)}</td><td class="r">${f(d.geo.ttop, 2)} / ${f(d.geo.tbot, 2)}</td><td class="r">${d.key.on ? f(d.key.h, 2) : '–'}</td><td class="r">${f(d.conc, 2)}</td><td class="r">${f(d.steel)}</td><td class="r">${f(d.exc, 1)}</td><td class="r"><b>${f(d.costM)}</b></td><td>${escH(d.gov)} %${f(d.govV * 100)}</td><td><button class="btn" data-act="${act}" data-i="${i}">uygula</button></td></tr>`;
  const dHead = `<tr><th>Tip</th><th class="r">Ön amp. (m)</th><th class="r">Arka amp. (m)</th><th class="r">B (m)</th><th class="r">tb (m)</th><th class="r">Gövde üst/alt</th><th class="r">Diş (m)</th><th class="r">Beton m³/m</th><th class="r">Donatı kg/m</th><th class="r">Kazı m³/m</th><th class="r">Maliyet /m</th><th>Belirleyici</th><th></th></tr>`;
  function tabOpt() {
    const c = OPT.cfg, d = SV.defaults(S), p = S.price;
    let h = saveBar() + `<section class="card"><h3>En ekonomik tasarım</h3><p class="aim"><b>Amaç:</b> Girilen yükler ve zemin için tüm stabilite ve betonarme kontrollerini sağlayan, seçilen ölçüte göre en ekonomik boyutları bulmak. Taban kalınlığı, gövde kalınlığı, kayma dişi ve ön ampatman taranır; her kombinasyonda gereken en kısa arka ampatman bulunur ve donatı otomatik seçilir.</p>` +
      `<div class="fields" style="grid-template-columns:repeat(4,1fr);padding:0">` +
      `<div class="f"><label>Ölçüt</label><select data-oc="objective">${Object.keys(objName).map((k) => `<option value="${k}" ${c.objective === k ? 'selected' : ''}>${objName[k]}</option>`).join('')}</select></div>` +
      `<div class="f"><label>Taban kalınlığı en az (m)</label><input type="number" step="0.05" data-oc="tbMin" value="${c.tbMin}"></div><div class="f"><label>Taban kalınlığı en çok (m)</label><input type="number" step="0.05" data-oc="tbMax" value="${c.tbMax || d.tbMax}"></div>` +

      `<div class="f"><label>Diş derinliği en çok (m)</label><input type="number" step="0.1" data-oc="keyMax" value="${c.keyMax}"></div><div class="f"><label>Boyut adımı (m)</label><input type="number" step="0.05" data-oc="step" value="${c.step}"></div></div>` +
      `<h3 style="margin-top:10px">Birim fiyatlar (yalnızca maliyet ölçütü için)</h3><div class="fields" style="grid-template-columns:repeat(6,1fr);padding:0">` +

    const r = OPT.res;
    if (r) h += `<section class="card"><h3>Sonuçlar – ${objName[r.cfg.objective]}</h3>` + (r.best ? `<p class="note">${f(r.nFull)} tasarım tam hesaplandı, ${f(r.nFeas)} tanesi tüm kontrolleri sağladı (${f(r.ms)} ms). İlk satır optimumdur.</p><div style="overflow-x:auto"><table>${dHead}${r.list.slice(0, 15).map((x, i) => dRow(x, 'optApply', i)).join('')}</table></div>` : `<div class="res bad">Uygun tasarım bulunamadı. Taban kalınlığı ve ön ampatman sınırlarını büyütün, dişi açın ya da zemin/yük değerlerini gözden geçirin.</div>`) + `</section>`;
    if (OPT.cmp) h += `<section class="card"><h3>Duvar tiplerinin karşılaştırması</h3><p class="note">Her satır o tipin (dişli ya da dişsiz) en ekonomik çözümüdür. Arsa sınırı nedeniyle ön ya da arka ampatman yapılamıyorsa L / ters L satırına bakın.</p><div style="overflow-x:auto"><table>${dHead.replace('<th>Tip</th>', '<th>Tip</th>')}${OPT.cmp.map((x, i) => (x.best ? dRow(x.best, 'cmpApply', i, x.tk ? 'dişli' : 'dişsiz') : `<tr><td>${{ T: 'T', L: 'L', RL: 'Ters L' }[x.t]} ${x.tk ? '(dişli)' : '(dişsiz)'}</td><td colspan="12" style="color:#A12622">uygun çözüm yok</td></tr>`)).join('')}</table></div></section>`;
    return h;
  }

  /* ---------------- HESAP ADIMLARI ---------------- */
  const rowsT = (arr) => `<table>${arr.map((r) => (r.head ? `<tr><th colspan="3">${r.head}</th></tr>` : `<tr class="${r.cls || ''}"><td>${r[0]}</td><td class="f2">${r[1] || ''}</td><td class="r">${r[2] == null ? '' : r[2]}</td></tr>`)).join('')}</table>`;
  const card = (no, title, aim, body) => `<section class="card"><h3><span class="no">${no}</span>${title}</h3><p class="aim"><b>Amaç:</b> ${aim}</p>${body}</section>`;
  function tabAdim() {
    const o = OUT; if (!o.ok) return `<div class="res bad">${escH(o.err)}</div>`;
    const gm = o.gm, ep = o.ep, st = o.stat, A = o.A0, b = S.back, fo = S.found, L = S.lim;
    let h = '';
    h += card(1, 'Ağırlıklar ve düşey kuvvetler', 'Duvarın ve topuk üstündeki dolgunun ağırlıklarını ve ön uca (x = 0) göre kollarını bulmak.',
      `<table><tr><th>Kuvvet</th><th class="r">V (kN/m)</th><th class="r">x (m)</th><th class="r">V·x (kNm/m)</th><th>Stabilitede</th></tr>` + A.V.map((v) => `<tr><td>${escH(v.n)}</td><td class="r">${f(v.v, 2)}</td><td class="r">${f(v.x, 3)}</td><td class="r">${f(v.v * v.x, 2)}</td><td>${v.stab ? 'sayılır' : 'yalnız taban basıncında'}</td></tr>`).join('') + `</table>`);
    h += card(2, 'Aktif toprak itkisi', 'Dolgunun duvarı itme kuvvetini ve etki noktasını bulmak.', rowsT([
      [ep.virt ? 'Sanal arka yüz (topuk ucundan geçen düşey düzlem)' : 'Duvar arka yüzü (topuk yok)', ep.virt ? 'topuk üstündeki dolgu duvarla birlikte çalışır' : '', `δ = ${f(ep.dDeg, 1)}°`],
      ['Coulomb aktif katsayısı', `Ka = cos²φ / [cosδ·(1 + √(sin(φ+δ)·sin(φ−β) / (cosδ·cosβ)))²], φ = ${f(b.phi)}°, β = ${f(b.beta)}°`, `<b>${f(ep.K, 4)}</b>`],
      ['Düzlem yüksekliği', 'Hv = H + l·tanβ', f(gm.Hv, 3) + ' m'],
      ['Zemin itkisi', ep.hw > 0 ? 'su üstü γ, su altı γ′ = γsat − γw' : 'Pa = ½·Ka·γ·Hv²', `${f(ep.soil.P, 2)} kN/m, y = ${f(ep.soil.y, 3)} m`],
      ['Sürşarj itkisi', 'Pq = Ka·q·Hv', `${f(ep.q.P, 2)} kN/m, y = ${f(ep.q.y, 3)} m`],
      ['Su basıncı', 'Pw = ½·γw·hw²', `${f(ep.w.P, 2)} kN/m`],
      ['Yatay / düşey bileşen', 'P·cosδ / P·sinδ', `${f((ep.soil.P + ep.q.P) * Math.cos(ep.d), 2)} / ${f((ep.soil.P + ep.q.P) * Math.sin(ep.d), 2)} kN/m`],
      ['Pasif direnç (ön)', `Kp = tan²(45 + φ/2) = ${f(A.pp.Kp, 3)}; derinlik ${f(A.pp.z1, 2)} → ${f(A.pp.z2, 2)} m`, `${f(A.pp.P, 2)} kN/m × ${f(fo.fp, 2)}`],
    ]));
    if (o.seis && o.A1.ep.E) {
      const E = o.A1.ep.E;
      h += card('2b', 'Deprem itkisi (Mononobe–Okabe)', 'Deprem sırasında artan itkiyi ve atalet kuvvetlerini bulmak.', rowsT([
        ['ψ = atan(kh / (1 − kv))', `kh = ${f(S.seis.kh, 2)}, kv = ${f(S.seis.kv, 2)}`, f(E.psi, 2) + '°'], ['KAE', 'Mononobe–Okabe', `<b>${f(E.KE, 4)}</b>`],
        ['İtki artışı', 'ΔPAE = ½·γ·Hv²·[(1 − kv)·KAE − Ka], 0,6·Hv’de', `${f(E.P, 2)} kN/m`], ['Sürşarj artışı', 'q·Hv·ΔK', `${f(E.Pq, 2)} kN/m`],
      ].concat(o.A1.H.filter((x) => x.cat === 'E').map((x) => [escH(x.n), `y = ${f(x.y, 2)} m`, f(x.h, 2) + ' kN/m']))));
    }
    const stabCard = (no, t, c, lim) => card(no, t, 'Duvarın devrilmeye, kaymaya ve taban basıncına karşı güvenliğini göstermek.', rowsT([
      { head: 'Devrilme (ön uç etrafında)' }, ['Karşı koyan moment', 'ΣV·x (stabilitede sayılan)', f(c.MRst, 2) + ' kNm/m'], ['Devirici moment', 'ΣH·y + U·xU', f(c.MO + c.MU, 2) + ' kNm/m'],
      { cls: c.FSo >= lim.o ? 'tot' : 'bad', 0: 'FS devrilme', 1: '≥ ' + f(lim.o, 2), 2: f(c.FSo, 3), length: 3 },
      { head: 'Kayma' }, ['Düşey kuvvet N', 'ΣV − U', f(c.N, 2) + ' kN/m'], ['Sürtünme', `N·tan δb, δb = ${f(c.dB, 1)}°`, f(c.Rf, 2)], ['Adezyon', 'ca·B', f(c.Rc, 2)], ['Pasif (azaltılmış)', 'fp·Pp', f(c.Rp, 2)],
      ['Toplam direnç R / itici ΣH', '', `${f(c.R, 2)} / ${f(c.H, 2)} kN/m`], { cls: c.FSs >= lim.s ? 'tot' : 'bad', 0: 'FS kayma', 1: '≥ ' + f(lim.s, 2), 2: f(c.FSs, 3), length: 3 },
      { head: 'Taban basıncı' }, ['Bileşke yeri', 'x = (ΣV·x − ΣH·y − U·xU) / N', f(c.xr, 3) + ' m'], ['Eksantrisite', 'e = B/2 − x', f(c.e, 3) + ' m (sınır B/' + f(lim.e) + ' = ' + f(gm.B / lim.e, 2) + ')'],
      ['qmax / qmin', c.bp.full ? 'N/B·(1 ± 6e/B)' : 'çekme var: 2N / (3x)', `${f(c.bp.qmax, 1)} / ${f(c.bp.qmin, 1)} kPa`], { cls: c.bp.qmax <= lim.q ? 'tot' : 'bad', 0: 'qmax ≤ qa', 1: f(lim.q, 0) + ' kPa', 2: f(c.bp.qmax, 1), length: 3 },

    if (o.rc.key) h += card(7, 'Kayma dişi', 'Dişin önündeki pasif direnci taşıyabildiğini göstermek.', rowsT([['Dişe gelen pasif kuvvet', 'γG·fp·Pp,diş', f(sr.Vkey, 2) + ' kN/m'], ['Kol (diş kökünden)', '', f(A.pp.keyArm, 3) + ' m']]) + rcBlock(o.rc.key));
    return h;
  }
  function rcBlock(r) {

    if (SHEET > sh.length) SHEET = 1;
    return saveBar() + `<div class="ctrl sbar">${sh.map((x, i) => `<button class="btn ${SHEET === i + 1 ? 'on' : ''}" data-act="sheet" data-v="${i + 1}">${nm[i]}</button>`).join('')}<span style="flex:1"></span><button class="btn p" data-act="printsheet">A3 PDF / Yazdır (${sh.length} pafta)</button>${sh.map((x, i) => `<button class="btn" data-act="svg" data-v="${i + 1}">Pafta ${i + 1} SVG</button>`).join('')}</div>` +
      `<p class="note">A3 yatay. Tarayıcıda “PDF olarak kaydet”i seçip kenar boşluğunu “Yok”, ölçeği “%100” yapın.</p>` + sh.map((s, i) => `<div class="sheet ${i + 1 === SHEET ? 'on' : ''}">${s}</div>`).join('');
  }
  function printSheets() { document.body.classList.add('print-sheet'); const done = () => { document.body.classList.remove('print-sheet'); window.removeEventListener('afterprint', done); }; window.addEventListener('afterprint', done); window.print(); }
  function downloadSvg(n) { const x = PF.build(S, OUT)[n - 1]; if (!x) return; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([x], { type: 'image/svg+xml' })); a.download = `Istinat_${(S.meta.name || 'duvar').replace(/[^\p{L}\p{N}\-]+/gu, '_')}_P${n}.svg`; a.click(); }

  /* ---------------- KAYITLI TASARIMLAR ---------------- */
  let DESLIB = [], CURID = null, DESSIG = '';
  try { DESLIB = JSON.parse(localStorage.getItem(DES_KEY) || '[]').filter((x) => x && x.id && x.name && x.s && x.s.geo); } catch (e) { /* yok */ }
  try { CURID = localStorage.getItem(CUR_KEY) || null; } catch (e) { /* yok */ }
  if (CURID && !DESLIB.some((x) => x.id === CURID)) CURID = null;
  const saveLib = () => { try { localStorage.setItem(DES_KEY, JSON.stringify(DESLIB)); } catch (e) { toast('Kayıt yapılamadı: tarayıcı depolaması dolu ya da kapalı. Dosyaya kaydedin.', false); } };
  const setCur = (id) => { CURID = id; try { if (id) localStorage.setItem(CUR_KEY, id); else localStorage.removeItem(CUR_KEY); } catch (e) { /* sessiz */ } };
  const stable = (o) => JSON.stringify(o, (k, v) => (v && typeof v === 'object' && !Array.isArray(v) ? Object.keys(v).sort().reduce((a, x) => { a[x] = v[x]; return a; }, {}) : v));
  const skey = (s) => { const c = clone(s); delete c.rebar; return stable(c); };
  const curRec = () => DESLIB.find((x) => x.id === CURID) || null;
  const dirty = () => { const r = curRec(); return !!r && skey(S) !== skey(r.s); };
  const newId = () => 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const sorted = () => DESLIB.slice().sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
  const uniqueName = (n, ex) => { let x = n, i = 2; while (DESLIB.some((r) => r.id !== ex && r.name.toLowerCase() === x.toLowerCase())) x = `${n} (${i++})`; return x; };
  const defName = () => `${S.meta.name || 'İstinat'} · ${{ T: 'T', L: 'L', RL: 'ters L' }[S.type]} H${f(S.geo.H, 2)}`;
  function detachDesign() { if (CURID) setCur(null); }
  function renderDesignUi() {
    const list = sorted(), sig = list.map((r) => r.id + r.name).join(';') + CURID, sel = $('#selDesign');
    if (sig !== DESSIG) { DESSIG = sig; sel.innerHTML = `<option value="">📂 Kayıtlı tasarım aç (${list.length})</option>` + list.map((r) => `<option value="${escH(r.id)}">${r.id === CURID ? '✔ ' : ''}${escH(r.name)}</option>`).join('') + '<option value="__file">💻 Bilgisayardaki dosyadan aç…</option>'; }
    sel.value = '';
    const ch = $('#desChip'), r = curRec();
    if (r) { ch.style.display = ''; ch.innerHTML = `💾 ${escH(r.name)}` + (dirty() ? ' <b title="Kayıttan sonra değişiklik yapıldı">●</b>' : ''); } else ch.style.display = 'none';
  }
  const DLG = { mode: null, id: null, name: '', note: '', err: '' };
  function dlgOpen(mode, id) { const r = mode === 'edit' ? DESLIB.find((x) => x.id === id) : curRec(); if (mode === 'edit' && !r) return; Object.assign(DLG, { mode, id: id || null, name: r ? r.name : defName(), note: r ? r.note || '' : '', err: '' }); dlgRender(); }
  function dlgRender() {
    let box = $('#dlg'); if (!box) { box = document.createElement('div'); box.id = 'dlg'; document.body.appendChild(box); }
    if (!DLG.mode) { box.style.display = 'none'; box.innerHTML = ''; return; }
    const r = curRec(), ed = DLG.mode === 'edit';
    box.style.display = 'flex';
    box.innerHTML = `<div class="dlgbox"><h3>${ed ? 'Adı ve notu düzenle' : 'Tasarımı kaydet'}</h3><div class="f"><label>Tasarım adı</label><input type="text" id="dlgName" data-dl="name" value="${escH(DLG.name)}"></div>` +
      `<div class="f" style="margin-top:6px"><label>Not (isteğe bağlı)</label><input type="text" data-dl="note" value="${escH(DLG.note)}"></div>` +
      (ed ? '' : `<p class="note" style="margin:8px 0 0">${TYPE_NAMES[S.type]} · H = ${f(S.geo.H, 2)} m · B = ${OUT.ok ? f(OUT.gm.B, 2) : '–'} m · beton ${OUT.ok ? f(OUT.qty.per.conc, 2) : '–'} m³/m</p>` + (r ? `<p class="note" style="margin:6px 0 0">Açık kayıt: <b>${escH(r.name)}</b><br>“Güncelle” bu kaydın üzerine yazar; “Yeni kayıt olarak kaydet” ayrı bir kopya oluşturur.</p>` : '')) +
      (DLG.err ? `<div class="res bad">${DLG.err}</div>` : '') +
      `<div class="btnrow">${ed ? '<button class="btn p" data-act="dlgOk">Kaydet</button>' : (r ? '<button class="btn p" data-act="dlgUpd">Güncelle</button><button class="btn" data-act="dlgNew">Yeni kayıt olarak kaydet</button>' : '<button class="btn p" data-act="dlgNew">Kaydet</button>') + '<button class="btn" data-act="dlgFile">💻 Bilgisayara da kaydet</button>'}<button class="btn" data-act="dlgCancel">Vazgeç</button></div>` +
      (ed ? '' : '<p class="note" style="margin:8px 0 0">Kayıt bu tarayıcıda saklanır. Dosya olarak bilgisayarınıza yazmak için “Bilgisayara da kaydet”i kullanın.</p>') + `</div>`;
    setTimeout(() => { const i = $('#dlgName'); if (i) { i.focus(); i.select(); } }, 0);
  }
  const dlgClose = () => { DLG.mode = null; dlgRender(); };
  function dlgCommit(asNew) {
    const name = String(DLG.name || '').trim(), note = String(DLG.note || '').trim();
    if (!name) { DLG.err = 'Tasarım adı gerekli.'; dlgRender(); return; }
    const now = new Date().toISOString(); let msg, shown;
    if (DLG.mode === 'edit') { const r = DESLIB.find((x) => x.id === DLG.id); r.name = uniqueName(name, r.id); r.note = note; r.updatedAt = now; msg = 'Kaydedildi:'; shown = r; }
    else if (!asNew && curRec()) { const r = curRec(); r.name = uniqueName(name, r.id); r.note = note; r.s = clone(S); r.updatedAt = now; msg = 'Tasarım güncellendi:'; shown = r; }
    else { const r = { id: newId(), name: uniqueName(name), note, savedAt: now, updatedAt: now, s: clone(S) }; DESLIB.push(r); setCur(r.id); msg = 'Tasarım kaydedildi:'; shown = r; }
    saveLib(); dlgClose(); renderDesignUi(); if (TAB === 'kayit') renderTab(); toast(msg, shown.name);
  }
  function dsnOpen(id, goTab) {
    const r = DESLIB.find((x) => x.id === id); if (!r) return;
    if (CURID !== id && (CURID ? dirty() : true) && !confirm('Güncel girdilerdeki kaydedilmemiş değişiklikler kaybolacak. Devam edilsin mi?')) return;
    S = merge(clone(W.DEFAULTS), clone(r.s)); setCur(id); OPT.res = null;
    if (goTab) TAB = 'tasarim';
    renderSide(); recalc(); toast('Tasarım açıldı:', r.name);
  }
  const FILETYPES = [{ description: 'İstinat duvarı tasarımı (.json)', accept: { 'application/json': ['.json'] } }];
  async function saveFile() {
    const r = curRec(), now = new Date().toISOString(), rec = { id: r ? r.id : newId(), name: r ? r.name : defName(), note: r ? r.note || '' : '', savedAt: now, updatedAt: now, s: clone(S) };
    const base = rec.name.replace(/[^\p{L}\p{N}\-]+/gu, '_'), body = JSON.stringify({ app: 'istinat-hesap', version: 1, designs: [rec] }, null, 1);
    if (window.showSaveFilePicker) { try { const h = await window.showSaveFilePicker({ suggestedName: base + '.json', types: FILETYPES }); const w = await h.createWritable(); await w.write(body); await w.close(); toast('Dosyaya kaydedildi:', h.name); } catch (e) { if (e && e.name !== 'AbortError') toast('Dosya kaydedilemedi.', false); } }
    else { exportJson([rec], base); toast('Dosya indirilenler klasörüne indirildi:', base + '.json'); }
  }
  function exportJson(list, base) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: 'istinat-hesap', version: 1, designs: list }, null, 1)], { type: 'application/json' })); a.download = `${base || 'istinat_tasarimlari'}.json`; a.click(); }
  function importText(text, openAfter) {
    try {
      const j = JSON.parse(text), arr = Array.isArray(j) ? j : j.designs, ids = [];
      arr.forEach((x) => { if (!x || !x.name || !x.s || !x.s.geo) return; const same = DESLIB.find((y) => y.id === x.id); if (same && skey(same.s) === skey(merge(clone(W.DEFAULTS), x.s))) { ids.push(same.id); return; } const id = same || !x.id ? newId() : String(x.id); DESLIB.push({ id, name: uniqueName(String(x.name)), note: String(x.note || ''), savedAt: x.savedAt || new Date().toISOString(), updatedAt: x.updatedAt || new Date().toISOString(), s: x.s }); ids.push(id); });
      if (!ids.length) throw new Error('boş');
      saveLib(); renderDesignUi(); if (openAfter) dsnOpen(ids[0], true); else { renderTab(); toast('İçe aktarıldı.', true); }
    } catch (e) { toast('Dosya açılamadı: geçerli bir tasarım dosyası değil.', false); }
  }
  async function openFile() {
    if (window.showOpenFilePicker) { try { const [h] = await window.showOpenFilePicker({ types: FILETYPES }); importText(await (await h.getFile()).text(), true); } catch (e) { if (e && e.name !== 'AbortError') toast('Dosya açılamadı.', false); } }
    else $('#desOpenFile').click();
  }
  const saveBar = () => `<div class="sbar"><button class="btn p" data-act="saveDlg">💾 Bu tasarımı kaydet</button></div>`;
  function tabKayit() {
    const list = sorted(), d = dirty();
    const rows = list.map((r) => { const o = W.compute(merge(clone(W.DEFAULTS), clone(r.s))), open = r.id === CURID;
      return `<tr class="${open ? 'tot' : ''}"><td><b>${escH(r.name)}</b>${r.note ? `<div class="note">${escH(r.note)}</div>` : ''}</td><td>${{ T: 'T', L: 'L', RL: 'Ters L' }[r.s.type] || ''}</td><td class="r">${f(r.s.geo.H, 2)}</td><td class="r">${o.ok ? f(o.gm.B, 2) : '–'}</td><td class="r">${o.ok ? f(o.qty.per.conc, 2) : '–'}</td><td class="r">${o.ok ? f(o.qty.per.steel) : '–'}</td><td class="r">${o.ok ? f(o.qty.costM) : '–'}</td><td>${o.ok ? (o.bad ? `<span style="color:#A12622">✘ ${o.bad}</span>` : '<span style="color:#1B6B3F">✔</span>') : '–'}</td>` +
        `<td style="font-size:12px;color:#5B6B7B">${new Date(r.updatedAt).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' })}</td><td>${open ? '<b style="color:#1B6B3F">Açık</b>' + (d ? ' <span style="color:#C25E00">· değişti</span>' : '') : ''}</td>` +
        `<td style="min-width:170px;line-height:2"><button class="btn p" data-act="dOpen" data-id="${r.id}">Aç</button> <button class="btn" data-act="dDup" data-id="${r.id}">Kopyala</button> <button class="btn" data-act="dEdit" data-id="${r.id}">Adı düzenle</button> <button class="btn" data-act="dExp" data-id="${r.id}">İndir</button> <button class="btn" data-act="dDel" data-id="${r.id}">Sil</button></td></tr>`; }).join('');
    return `<section class="card"><h3>Kayıtlı tasarımlar</h3><p class="aim"><b>Amaç:</b> Duvar tasarımlarını (tip, yükler, zemin, boyutlar, donatı) bir adla saklayıp sonra yeniden açmak. Benzer bir duvar için kaydı açın, değiştirin ve “Yeni kayıt olarak kaydet” deyin. Kayıtlar bu tarayıcıda saklanır; bilgisayara dosya olarak da kaydedebilirsiniz.</p>` +
      `<div class="sbar"><button class="btn p" data-act="saveDlg">💾 Güncel tasarımı kaydet</button><button class="btn" data-act="saveFile">💻 Dosyaya kaydet</button><button class="btn" data-act="openFile">💻 Dosyadan aç</button></div>` +
      (list.length ? `<div style="overflow-x:auto"><table><tr><th>Ad</th><th>Tip</th><th class="r">H (m)</th><th class="r">B (m)</th><th class="r">Beton m³/m</th><th class="r">Donatı kg/m</th><th class="r">Maliyet /m</th><th>Kontroller</th><th>Kayıt</th><th>Durum</th><th></th></tr>${rows}</table></div>` : '<p class="note">Henüz kayıtlı tasarım yok.</p>') +
      `<div class="btnrow" style="margin-top:8px"><button class="btn" data-act="expAll">Tümünü indir</button></div></section>`;
  }

  /* ---------------- sekmeler ---------------- */
  const TABS = [['girdi', 'Girdiler', tabGirdi], ['tasarim', 'Tasarım', tabTasarim], ['opt', 'Optimizasyon', tabOpt], ['adim', 'Hesap adımları', tabAdim], ['liste', 'Donatı ve metraj', tabListe], ['pafta', 'Paftalar (A3)', tabPafta], ['kayit', 'Kayıtlı tasarımlar', tabKayit]];
  function renderTab() {
    const keepY = window.scrollY; SHOWN = TAB;
    TABS.forEach((t) => $('#t-' + t[0]).classList.toggle('on', t[0] === TAB));
    $('#t-' + TAB).innerHTML = TABS.find((t) => t[0] === TAB)[2]();
    $('#tabs').innerHTML = TABS.map((t) => `<button data-tab="${t[0]}" class="${t[0] === TAB ? 'on' : ''}">${t[1]}</button>`).join('');
    if (TAB === 'tasarim') liveUpdate();
    window.scrollTo(0, keepY);
  }
  const renderSide = () => { SHOWN = null; };
  function toast(t, name, ok) {
    let el = $('#toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
    el.style.background = name === false || ok === false ? '#A12622' : '#1B6B3F';
    el.innerHTML = escH(t) + (name && name !== true ? ` <b>${escH(name)}</b>` : '');
    el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 3500);
  }

  /* ---------------- olaylar ---------------- */
  document.addEventListener('input', (e) => {
    const t = e.target, ds = t.dataset || {};
    if (ds.dl) { DLG[ds.dl] = t.value; return; }
    if (ds.oc) { const v = t.type === 'checkbox' ? t.checked : t.tagName === 'SELECT' ? t.value : parseFloat(t.value); if (t.type === 'number' && !isFinite(v)) return; OPT.cfg[ds.oc] = v; return; }
    if (ds.rb) { const [id, k] = ds.rb.split('.'); if (!S.rebar) S.rebar = clone(OUT.rb); S.rebar[id] = S.rebar[id] || clone(OUT.rb[id] || { phi: 12, s: 200 }); S.rebar[id][k] = +t.value; recalc(); return; }
    if (ds.dz || ds.dr) {
      const k = ds.dz || ds.dr, v = parseFloat(t.value); if (!isFinite(v)) return;
      set(S, k, Math.round(v * 100) / 100); detachIfNeeded();
      const twin = document.querySelector(ds.dz ? `[data-dr="${k}"]` : `[data-dz="${k}"]`); if (twin) twin.value = ds.dz ? v : v.toFixed(2);
      recalc(); return;
    }
    const k = ds.k; if (!k) return;
    let v = t.type === 'checkbox' ? t.checked : t.type === 'number' ? parseFloat(t.value) : t.value;
    if (t.type === 'number' && !isFinite(v)) return;
    set(S, k, v);
    if (k === 'rebarMode' && v === 'manual' && OUT && OUT.rb) S.rebar = clone(OUT.rb);
    if (t.tagName === 'SELECT' || t.type === 'checkbox') renderSide();
    recalc();
  });
  const detachIfNeeded = () => {};
  document.addEventListener('toggle', (e) => { const d = e.target; if (d && d.dataset && d.dataset.s != null) OPEN[d.dataset.s] = d.open; }, true);
  document.addEventListener('click', (e) => {
    if (e.target.id === 'dlg') { dlgClose(); return; }
    const ty = e.target.closest('[data-type]'); if (ty) { S.type = ty.dataset.type; renderSide(); recalc(); return; }
    const tb = e.target.closest('[data-tab]'); if (tb) { TAB = tb.dataset.tab; renderTab(); window.scrollTo(0, 0); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act, i = +a.dataset.i;
    if (act === 'needApply') { S.geo[a.dataset.k] = +a.dataset.v; recalc(); }
    if (act === 'optNow') optNow();
    if (act === 'optRun') runOpt([S.type], false).then((r) => { OPT.res = r; renderTab(); });
    if (act === 'optCmp') optCompare();
    if (act === 'optApply' && OPT.res) { SV.apply(S, OPT.res.list[i]); TAB = 'tasarim'; renderSide(); recalc(); toast('Tasarım uygulandı.', true); }
    if (act === 'cmpApply' && OPT.cmp) { SV.apply(S, OPT.cmp[i].best); TAB = 'tasarim'; renderSide(); recalc(); toast('Tasarım uygulandı.', true); }
    if (act === 'csv') csv();
    if (act === 'sheet') { SHEET = +a.dataset.v; renderTab(); }
    if (act === 'printsheet') printSheets();
    if (act === 'svg') downloadSvg(+a.dataset.v);
    if (act === 'saveDlg') dlgOpen('save');
    if (act === 'dlgNew') dlgCommit(true);
    if (act === 'dlgUpd' || act === 'dlgOk') dlgCommit(false);
    if (act === 'dlgFile') { dlgCommit(false); if (!DLG.mode) saveFile(); }
    if (act === 'dlgCancel') dlgClose();
    if (act === 'saveFile') saveFile();
    if (act === 'openFile') openFile();
    if (act === 'expAll' && DESLIB.length) exportJson(DESLIB, 'istinat_tasarimlari_' + new Date().toISOString().slice(0, 10));
    const id = a.dataset.id, r = id && DESLIB.find((x) => x.id === id);
    if (act === 'dOpen') dsnOpen(id, true);
    if (act === 'dEdit') dlgOpen('edit', id);
    if (act === 'dDup' && r) { const c = { id: newId(), name: uniqueName(r.name + ' (2)'), note: r.note, savedAt: new Date().toISOString(), updatedAt: new Date().toISOString(), s: clone(r.s) }; DESLIB.push(c); saveLib(); renderDesignUi(); renderTab(); toast('Kopyalandı:', c.name); }
    if (act === 'dExp' && r) exportJson([r], 'istinat_' + r.name.replace(/[^\p{L}\p{N}\-]+/gu, '_'));
    if (act === 'dDel' && r && confirm('Silmek istediğinize emin misiniz?')) { DESLIB = DESLIB.filter((x) => x.id !== id); if (CURID === id) setCur(null); saveLib(); renderDesignUi(); renderTab(); toast('Silindi.', true); }
  });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 's') { e.preventDefault(); if (!DLG.mode) dlgOpen('save'); return; }
    if (!DLG.mode) return;
    if (e.key === 'Escape') dlgClose(); else if (e.key === 'Enter' && e.target.dataset && e.target.dataset.dl) { e.preventDefault(); dlgCommit(false); }
  });
  document.addEventListener('change', (e) => { if (e.target.id === 'desOpenFile' && e.target.files[0]) { const rd = new FileReader(); rd.onload = () => importText(rd.result, true); rd.readAsText(e.target.files[0]); e.target.value = ''; } });
  $('#selType').addEventListener('change', (e) => { S.type = e.target.value; renderSide(); recalc(); });
  $('#selDesign').addEventListener('change', (e) => { const id = e.target.value; e.target.value = ''; if (id === '__file') openFile(); else if (id) dsnOpen(id, false); });
  $('#desChip').addEventListener('click', () => { TAB = 'kayit'; renderTab(); });
  $('#btnSave').addEventListener('click', () => dlgOpen('save'));
  $('#btnOpt').addEventListener('click', () => optNow());
  $('#btnPrint').addEventListener('click', () => window.print());

  /* ---------------- başlat ---------------- */
  const hadSaved = init();
  OUT = W.compute(S); renderTab(); renderChips();
  if (!hadSaved) {
    runOpt([S.type], true, 'İlk tasarım yüklere göre hesaplanıyor…').then((r) => { OPT.res = r; recalc(); if (r && r.best) toast('İlk tasarım yüklere göre otomatik yapıldı (en az maliyet). Yükleri ve zemini Girdiler sekmesinde değiştirip “⚙ Optimum tasarla”ya basın.', true); });
  }
  window.__S = () => S; window.__OUT = () => OUT;
})();

</script>
