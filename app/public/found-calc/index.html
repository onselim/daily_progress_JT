<!doctype html>
<html lang="tr">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temel Hesap Aracı – B-30 / BNS</title>
<style>
:root{--navy:#1F4E78;--blue:#4C78A8;--orange:#F58518;--green:#2E8B57;--red:#D64541;--bg:#F4F6F9;--card:#fff;--line:#D9DEE5;--ink:#1C2733;--mut:#5B6B7B}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
header{background:var(--navy);color:#fff;padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:17px;margin:0;font-weight:600}
header .sp{flex:1}
header select,header button{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid #fff3;background:#ffffff1f;color:#fff}
header select option{color:#000}
header button{cursor:pointer}header button:hover{background:#ffffff40}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;background:#ffffff26}
.chip.ok{background:#2E8B5777}.chip.bad{background:#D6454199}
.layout{min-height:calc(100vh - 52px)}
main{padding:14px 18px;min-width:0;max-width:1700px;margin:0 auto}
details{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff}
details>summary{padding:8px 10px;cursor:pointer;font-weight:600;color:var(--navy);list-style:none}
details>summary::before{content:"▸ ";color:var(--mut)}details[open]>summary::before{content:"▾ "}
.fields{padding:4px 10px 10px;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.f{display:flex;flex-direction:column;font-size:12px;color:var(--mut)}
.f.w2{grid-column:1/3}
.f input,.f select{font:inherit;color:var(--ink);padding:5px 6px;border:1px solid var(--line);border-radius:5px;width:100%}
.f label{display:flex;justify-content:space-between;gap:4px}
.f .u{color:#8896A5}
.f.chk{flex-direction:row;align-items:center;gap:6px;grid-column:1/3;color:var(--ink)}
.f.chk input{width:auto}
.hint{grid-column:1/3;font-size:11.5px;color:var(--mut);background:#F2F6FB;border-radius:6px;padding:6px 8px;line-height:1.4}
.btnrow{grid-column:1/3;display:flex;gap:6px;flex-wrap:wrap}
.btn{font:inherit;font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer}
.btn:hover{background:#EAF1F8}.btn.p{background:var(--blue);color:#fff}
nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
nav.tabs button{font:inherit;padding:8px 14px;border:0;background:none;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:600}
nav.tabs button.on{color:var(--navy);border-bottom-color:var(--orange)}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 6px;color:var(--navy);font-size:15.5px;display:flex;align-items:center;gap:8px}
.card h3 .no{background:var(--navy);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.aim{margin:4px 0 8px;color:#33475B;line-height:1.5;background:#F7FAFD;border-left:3px solid var(--blue);padding:6px 10px;border-radius:0 6px 6px 0}
.two{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:14px;align-items:start}
.two.wide{grid-template-columns:minmax(300px,640px) 1fr}
@media(max-width:1000px){.two,.two.wide{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:4px 7px;border-bottom:1px solid #E7EBF0;text-align:start;vertical-align:top}
th{background:#F0F4F8;color:var(--navy);font-weight:600;font-size:12px}
td.r,th.r{text-align:end;font-variant-numeric:tabular-nums}
td.f2{color:#556;font-size:12px}
tr.tot td{font-weight:700;background:#F7FAFD}
.res{margin-top:8px;padding:7px 10px;border-radius:7px;font-weight:600}
.res.ok{background:#E6F4EC;color:#1B6B3F}.res.bad{background:#FCE9E8;color:#A12622}.res.warn{background:#FFF4DE;color:#8A5A00}
.bar{height:9px;background:#E9EEF3;border-radius:5px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--green)}
.bar i.hi{background:var(--orange)}.bar i.over{background:var(--red)}
.gov{outline:2px solid var(--orange)}
.note{font-size:12.5px;color:var(--mut);line-height:1.5}
.warnbox{background:#FFF4DE;border:1px solid #F1D79A;border-radius:8px;padding:8px 12px;margin-bottom:10px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
svg text{user-select:none}
.shape{width:200px}
@media print{header,aside,nav.tabs,.btn{display:none!important}.layout{display:block}.tab{display:block!important;page-break-before:always}.tab:first-of-type{page-break-before:auto}main{padding:0}.card{break-inside:avoid}}

@page sheet{size:A3 landscape;margin:0}
#t-pafta .sheet{display:none}#t-pafta .sheet.on{display:block}
#t-pafta .sheet svg{width:100%;height:auto;display:block;background:#fff;box-shadow:0 1px 8px #0003}
#t-pafta .ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
@media print{body.print-sheet .tab{display:none!important}body.print-sheet #t-pafta{display:block!important;page-break-before:auto}body.print-sheet #t-pafta .ctrl{display:none}
body.print-sheet #t-pafta .sheet{display:block!important;page:sheet;break-after:page}body.print-sheet #t-pafta .sheet svg{width:420mm;height:297mm;box-shadow:none}}

.gzrow{display:grid;grid-template-columns:210px 1fr 96px 24px 74px;gap:8px;align-items:center;padding:3px 0;border-bottom:1px dashed #E7EBF0}
.gzrow label.nm{font-size:13px;color:#33475B}
.gzrow input[type=range]{width:100%;accent-color:var(--blue)}
.gzrow input[type=number]{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:5px;width:100%;text-align:right}
.gzrow .u{color:var(--mut);font-size:12px}.gzrow .fr{font-size:12px;color:var(--mut);display:flex;gap:4px;align-items:center}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.kpi{flex:1;min-width:130px;background:#F4F7FB;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.kpi b{display:block;font-size:19px;color:var(--navy)}.kpi span{font-size:11.5px;color:var(--mut)}
.dcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}.dcard h4{margin:0 0 4px;color:var(--navy)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.prog{height:8px;background:#E9EEF3;border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--blue);width:0}
@media(max-width:900px){.gzrow{grid-template-columns:1fr 1fr}.gzrow input[type=range]{grid-column:1/3}}
/* girdiler: kartlar yan yana */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px;align-items:start}
.igrid details.isec{margin:0}
.igrid .fields{grid-template-columns:1fr 1fr}
/* tasarım: solda kaydırmalı boyutlar (sabit), sağda canlı çizimler */
.dsn{display:grid;grid-template-columns:minmax(290px,350px) 1fr;gap:14px;align-items:start}
.dctl{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;margin:0}
.sl{padding:5px 0 7px;border-bottom:1px dashed #E7EBF0}
.sl1{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.sl1 label{font-size:12.5px;color:#33475B}
.sl .sn{display:flex;align-items:center;gap:4px}.sl .sn em{font-style:normal;color:var(--mut);font-size:11.5px;min-width:22px}
.sl input[type=number]{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:5px;width:78px;text-align:right}
.sl input[type=range]{width:100%;accent-color:var(--blue);margin:0}
.sl select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:5px}
.chk2{display:flex;gap:6px;align-items:center;font-size:12.5px;margin-top:8px;color:#33475B}
#gz-ranges tr.off td{color:#9AA7B5}
@media(max-width:1000px){.dsn{grid-template-columns:1fr}.dctl{position:static;max-height:none}}
/* sağdan sola diller (Arapça): çizimler, kaydırıcılar ve sayı kutuları soldan sağa kalır */
html[dir=rtl] body{direction:rtl}
svg,input[type=range],input[type=number],.prog{direction:ltr}
html[dir=rtl] svg text{unicode-bidi:plaintext}
#selLang{max-width:150px}
.mbtn{border:0;background:#EEF3F8;border-radius:5px;cursor:pointer;padding:1px 6px;margin-right:5px;font-size:13px;line-height:1.3}.mbtn.lock{background:#FCE9E8}.mbtn.auto{background:#E6F4EC}
.sl input:disabled{opacity:.45}
.langgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:10px 0}
.langbtn{font:inherit;padding:14px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:2px}
.langbtn b{font-size:17px;color:var(--navy)}.langbtn span{font-size:12px;color:var(--mut)}
.langbtn:hover{border-color:var(--blue)}.langbtn.on{border-color:var(--orange);background:#FFF8EE}
#tip{position:fixed;z-index:90;max-width:326px;background:#1C2B3A;color:#fff;font-size:12.5px;line-height:1.5;padding:8px 11px;border-radius:8px;box-shadow:0 6px 22px #0005;pointer-events:none;display:none}
[data-tip] label{cursor:help}
@media print{#tip{display:none!important}}
/* kayıtlı tasarımlar: diyalog, uyarı, üst çubuk */
#selDesign{max-width:270px}
#desChip{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
#desChip b{color:#FFC36B}
#dlg{position:fixed;inset:0;background:#0007;z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.dlgbox{background:#fff;border-radius:12px;padding:16px 18px;width:min(460px,100%);box-shadow:0 10px 40px #0005}
.dlgbox h3{margin:0 0 10px;color:var(--navy);font-size:16px}
.dlgbox .f input{font-size:14px}
.dlgbox .btnrow{margin-top:12px}
#toast{position:fixed;right:18px;bottom:18px;background:#1B6B3F;color:#fff;padding:9px 14px;border-radius:8px;box-shadow:0 4px 18px #0004;z-index:70;opacity:0;pointer-events:none;transform:translateY(8px);transition:.2s}
#toast.show{opacity:1;transform:none}
.sbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
@media print{#dlg,#toast{display:none!important}}
</style>
</head>
<body>
<header>
  <h1>Temel Hesap Aracı</h1>
  <select id="selLang" title="Dil / Language / ენა / Язык / اللغة"></select>
  <select id="selTower" title="Direk tipi"></select>
  <select id="selClass" title="Zemin sınıfı"></select>
  <div class="chips" id="chips"></div>
  <span class="chip" id="desChip" style="display:none"></span>
  <div class="sp"></div>
  <button id="btnSave" title="Güncel tasarımı bir adla kaydeder; sonra tekrar açabilirsiniz (Ctrl+S)">💾 Kaydet</button>
  <select id="selDesign" title="Kayıtlı bir tasarımı aç"></select>
  <button id="btnAuto" title="Eğilme ve baca hesabına göre donatı çap/adetlerini önerir">Donatıyı otomatik öner</button>
  <button id="btnPrint">Yazdır / PDF</button>
</header>
<div class="layout">
  <main>
    <nav class="tabs" id="tabs"></nav>
    <div id="t-girdi" class="tab"></div>
    <div id="t-tasarim" class="tab"></div>
    <div id="t-opt" class="tab"></div>
    <div id="t-adim" class="tab"></div>
    <div id="t-liste" class="tab"></div>
    <div id="t-pafta" class="tab"></div>
    <div id="t-kayit" class="tab"></div>
    <div id="t-direk" class="tab"></div>
    <div id="t-zemin" class="tab"></div>
    <div id="t-dil" class="tab"></div>
  </main>
</div>
<input type="file" id="desOpenFile" accept=".json,application/json" style="display:none">
<script>
/* Çok dilli arayüz: kaynak dil Türkçe. Uygulama Türkçe metin üretir; bu modül görüntülenen metni seçili dile çevirir.
 *  - Sözlük anahtarı: Türkçe metin, sayılar '#' ile (ör. "Kesit (# cm)"); çeviri aynı sırayla '#' veya yeniden sıralamak için {1},{2}… kullanır.
 *  - Tam eşleşme yoksa metin içindeki bilinen ifadeler (en uzun önce) tek tek çevrilir.
 *  - DOM (HTML + SVG metinleri) MutationObserver ile otomatik çevrilir; dil değişince yeniden çevrilir.
 *  - Sayı biçimi dile göre (I18N.loc()); Arapça için sağdan sola yön. Eksik çeviri: İngilizce, sonra Türkçe.
 */
(function (root) {
  'use strict';
  const LANGS = [
    { code: 'tr', name: 'Türkçe', loc: 'tr-TR', dir: 'ltr' },
    { code: 'en', name: 'English', loc: 'en-US', dir: 'ltr' },
    { code: 'ka', name: 'ქართული', loc: 'ka-GE', dir: 'ltr' },
    { code: 'ru', name: 'Русский', loc: 'ru-RU', dir: 'ltr' },
    { code: 'ar', name: 'العربية', loc: 'ar-u-nu-latn', dir: 'rtl' },
    { code: 'de', name: 'Deutsch', loc: 'de-DE', dir: 'ltr' },
    { code: 'fr', name: 'Français', loc: 'fr-FR', dir: 'ltr' },
    { code: 'es', name: 'Español', loc: 'es-ES', dir: 'ltr' },
    { code: 'ku', name: 'Kurdî (Kurmancî)', loc: 'tr-TR', dir: 'ltr' },
  ];
  const KEYS = [], maps = {}, regs = {}, handlers = [], miss = new Set();
  let lang = 'tr', locOverride = null, codeOverride = null;
  const NUM = /\d+(?:[   ]\d{3})*(?:[.,]\d+)*/g;      // 8.094 · 8,094 · 8 094 (dar/ince boşluk binlik ayracı) · 0,1503
  const info = (c) => LANGS.find((l) => l.code === c) || LANGS[0];
  const ws = (s) => s.replace(/[ \t\r\n\f]+/g, ' ');      // dar/bölünmez boşluklar (sayı ayracı) korunur

  function setKeys(arr) { KEYS.length = 0; arr.forEach((k) => KEYS.push(k)); }
  function add(code, obj) {
    const m = maps[code] || (maps[code] = new Map());
    for (const i in obj) if (KEYS[i] != null) m.set(KEYS[i], obj[i]);
    for (const c in regs) delete regs[c];
  }
  /* "indeks|çeviri" satırları (düz metin biçimi; çeviri '#' veya {1},{2}… yer tutucu içerebilir) */
  function addText(code, text) {
    const o = {};
    text.split('\n').forEach((line) => { const i = line.indexOf('|'); if (i > 0) { const n = line.slice(0, i).trim(); if (/^\d+$/.test(n)) o[n] = line.slice(i + 1).trim(); } });
    add(code, o);
  }
  const lookup = (code, k) => { const m = maps[code]; let t = m && m.get(k); if (t == null && code !== 'en' && maps.en) t = maps.en.get(k); return t; };
  const fill = (tpl, nums) => { let i = 0; return tpl.replace(/#|\{(\d+)\}/g, (m, d) => (d !== undefined ? (nums[d - 1] != null ? nums[d - 1] : '') : (nums[i++] != null ? nums[i - 1] : '#'))); };
  const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  function frag(code) {
    if (regs[code] !== undefined) return regs[code];
    const ks = new Set([...(maps[code] ? maps[code].keys() : []), ...(code !== 'en' && maps.en ? maps.en.keys() : [])]);
    const arr = [...ks].filter((k) => k.length >= 3 && k.indexOf('#') < 0).sort((a, b) => b.length - a.length);
    regs[code] = arr.length ? new RegExp('(?<![\\p{L}\\p{N}])(?:' + arr.map(esc).join('|') + ')', 'gu') : null;
    return regs[code];
  }

  /* bir metni çevir (Türkçe kaynak → seçili dil) */
  function tr(s, code) {
    code = code || lang;
    if (code === 'tr' || !s) return s;
    const core0 = s.trim(); if (!core0) return s;
    const lead = s.slice(0, s.length - s.trimStart().length), trail = s.slice(s.trimEnd().length), core = ws(core0);
    if (!/[A-Za-zÇĞİÖŞÜçğıöşü]/.test(core)) return s;
    const nums = [], k = core.replace(NUM, (m) => { nums.push(m); return '#'; });
    if (root.__collect) root.__collect.add(k);
    const t = lookup(code, k);
    if (t != null) return lead + fill(t, nums) + trail;
    const re = frag(code);
    if (re) {
      let ch = false;
      const out = core.replace(re, (m) => { const r = lookup(code, m); if (r == null) return m; ch = true; return r; });
      if (ch) return lead + out + trail;
    }
    if (/[çğıöşüÇĞİÖŞÜ]/.test(core) || /^[A-ZÇĞİÖŞÜ][a-zçğıöşü]{3,}/.test(core)) miss.add(k);
    return s;
  }

  /* DOM çevirisi: metin düğümleri + title/placeholder/aria-label */
  const orig = new WeakMap(), origAttr = new WeakMap(), ATTRS = ['title', 'placeholder', 'aria-label'];
  function tText(n) {
    const p = n.parentNode; if (p && (p.nodeName === 'SCRIPT' || p.nodeName === 'STYLE')) return;
    let o = orig.get(n); if (o === undefined) { o = n.nodeValue; orig.set(n, o); }
    const v = tr(o); if (n.nodeValue !== v) n.nodeValue = v;
  }
  function tEl(el) {
    if (!el.getAttribute) return;
    for (const a of ATTRS) {
      const cur = el.getAttribute(a); if (cur == null) continue;
      let m = origAttr.get(el); if (!m) { m = {}; origAttr.set(el, m); }
      if (m[a] === undefined) m[a] = cur;
      const v = tr(m[a]); if (cur !== v) el.setAttribute(a, v);
    }
  }
  const skipEl = (e) => e && e.closest && e.closest('[data-nolang],[translate=no]');      // kendi diline önceden çevrilmiş alanlar (pafta setleri)
  function walk(node) {
    if (!node) return;
    if (node.nodeType === 3) { if (!skipEl(node.parentElement)) tText(node); return; }
    if (node.nodeType !== 1 && node.nodeType !== 9 && node.nodeType !== 11) return;
    if (node.nodeType === 1) { if (skipEl(node)) return; tEl(node); }
    const w = document.createTreeWalker(node, 1 | 4, { acceptNode: (n) => (n.nodeType === 1 && n.hasAttribute('data-nolang') ? 2 : 1) });
    let n; while ((n = w.nextNode())) { if (n.nodeType === 3) tText(n); else tEl(n); }
  }

  /* HTML/SVG metni (indirme, CSV): etiketler arasındaki metinleri çevirir */
  const dec = (s) => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');
  const enc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function markup(str, code) {
    code = code || lang; if (code === 'tr') return str;
    return str.replace(/(<[^<>]*>)([^<>]+)(?=<)/g, (m, tag, t) => tag + (tag.indexOf('data-nolang') >= 0 ? t : enc(tr(dec(t), code))));   // data-nolang: önceden çevrilmiş metin
  }

  let srcTitle = null;
  function setLang(code) {
    code = info(code).code; lang = code;
    try { localStorage.setItem('temelHesapLang', code); } catch (e) { /* yok */ }
    const L = info(code);
    document.documentElement.lang = code; document.documentElement.dir = L.dir;
    if (srcTitle == null) srcTitle = document.title;
    document.title = tr(srcTitle, code);
    const sel = document.getElementById('selLang'); if (sel) sel.value = code;
    handlers.forEach((h) => h(code));      // uygulama yeniden çizer (sayı biçimi dile bağlı)
    walk(document.body);
  }
  function init() {
    let c = 'tr';
    try { const q = new URLSearchParams(location.search).get('lang'); c = q || localStorage.getItem('temelHesapLang') || 'tr'; } catch (e) { /* yok */ }
    const sel = document.getElementById('selLang');
    if (sel) { sel.innerHTML = LANGS.map((l) => `<option value="${l.code}">${l.name}</option>`).join(''); sel.addEventListener('change', () => setLang(sel.value)); }
    new MutationObserver((muts) => { for (const m of muts) m.addedNodes.forEach((n) => { if (lang !== 'tr') walk(n); }); }).observe(document.body, { childList: true, subtree: true });
    if (info(c).code !== 'tr') setLang(c); else { lang = 'tr'; if (sel) sel.value = 'tr'; document.documentElement.dir = 'ltr'; }
  }

  root.I18N = { LANGS, setKeys, add, addText, tr, markup, walk, setLang, init, miss, keys: KEYS,

45|Z (vertical)\n346|P inclined\n347|P = Z·√(#+#tan²α)\n348|Axial load uplift / compression\n349|input\n350|Shear (soil) / (chimney)\n351|Foundation loads\n352|Lu = # × P uplift\n353|Lc = # × P compression\n354|Soil and unit weights (dry / submerged)\n355|It is the weight that resists uplift. If the soil is under water each body becomes lighter by the weight of the water it displaces (# daN/m³) (Archimedes): soil γsat → γsat − #, concrete # → # daN/m³. That is why resistance drops and the foundation grows in saturated classes.\n356|groundwater level\n357|Dry soil\n358|γ soil = # daN/m³ · γ concrete = #\n359|Saturated soil (C#)\n360|γ' = γsat − γw = # − # = # · concrete #\n361|buoyancy\n362|Bearing capacity qa / at the edge\n363|Soil unit weight (effective)\n364|dry\n365|Concrete density (effective)\n366|Wedge angle β\n367|tanβ = #\n368|fcd = fck/γc\n369|fyd = fy/γs\n370|Volume and weight of the concrete\n371|The self-weight of the foundation is a small but certain part of the resistance against uplift. Three parts are calculated separately: base pad, pad #, chimney.\n372|Lu=#\n373|Gpt=#\n374|Gb=#\n375|Base pad: T#·B²\n376|Pad #: T#·B#²\n377|Chimney: A²·(T+To−T#−T#)\n378|Total concrete Vb\n379|Gb = Vb × γc\n380|Soil wedge: part by part\n381|When the uplift load pulls the foundation up, the truncated-cone-shaped soil mass above it is lifted too; its weight is added to the resistance. The side faces are flat (prismatic wedge), the corners are conical (quarter cones). Because there is concrete inside the wedge, the volume occupied by the concrete must be deducted from the soil weight.\n382|① Prism: B²·T\n383|② # side wedges: #·B·T²·tanβ\n384|③ # corner quarter cones: (π/#)·T³·tan²β\n385|Total wedge (①+②+③)\n386|− Chimney: A²·(T−T#−T#)\n387|− Pad #: T#·B#²\n388|Vpt – report method\n389|pad # not deducted\n390|− Pad #: T#·B² (correction)\n391|non-soil volume\n392|Vpt – used\n393|Gpt = Vpt × γsoil\n394|Soil above the pad (for bearing)\n395|Vat = B²(T−T#) − A²(T−T#−T#) − T#·B#²\n396|Gat = Vat × γsoil\n397|Corrected method: all # concrete parts were deducted from the wedge.\n398|Uplift (pull-out) check\n399|Does the foundation lift out when pulled up? Resistance: weight of the concrete + weight of the soil wedge. Because the load is already factored, a safety factor ≥ # is required (the report has no extra factor on the resistance side).\n400|Resistance R = φ·(Gb + Gpt)\n401|FS = R / Lu\n402|report method (pad-# counted)\n403|corrected (pad-# deducted)\n404|✔ Uplift satisfied: FS = #\n405|Bearing: soil pressure\n406|Can the soil under the foundation carry the compression load and the bending caused by the horizontal force? The average pressure must not exceed qa, the corner pressure must not exceed #·qa, and there must be no tension (negative pressure) at the corners.\n407|Lc=#\n408|min #\n409|max # daN/cm²\n410|Moments: M = V·(T+To+#)\n411|ΣG = Lc + Gat + Gb\n412|Eccentricity e = M/ΣG\n413|Average pressure Qo = ΣG/B²\n414|Moment share (Mx±My)·#/B³\n415|Largest / smallest\n416|✔ Bearing satisfied\n417|Overturning\n418|The uplift and horizontal force try to overturn the foundation about one corner of the pad (A). The resistance is half of the soil wedge (Gpt/#); the overturning force is found by dividing the moment Lu·y + V·(T+To) − Gb·B/# by the arm ⅔(B+T#) (old US reference sheet #-D-#).\n419|A (pivot point)\n420|Lu·y\n421|V·(T+To)\n422|Gpt/# + Gb\n423|y = B/#·cosα\n424|Resistance Lr = φ·Gpt/#\n425|Lox = [Lu·y + Vx(T+To) − Gb·B/#] / ⅔(B+T#)\n426|Loy (with Vy)\n427|report method: # · #\n428|✘ Overturning not satisfied\n429|Pad reinforcement (bending – Eurocode #)\n430|The pad bends like a cantilever, pushed up by the soil (compression case) and pulled from above by the leg in uplift. The required reinforcement is found from the bending moment with K = Mu/(b·d²·fcd), z = d/#·[#+√(#−#K)] ≤ #d, As = Mu/(fyd·z); the selected reinforcement must satisfy it.\n431|soil pressure (cantilever bending)\n432|Mu = L²/#·[Q#(#B−L)+L·Q#]\n433|Pad botto ოწმდება (B # mm ბიჯით, T # mm ბიჯით ≈ # პროექტი, რამდენიმე წამი). დასაშვებთაგან ირჩევა ყველაზე ნაკლები ბეტონის, არმატურის, ამოღებისა და ღირებულების მქონე. საწყისი პროექტიდან გაუმჯობესება არ ხდება; შედეგი საწყის მნიშვნელობაზე არ არის დამოკიდებული.\n260|საჭირო ზომის მრუდი:\n261|თითოეული T-სთვის B იზრდება პატარადან დიდისკენ # mm ბიჯით; ჩნდება პირველი მნიშვნელობა, რომელიც ყველა შემოწმებას აკმაყოფილებს, და # mm-მდე დაზუსტდება. იგივე ლოგიკით მიიღება «საჭირო T ფიქსირებული B-სთვის».\n262|რა რჩება უცვლელი:\n263|«თავისუფლად» მოუნიშნავი პარამეტრები (T#, T#, B#, A, To, β, qa) რჩება დაპროექტების ჩანართის მნიშვნელობაზე; ოპტიმუმი მათზეა დამოკიდებული. უკეთესი შედეგისთვის მონიშნეთ შესაბამისი უჯრა «თავისუფალი» (ძებნა იზრდება, ბიჯი ავტომატურად მსხვილდება).\n264|რატომ ეს ოპტიმუმი?\n265|სიღრმის ზრდისას გრუნტის სოლი იზრდება და ამოგლეჯვისთვის საჭირო B მცირდება; მაგრამ T ძალიან რომ გაიზარდოს, ფილის ზემოთ გრუნტისა/ბეტონის წონა ზღუდავს ტარუნარიანობას და B კვლავ იზრდება. მინიმალური ბეტონი იმ გადაკვეთის წერტილთანაა, სადაც ამოგლეჯვა და ტარუნარიანობა ერთმანეთს ზღუდავს.\n266|საჭირო ზომის მრუდი – «რა სიგანის ფილაა საჭირო ამ სიღრმეზე?»\n267|მიზანი:\n268|ერთი პარამეტრის (მაგ. სიღრმე T) ცვლილებისას,\n269|დაპროექტების ყველა კრიტერიუმის დასაკმაყოფილებლად,\n270|ვნახოთ, რა მინიმალური მნიშვნელობა უნდა ჰქონდეს მეორე პარამეტრს (მაგ. ფილის სიგანე B). ლურჯი ხაზი თითოეული T-სთვის უმცირესი საჭირო B-ა; ხაზის ზემოთ დასაშვები არეა. ნარინჯისფერი ხაზი ამ პროექტის ბეტონის მოცულობაა, მონიშნული წერტილი კი კომბინაციაა\n271|მინიმალური ბეტონით\n272|(ოპტიმუმი). სხვა ზომები რჩება დაპროექტების ჩანართის მნიშვნელობებზე; ყოველ წერტილში ფილისა და სვეტის არმატურა ავტომატურად შეირჩევა.\n273|პარამეტრი, რომელსაც ცვლით (X)\n274|საჭირო (Y)\n275|X მინიმუმი (mm)\n276|X მაქსიმუმი (mm)\n277|მრუდის აგება\n278|დააჭირეთ «მრუდის აგება»-ს (რამდენიმე წამს გასტანს).\n279|ერთი პარამეტრის შეცვლა, დანარჩენის ფიქსირება\n280|ვნახოთ, არჩეული პარამეტრის რა მნიშვნელობებზე სრულდება დაპროექტების ყველა კრიტერიუმი. ხაზები აჩვენებს თითოეული კრიტერიუმის გამოყ ელოთ?\n1105|ღია პროექტს შეუნახავი ცვლილებები აქვს. მაინც ჩაიტვირთოს სხვა ანძა ან გრუნტი?\n1106|შეინახეთ მიმდინარე პროექტი (ანძა, გრუნტი, დატვირთვები, სტუბი, ზომები, არმატურა და პარამეტრები) სახელით და მოგვიანებით ერთი დაწკაპუნებით გახსენით. მსგავსი პროექტებისთვის იგივე მონაცემების ხელახლა შეყვანა საჭირო არ არის: გახსენით შენახული პროექტი, შეცვალეთ და აირჩიეთ „განახლება“ ან „ახალ ჩანაწერად შენახვა“. პროექტები ინახება ამ ბრაუზერში; სხვა კომპიუტერზე გადასატანად ჩამოტვირთეთ და იმპორტირეთ.\n1107|· შეუნახავი ცვლილებები\n1108|შენახულია\n1109|სტატუსი\n1110|აქტიური\n1111|· შეცვლილია\n1112|გახსნა\n1113|სახელის შეცვლა\n1114|ჩამოტვირთვა\n1115|ყველას ჩამოტვირთვა\n1116|ბეტონი, არმატურა და ექსკავაცია მოცემულია ერთ ანძაზე (# ფეხი). სვეტი „შემოწმებები“ აჩვენებს, შენახული პროექტის რამდენი შემოწმება არ სრულდება.\n1117|შენახული პროექტები ჯერ არ არის. მიმდინარე პროექტის შესანახად გამოიყენეთ ზედა ღილაკი „შენახვა“.\n1118|ახალი ჩანაწერები ვერ მოიძებნა (იდენტური ჩანაწერები უკვე არსებობს).\n1119|💻 ფაილში შენახვა\n1120|💻 ფაილიდან გახსნა\n1121|ინახავს მიმდინარე პროექტს ფაილად თქვენი კომპიუტერის ნებისმიერ საქაღალდეში\n1122|ხსნის პროექტის ფაილს თქვენი კომპიუტერიდან\n1123|ფაილში შენახულია:\n1124|ფაილის შენახვა ვერ მოხერხდა.\n1125|ფაილი ჩამოიტვირთა ჩამოტვირთვების საქაღალდეში:\n1126|ფაილი ვერ გაიხსნა: ეს არ არის სწორი პროექტის ფაილი.\n1127|💻 კომპიუტერზეც შენახვა\n1128|ინახავს ბრაუზერში და შემდეგ გთხოვთ აირჩიოთ საქაღალდე კომპიუტერზე\n1129|პროექტი ინახება ამ ბრაუზერში. კომპიუტერზე ფაილად ჩასაწერად გამოიყენეთ „კომპიუტერზეც შენახვა“.\n1130|💻 კომპიუტერიდან ფაილის გახსნა…\n1131|ანძის რეაქციები: ერთი ფეხის დეკარტული რეაქციები Z, X, Y (კნ) ანძის დაპროექტებიდან (მაგ. PLS-CADD). პირდაპირი ღერძული დატვირთვა: საძირკვლის ანგარიშის დატვირთვები სტუბის ღერძის გასწვრივ (daN).\n1132|ფეხის (სტუბის) ღერძის ვერტიკალიდან დახრის ტანგენსი. მისგან გამოითვლება დახრილი ღერძული დატვირთვა P = Z·√(#+#tan²α) და ჰორიზონტალური ძვრა X − Z·tanα.\n1133|ერთი ანძის ორ მეზობელ ფეხს შორის მანძილი ცენტრიდან ცენტრამდე. საჭიროა მხოლოდ სოლების გადაფარვის შემოწმებისთვის; ცარიელის შემთხვევაში შემოწმება არ ხდება.\n1134|ფეხებს შორის მანძილი მეორე მიმართულებით (ცენტრიდან ცენტრამდე). სოლების გადაფარვის შემოწმებისთვის.\n1135|ტექნიკური პირობების კოეფიციენტი საძირკვლის დატვირთვებზე (ER #). დატვირთვები მასზე მრავლდება, რომ საძირკველი ანძაზე ადრე არ დაირღვეს.\n1136|ერთი ფეხის უდიდესი ამომგლეჯი (გამჭიმავი) ვერტიკალური რეაქცია. ამოგლეჯის შემოწმების მთავარი დატვირთვა.\n1137|ერთი ფეხის უდიდესი მკუმშავი ვერტიკალური რეაქცია. განსაზღვრავს ფუძის წნევისა და გაჭოლვის შემოწმებებს.\n1138|ჰორიზონტალური რეაქცია ამოგლეჯის დატვირთვის შემთხვევაში (X მიმართულება). სვეტის ძვრა ამ სტრიქონიდან აიღება.\n1139|ჰორიზონტალური რეაქცია კუმშვის შემთხვევაში (X მიმართულება). გრუნტის ძვრა და გადაყირავება ამ სტრიქონიდან აიღება.\n1140|ჰორიზონტალური რეაქცია ამოგლეჯის შემთხვევაში (Y მიმართულება).\n1141|ჰორიზონტალური რეაქცია კუმშვის შემთხვევაში (Y მიმართულება).\n1142|ამომგლეჯი დატვირთვა სტუბის ღერძის გასწვრივ (საძირკვლის ანგარიშის მნიშვნელობა, daN).\n1143|მკუმშავი დატვირთვა სტუბის ღერძის გასწვრივ (საძირკვლის ანგარიშის მნიშვნელობა, daN).\n1144|ჰორიზონტალური ძვრა მიწის დონეზე გადაყირავებისა და ფუძის წნევისთვის (X მიმართულება).\n1145|ჰორიზონტალური ძვრა მიწის დონეზე გადაყირავებისა და ფუძის წნევისთვის (Y მიმართულება).\n1146|ჰორიზონტალური ძვრა სვეტის ღუნვისთვის (X მიმართულება).\n1147|ჰორიზონტალური ძვრა სვეტის ღუნვისთვის (Y მიმართულება).\n1148|მონიშვნისას ამოგლეჯის შემოწმებაში დახრილი ღერძული დატვირთვის ნაცვლად ვერტიკალური Z გამოიყენება (დაახლოებით #%-ით ნაკლები დატვირთვა). გამორთული = ანგარიშის მეთოდი.\n1149|ფუძის დასაშვები წნევა საინჟინრო-გეოლოგიური კვლევიდან. ფუძის საშუალო წნევა ამ მნიშვნელობას არ უნდა აღემატებოდეს.\n1150|დასაშვები კოეფიციენტი გადაყირავების მომენტით გაზრდილი კუთხის წნევისთვის: კუთხის წნევა ≤ კოეფიციენტი × qa.\n1151|გრუნტის ბუნებრივი მოცულობითი წონა. მისით გამოითვლება ამოგლეჯის სოლისა და ფუძის ფილაზე მდებარე გრუნტის წონა; მეტი მნიშვნელობა მეტ წინაღობას იძლევა.\n1152|წყალგაჯერებული მოცულობითი წონა. წყლის ქვეშ გამოიყენება ეფექტური წონა γsat − #.\n1153|ამოგლეჯისას საძირკვლის ზემოთ გრუნტის სოლის (ფრუსტუმის) კუთხე ვერტიკალიდან. დიდი კუთხე ფართო სოლს, ანუ მეტ გრუნტის წონას ნიშნავს.\n1154|ჩართავს ამომტივტივებელ ძალას: გრუნტი და ბეტონი წყლის ქვეშ მსუბუქდება. წყალქვეშა საძირკველი გაცილებით დიდი გამოდის.\n1155|კვადრატული სვეტის გვერდი. სტუბისა და კლიტების ბოლოები არმატურის კარკასში უნდა მოთავსდეს.\n1156|სვეტის სიმაღლე მიწის ზემოთ. გავლენას ახდენს სვეტის მხარზე და მოცულობებზე.\n1157|ფუძის ფილის (საფეხური #, ქვედა ფართო ფილა) სისქე. განსაზღვრავს გაჭოლვასა და ღუნვას.\n1158|საფეხურის # (ზედა პატარა საფეხური) სისქე.\n1159|სიღრმე მიწის დონიდან ფუძის ფილის ძირამდე. ამოგლეჯის სოლის სიმაღლეა, ამიტომ ყველაზე ეფექტური ზომაა; ქვაბულსაც განსაზღვრავს.\n1160|კვადრატული ფუძის ფილის გვერდი. განსაზღვრავს როგორც ფუძის წნევას, ისე ამოგლეჯის სოლის ფუძეს.\n1161|კვადრატული საფეხურის # გვერდი (ჩვეულებრივ B-ს ნახევარი).\n1162|დახრილი: სვეტი სტუბის ღერძის გასწვრივ ისხმება. ვერტიკალური: როგორც ანგარიშშია დახაზული.\n1163|სტუბის კუთხოვანას თაროს სიგანე. მასზეა დამოკიდებული კვეთის ფართობი და შეჭიდულობის პერიმეტრი.\n1164|სტუბის კუთხოვანას სისქე.\n1165|სტუბის კუთხოვანას შიდა მომრგვალების რადიუსი; გამოიყენება კვეთის ფართობში.\n1166|სტუბის ბეტონში ჩაშვებული სიგრძე (ღერძის გასწვრივ). განსაზღვრავს შეჭიდულობის უნარს და ეტევა თუ არა სტუბი ბეტონში.\n1167|სტუბის ბეტონის ზემოთ დარჩენილი სიგრძე (მინიმუმ # მმ).\n1168|სტუბის ფოლადის დენადობის ზღვარი (S#).\n1169|სტუბზე დამაგრებული საანკერო ფირფიტების (კლიტების) რაოდენობა. იძლევა ბეტონზე ჩაჭყლეტის უნარს და მონაცვლეობს კუთხოვანას ორ თაროზე.\n1170|სტუბიდან გამოშვერილი კლიტის თაროს სიგანე.\n1171|კლიტის სისქე.\n1172|კლიტის სიგრძე; განსაზღვრავს ჩაჭყლეტის ფართობს.\n1173|კლიტა–სტუბის შეერთების ჭანჭიკების საერთო რაოდენობა.\n1174|ჭანჭიკის დიამეტრი (კლასი #).\n1175|სტუბის ეფექტური პერიმეტრი შეჭიდულობისთვის. აღებულია ანგარიშის კლიტა–სტუბის დეტალის ფორმულიდან; სხვა პროფილისთვის დაახლოებით #·F#.\n1176|კლიტებს შორის ვერტიკალური ბიჯი (ნახაზისა და სტუბის ბეტონში მოთავსების შემოწმებისთვის).\n1177|მანძილი სტუბის ქვედა ბოლოდან პირველ კლიტამდე.\n1178|სტუბის წახნაგი, რომელზეც კლიტები მაგრდება. შიდა წახნაგზე კლიტა შეიძლება სტუბის თაროს დაეჯახოს.\n1179|მონიშვნისას სტუბი ფუძის ფილამდე ეშვება და დასასწორებელ ბლოკზე დგას; წინააღმდეგ შემთხვევაში მხოლოდ სვეტში რჩება.\n1180|სტუბის ქვეშ დასასწორებელი ბლოკის სიმაღლე (მხოლოდ ნახაზისთვის).\n1181|ბეტონის მახასიათებელი კუმშვის სიმტკიცე.\n1182|არმატურის ფოლადის დენადობის ზღვარი.\n1183|ბეტონის საიმედოობის კოეფიციენტი.\n1184|ფოლადის საიმედოობის კოეფიციენტი.\n1185|ბეტონის მოცულობითი წონა; საძირკვლის საკუთარი წონა ამოგლეჯის წინაღობაში შედის. წყლის ქვეშ აკლდება #.\n1186|ფილის არმატურის დამცავი ფენა. მომზადების ბეტონზე # სმ, უშუალოდ გრუნტზე ჩასხმისას # სმ.\n1187|სვეტის გრძივი ღეროებისა და სამაგრების დამცავი ფენა; განსაზღვრავს არმატურის კარკასის ზომას.\n1188|მანძილი, რომლითაც სვეტის ღეროები ბეტონის ზედა ზედაპირამდე არ აღწევს.\n1189|ფუძის ფილის ქვეშ ჩასხმული მომზადების ბეტონი. აღრმავებს ქვაბულს; მისი წონა წინაღობას არ ემატება.\n1190|მომზადების ბეტონის სისქე.\n1191|მომზადების ბეტონის გამოშვერა ფილის კიდიდან თითო მხარეს.\n1192|დამატებითი ექსკავაცია ფილის თითო მხარეს ყალიბისა და სამუშაოსთვის.\n1193|როგორ შეესაბამება ქვედა და ზედა ბადე დიამეტრითა და რაოდენობით. თანაბარი რაოდენობისას ქვედა და ზედა ღეროები ერთმანეთს წყვილ-წყვილად შეიძლება შეეკრას.\n1194|ფუძის ფილის ქვედა ბადის დიამეტრი (ორივე მიმართულებით ერთნაირი).\n1195|ფუძის ფილის ქვედა ბადის ღეროების რაოდენობა თითო მიმართულებით.\n1196|ფუძის ფილის ზედა ბადის დიამეტრი (ამოგლეჯისას უკუღუნვისთვის).\n1197|ფუძის ფილის ზედა ბადის ღეროების რაოდენობა თითო მიმართულებით.\n1198|საფეხურის # ღეროების დიამეტრი.\n1199|საფეხურის # ღეროების რაოდენობა თითო მიმართულებით.\n1200|სვეტის გრძივი ღეროების დიამეტრი.\n1201|სვეტის გრძივი ღეროების რაოდენობა (#-ის ჯერადი: კუთხეები და გვერდები). მოქმედებს მინიმუმ #% არმირების მოთხოვნა.\n1202|სვეტის სამაგრების დიამეტრი.\n1203|სვეტის სამაგრების ბიჯი.\n1204|ბადის ღეროების ბოლოები #°-იანი კაუჭით (U ფორმა) თუ სწორი.\n1205|კაუჭის ბოლოს სწორი სიგრძე (დიამეტრის ჯერადი).\n1206|სვეტის ღეროების ქვედა სწორი ტერფის სიგრძე (დიამეტრის ჯერადი).\n1207|მოღუნვის შიდა დიამეტრი მცირე ღეროებისთვის (EC#: #Φ).\n1208|მოღუნვის შიდა დიამეტრი დიდი ღეროებისთვის (EC#: #Φ).\n1209|ამოგლეჯისა და გადაყირავების წინაღობაზე გამოყენებული კოეფიციენტი (ანგარიშის მეთოდი: #).\n1210|შესწორებული მეთოდი: საფეხურის # მოცულობა ორჯერ – ბეტონადაც და გრუნტადაც – არ ითვლება. გამორთული = ანგარიშის მეთოდი (უფრო ოპტიმისტური).\n1211|ანგარიშის ფილის მხრის დანამატის აღსადგენად (# სმ).\n1212|ანგარიშის სვეტის მხრის დანამატის აღსადგენად (# სმ).\n1213|სადგამები და ჭრის გეგმა\n1214|ძირის ზედა ბადისთვის სადგამების დაყენება\n1215|ზედა ბადეებისთვის სადგამების დაყენება\n1216|სადგამების ბიჯი (ორივე მიმართულებით)\n1217|სადგამის დიამეტრი\n1218|ავტომატური (სიმაღლისა და ზედა არმატურის მიხედვით)\n1219|სადგამების დამზადება ჭრის ნარჩენებიდან\n1220|ღეროს სავაჭრო სიგრძე\n1221|ნორმები სადგამების რაოდენობას არ ადგენს; მოითხოვს, რომ ზედა ბადე ბეტონირებისას ადგილზე დარჩეს (EN #). პრაქტიკაში ~# მ ბადე (≈ # ცალი/მ²) გამოიყენება; წვრილი ზედა არმატურისას (Φ ≤ #) ბიჯი #–# მ-მდე მცირდება. დიამეტრი ზედა არმატურაზე ნაკლები არ უნდა იყოს, მინ. Φ#; # მ-ზე მაღლა Φ#, # მ-ზე მაღლა Φ#.\n1222|ნორმები სადგამების რაოდენობას არ ადგენს; მოითხოვს, რომ ზედა ბადე ბეტონირებისას ადგილზე დარჩეს (EN #). პრაქტიკაში ~# მ ბადე (≈ # ცალი/მ²) გამოიყენება; წვრილი ზედა არმატურისას (Φ ≤ #) ბიჯი #–# მ-მდე მცირდება. დიამეტრი ზედა არმატურაზე ნაკლები არ უნდა იყოს, მინ. Φ#; # მ-ზე მაღლა Φ#, # მ-ზე მაღლა Φ#. ჭრის გეგმა ერთი ანძისთვის (# საყრდენი) დგება.\n1223|სადგამი (ძირის ზედა ბადეს იჭერს)\n1224|სადგამები (ძირის ზედა ბადე)\n1225|Φ# · # კგ · # ცალი ნარჩენებიდან\n1226|Φ# · # კგ · ახალი ღეროდან\n1227|ცალი\n1228|შესაძენი არმატურა\n1229|# მ ღერო · დანაკარგი #%\n1230|# მ ღეროებიდან ჭრის გეგმა და სადგამები\n1231|არმატურის # მ სავაჭრო ღეროებიდან მინიმალური დანაკარგით დაჭრა და ზედა ბადის სადგამების ჯერ ამ ჭრის ნარჩენებიდან დამზადება.\n1232|არმატურის # მ სავაჭრო ღეროებიდან მინიმალური დანაკარგით დაჭრა და ზედა ბადეების სადგამების ჯერ ამ ჭრის ნარჩენებიდან დამზადება.\n1233|წმინდა ს ბადეს ქვედა ბადის ზემოთ სწორ სიმაღლეზე იჭერს. ბეტონირებისას მუშებისა და ახალი ბეტონის წონით ზედა ბადის ჩაჯდომას უშლის ხელს; დამცავი ფენა და სასარგებლო სიმაღლე (d) ნარჩუნდება. მზიდად არ ითვლება, მხოლოდ მოცულობებში შედის. ფუძის ფილის ზედა ბადისთვის და # საფეხურის ზედა ბადისთვის ცალკე სადგამები გამოიყენება.\n1280|სადგამების ბიჯი ორივე მიმართულებით. პრაქტიკაში გავრცელებულია # მ (≈ # ცალი/მ²); წვრილი ზედა არმატურისას (Φ#–#) და ინტენსიური მოძრაობისას #–# მ. BS #-# ბიჯს დასაყრდენი ღეროს დიამეტრს უკავშირებს; წვრილ ღეროს უფრო ხშირი სადგამი სჭირდება.\n1281|სადგამის დიამეტრი. ავტომატური: დასაყრდენ ზედა არმატურაზე არანაკლები, მინ. Φ#; Φ#, თუ სადგამი # მ-ზე მაღალია, და Φ# # მ-ზე მაღლა (რომ გრძელი ფეხები არ გამოიღუნოს). # მ-ზე მაღლა განიხილეთ გაბმული სადგამები.\n1282|მონიშვნისას სადგამები ჯერ # მ ღეროების ჭრისგან დარჩენილი, საკმარისი დიამეტრისა და სიგრძის ნაჭრებიდან მზადდება; ახალი ღერო მხოლოდ დარჩენილი სადგამებისთვის იჭრება. ასე სადგამები ხშირად დამატებითი შესყიდვის გარეშე იფარება და დანაკარგი მცირდება.\n1283|სავაჭრო სიგრძე, რომლითაც არმატურა იყიდება (თურქეთში ჩვეულებრივ # მ). ჭრის გეგმა თითოეული დიამეტრის ნაჭრებს ამ სიგრძეში მინიმალური დანაკარგით ანაწილებს; უფრო გრძელი ნაჭრები სრულ ღეროდ + ნაშთად იყოფა (გადაბმის სიგრძე ნაჭრის სიგრძეშია).");

робуется по очереди (B с шагом # mm, T с шагом # mm ≈ # проектов, несколько секунд). Среди допустимых выбирается с наименьшим бетоном, наименьшей арматурой, наименьшей выемкой и наименьшей стоимостью. Улучшение от начального проекта не выполняется; результат не зависит от начального значения.\n260|Кривая необходимого размера:\n261|для каждого значения T величина B увеличивается от малой к большой с шагом # mm; находится первое значение, удовлетворяющее всем проверкам, и уточняется до # mm. По той же логике находится «необходимая T при фиксированной B».\n262|Что остаётся фиксированным:\n263|параметры, не отмеченные свободными (T#, T#, B#, A, To, β, qa), сохраняют значения вкладки Проектирование; оптимум зависит от них. Для лучшего результата отметьте нужный флажок «свободный» (перебор растёт, шаг автоматически укрупняется).\n264|Почему такой оптимум?\n265|С ростом глубины грунтовый клин увеличивается и необходимая для вырыва B уменьшается; но при слишком большой T вес грунта/бетона над плитой ограничивает несущую способность, и B снова растёт. Минимум бетона находится вблизи точки пересечения, где вырыв и несущая способность ограничивают друг друга.\n266|Кривая необходимого размера – «какая ширина плиты нужна на этой глубине?»\n267|Цель:\n268|При изменении одного параметра (например, глубины T),\n269|чтобы выполнить все критерии проекта,\n270|увидеть минимальное значение, которое должен иметь другой параметр (например, ширина плиты B). Синяя линия – наименьшая необходимая B для каждой T; выше линии допустимая область. Оранжевая линия – объём бетона этого проекта, отмеченная точка – комбинация с\n271|минимальным бетоном\n272|(оптимум). Остальные размеры остаются на значениях вкладки Проектирование; в каждой точке арматура плиты и подколонника подбирается автоматически.\n273|Изменяемый параметр (X)\n274|Необходимый (Y)\n275|X минимум (mm)\n276|X максимум (mm)\n277|Построить кривую\n278|Нажмите «Построить кривую» (займёт несколько секунд).\n279|Изменить один параметр, остальные зафиксировать\n280|Увидеть, при каких значениях выбранного параметра выполняются все критерии проекта. Линии показывают использование (нагрузка/несущая способность) каждого критерия; ниже линии #% безопасно, зелёная полоса – допустимый диапазон. Остальные размеры остаются на значениях вкладки\n281|.\n282|минимум\n283|максимум\n284|Глубина T (под плитой) (mm)\n285|текущее\n286|Несущая спос. среднее\n287|Несущая спос. угол\n288|Изгиб плиты (K/K′)\n289|зелёная полоса: все проверки выполнены\n290|Допустимый диапазон:\n291|· нижнюю границу ограничивает:\n292|Наименьшее допустимое значение этого параметра:\n293|применить это значение\n294|Проект с минимумом бетона / арматуры / выемки\n295|Перебрать все комбинации параметров, отмеченных «свободными», в их диапазонах; среди удовлетворяющих всем критериям найти проект с наименьшим бетоном, арматурой и выемкой. Для каждой комбинации арматура плиты и подколонника подбирается автоматически. Неотмеченные параметры сохраняют текущее значение.\n296|Свободный\n297|Параметр\n298|текущее\n299|шаг\n300|Ширина плиты B (mm)\n301|Ширина #-й ступени B# (mm)\n302|Толщина плиты T# (mm)\n303|Толщина #-й ступени T# (mm)\n304|Ширина подколонника A (mm)\n305|Высота подколонника над землёй To (mm)\n306|Угол грунтового клина (frustum) β (°)\n307|Несущая способность qa (daN/cm²)\n308|Критерий сортировки\n309|наименьший бетон\n310|наименьшая арматура\n311|наименьшая выемка\n312|наименьшая стоимость\n313|Бетон (/m³)\n314|Сталь (/kg)\n315|Выемка (/m³)\n316|Бетонная подготовка (/m³)\n317|Решить\n318|Удельные цены – условные (только для «наименьшая стоимость»); введите свои цены.\n319|Сводка проверок\n320|Результат\n321|(определяющий)\n322|Использование = нагрузка/несущая способность. Определяющий критерий – проверка с наибольшим использованием; он увеличивает или уменьшает фундамент. Для продавливания принята (осторожная) площадь из отчёта; при полной геометрической площади # daN/cm².\n323|Объёмы (на опору, # ног)\n324|Бетон (конструктивный)\n325|Бетонная подготовка\n326|Выемка\n327|Арматура\n328|# kg/нога\n329|Коэффициент армирования\n330|Запас на вырыв: три метода\n331|Выбранный метод\n332|#-я ступень вычитается\n333|Метод отчёта\n334|#-я ступень считается и как бетон, и как грунт\n335|Скорректированный\n336|объём #-й ступени вычитается из грунта\n337|Разница = T#·B²·γгрунта = # daN. Эта разница влияет и на проверку опрокидывания (сопротивление Gpt/#).\n338|Каждая карточка:\n339|цель\n340|→ схема → расчёт с числами → результат. Числа рассчитываются «вживую» по данным левой панели.\n341|Нагрузки: от декартовых к наклонной оси\n342|Программа расчёта опоры выдаёт для каждой ноги горизонтальные (X, Y) и вертикальные (Z) силы. Stub и фундамент же работают вдоль\n343|наклонной оси\n344|ноги; нагрузка приводится к этой оси и увеличивается на #% по нормам. Поперечные силы не увеличиваются.\n345|Z (вертикальная)\n346|P наклонная\n347|P = Z·√(#+#tan²α)\n348|Осевая нагрузка вырыв / сжатие\n349|исходное\n350|Срез (грунт) / (подколонник)\n351|Нагрузки на фундамент\n352|Lu = # × P вырыв\n353|Lc = # × P сжатие\n354|Грунт и удельные веса (сухой / под водой)\n355|Это вес, противодействующий вырыву. Если грунт под водой, каждое тело становится легче на вес вытесненной воды (# daN/m³) (Архимед): грунт γsat → γsat − #, бетон # → # daN/m³. Поэтому в водонасыщенных классах сопротивление падает, а фундамент растёт.\n356|уровень грунтовых вод\n357|Сухой грунт\n358|γ грунта = # daN/m³ · γ бетона = #\n359|Водонасыщенный грунт (C#)\n360|γ' = γsat − γw = # − # = # · бетон #\n361|взвешивание\n362|Несущая способность qa / по краю\n363|Удельный вес грунта (эффективный)\n364|сухой\n365|Плотность бетона (эффективная)\n366|Угол клина β\n367|tanβ = #\n368|fcd = fck/γc\n369|fyd = fy/γs\n370|Объём и вес бетона\n371|Собственный вес фундамента – малая, но надёжная часть сопротивления вырыву. Три части считаются отдельно: плита, #-я ступень, подколонник.\n372|Lu=#\n373|Gpt=#\n374|Gb=#\n375|Плита: T#·B²\n376|#-я ступень: T#·B#²\n377|Подколонник: A²·(T+To−T#−T#)\n378|Весь бетон Vb\n379|Gb = Vb × γc\n380|Грунтовый клин: по частям\n381|Когда нагрузка вырыва тянет фундамент вверх, поднимается и масса грунта над ним в форме усечённого конуса; её вес добавляется к сопротивлению. Боковые грани плоские (призматический клин), углы конические (четверть-конусы). Так как внутри клина есть бетон, объём, занятый бетоном, нужно вычесть из веса грунта.\n382|① Призма: B²·T\n383|② # боковых клина: #·B·T²·tanβ\n384|③ # угловых четверть-конуса: (π/#)·T³·tan²β\n385|Клин всего (①+②+③)\n386|− Подколонник: A²·(T−T#−T#)\n387|− #-я ступень: T#·B#²\n388|Vpt – метод отчёта\n389|#-я ступень не вычтена\n390|− #-я ступень: T#·B² (поправка)\n391|объём не-грунта\n392|Vpt – принятый\n393|Gpt = Vpt × γгрунта\n394|Грунт над плитой (для несущей способности)\n395|Vat = B²(T−T#) − A²(T−T#−T#) − T#·B#²\n396|Gat = Vat × γгрунта\n397|Скорректированный метод: все # частей бетона вычтены из клина.\n398|Проверка на вырыв\n399|Вырвется ли фундамент при подъёме вверх? Сопротивление: вес бетона + вес грунтового клина. Так как нагрузка уже с коэффициентами, требуется запас ≥ # (в отчёте дополнительного коэффициента на стороне сопротивления нет).\n400|Сопротивление R = φ·(Gb + Gpt)\n401|FS = R / Lu\n402|метод отчёта (#-я ступень учитывается)\n403|скорректированный (#-я ступень вычитается)\n404|✔ Вырыв выполнен: FS = #\n405|Несущая способность: давление грунта\n406|Выдержит ли грунт под фундаментом сжимающую нагрузку и изгиб от горизонтальной силы? Среднее давление не должно превышать qa, угловое – #·qa, и в углах не должно быть растяжения (отрицательного давления).\n407|Lc=#\n408|мин #\n409|макс # daN/cm²\n410|Моменты: M = V·(T+To+#)\n411|ΣG = Lc + Gat + Gb\n412|Эксцентриситет e = M/ΣG\n413|Среднее давление Qo = ΣG/B²\n414|Доля момента (Mx±My)·#/B³\n415|Наибольшее / наименьшее\n416|✔ Несущая способность выполнена\n417|Опрокидывание\n418|Вырыв и горизонтальная сила стремятся опрокинуть фундамент вокруг одного угла плиты (A). Сопротивление – половина грунтового клина (Gpt/#); опрокидывающая сила находится делением момента Lu·y + V·(T+To) − Gb·B/# на плечо ⅔(B+T#) (прежний справочный лист США #-D-#).\n419|A (точка поворота)\n420|Lu·y\n421|V·(T+To)\n422|Gpt/# + Gb\n423|y = B/#·cosα\n424|Сопротивление Lr = φ·Gpt/#\n425|Lox = [Lu·y + Vx(T+To) − Gb·B/#] / ⅔(B+T#)\n426|Loy (с Vy)\n427|метод отчёта: # · #\n428|✘ Опрокидывание не выполнено\n429|Арматура плиты (изгиб – Еврокод #)\n430|Плита изгибается как консоль: снизу её подпирает грунт (случай сжатия), а при вырыве сверху тянет нога. Необходимая арматура находится по изгибающему моменту: K = Mu/(b·d²·fcd), z = d/#·[#+√(#−#K)] ≤ #d, As = Mu/(fyd·z); принятая арматура должна это обеспечить.\n431|давление грунта (изгиб консоли)\n432|Mu = L²/#·[Q#(#B−L)+L·Q#]\n433|Плита снизу (случай сжатия)\n434|d = T# − защ. слой − #Φ\n435|Консоль L = ½(B−B#) · Mu\n436|Требуемая As · принятая\n437|Плита сверху (случай вырыва)\n438|d · L · Mu\n439|#-я ступень сверху (случай вырыва)\n440|Минимальная арматура\n441|ACI #%·Ag (плита / #-я ступень)\n442|EC# #·fctm/fyk·b·d: # / # cm²\n443|✔ Арматура плиты: достаточна\n444|Передавая нагрузку на плиту, подколонник стремится продавить её, как штамп. Касательное напряжение на критическом контуре в #d от подколонника не должно превышать минимальную сдвиговую прочность бетона (тип EC#).\n445|критический контур: на расстоянии #d от подколонника\n446|d = T#+T# − защ. слой − #Φ\n447|Критический контур u = #A + #π(#d)\n448|Чистое давление Pr = Lc/B²\n449|Площадь (по отчёту) Ap · Lp = Lc − Pr·Ap\n450|Ap = # cm²\n451|Напряжение Ved = Lp/(u·d)\n452|метод отчёта\n453|по полной геометрической площади\n454|VRd = #·k^#·√fck\n455|✔ Продавливание выполнено: #%\n456|Арматура подколонника и хомуты\n457|Подколонник – колонна, передающая нагрузку от stub на плиту. Осевую нагрузку воспринимает stub; подколоннику остаётся изгиб от горизонтальных поперечных сил. Изгибная несущая способность принятой продольной арматуры (анализ сечения, N = #) относится к приложенному моменту; для двух осей линейное взаимодействие (EN #-#-# #) должно быть ≤ #.\n458|M = V·плечо\n459|Плечо момента (верх плиты → верх подколонника + добавка)\n460|# cm добавка\n461|Mux = Vx·плечо · Muy = Vy·плечо\n462|Арматура As\n463|Несущая способность по моменту Mu (анализ сечения)\n464|нейтральная ось x = # cm\n465|Взаимодействие Mux/Mu + Muy/Mu\n466|Минимальная арматура #% (ACI)\n467|Хомуты Φ# / # cm\n468|не более min(A, #Φ, #) = # cm\n469|✔ Подколонник: изгиб #%\n470|В отчёте используется номограмма R′=#; здесь выполняется анализ сечения по фактическому положению стержней (более осторожно).\n471|Stub передаёт осевую нагрузку от ноги опоры бетону. Нагрузка воспринимается тремя путями: сцепление поверхности stub с бетоном, смятие бетона уголками cleat и болты cleat–stub. Несущая способность каждого пути должна превышать осевую нагрузку (отчёт: ANSI/ASCE #-#).\n472|f′c = fck/γc · fa = #·f′c\n473|Напряжение сцепления fb = #·√f′c(MPa)\n474|Сталь stub Sfb = fy/# (S#)\n475|Осевая нагрузка P = max(Pc, Pu)\n476|Pc = #, Pu = # (без ×#)\n477|Площадь профиля An\n478|Требуемая Amin = Pu/Sfb + V/(#·Sfb)\n479|lb = # mm, L# = # mm\n480|Эффективная ширина cleat Le = t# + r# + #·t#·√(Sfb/fa)\n481|Площадь смятия Aa = L#·Le·N\n482|Несущая способность на смятие Gc = Aa·fa\n483|Несущая способность болтов Sb = #·(π/#·d²)·#\n484|Нижний конец stub (от низа плиты)\n485|ось # mm × cos = # mm по вертикали\n486|от верха #-й ступени до верха бетона # mm\n487|Размещение cleat: F#/# + F# ≤ A/# − защ. слой − хомут − стержень\n488|# ≤ # cm (требуется A ≥ # m)\n489|✔ Анкеровка stub выполнена\n490|Значение Amin из отчёта (B-#: # cm²) не удалось воспроизвести по исходным данным этой формулы; здесь оно считается по Pu и V. Периметр узла cleat–stub lb принимается как исходное данное.\n491|Бетон и выемка\n492|Статья\n493|# нога\n494|Опора (×#)\n495|Единица\n496|Бетон плиты\n497|Бетон #-й ступени\n498|Бетон подколонника (включая надземную часть)\n499|Конструктивный бетон всего\n500|Выемка – метод отчёта (B²·T)\n501|Обратная засыпка (прибл.)\n502|выемка − бетон ниже земли − бетонная подготовка\n503|Бетонная подготовка и рабочий запас изменяют выемку на # % относительно метода отчёта. Опалубка и перевозка не учтены.\n504|Группа\n505|# нога (kg)\n506|Опора (kg)\n507|Сетки плиты (нижняя, верхняя, #-я ступень)\n508|Подколонник продольная + хомуты\n509|Итого\n510|Нахлёсты и отходы (обычно #–#%) не включены.\n511|Сводка резки и гибки (# нога)\n512|Диаметр\n513|Общая длина (м)\n514|Масса (kg)\n515|# m стержня (прибл.)\n516|Длина заготовки = Σ наружных размеров − Σ поправок на гибку. Внутренний диаметр гибки: Φ≤# → #Φ, Φ># → #Φ. Так как у опоры # ног, умножьте количество на #.\n517|Скачать CSV\n518|Как рассчитывается поправка на гибку?\n519|При гибке стержня сумма наружных размеров больше фактической длины стали (в углу сталь «укорачивается»). Правильная длина заготовки получается вычитанием поправки на гибку из суммы наружных размеров. Чем больше диаметр гибки, тем больше поправка; поэтому для стержней Φ># принят внутренний диаметр #Φ, а для Φ≤# – #Φ.\n520|Стержень\n521|Геометрия гибки\n522|Длина заготовки\n523|Стержень сетки A#\n524|D = #Φ = # cm · rc = D/# + Φ/# = # cm · поправка на #° = #(rc+Φ/#) − rc·π/# = # cm\n525|Σ размеров = # + # + # = # cm; гибы: #° → # cm + #° → # cm = # cm\n526|Заготовка = # − # = # cm\n527|Стержень подколонника K#\n528|Σ размеров = # + # = # cm; гибы: #° → # cm = # cm\n529|Хомут\n530|Σ размеров = # + # + # + # + # + # = # cm; гибы: #° → # cm + #° → # cm + #° → # cm + #° → # cm + #° → # cm = # cm\n531|Формула: поправка(θ) = #·(rc + Φ/#)·tan(θ/#) − rc·θ. Наружный размер измеряется от пересечения наружных граней гиба; у крюков прямой концевой участок (длина крюка) измеряется после гиба.\n532|Ведомость арматуры\n533|Поз.\n534|Метка\n535|Описание\n536|Форма (наружные размеры cm, гибы °)\n537|Кол.\n538|Участки (cm)\n539|Углы гибки\n540|Поправка на гибку\n541|Длина заготовки (cm)\n542|Всего (м)\n543|Нижняя сетка плиты – направление X (концы загнуты вв عزم للعمود\n127|تعيد إضافات الذراع الأرقام الواردة في التقرير (القاعدة # سم، العمود # cm). عدم تأشير مربع الدرجة # = طريقة التقرير.\n128|الأبعاد\n129|اسحب المنزلق أو اكتب القيمة بالمليمتر؛ تتغير الرسومات والفحوص على اليمين فوراً.\n130|عرض القاعدة B\n131|العمق T (تحت القاعدة)\n132|قدرة التحمل qa\n133|اختيار التسليح تلقائياً عند تغيير البعد\n134|اطرح الدرجة # من حجم الإسفين (مصحّح)\n135|الأحمال، التربة، التسليح، الـ stub:\n136|البحث عن أقل خرسانة / تسليح:\n137|خرسانة / ساق\n138|حفر / ساق\n139|حديد / ساق (# kg/m³)\n140|الانقلاب X\n141|المعيار الحاكم (%#)\n142|# فحوصات ✘\n143|الأبعاد المطلوبة لهذا التصميم\n144|أصغر قيمة تحقق كل المعايير مع بقاء باقي الأبعاد على قيمها الحالية. غيّر العمق (T) فيتحدّث هنا عرض القاعدة المطلوب. المنحنى الكامل:\n145|أصغر عرض مطلوب للقاعدة B (T ثابت)\n146|حالياً # mm ✘ غير كافٍ\n147|أصغر عمق مطلوب T (B ثابت)\n148|مقطع (عمود مائل)\n149|سطح الأرض\n150|خرسانة نظافة # cm\n151|كتلة ضبط\n152|stub L#×#×#\n153|في الخرسانة # mm (تثبيت L# = #)\n154|cleat ×# (L#×#، # mm)\n155|To=#\n156|شبكة القاعدة السفلية #Φ#/اتجاه\n157|شبكة القاعدة العلوية #Φ#/اتجاه\n158|علوي الدرجة # #Φ#/اتجاه\n159|العمود #Φ#\n160|كانات Φ#/#\n161|Stub L#×# · # cleat\n162|عمود مائل: tanα = #\n163|الغطاء: القاعدة # سم، العمود # cm\n164|Stub – cleat: مقطع أفقي (مقطع أفقي في العمود)\n165|المقطع: مستوى أفقي يمر بمركز العمود، منظر من الأعلى. يوضع مقطع الـ stub على شكل L بحيث يقع مركز ثقل مقطعه (تقاطع محوري القصور) في مركز العمود وكعبه نحو الزاوية الخارجية؛ وتُثبَّت الـ cleat بالتناوب على الجناحين. الخط الأخضر المتقطع هو حد قفص التسليح الداخلي؛ وإذا خرج طرف cleat عنه يتحول إلى الأحمر.\n166|حد قفص التسليح الداخلي\n167|+ مركز العمود = مركز ثقل مقطع الـ stub\n168|– · – محورا القصور الرئيسيان (قطري)\n169|كعب الـ stub (الزاوية الخارجية)\n170|أبعد طرف cleat # cm\n171|نصف عرض القفص # cm\n172|مقطع الـ stub\n173|Cleat\n174|L#×# · # mm · # قطع\n175|وجه تثبيت الـ cleat\n176|الوجه الخارجي\n177|الغطاء + الكانة + القضيب\n178|نصف عرض القفص\n179|طرف الـ cleat (من المركز)\n180|الهامش\n181|نسبة الاستغلال\n182 Φ\n107|Bügelabstand\n108|Haken- und Biegeeinstellungen\n109|Mattenendhaken\n110|#°-Haken (U-Form)\n111|Gerader Stab ohne Haken\n112|Hakenlänge (×Φ)\n113|Gerade Länge des Schaftstab-Fußes (×Φ)\n114|Biegerolle innen Φ≤# (×Φ)\n115|Biegerolle innen Φ># (×Φ)\n116|EC# Tabelle #N: Φ≤# → #Φ, Φ># → #Φ. Schnittlänge = Σ Außenmaße − Biegezuschlag; Biegezuschlag = #(rc+Φ/#)·tan(θ/#) − rc·θ, rc = D/# + Φ/#.\n117|Planangaben\n118|Projekt\n119|Gezeichnet\n120|Geprüft\n121|Revision\n122|Berechnungsannahmen\n123|Widerstandsbeiwert φ (Abheben, Kippen)\n124|Volumen der #. Stufe vom Keilvolumen abziehen (korrigierte Methode)\n125|Zuschlag Hebelarm Platte\n126|Zuschlag Hebelarm Schaft\n127|Die Hebelarmzuschläge reproduzieren die Zahlen des Berichts (Platte # cm, Schaft # cm). Ohne Häkchen bei Stufe # = Methode des Berichts.\n128|Abmessungen\n129|Schieberegler ziehen oder Wert in mm eintippen; die Zeichnungen und Nachweise rechts ändern sich sofort.\n130|Fundamentbreite B\n131|Tiefe T (unter Platte)\n132|Tragfähigkeit qa\n133|Bewehrung bei Maßänderung automatisch wählen\n134|#. Stufe vom Keilvolumen abziehen (korrigiert)\n135|Lasten, Boden, Bewehrung, Stub:\n136|Suche nach minimalem Beton / minimaler Bewehrung:\n137|Beton / Fundament\n138|Aushub / Fundament\n139|Stahl / Fundament (# kg/m³)\n140|Kippen X\n141|maßgebendes Kriterium (%#)\n142|# Nachweise ✘\n143|Erforderliche Abmessungen für diesen Entwurf\n144|Kleinster Wert, der alle Kriterien erfüllt, während alle anderen Abmessungen bei ihren aktuellen Werten bleiben. Ändern Sie die Tiefe (T), dann wird hier die erforderliche Fundamentbreite aktualisiert. Vollständige Kurve:\n145|Erforderliche Mindest-Fundamentbreite B (T fest)\n146|aktuell # mm ✘ nicht ausreichend\n147|Erforderliche Mindesttiefe T (B fest)\n148|Schnitt (geneigter Schaft)\n149|Geländeoberfläche\n150|Sauberkeitsschicht # cm\n151|Justierblock\n152|Stub L#×#×#\n153|im Beton # mm (Verankerung L# = #)\n154|Cleat ×# (L#×#, # mm)\n155|To=#\n156|Untere Plattenbewehrung #Φ#/Richtung\n157|Obere Plattenbewehrung #Φ#/Richtung\n158|Obere Bewehrung #. Stufe #Φ#/Richtung\n159|Schaft #Φ#\n160|Bügel Φ#/#\n161|Stub L#×# · # Cleats\n162|Geneigter Schaft: tanα = #\n163|Deckung: Platte # cm, Schaft # cm\n164|Stub–Cleat-Grundrissschnitt (Horizontalschnitt durch den Schaft)\n165|Schnitt: Horizontalebene durch die Schaftmitte, Ansicht von oben. Das Stub-L-Profil sitzt mit seinem Flächenschwerpunkt (Schnittpunkt der Trägheitsachsen) in der Schaftmitte, die Ferse zeigt zur Außenecke; die Cleats sind abwechselnd an die beiden Schenkel geschraubt. Die grüne gestrichelte Linie ist die Grenze des inneren Bewehrungskorbs; liegt eine Cleat-Spitze außerhalb, wird sie rot.\n166|Grenze des inneren Bewehrungskorbs\n167|+ Schaftmitte = Flächenschwerpunkt des Stubs\n168|– · – Hauptträgheitsachsen (diagonal)\n169|Stub-Ferse (Außenecke)\n170|äußerste Cleat-Spitze # cm\n171|halbe Korbbreite # cm\n172|Stub-Profil\n173|Cleat\n174|L#×# · # mm · # Stk.\n175|Anschlussseite der Cleats\n176|Außenseite\n177|Deckung + Bügel + Stab\n178|Halbe Korbbreite\n179|Cleat-Spitze (von der Mitte)\n180|Rest\n181|Ausnutzung\n182|✔ Cleats liegen innerhalb des Korbs\n183|Der Flächenschwerpunkt des Stub-L-Profils (e innen vom Rücken der Ferse) liegt in der Schaft-\n184|mitte; die Ferse zeigt zur Außenecke (+x, −y). Cleat: senkrechter Schenkel am Schenkel verschraubt,\n185|waagerechter Schenkel (F#) ragt in den Beton, Breite L# entlang des Schenkels.\n186|Die Cleats sind abwechselnd auf die beiden Schenkel verteilt; die Zeichnung zeigt die Projektion aller Cleats.\n187|#D – Fundament und Bodenkeil\n188|Mit der Maus ziehen: dreht · Mausrad: zoomt · Doppelklick: zurücksetzen.\n189|R = T·tanβ = # m\n190|Az #° · El #°\n191|# Seitenkeile: # m³ (ebene Fläche)\n192|# Eckviertelkegel: # m³\n193|Betonfundament (Referenz)\n194|Bodenkeil: innerer Prismenkörper (B²·T = # m³) + Seitenkeile + Eckkegel\n195|Isometrisch\n196|Grundriss (oben)\n197|Vorderansicht\n198|Seitenansicht\n199|Unten\n200|Grundriss\n201|Schaftkopf (geneigt)\n202|Untere Lage: #Φ# (s≈# cm)\n203|Obere Lage: #Φ# (s≈# cm) – gestrichelt\n204|#. Stufe: #Φ# (s≈# cm)\n205|Schaftbewehrung und Fußrichtung (Pfeil)\n206|Nachweise\n207|Abheben\n208|Sohlpressung – Mittel\n209|Sohlpressung – Ecke\n210|Sohlpressung – keine Zugspannung\n915|Vorschlag übernehmen\n916|Erforderlich (Vorschlag): Anzahl Cleats ≥ # · Schrauben ≥ # · Einbindelänge ≥ # mm\n917|Eingaben geändert: Diese Kurve wurde mit alten Werten berechnet. „Kurve zeichnen“ drücken, um sie zu aktualisieren.\n918|Warnung: Die Maße der zweiten Stufe (B1 oder T2) sind null oder sehr klein. Dieses Werkzeug kann keinen Entwurf ohne zweite Stufe berechnen; deshalb sind Plattenbiegung, Durchstanzen und Bewehrungsnachweise nicht erfüllt. B1 und T2 erhöhen.\n919|Manuell geändert\n920|Gesperrt – ändert sich nicht\n921|Automatisch – kleinster Wert für die anderen Maße\n922|Maßschritt\n923|Beim Ändern eines Maßes werden die „automatischen“ Maße auf den kleinsten Wert gesetzt (auf den Schritt gerundet)\n924|⚙ Automatisch:\n925|(Schritt # mm)\n926|nicht erfüllbar – Maß unverändert\n927|aktuell # mm ✔ passt\n928|aktuell # mm ⚠ Überdimensionierung – # mm genügen\n929|(berechnetes Minimum # mm)\n930|Symbol in jeder Zeile: ✎ manuell · 🔒 gesperrt · ⚙ automatisch. Symbol anklicken. Wenn Sie ein anderes Maß ändern, werden automatische Maße auf den kleinsten Wert gesetzt, der den Entwurf erfüllt (auf den Maßschritt aufgerundet); gesperrte Maße ändern sich nie. „Überdimensionierung“: mindestens einen Schritt mehr als nötig.\n931|zulässiger Bereich: alle Nachweise erfüllt\n932|unzureichend: einige Nachweise nicht erfüllt\n933|Gesamte Bewehrung\n934|Bewehrung wählen (Pos.)\n935|Stab (Bezeichnung)\n936|(alle)\n937|Gewählte Bewehrung: Schnitt- und Biegeinformation\n938|Mastbibliothek\n939|Eigene Masttypen (Lasten, Beinneigung, Stub/Cleat und vorgegebene Fundamentmaße) hinzufügen, bearbeiten und auswählen. Sie erscheinen neben den Optionen im Mastfeld. Die Bibliothek wird in diesem Browser gespeichert; zum Übertragen herunterladen und importieren.\n940|Mast hinzufügen / bearbeiten\n941|Mastname\n942|Mastname ist erforderlich.\n943|Vorgegebene Masttypen können nicht geändert werden; mit „Kopieren“ eine eigene Kopie erstellen.\n944|In Verwendung: Lasten, Stub und Fundamentmaße dieses Masttyps wurden in den Reiter Eingaben übernommen.\n945|Aus dem Mast in den Eingaben füllen\n946|Vorgegebene Fundamentmaße (für alle Bodenklassen)\n947|In den Eingaben fehlt eine Zahl oder sie ist ungültig.\n948|Stub\n949|Lasten (Zug / Druck)\n950|Beinabstand X (Mitte–Mitte)\n951|Beinabstand Y (Mitte–Mitte)\n952|Für die Keilüberschneidungsprüfung; ohne Eingabe wird nicht geprüft\n953|Weitere Mastschüsse (Body Extension):\n954|Beinabstand und Zuglast für jeden. Das Fundament ist für alle Schüsse gleich, daher wird für jeden Schuss einzeln geprüft; bei niedrigem Schuss ist der Beinabstand eng, aber die Lasten sind auch viel kleiner. Last und Abstand oben gelten für den höchsten Schuss.\n955|Schuss\n956|Abstand X (m)\n957|Abstand Y (m)\n958|Zuglast Z (kN)\n959|Zuglast Z (daN)\n960|Schuss hinzufügen\n961|Keilüberschneidung (Nachbarbeine)\n962|Keilüberschneidung (Gruppe)\n963|Überschneiden sich die Erdkeile benachbarter Beine, darf derselbe Boden nicht für beide Beine angesetzt werden. An der vom Wind getroffenen Seite werden zwei Beine zugleich gezogen; das gemeinsame Volumen wird halbiert und vom Keilgewicht jedes Beins abgezogen.\n964|Überschneidungsschwelle: Beinabstand < B + 2·T·tanβ\n965|Je Schuss: Abstand X × Y, Lastverhältnis, überschneidendes Volumen, FS (Gruppe) = φ·(Gb + Gpt − ΔG) / Lu\n966|Hauptschuss (höchster)\n967|# × # m · Last ×# · Überschneidung # m³\n968|Pro Bein abgezogenes Gewicht am kritischen Schuss ΔG = ½·Vüb·γ\n969|Der Beinabstand liegt sehr nahe an der Fundamentbreite: die Fundamente stoßen zusammen.\n970|Abhebesicherheit nach Überschneidung erfüllt: FS = #\n971|Abhebesicherheit nach Überschneidung nicht erfüllt: FS = #\n972|Für die Keilüberschneidungsprüfung den Beinabstand (X, Y) im Reiter Eingaben angeben. Eine Überschneidung beginnt, wenn der Abstand kleiner als # m ist.\n973|FS = # ≥ # · überschneidendes Volumen # m³\n974|überschneidendes Volumen X # · Y # m³\n211|Qmin = # ≥ #\n212|Kippen Y\n213|Durchstanzen\n214|Untere Plattenbewehrung\n215|erforderlich # ≤ # cm²\n216|Obere Plattenbewehrung\n217|Bewehrung #. Stufe\n218|Schaftbiegung\n219|Mx/Mu + My/Mu = # ≤ #\n220|Schaft Mindestbewehrung #%\n221|Platte Mindestbewehrung #%\n222|Stub-Verankerung\n223|maßgebend: Schrauben #%\n224|Stub passt in den Beton\n225|Einbindung # ≤ vorhanden # mm\n226|Cleat passt in den Bewehrungskorb\n227|Cleat-Spitze # ≤ Korb # cm (A ≥ # m)\n228|Bodenkeil – Teil für Teil\n229|Prisma B²·T\n230|# Seitenkeile\n231|R = T·tanβ = # mm\n232|# Eckviertelkegel\n233|− Schaft, − #. Stufe\n234|− #. Stufe (Korrektur)\n235|Keil Vpt\n236|Gpt + Gb\n237|Zuglast Lu\n238|Abheben FS\n239|Stub- und Cleat-Verankerung\n240|L#×#×#, im Beton # mm\n241|Axiallast P\n242|Pc = #, Pu = # daN\n243|Profilfläche An ≥ Amin\n244|Verbund Bc = lb·L#·fb\n245|Cleat-Pressung Gc (# Stk.)\n246|Schrauben Sb (# × M#)\n247|Passen in den Beton\n248|Cleat passt in den inneren Bewehrungskorb\n249|Cleat-Spitze # ≤ Korb # cm · erforderlich A ≥ # m\n250|Die Zeichnung zeigt Stub und Cleats mit den Maßen des Berichts. Die Cleat-Positionen sind symbolisch (Abstand unter Eingaben → Abschnitt Stub). Details: Reiter Berechnungsschritte, Schritt #.\n251|Wie funktioniert die Optimierung? (kein Startpunkt, es wird abgetastet)\n252|Bewertung eines Entwurfs:\n253|für die gegebenen Maße (B, B#, T, T#, T#, A…) werden Lasten, Bodenkeilgewicht, Abheben, Sohlpressung, Kippen, Durchstanzen, Plattenbiegung, Schaft- und Stub-Nachweise berechnet; Platten- und Schaftbewehrung werden dafür automatisch gewählt. Sind alle Nachweise ≤ #%, ist der Entwurf\n254|zulässig\n255|.\n256|„Lösen“ (minimaler Beton / Bewehrung / Aushub):\n257|jede Kombination\n258|der als „frei“ markierten Parameter (Standard B und T) im Bereich wird\n259|nacheinander probiert (B in # mm, T in # mm Schritten ≈ # Entwürfe, einige Sekunden). Unter den zulässigen wird der mit dem wenigsten Beton, der geringsten Bewehrung, dem kleinsten Aushub und den niedrigsten Kosten gewählt. Es wird nicht von einem Startentwurf aus verbessert; das Ergebnis hängt nicht vom Startwert ab.\n260|Kurve der erforderlichen Abmessung:\n261|für jeden T-Wert wird B in # mm Schritten von klein nach groß erhöht; der erste Wert, der alle Nachweise erfüllt, wird gefunden und auf # mm eingegrenzt. Mit derselben Logik erhält man „erforderliches T bei festem B“.\n262|Fest bleibende Größen:\n263|nicht als frei markierte Parameter (T#, T#, B#, A, To, β, qa) behalten ihren Wert aus dem Reiter Entwurf; das Optimum hängt von ihnen ab. Für ein besseres Ergebnis das Kästchen „frei“ markieren (die Suche wird größer, die Schrittweite gröber).\n264|Warum dieses Optimum?\n265|Mit zunehmender Tiefe wächst der Bodenkeil und das für das Abheben erforderliche B sinkt; wird T aber zu groß, begrenzt das Gewicht von Boden/Beton über der Platte die Sohlpressung und B steigt wieder. Der minimale Betonverbrauch liegt nahe dem Schnittpunkt, an dem sich Abheben und Sohlpressung gegenseitig begrenzen.\n266|Kurve der erforderlichen Abmessung – „Welche Fundamentbreite ist bei dieser Tiefe nötig?“\n267|Zweck:\n268|Beim Ändern eines Parameters (z. B. Tiefe T)\n269|um alle Entwurfskriterien zu erfüllen,\n270|zu sehen, welchen Mindestwert der andere Parameter (z. B. Fundamentbreite B) haben muss. Die blaue Linie ist das kleinste B je T; oberhalb der Linie liegt der zulässige Bereich. Die orange Linie ist das Betonvolumen dieses Entwurfs, der markierte Punkt ist die Kombination mit dem\n271|geringsten Beton\n272|(Optimum). Die anderen Abmessungen bleiben bei ihren Werten im Reiter Entwurf; an jedem Punkt werden Platten- und Schaftbewehrung automatisch gewählt.\n273|Parameter, den Sie ändern (X)\n274|Erforderlich (Y)\n275|X Minimum (mm)\n276|X Maximum (mm)\n277|Kurve zeichnen\n278|„Kurve zeichnen“ drücken (dauert einige Sekunden).\n279|Einen Parameter ändern, die anderen festhalten\n280|Sehen, bei welchen Werten des gewählten Parameters alle Entwurfskriterien erfüllt sind. Die Linien zeigen die Ausnutzung (Last/Tragfähigkeit) jedes Kriteriums; unter der #%-Linie ist sicher, das grüne Band ist der zulässige Bereich. Alle anderen Abmessungen bleiben bei ihren Werten im Reiter\n281|.\n282|Minimum\n283|Maximum\n284|Tiefe T (unter Platte) (mm)\n285|aktuell\n286|Sohlpressung Mittel\n287|Sohlpressung Ecke\n288|Plattenbiegung (K/K′)\n289|grünes Band: alle Nachweise erfüllt\n290|Zulässiger Bereich:\n291|· untere Grenze begrenzt durch:\n292|Kleinster zulässiger Wert dieses Parameters:\n293|diesen Wert übernehmen\n294|Entwurf mit minimalem Beton / minimaler Bewehrung / minimalem Aushub\n295|Alle Kombinationen der als „frei“ markierten Parameter in ihren Bereichen abtasten; unter denen, die alle Kriterien erfüllen, den Entwurf mit dem wenigsten Beton, der geringsten Bewehrung und dem kleinsten Aushub finden. Platten- und Schaftbewehrung werden für jede Kombination automatisch gewählt. Nicht markierte Parameter behalten ihren aktuellen Wert.\n296|Frei\n297|Parameter\n298|aktuell\n299|Schritt\n300|Fundamentbreite B (mm)\n301|Breite der #. Stufe B# (mm)\n302|Dicke der Fundamentplatte T# (mm)\n303|Dicke der #. Stufe T# (mm)\n304|Schaftbreite A (mm)\n305|Schafthöhe über Gelände To (mm)\n306|Keilwinkel (Frustum) β (°)\n307|Tragfähigkeit qa (daN/cm²)\n308|Sortierkriterium\n309|geringster Beton\n310|geringste Bewehrung\n311|geringster Aushub\n312|geringste Kosten\n313|Beton (/m³)\n314|Stahl (/kg)\n315|Aushub (/m³)\n316|Sauberkeitsschicht (/m³)\n317|Lösen\n318|Einheitspreise sind Platzhalter (nur für „geringste Kosten“); geben Sie Ihre eigenen Preise ein.\n319|Nachweisübersicht\n320|Ergebnis\n321|(maßgebend)\n322|Ausnutzung = Last/Tragfähigkeit. Das maßgebende Kriterium ist der Nachweis mit der höchsten Ausnutzung; er vergrößert oder verkleinert das Fundament. Für Durchstanzen wird die (konservative) Fläche des Berichts verwendet; mit der vollen geometrischen Fläche # daN/cm².\n323|Mengen (pro Mast, # Fundamente)\n324|Beton (Konstruktion)\n325|Sauberkeitsschicht\n326|Aushub\n327|Bewehrung\n328|# kg/Fundament\n329|Bewehrungsgrad\n330|Abhebesicherheit: drei Methoden\n331|Gewählte Methode\n332|Stufe # wird abgezogen\n333|Methode des Berichts\n334|Stufe # zählt als Beton und als Boden\n335|Korrigiert\n336|Volumen der Stufe # wird vom Boden abgezogen\n337|Differenz = T#·B²·γBoden = # daN. Diese Differenz beeinflusst auch den Kippnachweis (Widerstand Gpt/#).\n338|Jede Karte:\n339|Zweck\n340|→ Skizze → Rechnung mit Zahlen → Ergebnis. Die Zahlen werden live aus den Eingaben im linken Bereich berechnet.\n341|Lasten: von kartesisch zur geneigten Achse\n342|Das Mastprogramm liefert für jedes Bein horizontale (X, Y) und vertikale (Z) Kräfte. Stub und Fundament wirken jedoch entlang der\n343|geneigten Achse\n344|des Beins; die Last wird auf diese Achse umgerechnet und gemäß Vorschrift um #% erhöht. Querkräfte werden nicht erhöht.\n345|Z (vertikal)\n346|P geneigt\n347|P = Z·√(#+#tan²α)\n348|Achslast Zug / Druck\n349|Eingabe\n350|Querkraft (Boden) / (Schaft)\n351|Fundamentlasten\n352|Lu = # × P Zug\n353|Lc = # × P Druck\n354|Boden und Wichten (trocken / unter Wasser)\n355|Es ist das Gewicht, das dem Abheben entgegenwirkt. Liegt der Boden unter Wasser, wird jeder Körper um das Gewicht des verdrängten Wassers (# daN/m³) leichter (Archimedes): Boden γsat → γsat − #, Beton # → # daN/m³. Deshalb sinkt der Widerstand in gesättigten Klassen und das Fundament wird größer.\n356|Grundwasserspiegel\n357|Trockener Boden\n358|γ Boden = # daN/m³ · γ Beton = #\n359|Gesättigter Boden (C#)\n360|γ' = γsat − γw = # − # = # · Beton #\n361|Auftrieb\n362|Tragfähigkeit qa / am Rand\n363|Wichte des Bodens (wirksam)\n364|trocken\n365|Rohdichte Beton (wirksam)\n366|Keilwinkel β\n367|tanβ = #\n368|fcd = fck/γc\n369|fyd = fy/γs\n370|Volumen und Gewicht des Betons\n371|Das Eigengewicht des Fundaments ist ein kleiner, aber sicherer Teil des Widerstands gegen Abheben. Drei Teile werden getrennt berechnet: Fundamentplatte, #. Stufe, Schaft.\n372|Lu=#\n373|Gpt=#\n374|Gb=#\n375|Fundamentplatte: T#·B²\n376|#. Stufe: T#·B#²\n377|Schaft: A²·(T+To−T#−T#)\n378|Gesamtbeton Vb\n379|Gb = Vb × γc\n380|Bodenkeil: Teil für Teil\n381|Wenn die Zuglast das Fundament nach oben zieht, wird auch die darüberliegende kegelstumpfförmige Bodenmasse angehoben; ihr Gewicht geht in den Widerstand ein. Die Seitenflächen sind eben (prismatischer Keil), die Ecken kegelförmig (Viertelkegel). Da im Keil auch Beton liegt, muss das vom Beton eingenommene Volumen vom Bodengewicht abgezogen werden.\n382|① Prisma: B²·T\n383|② # Seitenkeile: #·B·T²·tanβ\n384|③ # Eckviertelkegel: (π/#)·T³·tan²β\n385|Keil gesamt (①+②+③)\n386|− Schaft: A²·(T−T#−T#)\n387|− #. Stufe: T#·B#²\n388|Vpt – Methode des Berichts\n389|#. Stufe nicht abgezogen\n390|− #. Stufe: T#·B² (Korrektur)\n391|Nicht-Boden-Volumen\n392|Vpt – verwendet\n393|Gpt = Vpt × γBoden\n394|Boden über der Platte (für Sohlpressung)\n395|Vat = B²(T−T#) − A²(T−T#−T#) − T#·B#²\n396|Gat = Vat × γBoden\n397|Korrigierte Methode: alle # Betonteile wurden vom Keil abgezogen.\n398|Abhebenachweis (Herausziehen)\n399|Hebt sich das Fundament beim Hochziehen aus dem Boden? Widerstand: Gewicht des Betons + Gewicht des Bodenkeils. Da die Last bereits mit Faktoren beaufschlagt ist, wird ein Sicherheitsbeiwert ≥ # verlangt (im Bericht gibt es auf der Widerstandsseite keinen weiteren Faktor).\n400|Widerstand R = φ·(Gb + Gpt)\n401|FS = R / Lu\n402|Methode des Berichts (Stufe # zählt)\n403|korrigiert (Stufe # abgezogen)\n404|✔ Abheben erfüllt: FS = #\n405|Sohlpressung: Bodendruck\n406|Kann der Boden unter dem Fundament die Drucklast und die durch die Horizontalkraft entstehende Biegung aufnehmen? Die mittlere Pressung darf qa nicht überschreiten, die Eckpressung nicht #·qa, und an den Ecken darf keine Zugspannung (nega  = Lp/(u·d)\n452|Methode des Berichts\n453|mit voller geometrischer Fläche\n454|VRd = #·k^#·√fck\n455|✔ Durchstanzen erfüllt: #%\n456|Schaftbewehrung und Bügel\n457|Der Schaft ist die Stütze, die die Stub-Last in die Platte leitet. Die Axiallast trägt der Stub; dem Schaft bleibt die Biegung aus den horizontalen Querkräften. Die Biegetragfähigkeit der gewählten Längsbewehrung (Querschnittsanalyse, N = #) wird auf das einwirkende Moment bezogen; für die beiden Achsen muss die lineare Interaktion (EN #-#-# #) ≤ # sein.\n458|M = V·Hebelarm\n459|Hebelarm (Plattenoberkante → Schaftkopf + Zuschlag)\n460|# cm Zuschlag\n461|Mux = Vx·Hebelarm · Muy = Vy·Hebelarm\n462|Bewehrung As\n463|Momententragfähigkeit Mu (Querschnittsanalyse)\n464|Nulllinie x = # cm\n465|Interaktion Mux/Mu + Muy/Mu\n466|Mindestbewehrung #% (ACI)\n467|Bügel Φ# / # cm\n468|höchstens min(A, #Φ, #) = # cm\n469|✔ Schaft: Biegung #%\n470|Der Bericht verwendet das R′=#-Diagramm; hier wird eine Querschnittsanalyse mit den tatsächlichen Stablagen durchgeführt (konservativer).\n471|Der Stub leitet die Axiallast vom Mastbein in den Beton. Die Last wird auf drei Wegen getragen: Verbund zwischen Stub-Oberfläche und Beton, Pressung der Cleat-Winkel auf den Beton und die Cleat–Stub-Schrauben. Die Tragfähigkeit jedes Weges muss größer als die Axiallast sein (Bericht: ANSI/ASCE #-#).\n472|f′c = fck/γc · fa = #·f′c\n473|Verbundspannung fb = #·√f′c(MPa)\n474|Stub-Stahl Sfb = fy/# (S#)\n475|Axiallast P = max(Pc, Pu)\n476|Pc = #, Pu = # (ohne ×#)\n477|Profilfläche An\n478|Erforderliches Amin = Pu/Sfb + V/(#·Sfb)\n479|lb = # mm, L# = # mm\n480|Wirksame Cleat-Breite Le = t# + r# + #·t#·√(Sfb/fa)\n481|Pressungsfläche Aa = L#·Le·N\n482|Pressungstragfähigkeit Gc = Aa·fa\n483|Schraubentragfähigkeit Sb = #·(π/#·d²)·#\n484|Stub-Unterkante (von der Sohle)\n485|Achse # mm × cos = # mm vertikal\n486|von Oberkante Stufe # bis Betonoberkante # mm\n487|Cleat-Passung: F#/# + F# ≤ A/# − Deckung − Bügel − Stab\n488|# ≤ # cm (erforderlich A ≥ # m)\n489|✔ Stub-Verankerung erfüllt\n490|Der Amin-Wert des Berichts (B-#: # cm²) ließ sich aus den Eingaben dieser Formel nicht reproduzieren; hier wird er mit Pu und V berechnet. Der Cleat–Stub-Detailumfang lb wird als Eingabe übernommen.\n491|Beton und Aushub\n492|Position\n493|# Fundament\n494|Mast (×#)\n495|Einheit\n496|Beton Fundamentplatte\n497|Beton #. Stufe\n498|Beton Schaft (einschließlich über Gelände)\n499|Konstruktionsbeton gesamt\n500|Aushub – Methode des Berichts (B²·T)\n501|Hinterfüllung (ca.)\n502|Aushub − Beton unter Gelände − Sauberkeitsschicht\n503|Sauberkeitsschicht und Arbeitsraum verändern den Aushub gegenüber der Methode des Berichts um # %. Schalung und Transport sind nicht berücksichtigt.\n504|Gruppe\n505|# Fundament (kg)\n506|Mast (kg)\n507|Plattenbewehrung (unten, oben, #. Stufe)\n508|Schaft längs + Bügel\n509|Gesamt\n510|Stoßübergreifung und Verschnitt (meist #–#%) sind nicht enthalten.\n511|Schnitt- und Biegeübersicht (# Fundament)\n512|Durchmesser\n513|Gesamtlänge (m)\n514|Gewicht (kg)\n515|# m Stab (ca.)\n516|Schnittlänge = Σ Außenmaße − Σ Biegezuschläge. Biegerolle innen: Φ≤# → #Φ, Φ># → #Φ. Da ein Mast # Fundamente hat, die Stückzahlen mit # multiplizieren.\n517|CSV herunterladen\n518|Wie wird der Biegezuschlag berechnet?\n519|Wird ein Stab gebogen, ist die Summe der Außenmaße größer als die tatsächliche Stahllänge (der Stahl „verkürzt“ sich an der Ecke). Die richtige Schnittlänge erhält man, indem man den Biegezuschlag von der Summe der Außenmaße abzieht. Je größer der Biegedurchmesser, desto größer der Zuschlag; deshalb wird bei Φ># Stäben #Φ und bei Φ≤# Stäben #Φ als Innendurchmesser verwendet.\n520|Stab\n521|Biegegeometrie\n522|Schnittlänge\n523|Mattenstab A#\n524|D = #Φ = # cm · rc = D/# + Φ/# = # cm · #°-Zuschlag = #(rc+Φ/#) − rc·π/# = # cm\n525|Σ Maße = # + # + # = # cm; Biegungen: #° → # cm + #° → # cm = # cm\n526|Schnitt = # − # = # cm\n527|Schaftstab K#\n528|Σ Maße = # + # = # cm; Biegungen: #° → # cm = # cm\n529|Bügel\n5 tand # m · # Stk./m²\n1275|Je Durchmesser werden die Stücke, beginnend mit dem längsten, in die Stäbe eingepasst (bestmögliche Belegung); Böcke werden aus Resten mit ausreichendem Durchmesser (≥ Bockdurchmesser) und ausreichender Länge geschnitten. Werden mehrere Masten zusammen geschnitten, sinkt der Verschnitt weiter.\n1276|Schnitt # mm · S#\n1277|Kennung: S#\n1278|Bewehrung – Böcke\n1279|Unterstützungsbock: Π-förmig gebogener Stab, der die obere Lage in richtiger Höhe über der unteren hält. Beim Betonieren verhindert er das Absinken der oberen Lage unter Arbeitern und Frischbeton, sodass Betondeckung und Nutzhöhe (d) erhalten bleiben. Er wird statisch nicht angesetzt, nur in den Mengen. Für die obere Lage der Fußplatte und die obere Lage der Stufe # werden getrennte Böcke verwendet.\n1280|Abstand der Böcke in beiden Richtungen. Üblich sind # m (≈ # Stk./m²); bei dünner oberer Bewehrung (Φ#–#) und starkem Begehen #–# m. BS #-# verknüpft den Abstand mit dem Durchmesser des getragenen Stabes; dünnere Stäbe brauchen engere Böcke.\n1281|Bockdurchmesser. Automatisch: nicht kleiner als die getragene obere Bewehrung, mindestens Φ#; Φ# ab # m Bockhöhe und Φ# ab # m (damit lange Beine nicht knicken). Über # m Höhe ausgesteifte Böcke vorsehen.\n1282|Wenn aktiviert, werden die Böcke zuerst aus Reststücken des Zuschnitts der # m Stäbe mit ausreichendem Durchmesser und ausreichender Länge gefertigt; neue Stäbe werden nur für die fehlenden Böcke geschnitten. So sind die Böcke oft ohne zusätzlichen Stahleinkauf gedeckt und der Verschnitt sinkt.\n1283|Handelslänge, in der die Bewehrung gekauft wird (in der Türkei meist # m). Der Schneideplan verteilt die Stücke je Durchmesser mit möglichst wenig Verschnitt auf diese Länge; längere Stücke werden in ganze Stäbe plus Rest geteilt (Übergreifungslänge ist in der Stücklänge enthalten).");
