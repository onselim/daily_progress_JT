du béton de propreté n'est pas ajouté à la résistance (prudent).\n99|Choix des armatures\n100|Nappe inférieure de la semelle Φ\n101|barres / direction\n102|Nappe supérieure de la semelle Φ\n103|Nappe supérieure #e semelle Φ\n104|Armatures longitudinales du fût Φ\n105|nombre (multiple de #)\n106|Cadres Φ\n107|Espacement des cadres\n108|Réglages de crochets et de cintrage\n109|Crochet d'extrémité de nappe\n110|Crochet à #° (forme en U)\n111|Barre droite sans crochet\n112|Longueur du crochet (×Φ)\n113|Longueur droite du pied de barre du fût (×Φ)\n114|Diamètre intérieur de cintrage Φ≤# (×Φ)\n115|Diamètre intérieur de cintrage Φ># (×Φ)\n116|EC# Tableau #N : Φ≤# → #Φ, Φ># → #Φ. Longueur de coupe = Σ cotes extérieures − allongement de cintrage ; allongement = #(rc+Φ/#)·tan(θ/#) − rc·θ, rc = D/# + Φ/#.\n117|Informations du plan\n118|Projet\n119|Dessiné par\n120|Vérifié par\n121|Révision\n122|Hypothèses de calcul\n123|Coefficient de résistance φ (arrachement, renversement)\n124|Déduire le volume de la #e semelle du volume du coin (méthode corrigée)\n125|Majoration du bras de levier de la semelle\n126|Majoration du bras de levier du fût\n127|Les majorations de bras reproduisent les chiffres du rapport (semelle # cm, fût # cm). Case #e semelle décochée = méthode du rapport.\n128|Dimensions\n129|Faites glisser le curseur ou saisissez la valeur en mm ; les dessins et vérifications à droite changent immédiatement.\n130|Largeur de la semelle B\n131|Profondeur T (sous la semelle)\n132|Capacité portante qa\n133|Choisir automatiquement les armatures quand une dimension change\n134|Déduire la #e semelle du volume du coin (corrigé)\n135|Charges, sol, armatures, stub :\n136|Recherche du minimum de béton / d'armatures :\n137|béton / jambe\n138|fouille / jambe\n139|acier / jambe (# kg/m³)\n140|Renversement X\n141|critère déterminant (%#)\n142|# vérifications ✘\n143|Dimensions nécessaires pour cette conception\n144|Plus petite valeur satisfaisant tous les critères, toutes les autres dimensions restant à leur valeur actuelle. Changez la profondeur (T) et la largeur de semelle nécessaire est mise à jour ici. Courbe complète :\n145|Largeur minimale de semelle B nécessaire (T fixe)\n146|actuellement # mm ✘ insuffisant\n147|Profondeur minimale T nécessaire (B fixe)\n148|Coupe (fût incliné)\n149|surface du sol\n150|béton de propreté # cm\n151|cale de réglage\n152|stub L#×#×#\n153|dans le béton # mm (ancrage L# = #)\n154|cleat ×# (L#×#, # mm)\n155|To=#\n156|Nappe inférieure #Φ#/direction\n157|Nappe supérieure #Φ#/direction\n158|Nappe supérieure #e semelle #Φ#/direction\n159|Fût #Φ#\n160|Cadres Φ#/#\n161|Stub L#×# · # cleats\n162|Fût incliné : tanα = #\n163|enrobage : semelle # cm, fût # cm\n164|Stub – coupe en plan des cleats (coupe horizontale du fût)\n165|Coupe : plan horizontal passant par le centre du fût, vue de dessus. Le profilé en L du stub est placé avec son centre de gravité (intersection des axes d'inertie) au centre du fût, le talon tourné vers l'angle extérieur ; les cleats sont boulonnés alternativement sur les deux ailes. La ligne verte en pointillés est la limite de la cage d'armatures intérieure ; si le bout d'un cleat la dépasse, il devient rouge.\n166|limite de la cage d'armatures intérieure\n167|+ centre du fût = centre de gravité de la section du stub\n168|– · – axes principaux d'inertie (diagonale)\n169|talon du stub (angle extérieur)\n170|bout de cleat le plus éloigné # cm\n171|demi-largeur de la cage # cm\n172|Profilé du stub\n173|Cleat\n174|L#×# · # mm · # pcs\n175|Face de fixation des cleats\n176|face extérieure\n177|Enrobage + cadre + barre\n178|Demi-largeur de la cage\n179|Bout de cleat (depuis le centre)\n180|Marge\n181|Taux de travail\n182|✔ les cleats sont dans la cage\n183|Le centre de gravité de la section du profilé en L du stub (e vers l'intérieur depuis le dos du talon) est au centre du\n184|fût ; le talon est tourné vers l'angle extérieur (+x, −y). Cleat : aile verticale boulonnée sur la face de l'aile,\n185|aile horizontale (F#) pénétrant dans le béton, largeur L# le long de l'aile.\n186|Les cleats sont répartis alternativement sur les deux ailes ; le dessin montre la projection de tous les cleats.\n187|#D – fondation et coin de sol\n188|Faites glisser à la souris : fait pivoter · molette : zoom · double-clic : réinitialise.\n189|R = T·tanβ = # m\n190|az #° · él #°\n191|# coins latéraux : # m³ (face plane)\n192|# quarts de cône d'angle : # m³\n193|fondation en béton (référence)\n194|Coin de sol : prisme intérieur (B²·T = # m³) + coins latéraux + cônes d'angle\n195|Isométrique\n196|Plan (dessus)\n197|Face\n198|Côté\n199|Dessous\n200|Plan\n201|tête de fût (inclinée)\n202|Nappe inférieure : #Φ# (s≈# cm)\n203|Nappe supérieure : #Φ# (s≈# cm) – pointillé\n204|#e semelle : #Φ# (s≈# cm)\n205|Armatures du fût et direction du pied (flèche)\n206|Vérifications des critères\n207|Arrachement\n208|Portance – moyenne\n209|Portance – angle\n210|Portance – sans traction\n915|Appliquer la suggestion\n916|Nécessaire (suggestion) : nombre de cleats ≥ # · boulons ≥ # · longueur scellée ≥ # mm\n917|Données modifiées : cette courbe a été calculée avec d'anciennes valeurs. Appuyez sur « Tracer la courbe » pour l'actualiser.\n918|Attention : les dimensions de la 2e semelle (B1 ou T2) sont nulles ou très petites. Cet outil ne peut pas calculer une conception sans 2e semelle (redan) ; c'est pourquoi les vérifications de flexion de la semelle, de poinçonnement et d'armatures ne sont pas satisfaites. Augmentez B1 et T2.\n919|Modifié manuellement\n920|Verrouillé – ne change pas\n921|Automatique – plus petite valeur pour les autres dimensions\n922|Pas de dimension\n923|Quand une dimension est modifiée, les dimensions « automatiques » sont réglées à leur plus petite valeur (arrondie au pas)\n924|⚙ Automatique :\n925|(pas # mm)\n926|non réalisable – dimension inchangée\n927|actuellement # mm ✔ conforme\n928|actuellement # mm ⚠ surdimensionné – # mm suffisent\n929|(minimum calculé # mm)\n930|Symbole de chaque ligne : ✎ manuel · 🔒 verrouillé · ⚙ automatique. Cliquez sur le symbole. Quand vous modifiez une autre dimension, les dimensions automatiques sont réglées à la plus petite valeur satisfaisant la conception (arrondie au pas supérieur) ; les dimensions verrouillées ne changent jamais. « Surdimensionné » : au moins un pas de plus que nécessaire.\n931|zone acceptable : toutes les vérifications satisfaites\n932|insuffisant : certaines vérifications non satisfaites\n933|Toutes les armatures\n934|Choisir l'armature (repère)\n935|Barre (étiquette)\n936|(toutes)\n937|Armature choisie : informations de coupe et de cintrage\n938|Bibliothèque de pylônes\n939|Ajoutez, modifiez et choisissez vos propres types de pylône (charges, pente de jambe, stub/cleat et dimensions de fondation par défaut). Ils apparaissent à côté des options de la liste des pylônes. La bibliothèque est enregistrée dans ce navigateur ; téléchargez-la et importez-la pour la transférer.\n940|Ajouter / modifier un pylône\n941|Nom du pylône\n942|Le nom du pylône est obligatoire.\n943|Les types de pylône prédéfinis ne peuvent pas être modifiés ; utilisez « Copier » pour créer votre propre copie.\n944|Utilisé : les charges, le stub et les dimensions de fondation de ce type de pylône ont été appliqués à l'onglet Données.\n945|Remplir depuis le pylône des Données\n946|Dimensions de fondation par défaut (pour toutes les classes de sol)\n947|Un nombre est manquant ou invalide dans les données.\n948|Stub\n949|Charges (arrachement / compression)\n950|Entraxe des jambes X (centre à centre)\n951|Entraxe des jambes Y (centre à centre)\n952|Pour la vérification du chevauchement des cônes ; sans valeur, la vérification est ignorée\n953|Autres hauteurs de fût (body extension) :\n954|entraxe et effort d'arrachement pour chacune. La fondation est identique pour toutes les hauteurs, la vérification est donc faite pour chacune ; sur un fût bas l'entraxe est étroit mais les charges sont aussi bien plus faibles. La charge et l'entraxe ci-dessus correspondent au fût le plus haut.\n955|Fût\n956|Entraxe X (m)\n957|Entraxe Y (m)\n958|Effort d'arrachement Z (kN)\n959|Effort d'arrachement Z (daN)\n960|Ajouter une hauteur\n961|Chevauchement des cônes (jambes voisines)\n962|Chevauchement des cônes (groupe)\n963|Si les cônes de sol de jambes voisines se chevauchent, le même sol ne peut pas être compté pour les deux jambes. Sur la face exposée au vent, deux jambes sont arrachées ensemble ; le volume commun est divisé par deux et déduit du poids du cône de chaque jambe.\n964|Seuil de chevauchement : entraxe < B + 2·T·tanβ\n965|Par hauteur de fût : entraxe X × Y, rapport de charge, volume en commun, FS (groupe) = φ·(Gb + Gpt − ΔG) / Lu\n966|Fût principal (le plus haut)\n967|# × # m · charge ×# · commun # m³\n968|Poids déduit par jambe sur la hauteur critique ΔG = ½·Vcom·γ\n969|L'entraxe est très proche de la largeur des semelles : les semelles se touchent.\n970|Arrachement après chevauchement vérifié : FS = #\n971|Arrachement après chevauchement non vérifié : FS = #\n972|Pour la vérification du chevauchement, saisissez l'entraxe des jambes (X, Y) dans l'onglet Données. Le chevauchement commence lorsque l'entraxe est inférieur à # m.\n973|FS = # ≥ # · volume en commun # m³\n974|volume en commun X # · Y # m³\n211|Qmin = # ≥ #\n212|Renversement Y\n213|Poinçonnement\n214|Armatures inférieures de la semelle\n215|nécessaire # ≤ # cm²\n216|Armatures supérieures de la semelle\n217|Armatures #e semelle\n218|Flexion du fût\n219|Mx/Mu + My/Mu = # ≤ #\n220|Fût armatures minimales #%\n221|Semelle armatures minimales #%\n222|Ancrage du stub\n223|le plus critique : boulons #%\n224|Le stub tient dans le béton\n225|scellé # ≤ disponible # mm\n226|Le cleat tient dans la cage d'armatures\n227|bout de cleat # ≤ cage # cm (A ≥ # m)\n228|Coin de sol – pièce par pièce\n229|Prisme B²·T\n230|# coins latéraux\n231|R = T·tanβ = # mm\n232|# quarts de cône d'angle\n233|− fût, − #e semelle\n234|− #e semelle (correction)\n235|Coin Vpt\n236|Gpt + Gb\n237|Charge d'arrachement Lu\n238|Arrachement FS\n239|Ancrage du stub et des cleats\n240|L#×#×#, dans le béton # mm\n241|Charge axiale P\n242|Pc = #, Pu = # daN\n243|Aire du profilé An ≥ Amin\n244|Adhérence Bc = lb·L#·fb\n245|Écrasement des cleats Gc (# pcs)\n246|Boulons Sb (# × M#)\n247|Tenue dans le béton\n248|Tenue du cleat dans la cage d'armatures intérieure\n249|bout de cleat # ≤ cage # cm · A nécessaire ≥ # m\n250|Le dessin montre le stub et les cleats avec les dimensions du rapport. Les positions des cleats sont symboliques (espacement dans Données → section Stub). Détails : onglet Étapes de calcul, étape #.\n251|Comment fonctionne l'optimisation ? (pas de point de départ, on balaye)\n252|Évaluation d'une conception :\n253|pour les dimensions données (B, B#, T, T#, T#, A…) on calcule les charges, le poids du coin de sol, l'arrachement, la portance, le renversement, le poinçonnement, la flexion de la semelle, les vérifications du fût et du stub ; les armatures de la semelle et du fût sont choisies automatiquement pour cette taille. Si toutes les vérifications sont ≤ #%, la conception est\n254|acceptable\n255|.\n256|« Résoudre » (minimum de béton / d'armatures / de fouille) :\n257|chaque combinaison\n258|des paramètres marqués « libres » (par défaut B et T) dans la plage est\n259|essayée tour à tour (B par pas de # mm, T par pas de # mm ≈ # conceptions, quelques secondes). Parmi les conceptions acceptables, on retient celle qui a le moins de béton, le moins d'armatures, la moindre fouille et le coût le plus bas. Aucune amélioration à partir d'une conception de départ n'est faite ; le résultat ne dépend pas de la valeur de départ.\n260|Courbe de dimension nécessaire :\n261|pour chaque valeur de T, B est augmenté de petit à grand par pas de # mm ; la première valeur satisfaisant toutes les vérifications est trouvée puis affinée jusqu'à # mm. La même logique donne « T nécessaire pour un B fixe ».\n262|Ce qui reste fixe :\n263|les paramètres non marqués libres (T#, T#, B#, A, To, β, qa) gardent leur valeur de l'onglet Conception ; l'optimum en dépend. Pour un meilleur résultat, cochez « libre » pour la case concernée (la recherche s'allonge, le pas grossit automatiquement).\n264|Pourquoi cet optimum ?\n265|Quand la profondeur augmente, le coin de sol grandit et le B nécessaire à l'arrachement diminue ; mais quand T devient trop grand, le poids du sol/béton au-dessus de la semelle limite la portance et B augmente de nouveau. Le minimum de béton se situe près du point de croisement où l'arrachement et la portance se limitent mutuellement.\n266|Courbe de dimension nécessaire – « quelle largeur de semelle à cette profondeur ? »\n267|Objectif :\n268|En faisant varier un paramètre (p. ex. la profondeur T),\n269|pour satisfaire tous les critères de conception,\n270|voir la valeur minimale que doit avoir l'autre paramètre (p. ex. la largeur de semelle B). La ligne bleue est le plus petit B nécessaire pour chaque T ; au-dessus de la ligne se trouve la zone acceptable. La ligne orange est le volume de béton de cette conception, le point marqué est la combinaison à\n271|béton minimal\n272|(optimum). Les autres dimensions restent à leur valeur de l'onglet Conception ; à chaque point, les armatures de la semelle et du fût sont choisies automatiquement.\n273|Paramètre que vous faites varier (X)\n274|Nécessaire (Y)\n275|X minimum (mm)\n276|X maximum (mm)\n277|Tracer la courbe\n278|Appuyez sur « Tracer la courbe » (quelques secondes).\n279|Changer un paramètre, garder les autres fixes\n280|Voir pour quelles valeurs du paramètre choisi tous les critères de conception sont satisfaits. Les lignes montrent le taux de travail (charge/capacité) de chaque critère ; sous la ligne #% c'est sûr, la bande verte est la plage acceptable. Toutes les autres dimensions restent à leur valeur de l'onglet\n281|.\n282|minimum\n283|maximum\n284|Profondeur T (sous la semelle) (mm)\n285|actuel\n286|Portance moy.\n287|Portance angle\n288|Flexion semelle (K/K′)\n289|bande verte : toutes les vérifications satisfaites\n290|Plage acceptable :\n291|· limite inférieure imposée par :\n292|Plus petite valeur acceptable de ce paramètre :\n293|appliquer cette valeur\n294|Conception à béton / armatures / fouille minimaux\n295|Balayer toutes les combinaisons des paramètres marqués « libres » dans leurs plages ; parmi celles qui satisfont tous les critères, trouver la conception à béton, armatures et fouille minimaux. Les armatures de la semelle et du fût sont choisies automatiquement pour chaque combinaison. Les paramètres non marqués gardent leur valeur actuelle.\n296|Libre\n297|Paramètre\n298|actuel\n299|pas\n300|Largeur de la semelle B (mm)\n301|Largeur de la #e semelle B# (mm)\n302|Épaisseur de la semelle T# (mm)\n303|Épaisseur de la #e semelle T# (mm)\n304|Largeur du fût A (mm)\n305|Hauteur du fût au-dessus du sol To (mm)\n306|Angle du coin de sol (frustum) β (°)\n307|Capacité portante qa (daN/cm²)\n308|Critère de classement\n309|béton minimal\n310|armatures minimales\n311|fouille minimale\n312|coût minimal\n313|Béton (/m³)\n314|Acier (/kg)\n315|Fouille (/m³)\n316|Béton de propreté (/m³)\n317|Résoudre\n318|Les prix unitaires sont des valeurs provisoires (uniquement pour « coût minimal ») ; saisissez vos propres prix.\n319|Récapitulatif des vérifications\n320|Résultat\n321|(déterminant)\n322|Taux de travail = charge/capacité. Le critère déterminant est la vérification au taux de travail le plus élevé ; c'est lui qui agrandit ou réduit la fondation. Pour le poinçonnement, l'aire (prudente) du rapport est utilisée ; avec l'aire géométrique complète # daN/cm².\n323|Quantités (par pylône, # jambes)\n324|Béton (structurel)\n325|Béton de propreté\n326|Fouille\n327|Armatures\n328|# kg/jambe\n329|Taux d'armatures\n330|Sécurité à l'arrachement : trois méthodes\n331|Méthode choisie\n332|#e semelle déduite\n333|Méthode du rapport\n334|#e semelle comptée à la fois comme béton et comme sol\n335|Corrigée\n336|volume de la #e semelle déduit du sol\n337|Différence = T#·B²·γsol = # daN. Cette différence influence aussi la vérification au renversement (résistance Gpt/#).\n338|Chaque fiche :\n339|objectif\n340|→ schéma → calcul chiffré → résultat. Les chiffres sont calculés en direct à partir des données du panneau de gauche.\n341|Charges : du repère cartésien à l'axe incliné\n342|Le programme du pylône fournit pour chaque jambe des efforts horizontaux (X, Y) et verticaux (Z). Le stub et la fondation, eux, travaillent suivant\n343|l'axe incliné\n344|de la jambe ; la charge est ramenée à cet axe et majorée de #% comme l'exige le cahier des charges. Les efforts tranchants ne sont pas majorés.\n345|Z (vertical)\n346|P incliné\n347|P = Z·√(#+#tan²α)\n348|Charge axiale arrachement / compression\n349|donnée\n350|Cisaillement (sol) / (fût)\n351|Charges de fondation\n352|Lu = # × P arrachement\n353|Lc = # × P compression\n354|Sol et poids volumiques (sec / sous l'eau)\n355|C'est le poids qui s'oppose à l'arrachement. Si le sol est sous l'eau, chaque corps s'allège du poids de l'eau déplacée (# daN/m³) (Archimède) : sol γsat → γsat − #, béton # → # daN/m³. C'est pourquoi la résistance baisse et la fondation grossit dans les classes saturées.\n356|niveau de la nappe\n357|Sol sec\n358|γ sol = # daN/m³ · γ béton = #\n359|Sol saturé (C#)\n360|γ' = γsat − γw = # − # = # · béton #\n361|poussée\n362|Capacité portante qa / en rive\n363|Poids volumique du sol (effectif)\n364|sec\n365|Masse volumique du béton (effective)\n366|Angle du coin β\n367|tanβ = #\n368|fcd = fck/γc\n369|fyd = fy/γs\n370|Volume et poids du béton\n371|Le poids propre de la fondation est une part petite mais certaine de la résistance à l'arrachement. Trois parties sont calculées séparément : semelle, #e semelle, fût.\n372|Lu=#\n373|Gpt=#\n374|Gb=#\n375|Semelle : T#·B²\n376|#e semelle : T#·B#²\n377|Fût : A²·(T+To−T#−T#)\n378|Béton total Vb\n379|Gb = Vb × γc\n380|Coin de sol : pièce par pièce\n381|Quand la charge d'arrachement tire la fondation vers le haut, la masse de sol en tronc de cône au-dessus est soulevée aussi ; son poids s'ajoute à la résistance. Les faces latérales sont planes (coin prismatique), les angles coniques (quarts de cône). Comme il y a du béton dans le coin, le volume occupé par le béton doit être déduit du poids du sol.\n382|① Prisme : B²·T\n383|② # coins latéraux : #·B·T²·tanβ\n384|③ # quarts de cône d'angle : (π/#)·T³·tan²β\n385|Coin total (①+②+③)\n386|− Fût : A²·(T−T#−T#)\n387|− #e semelle : T#·B#²\n388|Vpt – méthode du rapport\n389|#e semelle non déduite\n390|− #e semelle : T#·B² (correction)\n391|volume hors sol\n392|Vpt – retenu\n393|Gpt = Vpt × γsol\n394|Sol au-dessus de la semelle (pour la portance)\n395|Vat = B²(T−T#) − A²(T−T#−T#) − T#·B#²\n396|Gat = Vat × γsol\n397|Méthode corrigée : les # parties de béton ont toutes été déduites du coin.\n398|Vérification à l'arrachement (extraction)\n399|La fondation se soulève-t-elle quand on la tire vers le haut ? Résistance : poids du béton + poids du coin de sol. La charge étant déjà pondérée, un coefficient de sécurité ≥ # est exigé (le rapport n'a pas de coefficient supplémentaire côté résistance).\n400|Résistance R = φ·(Gb + Gpt)\n401|FS = R / Lu\n402|méthode du rapport (#e semelle comptée)\n403|corrigée (#e semelle déduite)\n404|✔ Arrachement satisfait : FS = #\n405|Portance : pression du sol\n406|Le sol sous la fondation peut-il porter la charge de compression et la flexion due à l'effort horizontal ? La pression moyenne ne doit pas dépasser qa, la pression d'angle ne doit pas dépasser #·qa, et il ne doit pas y avoir de traction (pression négative) aux angles.\n407|Lc=#\n408|min #\n409|max # daN/cm²\n410|Moments : M = V·(T+To+#)\n411|ΣG = Lc + Gat + Gb\n412|Excentricité e = M/ΣG\n413|Pression moyenne Qo = ΣG/B²\n414|Part du moment (Mx±My)·#/B³\n415|Maximale / minimale\n416|✔ Portance satisfaite\n417|Renversement\n418|L'arrachement et l'effort horizontal tentent de renverser la fondation autour d'un angle de la semelle (A). La résistance r) y ensancha el fondo. La cuña de arrancamiento parte de debajo de la zapata; el peso del hormigón de limpieza no se suma a la resistencia (lado seguro).\n99|Selección de armadura\n100|Parrilla inferior de la zapata Φ\n101|barras / dirección\n102|Parrilla superior de la zapata Φ\n103|Parrilla superior #.ª zapata Φ\n104|Armadura longitudinal del fuste Φ\n105|cantidad (múltiplo de #)\n106|Estribos Φ\n107|Separación de estribos\n108|Ajustes de ganchos y doblado\n109|Gancho de extremo de parrilla\n110|Gancho a #° (forma de U)\n111|Barra recta sin gancho\n112|Longitud del gancho (×Φ)\n113|Longitud recta del pie de barra del fuste (×Φ)\n114|Diámetro interior de doblado Φ≤# (×Φ)\n115|Diámetro interior de doblado Φ># (×Φ)\n116|EC# Tabla #N: Φ≤# → #Φ, Φ># → #Φ. Longitud de corte = Σ cotas exteriores − descuento de doblado; descuento = #(rc+Φ/#)·tan(θ/#) − rc·θ, rc = D/# + Φ/#.\n117|Datos del plano\n118|Proyecto\n119|Dibujado por\n120|Revisado por\n121|Revisión\n122|Hipótesis de cálculo\n123|Factor de resistencia φ (arrancamiento, vuelco)\n124|Restar el volumen de la #.ª zapata del volumen de la cuña (método corregido)\n125|Adición al brazo de momento de la zapata\n126|Adición al brazo de momento del fuste\n127|Las adiciones de brazo reproducen las cifras del informe (zapata # cm, fuste # cm). Casilla de la #.ª zapata sin marcar = método del informe.\n128|Dimensiones\n129|Arrastre el control deslizante o escriba el valor en mm; los dibujos y comprobaciones de la derecha cambian al instante.\n130|Ancho de la zapata B\n131|Profundidad T (bajo la zapata)\n132|Capacidad portante qa\n133|Elegir la armadura automáticamente al cambiar una dimensión\n134|Restar la #.ª zapata del volumen de la cuña (corregido)\n135|Cargas, suelo, armadura, stub:\n136|Búsqueda de hormigón / armadura mínimos:\n137|hormigón / pata\n138|excavación / pata\n139|acero / pata (# kg/m³)\n140|Vuelco X\n141|criterio determinante (%#)\n142|# comprobaciones ✘\n143|Dimensiones necesarias para este diseño\n144|Menor valor que cumple todos los criterios mientras el resto de dimensiones permanecen en su valor actual. Cambie la profundidad (T) y aquí se actualiza el ancho de zapata necesario. Curva completa:\n145|Ancho mínimo de zapata B necesario (T fija)\n146|actualmente # mm ✘ insuficiente\n147|Profundidad mínima T necesaria (B fija)\n148|Sección (fuste inclinado)\n149|superficie del terreno\n150|hormigón de limpieza # cm\n151|calzo de ajuste\n152|stub L#×#×#\n153|en el hormigón # mm (anclaje L# = #)\n154|cleat ×# (L#×#, # mm)\n155|To=#\n156|Parrilla inferior #Φ#/dirección\n157|Parrilla superior #Φ#/dirección\n158|Parrilla superior #.ª zapata #Φ#/dirección\n159|Fuste #Φ#\n160|Estribos Φ#/#\n161|Stub L#×# · # cleats\n162|Fuste inclinado: tanα = #\n163|recubrimiento: zapata # cm, fuste # cm\n164|Stub – sección en planta de los cleats (corte horizontal del fuste)\n165|Sección: plano horizontal por el centro del fuste, visto desde arriba. El perfil en L del stub se coloca con su centro de gravedad (intersección de los ejes de inercia) en el centro del fuste y el talón hacia la esquina exterior; los cleats se atornillan alternadamente a las dos alas. La línea verde discontinua es el límite de la jaula de armadura interior; si la punta de un cleat queda fuera, se pone roja.\n166|límite de la jaula de armadura interior\n167|+ centro del fuste = centro de gravedad de la sección del stub\n168|– · – ejes principales de inercia (diagonal)\n169|talón del stub (esquina exterior)\n170|punta de cleat más alejada # cm\n171|semiancho de la jaula # cm\n172|Perfil del stub\n173|Cleat\n174|L#×# · # mm · # uds.\n175|Cara de unión de los cleats\n176|cara exterior\n177|Recubrimiento + estribo + barra\n178|Semiancho de la jaula\n179|Punta del cleat (desde el centro)\n180|Margen\n181|Aprovechamiento\n182|✔ los cleats quedan dentro de la jaula\n183|El centro de gravedad de la sección del perfil en L del stub (e hacia dentro desde el dorso del talón) está en el centro del\n184|fuste; el talón mira a la esquina exterior (+x, −y). Cleat: ala vertical atornillada a la cara del ala,\n185|ala horizontal (F#) que penetra en el hormigón, ancho L# a lo largo del ala.\n186|Los cleats se reparten alternadamente en las dos alas; el dibujo muestra la proyección de todos los cleats.\n187|#D – cimentación y cuña de suelo\n188|Arrastre con el ratón: gira · rueda: zoom · doble clic: restablece.\n189|R = T·tanβ = # m\n190|az #° · el #°\n191|# cuñas laterales: # m³ (cara plana)\n192|# cuartos de cono de esquina: # m³\n193|cimentación de hormigón (referencia)\n194|Cuña de suelo: prisma interior (B²·T = # m³) + cuñas laterales + conos de esquina\n195|Isométrica\n196|Planta (arriba)\n197|Alzado\n198|Lateral\n199|Inferior\n200|Planta\n201|cabeza del fuste (inclinada)\n202|Parrilla inferior: #Φ# (s≈# cm)\n203|Parrilla superior: #Φ# (s≈# cm) – trazos\n204|#.ª zapata: #Φ# (s≈# cm)\n205|Armadura del fuste y dirección del pie (flecha)\n206|Comprobaciones de criterios\n207|Arrancamiento\n208|Capacidad portante – media\n209|Capacidad portante – esquina\n210|Capacidad portante – sin tracción\n915|Aplicar la sugerencia\n916|Necesario (sugerencia): número de cleats ≥ # · pernos ≥ # · longitud embebida ≥ # mm\n917|Datos modificados: esta curva se calculó con valores antiguos. Pulse «Dibujar curva» para actualizarla.\n918|Aviso: las dimensiones de la 2.ª zapata (B1 o T2) son cero o muy pequeñas. Esta herramienta no puede calcular un diseño sin 2.ª zapata (escalón); por eso no se cumplen las comprobaciones de flexión de la zapata, punzonamiento y armadura. Aumente B1 y T2.\n919|Se cambia manualmente\n920|Bloqueada – no cambia\n921|Automática – menor valor para las demás dimensiones\n922|Paso de dimensión\n923|Al cambiar una dimensión, las dimensiones «automáticas» se ajustan a su menor valor (redondeado al paso)\n924|⚙ Automático:\n925|(paso # mm)\n926|no alcanzable – dimensión sin cambios\n927|actualmente # mm ✔ correcto\n928|actualmente # mm ⚠ sobredimensionado – bastan # mm\n929|(mínimo calculado # mm)\n930|Símbolo de cada fila: ✎ manual · 🔒 bloqueada · ⚙ automática. Pulse el símbolo. Al cambiar otra dimensión, las automáticas se ajustan al menor valor que cumple el diseño (redondeado hacia arriba al paso); las bloqueadas nunca cambian. «Sobredimensionado»: al menos un paso más de lo necesario.\n931|zona admisible: todas las comprobaciones cumplidas\n932|insuficiente: algunas comprobaciones no se cumplen\n933|Toda la armadura\n934|Elegir armadura (marca)\n935|Barra (etiqueta)\n936|(todas)\n937|Armadura elegida: información de corte y doblado\n938|Biblioteca de apoyos\n939|Añada, edite y seleccione sus propios tipos de apoyo (cargas, pendiente de pata, stub/cleat y dimensiones de cimentación por defecto). Aparecen junto a las opciones del cuadro de apoyos. La biblioteca se guarda en este navegador; descárguela e impórtela para trasladarla.\n940|Añadir / editar apoyo\n941|Nombre del apoyo\n942|El nombre del apoyo es obligatorio.\n943|Los tipos de apoyo predefinidos no se pueden modificar; use «Copiar» para crear su propia copia.\n944|En uso: las cargas, el stub y las dimensiones de cimentación de este tipo de apoyo se aplicaron a la pestaña Datos.\n945|Rellenar con el apoyo de Datos\n946|Dimensiones de cimentación por defecto (para todas las clases de suelo)\n947|Falta un número o no es válido en los datos.\n948|Stub\n949|Cargas (arrancamiento / compresión)\n950|Separación de patas X (de centro a centro)\n951|Separación de patas Y (de centro a centro)\n952|Para la comprobación de solape de conos; si está vacío no se comprueba\n953|Otras alturas de fuste (body extension):\n954|separación de patas y carga de arrancamiento para cada una. La cimentación es la misma para todas las alturas, por lo que la comprobación se hace para cada una; en un fuste bajo la separación es estrecha pero las cargas son también mucho menores. La carga y la separación de arriba corresponden al fuste más alto.\n955|Fuste\n956|Separación X (m)\n957|Separación Y (m)\n958|Carga de arrancamiento Z (kN)\n959|Carga de arrancamiento Z (daN)\n960|Añadir fuste\n961|Solape de conos (patas vecinas)\n962|Solape de conos (grupo)\n963|Si los conos de suelo de patas vecinas se solapan, el mismo suelo no puede contarse para las dos patas. En la cara que recibe el viento se arrancan dos patas a la vez; el volumen común se divide entre dos y se resta del peso del cono de cada pata.\n964|Umbral de solape: separación < B + 2·T·tanβ\n965|Por altura de fuste: separación X × Y, relación de carga, volumen común, FS (grupo) = φ·(Gb + Gpt − ΔG) / Lu\n966|Fuste principal (el más alto)\n967|# × # m · carga ×# · solape # m³\n968|Peso descontado por pata en el fuste crítico ΔG = ½·Vcom·γ\n969|La separación está muy cerca del ancho de las zapatas: las zapatas chocan.\n970|Arrancamiento tras el solape cumple: FS = #\n971|Arrancamiento tras el solape no cumple: FS = #\n972|Para la comprobación de solape, introduzca la separación de patas (X, Y) en la pestaña Datos. El solape empieza cuando la separación es menor de # m.\n973|FS = # ≥ # · volumen común # m³\n974|volumen común X # · Y # m³\n211|Qmin = # ≥ #\n212|Vuelco Y\n213|Punzonamiento\n214|Armadura inferior de la zapata\n215|necesario # ≤ # cm²\n216|Armadura superior de la zapata\n217|Armadura #.ª zapata\n218|Flexión del fuste\n219|Mx/Mu + My/Mu = # ≤ #\n220|Fuste armadura mínima #%\n221|Zapata armadura mínima #%\n222|Anclaje del stub\n223|más crítico: pernos #%\n224|El stub cabe en el hormigón\n225|embebido # ≤ disponible # mm\n226|El cleat cabe en la jaula de armadura\n227|punta del cleat # ≤ jaula # cm (A ≥ # m)\n228|Cuña de suelo – parte por parte\n229|Prisma B²·T\n230|# cuñas laterales\n231|R = T·tanβ = # mm\n232|# cuartos de cono de esquina\n233|− fuste, − #.ª zapata\n234|− #.ª zapata (corrección)\n235|Cuña Vpt\n236|Gpt + Gb\n237|Carga de arrancamiento Lu\n238|Arrancamiento FS\n239|Anclaje del stub y de los cleats\n240|L#×#×#, en el hormigón # mm\n241|Carga axial P\n242|Pc = #, Pu = # daN\n243|Área del perfil An ≥ Amin\n244|Adherencia Bc = lb·L#·fb\n245|Aplastamiento de cleats Gc (# uds.)\n246|Pernos Sb (# × M#)\n247|Cabida en el hormigón\n248|Cabida del cleat en la jaula de armadura interior\n249|punta del cleat # ≤ jaula # cm · A necesario ≥ # m\n250|El dibujo muestra el stub y los cleats con las dimensiones del informe. Las posiciones de los cleats son simbólicas (separación en Datos → sección Stub). Detalles: pestaña Pasos de cálculo, paso #.\n251|¿Cómo funciona la optimización? (sin punto de partida, se hace un barrido)\n252|Evaluación de un diseño:\n253|para las dimensiones dadas (B, B#, T, T#, T#, A…) se calculan cargas, peso de la cuña de suelo, arrancamiento, capacidad portante, vuelco, punzonamiento, flexión de la zapata, comprobaciones del fuste y del stub; la armadura de la zapata y del fuste se elige automáticamente para ese tamaño. Si todas las comprobaciones son ≤ #%, el diseño es\n254|admisible\n255|.\n256|«Resolver» (hormigón / armadura / excavación mínimos):\n257|cada combinación\n258|de los parámetros marcados como «libres» (por defecto B y T) dentro del rango se\n259|prueba por turno (B en pasos de # mm, T en pasos de # mm ≈ # diseños, unos segundos). Entre los admisibles se elige el de menos hormigón, menos armadura, menos excavación y menor coste. No se mejora a partir de un diseño inicial; el resultado no depende del valor de partida.\n260|Curva de la dimensión necesaria:\n261|para cada valor de T se aumenta B de menor a mayor en pasos de # mm; se halla el primer valor que cumple todas las comprobaciones y se afina hasta # mm. Con la misma lógica se obtiene «T necesaria para B fija».\n262|Lo que permanece fijo:\n263|los parámetros no marcados como libres (T#, T#, B#, A, To, β, qa) conservan su valor de la pestaña Diseño; el óptimo depende de ellos. Para un mejor resultado marque la casilla «libre» correspondiente (la búsqueda crece, el paso se engrosa automáticamente).\n264|¿Por qué este óptimo?\n265|Al aumentar la profundidad crece la cuña de suelo y disminuye la B necesaria para el arrancamiento; pero si T crece demasiado, el peso de suelo/hormigón sobre la zapata limita la capacidad portante y B vuelve a aumentar. El mínimo de hormigón queda cerca del punto de cruce donde arrancamiento y capacidad portante se limitan mutuamente.\n266|Curva de la dimensión necesaria – «¿qué ancho de zapata hace falta a esta profundidad?»\n267|Objetivo:\n268|Al variar un parámetro (p. ej. la profundidad T),\n269|para cumplir todos los criterios de diseño,\n270|ver el valor mínimo que debe tener el otro parámetro (p. ej. el ancho de zapata B). La línea azul es la menor B necesaria para cada T; por encima de la línea está la zona admisible. La línea naranja es el volumen de hormigón de ese diseño, el punto marcado es la combinación de\n271|hormigón mínimo\n272|(óptimo). Las demás dimensiones permanecen en su valor de la pestaña Diseño; en cada punto la armadura de zapata y fuste se elige automáticamente.\n273|Parámetro que usted varía (X)\n274|Necesario (Y)\n275|X mínimo (mm)\n276|X máximo (mm)\n277|Dibujar curva\n278|Pulse «Dibujar curva» (tarda unos segundos).\n279|Cambiar un parámetro, mantener los demás fijos\n280|Ver para qué valores del parámetro elegido se cumplen todos los criterios de diseño. Las líneas muestran el aprovechamiento (carga/capacidad) de cada criterio; por debajo de la línea del #% es seguro, la banda verde es el rango admisible. Las demás dimensiones permanecen en su valor de la pestaña\n281|.\n282|mínimo\n283|máximo\n284|Profundidad T (bajo la zapata) (mm)\n285|actual\n286|Cap. portante media\n287|Cap. portante esquina\n288|Flexión zapata (K/K′)\n289|banda verde: todas las comprobaciones cumplidas\n290|Rango admisible:\n291|· el límite inferior lo impone:\n292|Menor valor admisible de este parámetro:\n293|aplicar este valor\n294|Diseño de hormigón / armadura / excavación mínimos\n295|Barrer todas las combinaciones de los parámetros marcados como «libres» en sus rangos; entre las que cumplen todos los criterios, hallar el diseño con menos hormigón, armadura y excavación. La armadura de zapata y fuste se elige automáticamente en cada combinación. Los parámetros sin marcar conservan su valor actual.\n296|Libre\n297|Parámetro\n298|actual\n299|paso\n300|Ancho de la zapata B (mm)\n301|Ancho de la #.ª zapata B# (mm)\n302|Espesor de la zapata T# (mm)\n303|Espesor de la #.ª zapata T# (mm)\n304|Ancho del fuste A (mm)\n305|Altura del fuste sobre el terreno To (mm)\n306|Ángulo de la cuña de suelo (frustum) β (°)\n307|Capacidad portante qa (daN/cm²)\n308|Criterio de ordenación\n309|menos hormigón\n310|menos armadura\n311|menos excavación\n312|menor coste\n313|Hormigón (/m³)\n314|Acero (/kg)\n315|Excavación (/m³)\n316|Hormigón de limpieza (/m³)\n317|Resolver\n318|Los precios unitarios son valores provisionales (solo para «menor coste»); introduzca sus propios precios.\n319|Resumen de comprobaciones\n320|Resultado\n321|(determinante)\n322|Aprovechamiento = carga/capacidad. El criterio determinante es la comprobación con mayor aprovechamiento; es la que agranda o reduce la cimentación. Para el punzonamiento se usa el área (prudente) del informe; con el área geométrica completa # daN/cm².\n323|Mediciones (por apoyo, # patas)\n324|Hormigón (estructural)\n325|Hormigón de limpieza\n326|Excavación\n327|Armadura\n328|# kg/pata\n329|Cuantía de armadura\n330|Seguridad al arrancamiento: tres métodos\n331|Método elegido\n332|se resta la #.ª zapata\n333|Método del informe\n334|la #.ª zapata cuenta como hormigón y como suelo\n335|Corregido\n336|el volumen de la #.ª zapata se resta del suelo\n337|Diferencia = T#·B²·γsuelo = # daN. Esta diferencia también afecta a la comprobación al vuelco (resistencia Gpt/#).\n338|Cada ficha:\n339|objetivo\n340|→ esquema → cálculo con cifras → resultado. Las cifras se calculan en vivo a partir de los datos del panel izquierdo.\n341|Cargas: de cartesianas al eje inclinado\n342|El programa del apoyo da para cada pata fuerzas horizontales (X, Y) y verticales (Z). El st 6|− Fuste: A²·(T−T#−T#)\n387|− #.ª zapata: T#·B#²\n388|Vpt – método del informe\n389|#.ª zapata no restada\n390|− #.ª zapata: T#·B² (corrección)\n391|volumen que no es suelo\n392|Vpt – utilizado\n393|Gpt = Vpt × γsuelo\n394|Suelo sobre la zapata (para capacidad portante)\n395|Vat = B²(T−T#) − A²(T−T#−T#) − T#·B#²\n396|Gat = Vat × γsuelo\n397|Método corregido: las # partes de hormigón se restaron todas de la cuña.\n398|Comprobación al arrancamiento (extracción)\n399|¿Se levanta la cimentación al tirar de ella hacia arriba? Resistencia: peso del hormigón + peso de la cuña de suelo. Como la carga ya está mayorada, se exige un coeficiente de seguridad ≥ # (en el informe no hay factor adicional del lado de la resistencia).\n400|Resistencia R = φ·(Gb + Gpt)\n401|FS = R / Lu\n402|método del informe (cuenta la #.ª zapata)\n403|corregido (se resta la #.ª zapata)\n404|✔ Arrancamiento cumplido: FS = #\n405|Capacidad portante: presión del suelo\n406|¿Puede el suelo bajo la cimentación soportar la carga de compresión y la flexión que produce la fuerza horizontal? La presión media no debe superar qa, la presión de esquina no debe superar #·qa y no debe haber tracción (presión negativa) en las esquinas.\n407|Lc=#\n408|mín #\n409|máx # daN/cm²\n410|Momentos: M = V·(T+To+#)\n411|ΣG = Lc + Gat + Gb\n412|Excentricidad e = M/ΣG\n413|Presión media Qo = ΣG/B²\n414|Parte del momento (Mx±My)·#/B³\n415|Máxima / mínima\n416|✔ Capacidad portante cumplida\n417|Vuelco\n418|El arrancamiento y la fuerza horizontal intentan volcar la cimentación en torno a una esquina de la zapata (A). La resistencia es la mitad de la cuña de suelo (Gpt/#); la fuerza de vuelco se obtiene dividiendo el momento Lu·y + V·(T+To) − Gb·B/# por el brazo ⅔(B+T#) (antigua hoja de referencia EE. UU. #-D-#).\n419|A (punto de giro)\n420|Lu·y\n421|V·(T+To)\n422|Gpt/# + Gb\n423|y = B/#·cosα\n424|Resistencia Lr = φ·Gpt/#\n425|Lox = [Lu·y + Vx(T+To) − Gb·B/#] / ⅔(B+T#)\n426|Loy (con Vy)\n427|método del informe: # · #\n428|✘ Vuelco no cumplido\n429|Armadura de la zapata (flexión – Eurocódigo #)\n430|La zapata flexa como una ménsula, empujada hacia arriba por el suelo (caso de compresión) y tirada desde arriba por la pata en arrancamiento. La armadura necesaria se obtiene del momento flector con K = Mu/(b·d²·fcd), z = d/#·[#+√(#−#K)] ≤ #d, As = Mu/(fyd·z); la armadura elegida debe cumplirla.\n431|presión del suelo (flexión en ménsula)\n432|Mu = L²/#·[Q#(#B−L)+L·Q#]\n433|Zapata inferior (caso de compresión)\n434|d = T# − recubrimiento − #Φ\n435|Ménsula L = ½(B−B#) · Mu\n436|As necesaria · elegida\n437|Zapata superior (caso de arrancamiento)\n438|d · L · Mu\n439|#.ª zapata superior (caso de arrancamiento)\n440|Armadura mínima\n441|ACI #%·Ag (zapata / #.ª zapata)\n442|EC# #·fctm/fyk·b·d: # / # cm²\n443|✔ Armadura de la zapata: suficiente\n444|Al transmitir la carga a la zapata, el fuste intenta punzonarla como un punzón. La tensión tangencial en el perímetro crítico a #d del fuste no debe superar la resistencia mínima a cortante del hormigón (tipo EC#).\n445|perímetro crítico: a #d del fuste\n446|d = T#+T# − recubrimiento − #Φ\n447|Perímetro crítico u = #A + #π(#d)\n448|Presión neta Pr = Lc/B²\n449|Área (del informe) Ap · Lp = Lc − Pr·Ap\n450|Ap = # cm²\n451|Tensión Ved = Lp/(u·d)\n452|método del informe\n453|con el área geométrica completa\n454|VRd = #·k^#·√fck\n455|✔ Punzonamiento cumplido: #%\n456|Armadura del fuste y estribos\n457|El fuste es el pilar que lleva la carga del stub a la zapata. El stub soporta la carga axial; al fuste le queda la flexión producida por los cortantes horizontales. La capacidad a flexión de la armadura longitudinal elegida (análisis de sección, N = #) se divide por el momento aplicado; para los dos ejes la interacción lineal (EN #-#-# #) debe ser ≤ #.\n458|M = V·brazo\n459|Brazo de momento (cara superior de zapata → cabeza del fuste + adición)\n460|# cm de adición\n461|Mux = Vx·brazo · Muy = Vy·brazo\n462|Armadura As\n463|Momento resistente Mu (análisis de sección      Temel raporundaki (A-BNS-FOUNDATION DESIGN-R2) PLS yükleri bu değerlerin ×1,1’idir; o rapor eksenel yükü ayrıca ×1,1 (ER 3.2.4.1) büyütür. */
  PRESETS.BNS12 = Object.assign({}, PRESETS.BNS, { name: 'BNS (askı direği) – direk tasarımı Rev.12 yükleri', report: {},
    loads: { mode: 'tower', tanA: 0.106385, Zu: 596.18, Xu: 105.37, Yu: 76.71, Zc: 785.71, Xc: 116.70, Yc: 100.06 } });

  /* ---------------- yardımcılar ---------------- */
  const barArea = (phiMm) => (PI * (phiMm / 10) ** 2) / 4; // cm²
  const unitWeight = (phiMm) => (phiMm * phiMm) / 162.2;   // kg/m
  const kTrue = (t) => Math.sqrt(1 + 2 * t * t);

  /* ---------------- yükler ---------------- */
  function computeLoads(inp) {
    const L = inp.loads, o = inp.opts, t = L.tanA, k = kTrue(t), er = o.erFactor;
    const r = { k, t, er };
    if (L.mode === 'tower') {
      const fu = o.useVertical ? 1 : k;
      r.Pu = L.Zu * 100 * fu;               // çekme, eksen yönü (daN) – ×1,1 öncesi
      r.Pc = L.Zc * 100 * k;                // basınç her zaman eğik eksen
      r.Zu = L.Zu * 100; r.Zc = L.Zc * 100;
      r.ZtanU = L.Zu * t * 100; r.ZtanC = L.Zc * t * 100;
      r.Vch = { x: (L.Xu - L.Zu * t) * 100, y: (L.Yu - L.Zu * t) * 100 }; // baca: çekme satırı artık kesmesi (rapor)
      r.Vs = { x: (L.Xc - L.Zc * t) * 100, y: (L.Yc - L.Zc * t) * 100 }; // zemin/devrilme: basınç satırı (rapor)
    } else {
      r.Pu = L.PuAx; r.Pc = L.PcAx;
      r.Vs = { x: L.Vsx, y: L.Vsy };
      r.Vch = { x: L.Vcx, y: L.Vcy };
    }
    r.Lu = er * r.Pu;
    r.Lc = er * r.Pc;
    return r;
  }

  /* ---------------- ağırlıklar ---------------- */
  function computeWeights(inp) {
    const g = inp.geo, s = inp.soil, m = inp.mat, o = inp.opts;
    const { A, To, T1, T2, T, B, B1 } = g;
    const tb = Math.tan(rad(s.beta));
    const gcEff = s.sub ? m.gcDens - GW : m.gcDens;
    const gsEff = s.sub ? s.gsat - GW : s.gdry;
    // beton
    const Vpad1 = T1 * B * B, Vpad2 = T2 * B1 * B1, Vchim = A * A * (T + To - T1 - T2);
    const Vb = Vpad1 + Vpad2 + Vchim;
    const Gb = Vb * gcEff;
    // zemin kaması
    const prism = B * B * T;
    const wedges = 2 * B * T * T * tb;
    const corners = (PI / 3) * Math.pow(T, 3) * tb * tb;
    const cone = prism + wedges + corners;
    const subChim = A * A * (T - T1 - T2);
    const subPad2 = T2 * B1 * B1;
    const subPad1 = T1 * B * B;
    const VptReport = cone - subChim - subPad2;
    const VptFixed = VptReport - subPad1;
    const Vpt = o.pad1Subtract ? VptFixed : VptReport;
    const Gpt = Vpt * gsEff;
    const GptReport = VptReport * gsEff;
    // taban ayağı üstündeki zemin
    const Vat = B * B * (T - T1) - A * A * (T - T1 - T2) - T2 * B1 * B1;
    const Gat = Vat * gsEff;
    return { tb, gcEff, gsEff, Vpad1, Vpad2, Vchim, Vb, Gb, prism, wedges, corners, cone, subChim, subPad2, subPad1,
      VptReport, VptFixed, Vpt, Gpt, GptReport, Vat, Gat, R: T * tb };
  }

  /* ---------------- kesit analizi: baca (N = 0) ---------------- */
  function ringBars(n, Acm, cc) {
    // n adet, 4 köşe + her kenarda eşit aralık; ordinat = basınç yüzeyinden uzaklık
    const per = n / 4;
    const s = Acm - 2 * cc;
    const pts = [];
    for (let i = 0; i <= per; i++) pts.push({ x: cc + (s * i) / per, y: cc });               // alt kenar
    for (let i = 1; i <= per; i++) pts.push({ x: cc + s, y: cc + (s * i) / per });            // sağ
    for (let i = per - 1; i >= 0; i--) pts.push({ x: cc + (s * i) / per, y: cc + s });        // üst
    for (let i = per - 1; i >= 1; i--) pts.push({ x: cc, y: cc + (s * i) / per });            // sol
    return pts;
  }
  function chimneyMu(Acm, cc, phiMm, n, fcd, fyd) {
    const a = barArea(phiMm), Es = 2.04e6, ecu = 0.0035;
    const pts = ringBars(n, Acm, cc);
    const ys = pts.map((p) => p.y);
    const f = (x) => {
      let F = 0.8 * Math.min(x, Acm / 0.8) * Acm * fcd;
      for (const y of ys) {
        const eps = (ecu * (x - y)) / x;
        F += Math.max(-fyd, Math.min(fyd, Es * eps)) * a;
      }
      return F;
    };
    let lo = 0.5, hi = 3 * Acm;
    for (let i = 0; i < 80; i++) { const mid = (lo + hi) / 2; if (f(mid) < 0) lo = mid; else hi = mid; }
    const x = (lo + hi) / 2;
    let M = 0.8 * Math.min(x, Acm / 0.8) * Acm * fcd * (Acm / 2 - 0.4 * Math.min(x, Acm / 0.8));
    for (const y of ys) {
      const eps = (ecu * (x - y)) / x;
      M += Math.max(-fyd, Math.min(fyd, Es * eps)) * a * (Acm / 2 - y);
    }
    return { Mu: M, x, nBars: pts.length, pts };
  }

  /* ---------------- kama çakışması: komşu iki ayağın zemin kamaları ----------------
     Plan kesitinde her yükseklikte kama = (B×B kare) ⊕ (r yarıçaplı daire), r = h·tanβ (h: taban ayağından yukarı).
     dx,dy: iki ayağın merkezleri arası mesafe. Dönüş: ortak hacim (m³). */
  function wedgeOverlap(B, T, tb, dx, dy) {
    const a = B / 2, R = T * tb;
    if (Math.abs(dx) >= 2 * (a + R) || Math.abs(dy) >= 2 * (a + R)) return 0;
    const NH = 16, NY = 48;
    let V = 0;
    for (let i = 0; i < NH; i++) {
      const r = ((i + 0.5) / NH) * R;
      const hw = (d) => { d = Math.abs(d); return d <= a ? a + r : d <= a + r ? a + Math.sqrt(r * r - (d - a) * (d - a)) : 0; };
      const y0 = Math.max(-(a + r), dy - (a + r)), y1 = Math.min(a + r, dy + a + r);
      if (y1 <= y0) continue;
      const st = (y1 - y0) / NY;
      let A = 0;
      for (let j = 0; j < NY; j++) {
        const y = y0 + (j + 0.5) * st, h1 = hw(y), h2 = hw(y - dy);
        const len = Math.min(h1, dx + h2) - Math.max(-h1, dx - h2);
        if (len > 0) A += len * st;
      }
      V += A * (T / NH);
    }
    return V;
  }

  /* ---------------- ana hesap ---------------- */
  function compute(inp) {
    const g = inp.geo, s = inp.soil, m = inp.mat, o = inp.opts, rb = inp.rebar;
    const { A, To, T1, T2, T, B, B1 } = g;
    const fcd = m.fck / m.gc, fyd = m.fy / m.gs;
    const ld = computeLoads(inp);
    const w = computeWeights(inp);
    const out = { ld, w, fcd, fyd };
    const Bc = B * 100, Ac = A * 100;
    const cosA = 1 / Math.sqrt(1 + ld.t * ld.t);

    /* 5 – uplift */
    const Rup = o.phi * (w.Gb + w.Gpt);
    out.uplift = { Lu: ld.Lu, Gb: w.Gb, Gpt: w.Gpt, R: Rup, FS: Rup / ld.Lu,
      FSreport: (o.phi * (w.Gb + w.GptReport)) / ld.Lu, FSfixed: (o.phi * (w.Gb + w.VptFixed * w.gsEff)) / ld.Lu,
      FSvertical: ld.Lu ? (o.phi * (w.Gb + w.Gpt)) / (ld.Lu * (inp.loads.mode === 'tower' ? 1 / ld.k : 1)) : 0 };

       Rüzgârın vurduğu yüzde iki ayak birlikte çekilir → ortak hacmin yarısı her ayağın kama ağırlığından düşülür. */
    /* Gövde boyu (body extension) bazında: temel tüm gövdelerde aynıdır; alçak gövdede ayak aralığı dardır ama yükler de çok azdır.
       Ana satır = girdilerdeki (en yüksek gövde) yük ve ayak aralığı; diğer gövdeler loads.bodies listesinden (çekme yükü oranıyla ölçeklenir). */
    const lgx = +inp.loads.legX, lgy = +inp.loads.legY, mainZ = inp.loads.mode === 'tower' ? +inp.loads.Zu : +inp.loads.PuAx, cases = [];
    if (lgx > 0 && lgy > 0) cases.push({ name: '', main: true, lx: lgx, ly: lgy, ratio: 1 });
    (inp.loads.bodies || []).forEach((b) => { const lx = +b.legX, ly = +b.legY, z = +b.Z; if (lx > 0 && ly > 0 && z > 0 && mainZ > 0) cases.push({ name: b.name || '', main: false, lx, ly, ratio: z / mainZ }); });
    if (cases.length) {
      const rows = cases.map((c) => {
        const Vx = wedgeOverlap(B, T, w.tb, c.lx, 0), Vy = wedgeOverlap(B, T, w.tb, 0, c.ly), Vd = wedgeOverlap(B, T, w.tb, c.lx, c.ly);
        const Vmax = Math.max(Vx, Vy), dG = 0.5 * Vmax * w.gsEff, LuI = ld.Lu * c.ratio;
        return Object.assign({}, c, { Vx, Vy, Vd, Vmax, dG, Lu: LuI, FS: (o.phi * (w.Gb + w.Gpt - dG)) / LuI, collide: Math.min(c.lx, c.ly) < B + 0.05 });
      });
      const worst = rows.reduce((a, b) => (b.FS < a.FS ? b : a));
      out.group = { rows, worst, lx: worst.lx, ly: worst.ly, Vx: worst.Vx, Vy: worst.Vy, Vd: worst.Vd, Vmax: worst.Vmax, dG: worst.dG, FS: worst.FS, Lcrit: B + 2 * T * w.tb, collide: rows.some((c) => c.collide) };
    } else out.group = null;

    /* 6 – bearing */
    const armB = (T + To + 0.1) * 100;
    const Mx = ld.Vs.x * armB, My = ld.Vs.y * armB;
    const SG = ld.Lc + w.Gat + w.Gb;
    const Qo = SG / (Bc * Bc);
    const dp = ((Mx + My) * 6) / Math.pow(Bc, 3), dm = ((Mx - My) * 6) / Math.pow(Bc, 3);
    const Q1 = Qo + dm, Q2 = Qo + dp, Q3 = Qo - dm, Q4 = Qo - dp;
    out.bearing = { Mx, My, SG, ex: Mx / SG, ey: My / SG, Bsix: Bc / 6, Qo, dp, dm, Q1, Q2, Q3, Q4,
      Qmax: Math.max(Q1, Q2, Q3, Q4), Qmin: Math.min(Q1, Q2, Q3, Q4), qa: s.qa, qEdge: s.edge * s.qa };

    /* 7 – devrilme (ABD ocak sayfası 103-D-64) */
    const y = (B / 3) * cosA;
    const Lr = o.phi * w.Gpt / 2;
    const den = (2 / 3) * (B + T1);
    const Lox = (ld.Lu * y + ld.Vs.x * (T + To) - w.Gb * B / 3) / den;
    const Loy = (ld.Lu * y + ld.Vs.y * (T + To) - w.Gb * B / 3) / den;
    const LrRep = o.phi * w.GptReport / 2;
    out.overturn = { y, Lr, Lox, Loy, FSx: Lr / Lox, FSy: Lr / Loy, FSxReport: LrRep / Lox, FSyReport: LrRep / Loy, den };

    /* 8 – ayak donatısı (EC2 eğilme) */
    const c = o.coverPad;
    const flex = (Mu, bw, d) => {
      const K = Mu / (bw * d * d * fcd);
      const Kp = 0.21;
      let z = (d / 2) * (1 + Math.sqrt(Math.max(0, 1 - 3.53 * K)));
      z = Math.min(z, 0.95 * d);
      const As = Mu / (fyd * z);
      return { K, Kp, ok: K <= Kp, z, As };
    };
    // pad-1 alt (basınç)
    const dBot = T1 * 100 - c - 1.5 * rb.padBotPhi / 10;
    const Lcant = 0.5 * (Bc - B1 * 100);
    const Mxu = (Lcant * Lcant / 6) * (Q2 * (3 * Bc - Lcant) + Lcant * Q1);
    const Myu = (Lcant * Lcant / 6) * (Q2 * (3 * Bc - Lcant) + Lcant * Q3);
    const MuBot = Math.max(Mxu, Myu);
    out.padBot = { d: dBot, L: Lcant, Mxu, Myu, Mu: MuBot, ...flex(MuBot, Bc, dBot) };
    // pad-1 üst (çekme)
    const armU = (T + To) * 100 + o.armPadAllow;
    const Mxx = ld.Vs.x * armU, Myy = ld.Vs.y * armU; // report: Vx*(T+To) (çekme durumu kesmeleri aynı takım)
    const Quo = (ld.Lu - w.Gb) / (Bc * Bc - Ac * Ac);
    const Qu1 = Quo + ((Mxx - Myy) * 6) / Math.pow(Bc, 3), Qu2 = Quo + ((Mxx + Myy) * 6) / Math.pow(Bc, 3);
    const Qu3 = Quo - ((Mxx - Myy) * 6) / Math.pow(Bc, 3), Qu4 = Quo - ((Mxx + Myy) * 6) / Math.pow(Bc, 3);
    const Lu1 = 0.5 * (Bc - B1 * 100) + (T1 + T2) * 100 * Math.SQRT2 * ld.t;
    const MxuU = (Lu1 * Lu1 / 6) * (Qu2 * (3 * Bc - Lu1) + Lu1 * Qu1);
    const MyuU = (Lu1 * Lu1 / 6) * (Qu2 * (3 * Bc - Lu1) + Lu1 * Qu3);
    const MuTop = Math.max(MxuU, MyuU);
    const dTop = T1 * 100 - c - 1.5 * rb.padTopPhi / 10;
    out.padTop = { d: dTop, Quo, Qu1, Qu2, Qu3, Qu4, L: Lu1, Mu: MuTop, ...flex(MuTop, Bc, dTop) };
    // pad-2 üst (çekme)
    const Lu2 = 0.5 * (Bc - Ac) + (T1 + T2) * 100 * Math.SQRT2 * ld.t;
    const MxuP2 = (Lu2 * Lu2 / 6) * (Qu2 * (3 * Bc - Lu2) + Lu2 * Qu1);
    const MyuP2 = (Lu2 * Lu2 / 6) * (Qu2 * (3 * Bc - Lu2) + Lu2 * Qu3);
    const MuP2 = Math.max(MxuP2, MyuP2);
    const dP2 = (T1 + T2) * 100 - c - 1.5 * rb.pad2Phi / 10;
    out.pad2 = { d: dP2, L: Lu2, Mu: MuP2, ...flex(MuP2, B1 * 100, dP2) };
    // sağlanan donatı
    const Abot = rb.padBotN * barArea(rb.padBotPhi), Atop = rb.padTopN * barArea(rb.padTopPhi), A2 = rb.pad2N * barArea(rb.pad2Phi);
    out.padBot.Aprov = Abot; out.padTop.Aprov = Atop; out.pad2.Aprov = A2;
    out.padBot.util = out.padBot.As / Abot; out.padTop.util = out.padTop.As / Atop; out.pad2.util = out.pad2.As / A2;
    const Ag1 = T1 * 100 * Bc, Ag2 = T2 * 100 * B1 * 100;
    out.minSteel = { aci1: 0.0018 * Ag1, aci2: 0.0018 * Ag2, prov1: Abot + Atop, prov2: A2,
      ec1: 0.26 * 2.6 / 500 * Bc * dBot, ec2: 0.26 * 2.6 / 500 * B1 * 100 * dP2 };

    /* 9 – zımbalama */
    const dp2 = dP2;
    const u = 4 * Ac + 2 * PI * 2 * dp2;
    const Pr = ld.Lc / (Bc * Bc);
    const ApRep = 4 * Ac * 2 * dp2 + (PI * Math.pow(2 * dp2, 2)) / 4;
    const ApFull = Ac * Ac + 4 * Ac * 2 * dp2 + PI * Math.pow(2 * dp2, 2);
    const LpRep = ld.Lc - Pr * ApRep, LpFull = ld.Lc - Pr * ApFull;
    const kk = 1 + Math.sqrt(200 / (dp2 * 10));
    const fckMPa = m.fck / 10;
    const vRd = 0.035 * Math.pow(kk, 1.5) * Math.sqrt(fckMPa) * 10;
    out.punch = { d: dp2, u, Pr, ApRep, ApFull, LpRep, LpFull, vedRep: LpRep / (u * dp2), vedFull: LpFull / (u * dp2), k: kk, vRd };

    /* 3 – baca */
    const cc = o.coverChim + rb.stPhi / 10 + rb.chimPhi / 20;
    const armC = (T + To - T1 - T2) * 100 + o.armChimAllow;
    const MuxC = ld.Vch.x * armC, MuyC = ld.Vch.y * armC;
    const cap = chimneyMu(Ac, cc, rb.chimPhi, rb.chimN, fcd, fyd);
    const AsC = rb.chimN * barArea(rb.chimPhi);
    out.chimney = { arm: armC, Mux: MuxC, Muy: MuyC, Mu: cap.Mu, xNA: cap.x, ratioX: MuxC / cap.Mu, ratioY: MuyC / cap.Mu,
      util: MuxC / cap.Mu + MuyC / cap.Mu, As: AsC, pct: (AsC / (Ac * Ac)) * 100, AsMinACI: 0.01 * Ac * Ac,
      cc, stMax: Math.min(Ac * 10, 20 * rb.chimPhi, 300) };
    return out;
  }

  /* ---------------- otomatik donatı önerisi ---------------- */
  const PHI_LIST = [12, 14, 16, 18, 20, 22, 25];
  function pickMesh(AsReq, width_cm, cover, maxS, minS, wBar) {
    let best = null;
    for (const phi of PHI_LIST) {
      const a = barArea(phi);
      let n = Math.max(Math.ceil(AsReq / a), Math.ceil((width_cm - 2 * cover) / maxS) + 1, 3);
      for (; n < 80; n++) {
        const s = (width_cm - 2 * cover - phi / 10) / (n - 1);
        if (s >= minS) break;
      }
      const s = (width_cm - 2 * cover - phi / 10) / (n - 1);
      if (s < minS && n > 3) continue;
      const w = n * phi * phi;
      if (!best || w < best.w) best = { phi, n, s, w };
    }
    return best;
  }
  /* ---- alt/üst hasır eşleştirme ----
     spec = { reqAs(phi) → gereken As (cm²) ya da null, width (cm), cover (cm), maxS, minS (cm) }
     mode: 'free'  alt ve üst ayrı seçilir
           'eqN'   adetler eşit; daha zor hasır adedi belirler, diğerinin çapı gereken en küçük değere iner
           'eqPhi' çaplar eşit; her hasırın adedi kendi gereksinimine göre
           'eqPhiN' çap ve adet eşit: alt ve üst çubuklar birebir bağlanır */
  function meshRange(spec, phi) {
    const As = spec.reqAs(phi); if (As == null) return null;
    const span = spec.width - 2 * spec.cover, nMin = Math.max(Math.ceil(As / barArea(phi) - 1e-9), Math.ceil(span / spec.maxS) + 1, 3);
    const nMax = Math.floor((span - phi / 10) / spec.minS) + 1;
    if (nMin > nMax && nMin > 3) return null;
    return { nMin, nMax: Math.max(nMax, nMin) };
  }
  function meshBest(spec) {
    let best = null;
    for (const phi of PHI_LIST) { const r = meshRange(spec, phi); if (!r) continue; const w = r.nMin * phi * phi; if (!best || w < best.w) best = { phi, n: r.nMin, w }; }
    return best;
  }
  function padPairSelect(sb, st, mode) {
    const free = () => { const b = meshBest(sb), t = meshBest(st); return b && t ? { bot: { phi: b.phi, n: b.n }, top: { phi: t.phi, n: t.n } } : null; };
    if (!mode || mode === 'free') return free();
    const rb = PHI_LIST.map((p) => meshRange(sb, p)), rt = PHI_LIST.map((p) => meshRange(st, p));
    let best = null;
    const take = (w, bot, top) => { if (!best || w < best.w - 1e-9) best = { w, bot, top }; };
    if (mode === 'eqN') {
      for (let n = 3; n <= 120; n++) {
        const ib = rb.findIndex((r) => r && r.nMin <= n && n <= r.nMax), it = rt.findIndex((r) => r && r.nMin <= n && n <= r.nMax);   // en küçük uygun çap
        if (ib < 0 || it < 0) continue;
        take(n * (PHI_LIST[ib] ** 2 + PHI_LIST[it] ** 2), { phi: PHI_LIST[ib], n }, { phi: PHI_LIST[it], n });
      }
    } else if (mode === 'eqPhi') {
      PHI_LIST.forEach((p, i) => { if (rb[i] && rt[i]) take((rb[i].nMin + rt[i].nMin) * p * p, { phi: p, n: rb[i].nMin }, { phi: p, n: rt[i].nMin }); });
    } else if (mode === 'eqPhiN') {
      PHI_LIST.forEach((p, i) => { if (!rb[i] || !rt[i]) return; const n = Math.max(rb[i].nMin, rt[i].nMin); if (n <= Math.min(rb[i].nMax, rt[i].nMax)) take(2 * n * p * p, { phi: p, n }, { phi: p, n }); });
    }
    return best ? { bot: best.bot, top: best.top } : free();
  }
  /* eğilmeye göre gereken As (padMeshSelect ile aynı formül) */
  function flexSpec(Mu, widthCm, thickCm, cover, bw, fcd, fyd, minAs, maxS, minS) {
    return { width: widthCm, cover, maxS, minS, reqAs: (phi) => {
      const d = thickCm - cover - 1.5 * phi / 10; if (d <= 5) return null;
      const K = Mu / (bw * d * d * fcd); if (K > 0.21) return null;
      const z = Math.min(0.95 * d, (d / 2) * (1 + Math.sqrt(1 - 3.53 * K)));
      return Math.max(Mu / (fyd * z), minAs);
    } };
  }
  function autoRebar(inp) {
    const o = inp.opts, g = inp.geo;
    const tmp = JSON.parse(JSON.stringify(inp));
    // iterasyon: d, donatı çapına bağlı
    let rb = Object.assign({}, inp.rebar);
    let res;
    for (let it = 0; it < 4; it++) {
      tmp.rebar = rb;
      res = compute(tmp);
      const a1 = Math.max(res.padBot.As, 0.0009 * g.T1 * 100 * g.B * 100); // en az %0,09 (toplam %0,18'in yarısı)

      if (si.full) { const w = si.plateW / 200, c0 = ax(zB); body += `<polygon points="${[[-1, -1], [1, -1], [1, 1], [-1, 1]].map((q) => P(c0 + q[0] * w, -c0 + q[1] * w, zB).join(',')).join(' ')}" fill="#A39A86" stroke="#5A5444" stroke-width="1"/>`; }
      body += `<polyline points="${pt(zB).join(',')} ${pt(zT0).join(',')}" fill="none" stroke="#1F3A5F" stroke-width="3" stroke-dasharray="6 3" opacity=".7"/>` +
        `<polyline points="${pt(zT0).join(',')} ${pt(zT1).join(',')}" fill="none" stroke="#1F3A5F" stroke-width="5"/>`;
    }
    body += `<polygon points="${[[-h - R, -h - R, 0], [h + R, -h - R, 0], [h + R, h + R, 0], [-h - R, h + R, 0]].map((p) => P(...p).join(',')).join(' ')}" fill="none" stroke="${C.soilD}" stroke-dasharray="5 3" stroke-width="1.2"/>`;
    // yön göstergesi: +x, +y eksen okları (köşede)
    const ax0 = [W - 70, H - 50];
    const axv = [[1, 0, 'x'], [0, 1, 'y']].map((q) => { const dx = (q[0] * sp - q[1] * cp) * 28, dy = (q[0] * cp + q[1] * sp) * se * 28; return arrow(ax0[0], ax0[1], ax0[0] + dx, ax0[1] + dy, '#667', 1.4) + txt(ax0[0] + dx * 1.3, ax0[1] + dy * 1.3 + 4, q[2], { size: 11, fill: '#445', bold: true }); }).join('');
    body += axv + txt(ax0[0], ax0[1] + 26, `az ${Math.round(((v.az % 360) + 360) % 360)}° · el ${Math.round(v.el)}°`, { size: 9.5, fill: '#778' });
    const lg = [[C.orange, `4 yan kama: ${n1(out.w.wedges, 2)} m³ (düz yüzey)`], [C.green, `4 köşe çeyrek koni: ${n1(out.w.corners, 2)} m³`], ['#888', 'beton temel (referans)']];
    body += lg.map((l, i) => `<rect x="12" y="${312 + i * 18}" width="12" height="12" fill="${l[0]}" fill-opacity=".7"/>` + txt(30, 322 + i * 18, l[1], { anchor: 'start', size: 11 })).join('');
    body += txt(330, 22, `Zemin kaması: iç prizma (B²·T = ${n1(out.w.prism, 2)} m³) + yan kamalar + köşe konileri`, { size: 12, fill: C.navy, bold: true });
    return svg(W, H, body);
  }
  const rad = (d) => (d * PI) / 180;

  /* ---------- kesit ---------- */
  function section(inp, out, rbd) {
    const g = inp.geo, o = inp.opts, rb = inp.rebar;
    const Bc = g.B * 100, B1c = g.B1 * 100, Ac = g.A * 100, T1c = g.T1 * 100, T2c = g.T2 * 100, Tc = g.T * 100, Toc = g.To * 100;
    const c = o.coverPad, tg = o.grobeton ? o.grobetonT : 0, og = o.grobeton ? o.grobetonOver : 0;
    const topPad = inp.stub ? Math.max(inp.stub.top, 500) / 10 + 12 : 25;     // stub betondan en az 50 cm taşar
    const sc = Math.min(520 / Bc, 400 / (Tc + Toc + topPad));
    const W = 760, H = 110 + (Tc + Toc + topPad) * sc + tg * sc + 80;
    const ox = 380;                              // orta eksen
    const zb = 110 + (Tc + Toc + topPad) * sc;       // ayak tabanı (px)
    const X = (x) => ox + x * sc, Z = (z) => zb - z * sc; // z: ayak tabanından yukarı (cm)
    const groundZ = Tc;
    let s = '';
    s += `<rect x="20" y="${Z(groundZ)}" width="${W - 40}" height="${Z(-tg - 60) - Z(groundZ)}" fill="${C.soil}"/>`;
    s += `<line x1="20" y1="${Z(groundZ)}" x2="${W - 20}" y2="${Z(groundZ)}" stroke="${C.soilD}" stroke-width="2"/>`;
    s += txt(60, Z(groundZ) - 6, 'zemin yüzeyi', { size: 10, fill: C.soilD });
    if (o.grobeton) s += `<rect x="${X(-Bc / 2 - og)}" y="${Z(0)}" width="${(Bc + 2 * og) * sc}" height="${tg * sc}" fill="#E7E2D3" stroke="#555" stroke-dasharray="4 2"/>` + txt(X(Bc / 2 + og) + 6, Z(-tg / 2) + 4, `grobeton ${tg} cm`, { anchor: 'start', size: 10 });
    const rect = (x0, x1, z0, z1, fill, st) => `<rect x="${X(x0)}" y="${Z(z1)}" width="${(x1 - x0) * sc}" height="${(z1 - z0) * sc}" fill="${fill}" stroke="${st || '#333'}" stroke-width="1.3"/>`;
    s += rect(-Bc / 2, Bc / 2, 0, T1c, C.conc);
    s += rect(-B1c / 2, B1c / 2, T1c, T1c + T2c, C.conc);
    const si = stubInfo(inp), inc = si.inc, xo = si.xo, zTopC = Tc + Toc, z0 = T1c + T2c;
    if (inc) s += `<polygon points="${X(-Ac / 2)},${Z(z0)} ${X(Ac / 2)},${Z(z0)} ${X(Ac / 2 + xo(zTopC))},${Z(zTopC)} ${X(-Ac / 2 + xo(zTopC))},${Z(zTopC)}" fill="${C.conc}" stroke="#333" stroke-width="1.3"/>`;
    else s += rect(-Ac / 2, Ac / 2, z0, zTopC, C.conc);
    // donatılar
    const stroke = (col, w) => `stroke="${col}" stroke-width="${Math.max(1.2, w * sc)}" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
    const phiB = rb.padBotPhi / 10, phiT = rb.padTopPhi / 10, phiD = rb.pad2Phi / 10;
    const hook = (phi, width, thick) => (o.hookMode === 'L' ? Math.min(o.hookPhi * phi, thick - 2 * c) : 0);
    // alt hasır X yönü (çizgi) ve Y yönü (kesit noktaları)
    const zX = c + phiB / 2, zY = c + phiB + phiB / 2;
    let hk = hook(phiB, Bc, T1c);
    s += `<path d="M ${X(-Bc / 2 + c)} ${Z(zX + hk)} L ${X(-Bc / 2 + c)} ${Z(zX)} L ${X(Bc / 2 - c)} ${Z(zX)} L ${X(Bc / 2 - c)} ${Z(zX + hk)}" ${stroke(C.rebar, phiB)}/>`;
    const nB = rb.padBotN, pB = (Bc - 2 * c - phiB) / (nB - 1);
    for (let i = 0; i < nB; i++) s += `<circle cx="${X(-Bc / 2 + c + phiB / 2 + i * pB)}" cy="${Z(zY)}" r="${Math.max(2, phiB / 2 * sc)}" fill="${C.rebar}"/>`;
    // üst hasır
    const zTx = T1c - c - phiT / 2, zTy = T1c - c - phiT - phiT / 2;
    hk = hook(phiT, Bc, T1c);
    s += `<path d="M ${X(-Bc / 2 + c)} ${Z(zTx - hk)} L ${X(-Bc / 2 + c)} ${Z(zTx)} L ${X(Bc / 2 - c)} ${Z(zTx)} L ${X(Bc / 2 - c)} ${Z(zTx - hk)}" ${stroke('#1E7B34', phiT)}/>`;
    const nT = rb.padTopN, pT = (Bc - 2 * c - phiT) / (nT - 1);
    for (let i = 0; i < nT; i++) s += `<circle cx="${X(-Bc / 2 + c + phiT / 2 + i * pT)}" cy="${Z(zTy)}" r="${Math.max(2, phiT / 2 * sc)}" fill="#1E7B34"/>`;
    // pad-2 üst
    const zDx = T1c + T2c - c - phiD / 2, zDy = zDx - phiD;
    hk = hook(phiD, B1c, T2c);
    s += `<path d="M ${X(-B1c / 2 + c)} ${Z(zDx - hk)} L ${X(-B1c / 2 + c)} ${Z(zDx)} L ${X(B1c / 2 - c)} ${Z(zDx)} L ${X(B1c / 2 - c)} ${Z(zDx - hk)}" ${stroke('#7B3FA0', phiD)}/>`;
    const nD = rb.pad2N, pD = (B1c - 2 * c - phiD) / (nD - 1);
    for (let i = 0; i < nD; i++) s += `<circle cx="${X(-B1c / 2 + c + phiD / 2 + i * pD)}" cy="${Z(zDy)}" r="${Math.max(2, phiD / 2 * sc)}" fill="#7B3FA0"/>`;
    // baca boyuna (kesit düzleminde iki yüz çubuğu) + ayaklar
    const cc = rbd ? rbd.pts : [];
    const half = Ac / 2 - (o.coverChim + rb.stPhi / 10 + rb.chimPhi / 20);
    const zbBar = c + (rb.padBotPhi + rb.padBotPhi) / 10, zTop = Tc + Toc - o.coverChimTop, foot = (rbd && rbd.bars.find((b) => b.mark === 'K1')) || null;
    const ft = foot ? Math.min(foot.tail, Bc / 2 - c - half - 2 - Math.abs(xo(zbBar))) : 20;
    [-1, 1].forEach((sg) => {
      const bx = sg * half + xo(zbBar);       // eğimli baca: çubuk ayaktan uca tek doğru (stub ile paralel)
      s += `<path d="M ${X(bx + sg * (ft + 3))} ${Z(zbBar)} L ${X(bx)} ${Z(zbBar)} L ${X(sg * half + xo(zTop))} ${Z(zTop)}" ${stroke('#C77700', rb.chimPhi / 10)}/>`;
    });
    // etriyeler
    const nSt = Math.floor(((Tc + Toc - T1c - T2c) - 2 * o.coverChim) / rb.stS) + 1;
    for (let i = 0; i < nSt; i++) {
      const z = T1c + T2c + o.coverChim + i * rb.stS;
      if (z > Tc + Toc - o.coverChim) break;
      s += `<line x1="${X(xo(z) - Ac / 2 + o.coverChim)}" y1="${Z(z)}" x2="${X(xo(z) + Ac / 2 - o.coverChim)}" y2="${Z(z)}" stroke="#555" stroke-width="1.1"/>`;
    }
    // stub ve cleat'ler (boyutlar girdilerden)
    s += stubSvg(si, X, Z, sc, W);
    // ölçüler
    s += dimH(X(-Bc / 2), X(Bc / 2), Z(-tg) + 26, `B = ${n1(Bc)} cm`, -2);
    s += dimH(X(-B1c / 2), X(B1c / 2), Z(T1c + T2c) - 12, `B1 = ${n1(B1c)}`);
    s += dimH(X(-Ac / 2 + xo(zTopC)), X(Ac / 2 + xo(zTopC)), Z(Tc + Toc) - 14, `A = ${n1(Ac)}`);
    s += dimV(X(Bc / 2) + 24, Z(0), Z(T1c), `T1=${n1(T1c)}`);
    s += dimV(X(Bc / 2) + 24, Z(T1c), Z(T1c + T2c), `T2=${n1(T2c)}`);
    s += dimV(X(Bc / 2) + 56, Z(0), Z(Tc), `T = ${n1(Tc)} cm`);
    s += dimV(X(Bc / 2) + 56, Z(Tc), Z(Tc + Toc), `To=${n1(Toc)}`);
    // açıklama
    const leg = [[C.rebar, `Ayak alt hasır ${rb.padBotN}Φ${rb.padBotPhi}/yön`], ['#1E7B34', `Ayak üst hasır ${rb.padTopN}Φ${rb.padTopPhi}/yön`], ['#7B3FA0', `2. ayak üst ${rb.pad2N}Φ${rb.pad2Phi}/yön`], ['#C77700', `Baca ${rb.chimN}Φ${rb.chimPhi}`], ['#555', `Etriye Φ${rb.stPhi}/${rb.stS}`]];
    if (si.st) leg.push(['#7D8FA6', `Stub L${si.st.F1}×${si.st.t1} · ${si.st.nCleat} cleat`]);
    if (inc) leg.push(['#C9CED4', `Baca eğimli: tanα = ${n1(si.t, 4)}`]);
    s += leg.map((l, i) => `<rect x="24" y="${24 + i * 18}" width="14" height="4" fill="${l[0]}"/>` + txt(44, 30 + i * 18, l[1], { anchor: 'start', size: 11 })).join('');
    s += txt(W - 20, 24, `pas payı: ayak ${c} cm, baca ${o.coverChim} cm`, { anchor: 'end', size: 11, fill: '#555' });
    return svg(W, H, s);
  }

  /* ---------- plan ---------- */
  function plan(inp, out, rbd) {
    const g = inp.geo, o = inp.opts, rb = inp.rebar;
    const Bc = g.B * 100, B1c = g.B1 * 100, Ac = g.A * 100, c = o.coverPad;
    const og = o.grobeton ? o.grobetonOver : 0;
    const W = 640, H = 620, sc = 440 / (Bc + 2 * og), ox = 320, oy = 310;
    const X = (x) => ox + x * sc, Y = (y) => oy - y * sc;
    let s = '';
    if (o.grobeton) s += `<rect x="${X(-Bc / 2 - og)}" y="${Y(Bc / 2 + og)}" width="${(Bc + 2 * og) * sc}" height="${(Bc + 2 * og) * sc}" fill="#F3EFE4" stroke="#777" stroke-dasharray="5 3"/>`;
    s += `<rect x="${X(-Bc / 2)}" y="${Y(Bc / 2)}" width="${Bc * sc}" height="${Bc * sc}" fill="${C.conc}" fill-opacity=".45" stroke="#333" stroke-width="1.5"/>`;
    s += `<rect x="${X(-B1c / 2)}" y="${Y(B1c / 2)}" width="${B1c * sc}" height="${B1c * sc}" fill="none" stroke="#555" stroke-dasharray="6 3" stroke-width="1.3"/>`;
    const phiB = rb.padBotPhi / 10, pB = (Bc - 2 * c - phiB) / (rb.padBotN - 1);
    for (let i = 0; i < rb.padBotN; i++) {
      const p = -Bc / 2 + c + phiB / 2 + i * pB;
      s += `<line x1="${X(-Bc / 2 + c)}" y1="${Y(p)}" x2="${X(Bc / 2 - c)}" y2="${Y(p)}" stroke="${C.rebar}" stroke-width="1.2"/>`;
      s += `<line x1="${X(p)}" y1="${Y(-Bc / 2 + c)}" x2="${X(p)}" y2="${Y(Bc / 2 - c)}" stroke="${C.rebar}" stroke-width="1.2" stroke-opacity=".55"/>`;
    }
    const phiT = rb.padTopPhi / 10, pT = (Bc - 2 * c - phiT) / (rb.padTopN - 1);
    for (let i = 0; i < rb.padTopN; i++) {
      const p = -Bc / 2 + c + phiT / 2 + i * pT;
      s += `<line x1="${X(-Bc / 2 + c)}" y1="${Y(p)}" x2="${X(Bc / 2 - c)}" y2="${Y(p)}" stroke="#1E7B34" stroke-width="1" stroke-dasharray="7 4"/>`;
      s += `<line x1="${X(p)}" y1="${Y(-Bc / 2 + c)}" x2="${X(p)}" y2="${Y(Bc / 2 - c)}" stroke="#1E7B34" stroke-width="1" stroke-dasharray="7 4" stroke-opacity=".55"/>`;
    }
    const phiD = rb.pad2Phi / 10, pD = (B1c - 2 * c - phiD) / (rb.pad2N - 1);
    for (let i = 0; i < rb.pad2N; i++) {
      const p = -B1c / 2 + c + phiD / 2 + i * pD;
      s += `<line x1="${X(-B1c / 2 + c)}" y1="${Y(p)}" x2="${X(B1c / 2 - c)}" y2="${Y(p)}" stroke="#7B3FA0" stroke-width="1.6"/>`;
      s += `<line x1="${X(p)}" y1="${Y(-B1c / 2 + c)}" x2="${X(p)}" y2="${Y(B1c / 2 - c)}" stroke="#7B3FA0" stroke-width="1.6" stroke-opacity=".6"/>`;
    }
    // baca
    s += `<rect x="${X(-Ac / 2)}" y="${Y(Ac / 2)}" width="${Ac * sc}" height="${Ac * sc}" fill="#fff" stroke="#111" stroke-width="2"/>`;
    s += `<rect x="${X(-Ac / 2 + o.coverChim)}" y="${Y(Ac / 2 - o.coverChim)}" width="${(Ac - 2 * o.coverChim) * sc}" height="${(Ac - 2 * o.coverChim) * sc}" fill="none" stroke="#555" stroke-width="1.3"/>`;
    const si0 = stubInfo(inp), zbPlan = c + (rb.padBotPhi + rb.padBotPhi) / 10;
    (rbd ? rbd.bars.filter((b) => b.group === 'baca' && b.xy) : []).forEach((b) => {
      s += `<circle cx="${X(b.xy.x)}" cy="${Y(b.xy.y)}" r="${Math.max(3, rb.chimPhi / 20 * sc)}" fill="#C77700"/>` + txt(X(b.xy.x), Y(b.xy.y) - 6, b.mark, { size: 8.5 });
      const d = b.footDir;
      const ux = d.includes('+x') ? 1 : d.includes('−x') ? -1 : 0, uy = d.includes('+y') ? 1 : d.includes('−y') ? -1 : 0, nn = Math.hypot(ux, uy) || 1;
      const L = Math.max(b.tail, 5);
      const sh = si0.inc ? si0.xo(zbPlan) : 0;      // çubuk ayak kotunda eğimle kaymış (+x, −y)
      s += arrow(X(b.xy.x + sh), Y(b.xy.y - sh), X(b.xy.x + sh + ux / nn * L), Y(b.xy.y - sh + uy / nn * L), '#C77700', 1.2);
    });
    const si = stubInfo(inp);
    if (si.inc) {
      // eğimli baca: üst yüzün plandaki yeri (kesikli), stub ekseni oku
      const off = si.xo(si.topC);
      s += `<rect x="${X(-Ac / 2 + off)}" y="${Y(Ac / 2 - off)}" width="${Ac * sc}" height="${Ac * sc}" fill="none" stroke="#1F4E78" stroke-width="1.6" stroke-dasharray="6 3"/>` +
        arrow(X(0), Y(0), X(off), Y(-off), '#1F4E78', 1.6) + txt(X(off + Ac / 2) + 6, Y(-off - Ac / 2) + 14, 'baca üstü (eğimli)', { anchor: 'start', size: 10.5, fill: '#1F4E78' });
    }
    s += dimH(X(-Bc / 2), X(Bc / 2), Y(-Bc / 2) + 28 + og * sc, `B = ${n1(Bc)} cm`);
    s += dimH(X(-Ac / 2), X(Ac / 2), Y(Ac / 2) - 10, `A=${n1(Ac)}`);
    const leg = [[C.rebar, `Alt hasır: ${rb.padBotN}Φ${rb.padBotPhi} (s≈${n1(pB, 1)} cm)`], ['#1E7B34', `Üst hasır: ${rb.padTopN}Φ${rb.padTopPhi} (s≈${n1(pT, 1)} cm) – kesik çizgi`], ['#7B3FA0', `2. ayak: ${rb.pad2N}Φ${rb.pad2Phi} (s≈${n1(pD, 1)} cm)`], ['#C77700', 'Baca donatısı ve ayak yönü (ok)']];
    s += leg.map((l, i) => `<rect x="20" y="${20 + i * 18}" width="14" height="4" fill="${l[0]}"/>` + txt(40, 26 + i * 18, l[1], { anchor: 'start', size: 11 })).join('');
    return svg(W, H, s);
  }

  /* ---------- zemin / su altı şeması ---------- */
  function submerged(inp, out) {
    const sub = inp.soil.sub;
    const W = 640, H = 270;
    let s = `<rect x="10" y="60" width="300" height="160" fill="${C.soil}" stroke="${C.soilD}"/>` + `<rect x="330" y="60" width="300" height="160" fill="${C.soil}" stroke="${C.soilD}"/>`;
    s += `<rect x="330" y="110" width="300" height="110" fill="#8EC5E8" fill-opacity=".55"/>` + `<line x1="330" y1="110" x2="630" y2="110" stroke="#2E7DB0" stroke-width="2" stroke-dasharray="6 3"/>` + txt(560, 104, 'yeraltı suyu seviyesi', { size: 10.5, fill: '#2E7DB0' });
    [10, 330].forEach((x0) => { s += `<rect x="${x0 + 125}" y="150" width="50" height="46" fill="#B8BEC6" stroke="#333"/><rect x="${x0 + 140}" y="60" width="20" height="90" fill="#B8BEC6" stroke="#333"/>`; });
    s += txt(160, 40, 'Kuru zemin', { size: 13, bold: true, fill: C.navy });
    s += txt(160, 240, `γ zemin = ${n1(inp.soil.gdry)} daN/m³ · γ beton = ${n1(inp.mat.gcDens)}`, { size: 11 });
    s += txt(480, 40, 'Suya doygun zemin (C4.2)', { size: 13, bold: true, fill: C.navy });
    s += txt(480, 240, `γ' = γsat − γw = ${n1(inp.soil.gsat)} − ${n1(1000)} = ${n1(inp.soil.gsat - 1000)} · beton ${n1(inp.mat.gcDens - 1000)}`, { size: 11 });
    s += arrow(320 + 40, 200, 320 + 40, 150, '#2E7DB0', 2.5) + txt(375, 150, 'kaldırma', { size: 10, fill: '#2E7DB0', anchor: 'start' });
    s += arrow(380, 130, 380, 175, '#888', 0);
    return svg(W, H, s);
  }

  /* ---------- kontrol şemaları (küçük) ---------- */
  function schemeUplift(out) {
    return svg(260, 190, `<rect x="30" y="140" width="200" height="30" fill="#B8BEC6" stroke="#333"/><rect x="115" y="40" width="30" height="100" fill="#B8BEC6" stroke="#333"/>` +
      `<polygon points="30,140 230,140 250,60 10,60" fill="${C.cone}" fill-opacity=".6" stroke="${C.soilD}" stroke-dasharray="4 3"/>` +
      arrow(130, 38, 130, 4, C.red, 3) + txt(165, 16, `Lu=${n1(out.ld.Lu)}`, { fill: C.red, size: 11, anchor: 'start', bold: true }) +
      arrow(60, 84, 60, 128, C.green, 3) + txt(70, 100, `Gpt=${n1(out.w.Gpt)}`, { size: 10, fill: '#1E7B34', anchor: 'start' }) +
      arrow(130, 160, 130, 186, C.blue, 0) + txt(130, 183, `Gb=${n1(out.w.Gb)}`, { size: 10, fill: C.blue }));
  }
  function schemeGroup(out, inp) {
    const g = out.group, B = inp.geo.B, R = inp.geo.T * out.w.tb;
    if (!g) return '';
    const W = g.lx + B + 2 * R, H = g.ly + B + 2 * R, sc = Math.min(230 / W, 150 / H), ox = 130 - (g.lx * sc) / 2, oy = 90 - (g.ly * sc) / 2;
    let s = '';
    [[0, 0], [1, 0], [0, 1], [1, 1]].forEach((p) => {
      const cx = ox + p[0] * g.lx * sc, cy = oy + p[1] * g.ly * sc, hw = (B / 2 + R) * sc;
      s += `<rect x="${cx - hw}" y="${cy - hw}" width="${2 * hw}" height="${2 * hw}" rx="${R * sc}" fill="${C.cone}" fill-opacity=".38" stroke="${C.soilD}" stroke-dasharray="4 3"/>`;
    });
    [[0, 0], [1, 0], [0, 1], [1, 1]].forEach((p) => {
      const cx = ox + p[0] * g.lx * sc, cy = oy + p[1] * g.ly * sc;
      s += `<rect x="${cx - (B / 2) * sc}" y="${cy - (B / 2) * sc}" width="${B * sc}" height="${B * sc}" fill="#B8BEC6" stroke="#333"/><circle cx="${cx}" cy="${cy}" r="2.5" fill="#333"/>`;
    });
    s += txt(130, 12, `X = ${n1(g.lx, 2)} m · Y = ${n1(g.ly, 2)} m`, { size: 10 }) + txt(130, 184, `çakışan hacim X ${n1(g.Vx, 1)} · Y ${n1(g.Vy, 1)} m³`, { size: 10, fill: g.FS >= 1 ? '#1E7B34' : C.red, bold: true });
    return svg(260, 190, s);
  }
  function schemeBearing(out) {
    const b = out.bearing;

  /* ---------- duyarlılık grafiği: bir parametreyi tara, doluluk çizgileri + uygun aralık ---------- */

    for (let i = 0; i <= nt; i++) { const v = x0 + ((x1 - x0) * i) / nt; s += `<line x1="${X(v)}" y1="${H - mb}" x2="${X(v)}" y2="${H - mb + 4}" stroke="#667"/>` + txt(X(v), H - mb + 16, n1(v * unitScale, unitScale === 1 ? 1 : 0), { size: 10.5, fill: '#445' }); }

  /* Gereken-boyut eğrisi: pts = [{x, y|null, concrete}], cur = {x, y}; sx/sy: model→gösterim çarpanı */

    for (let i = 0; i <= 5; i++) {
      const yv = y0 + ((y1 - y0) * i) / 5, yy = Y(yv), cv = c0 + ((c1 - c0) * i) / 5;

    const mn = ok.reduce((a, b) => (b.concrete < a.concrete ? b : a));

<script>

(function (root) {
  'use strict';
