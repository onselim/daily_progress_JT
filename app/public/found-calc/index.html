Gpt + Gb\n237|Charge d'arrachement Lu\n238|Arrachement FS\n239|Ancrage du stub et des cleats\n240|L#×#×#, dans le béton # mm\n241|Charge axiale P\n242|Pc = #, Pu = # daN\n243|Aire du profilé An ≥ Amin\n244|Adhérence Bc = lb·L#·fb\n245|Écrasement des cleats Gc (# pcs)\n246|Boulons Sb (# × M#)\n247|Tenue dans le béton\n248|Tenue du cleat dans la cage d'armatures intérieure\n249|bout de cleat # ≤ cage # cm · A nécessaire ≥ # m\n250|Le dessin montre le stub et les cleats avec les dimensions du rapport. Les positions des cleats sont symboliques (espacement dans Données → section Stub). Détails : onglet Étapes de calcul, étape #.\n251|Comment fonctionne l'optimisation ? (pas de point de départ, on balaye)\n252|Évaluation d'une conception :\n253|pour les dimensions données (B, B#, T, T#, T#, A…) on calcule les charges, le poids du coin de sol, l'arrachement, la portance, le renversement, le poinçonnement, la flexion de la semelle, les vérifications du fût et du stub ; les armatures de la semelle et du fût sont choisies automatiquement pour cette taille. Si toutes les vérifications sont ≤ #%, la conception est\n254|acceptable\n255|.\n256|« Résoudre » (minimum de béton / d'armatures / de fouille) :\n257|chaque combinaison\n258|des paramètres marqués « libres » (par défaut B et T) dans la plage est\n259|essayée tour à tour (B par pas de # mm, T par pas de # mm ≈ # conceptions, quelques secondes). Parmi les conceptions acceptables, on retient celle qui a le moins de béton, le moins d'armatures, la moindre fouille et le coût le plus bas. Aucune amélioration à partir d'une conception de départ n'est faite ; le résultat ne dépend pas de la valeur de départ.\n260|Courbe de dimension nécessaire :\n261|pour chaque valeur de T, B est augmenté de petit à grand par pas de # mm ; la première valeur satisfaisant toutes les vérifications est trouvée puis affinée jusqu'à # mm. La même logique donne « T nécessaire pour un B fixe ».\n262|Ce qui reste fixe :\n263|les paramètres non marqués libres (T#, T#, B#, A, To, β, qa) gardent leur valeur de l'onglet Conception ; l'optimum en dépend. Pour un meilleur résultat, cochez « libre » pour la case concernée (la recherche s'allonge, le pas grossit automatiquement).\n264|Pourquoi cet optimum ?\n265|Quand la profondeur augmente, le coin de sol grandit et le B nécessaire à l'arrachement diminue ; mais quand T devient trop grand, le poids du sol/béton au-dessus de la semelle limite la portance et B augmente de nouveau. Le minimum de béton se situe près du point de croisement où l'arrachement et la portance se limitent mutuellement.\n266|Courbe de dimension nécessaire – « quelle largeur de semelle à cette profondeur ? »\n267|Objectif :\n268|En faisant varier un paramètre (p. ex. la profondeur T),\n269|pour satisfaire tous les critères de conception,\n270|voir la valeur minimale que doit avoir l'autre paramètre (p. ex. la largeur de semelle B). La ligne bleue est le plus petit B nécessaire pour chaque T ; au-dessus de la ligne se trouve la zone acceptable. La ligne orange est le volume de béton de cette conception, le point marqué est la combinaison à\n271|béton minimal\n272|(optimum). Les autres dimensions restent à leur valeur de l'onglet Conception ; à chaque point, les armatures de la semelle et du fût sont choisies automatiquement.\n273|Paramètre que vous faites varier (X)\n274|Nécessaire (Y)\n275|X minimum (mm)\n276|X maximum (mm)\n277|Tracer la courbe\n278|Appuyez sur « Tracer la courbe » (quelques secondes).\n279|Changer un paramètre, garder les autres fixes\n280|Voir pour quelles valeurs du paramètre choisi tous les critères de conception sont satisfaits. Les lignes montrent le taux de travail (charge/capacité) de chaque critère ; sous la ligne #% c'est sûr, la bande verte est la plage acceptable. Toutes les autres dimensions restent à leur valeur de l'onglet\n281|.\n282|minimum\n283|maximum\n284|Profondeur T (sous la semelle) (mm)\n285|actuel\n286|Portance moy.\n287|Portance angle\n288|Flexion semelle (K t du sol\n337|Différence = T#·B²·γsol = # daN. Cette différence influence aussi la vérification au renversement (résistance Gpt/#).\n338|Chaque fiche :\n339|objectif\n340|→ schéma → calcul chiffré → résultat. Les chiffres sont calculés en direct à partir des données du panneau de gauche.\n341|Charges : du repère cartésien à l'axe incliné\n342|Le programme du pylône fournit pour chaque jambe des efforts horizontaux (X, Y) et verticaux (Z). Le stub et la fondation, eux, travaillent suivant\n343|l'axe incliné\n344|de la jambe ; la charge est ramenée à cet axe et majorée de #% comme l'exige le cahier des charges. Les efforts tranchants ne sont pas majorés.\n345|Z (vertical)\n346|P incliné\n347|P = Z·√(#+#tan²α)\n348|Charge axiale arrachement / compression\n349|donnée\n350|Cisaillement (sol) / (fût)\n351|Charges de fondation\n352|Lu = # × P arrachement\n353|Lc = # × P compression\n354|Sol et poids volumiques (sec / sous l'eau)\n355|C'est le poids qui s'oppose à l'arrachement. Si le sol est sous l'eau, chaque corps s'allège du poids de l'eau déplacée (# daN/m³) (Archimède) : sol γsat → γsat − #, béton # → # daN/m³. C'est pourquoi la résistance baisse et la fondation grossit dans les classes saturées.\n356|niveau de la nappe\n357|Sol sec\n358|γ sol = # daN/m³ · γ béton = #\n359|Sol saturé (C#)\n360|γ' = γsat − γw = # − # = # · béton #\n361|poussée\n362|Capacité portante qa / en rive\n363|Poids volumique du sol (effectif)\n364|sec\n365|Masse volumique du béton (effective)\n366|Angle du coin β\n367|tanβ = #\n368|fcd = fck/γc\n369|fyd = fy/γs\n370|Volume et poids du béton\n371|Le poids propre de la fondation est une part petite mais certaine de la résistance à l'arrachement. Trois parties sont calculées séparément : semelle, #e semelle, fût.\n372|Lu=#\n373|Gpt=#\n374|Gb=#\n375|Semelle : T#·B²\n376|#e semelle : T#·B#²\n377|Fût : A²·(T+To−T#−T#)\n378|Béton total Vb\n379|Gb = Vb × γc\n380|Coin de sol : pièce par pièce\n381|Quand la charge d'arrachement tire la fondation vers le haut, la masse de sol en tronc de cône au-dessus est soulevée aussi ; son poids s'ajoute à la résistance. Les faces latérales sont planes (coin prismatique), les angles coniques (quarts de cône). Comme il y a du béton dans le coin, le volume occupé par le béton doit être déduit du poids du sol.\n382|① Prisme : B²·T\n383|② # coins latéraux : #·B·T²·tanβ\n384|③ # quarts de cône d'angle : (π/#)·T³·tan²β\n385|Coin total (①+②+③)\n386|− Fût : A²·(T−T#−T#)\n387|− #e semelle : T#·B#²\n388|Vpt – méthode du rapport\n389|#e semelle non déduite\n390|− #e semelle : T#·B² (correction)\n391|volume hors sol\n392|Vpt – retenu\n393|Gpt = Vpt × γsol\n394|Sol au-dessus de la semelle (pour la portance)\n395|Vat = B²(T−T#) − A²(T−T#−T#) − T#·B#²\n396|Gat = Vat × γsol\n397|Méthode corrigée : les # parties de béton ont toutes été déduites du coin.\n398|Vérification à l'arrachement (extraction)\n399|La fondation se soulève-t-elle quand on la tire vers le haut ? Résistance : poids du béton + poids du coin de sol. La charge étant déjà pondérée, un coefficient de sécurité ≥ # est exigé (le rapport n'a pas de coefficient supplémentaire côté résistance).\n400|Résistance R = φ·(Gb + Gpt)\n401|FS = R / Lu\n402|méthode du rapport (#e semelle comptée)\n403|corrigée (#e semelle déduite)\n404|✔ Arrachement satisfait : FS = #\n405|Portance : pression du sol\n406|Le sol sous la fondation peut-il porter la charge de compression et la flexion due à l'effort horizontal ? La pression moyenne ne doit pas dépasser qa, la pression d'angle ne doit pas dépasser #·qa, et il ne doit pas y avoir de traction (pression négative) aux angles.\n407|Lc=#\n408|min #\n409|max # daN/cm²\n410|Moments : M = V·(T+To+#)\n411|ΣG = Lc + Gat + Gb\n412|Excentricité e = M/ΣG\n413|Pression moyenne Qo = ΣG/B²\n414|Part du moment (Mx±My)·#/B³\n415|Maximale / minimale\n416|✔ Portance satisfaite\n417|Renversement\n418|L'arrachement et l'effort horizontal tentent de renverser la fondation autour d'un angle de la semelle (A). La résistance est la moitié du coin de sol (Gpt/#) ; la force de renversement se déduit du moment Lu·y + V·(T+To) − Gb·B/# divisé par le bras ⅔(B+T#) (ancienne feuille US de référence #-D-#).\n419|A (point de rotation)\n420|Lu·y\n421|V·(T+To)\n422|Gpt/# + Gb\n423|y = B/#·cosα\n424|Résistance Lr = φ·Gpt/#\n425|Lox = [Lu·y + Vx(T+To) − Gb·B/#] / ⅔(B+T#)\n426|Loy (avec Vy)\n427|méthode du rapport : # · #\n428|✘ Renversement non satisfait\n429|Armatures de la semelle (flexion – Eurocode #)\n430|La semelle fléchit comme une console, poussée vers le haut par le sol (cas de compression) et tirée par le haut par la jambe en arrachement. Les armatures nécessaires se déduisent du moment de flexion avec K = Mu/(b·d²·fcd), z = d/#·[#+√(#−#K)] ≤ #d, As = Mu/(fyd·z) ; les armatures choisies doivent les satisfaire.\n431|pression du sol (flexion en console)\n432|Mu = L²/#·[Q#(#B−L)+L·Q#]\n433|Semelle inférieure (cas de compression)\n434|d = T# − enrobage − #Φ\n435|Console L = ½(B−B#) · Mu\n436|As nécessaire · choisi\n437|Semelle supérieure (cas d'arrachement)\n438|d · L · Mu\n439|#e semelle supérieure (cas d'arrachement)\n440|Armatures minimales\n441|ACI #%·Ag (semelle / #e semelle)\n442|EC# #·fctm/fyk·b·d : # / # cm²\n443|✔ Armatures de la semelle : suffisantes\n444|En transmettant la charge à la semelle, le fût tend à la poinçonner comme un emporte-pièce. La contrainte de cisaillement sur le contour critique à #d du fût ne doit pas dépasser la résistance minimale au cisaillement du béton (type EC#).\n445|contour critique : à #d du fût\n446|d = T#+T# − enrobage − #Φ\n447|Contour critique u = #A + #π(#d)\n448|Pression nette Pr = Lc/B²\n449|Aire (du rapport) Ap · Lp = Lc − Pr·Ap\n450|Ap = # cm²\n451|Contrainte Ved = Lp/(u·d)\n452|méthode du rapport\n453|avec l'aire géométrique complète\n454|VRd = #·k^#·√fck\n455|✔ Poinçonnement satisfait : #%\n456|Armatures du fût et cadres\n457|Le fût est le poteau qui transmet la charge du stub à la semelle. Le stub reprend la charge axiale ; il reste au fût l <script>
/* Sehpa (üst hasır taşıyıcı) donatısı ve 12 m boydan kesim planı – istinat ve temel araçlarında ortak.
   Birimler: m, kg. Sehpa şekli: ayaklı köprü (Π): ayak – düşey – üst – düşey – ayak.
   Kesim: her çap için en uzun parçadan başlayarak 12 m çubuklara yerleştirme (first-fit decreasing);
   12 m'den uzun parçalar tam boy + kalan parça olarak bölünür (bindirme payı parça boyuna zaten dahildir).
   Sehpalar önce bu kesimden artan firelerden (çapı en az sehpa çapı olan, boyu yeten parçalardan) çıkarılır, eksik kalan yeni çubuktan kesilir. */
(function (root) {
  'use strict';
  const unitW = (phi) => (phi * phi) / 162.2;                                  // kg/m
  const PHIS = [10, 12, 14, 16, 18, 20, 22, 25, 28, 32];
  const up = (p) => PHIS.find((x) => x >= p) || 32;
  const EPS = 1e-6;

  /* sehpa çapı: taşınan üst donatıdan ince olmasın, en az Φ12; yükseklik arttıkça burkulmaya karşı kalınlaşır */
  function chairPhi(h, topPhi, sel) {
    if (sel > 0) return sel;
    let p = Math.max(12, up(topPhi || 12));
    if (h > 0.5) p = Math.max(p, 16);
    if (h > 0.9) p = Math.max(p, 20);
    if (h > 1.4) p = Math.max(p, 25);
    return p;
  }
  /* Π sehpa ölçüleri: h (m) iki hasır arasındaki net yükseklik, sp sehpa aralığı */
  function chairShape(h, phi, o) {
    o = o || {};
    const foot = o.foot != null ? o.foot : Math.max(0.15, 12 * phi / 1000), top = o.top != null ? o.top : Math.max(0.30, 25 * phi / 1000);
    const hh = Math.max(0.05, h);
    return { foot, h: hh, top, len: 2 * foot + 2 * hh + top };
  }
  /* alan üzerinde sehpa adedi: her yönde en az 2 sıra, aralık ≈ sp */
  function grid(Lx, Ly, sp) {
    const nx = Math.max(2, Math.round(Lx / sp)), ny = Math.max(2, Math.round(Ly / sp));
    return { nx, ny, n: nx * ny, sx: Lx / nx, sy: Ly / ny };
  }
  /* kesim planı: items = [{ phi, len (m), n, mark }] */
  function cutPlan(items, stock) {
    stock = stock || 12;
    const byPhi = {};
    items.forEach((it) => {
      if (!(it.n > 0) || !(it.len > 0)) return;
      const g = byPhi[it.phi] || (byPhi[it.phi] = { phi: it.phi, pieces: [], full: 0, net: 0 });
      g.net += it.len * it.n;
      const nf = Math.floor((it.len + EPS) / stock), rem = it.len - nf * stock;
      g.full += nf * it.n;
      if (rem > 0.005) for (let i = 0; i < it.n; i++) g.pieces.push({ len: rem, mark: it.mark });
    });
    const out = [];
    Object.keys(byPhi).map(Number).sort((a, b) => a - b).forEach((phi) => {
      const g = byPhi[phi], bins = [];
      g.pieces.sort((a, b) => b.len - a.len);
      g.pieces.forEach((p) => {
        let best = null;
        for (const b of bins) if (b.free + EPS >= p.len && (!best || b.free < best.free)) best = b;   // en sıkı yerleşen (best-fit)
        if (!best) { best = { free: stock, cuts: [] }; bins.push(best); }
        best.free -= p.len; best.cuts.push(p);
      });
      const bars = g.full + bins.length, buy = bars * stock;
      out.push({ phi, bars, buy, net: g.net, waste: buy - g.net, offcuts: bins.map((b) => b.free).filter((x) => x > 0.005).sort((a, b) => b - a), bins });
    });
    return out;
  }
  /* sehpaları firelerden üret; kalan sehpalar yeni çubuktan */
  function chairsFrom(plan, ch, stock) {
    stock = stock || 12;
    const res = { n: ch.n, phi: ch.phi, len: ch.len, fromOff: 0, kgOff: 0, newBars: 0, fromNew: 0, used: [] };
    if (!(ch.n > 0)) return res;
    let need = ch.n;
    if (ch.useOffcuts !== false) {
      plan.filter((g) => g.phi >= ch.phi).sort((a, b) => a.phi - b.phi).forEach((g) => {
        g.offcuts.forEach((L, i) => {
          if (need <= 0) return;
          const k = Math.min(need, Math.floor((L + EPS) / ch.len));
          if (k > 0) { need -= k; res.fromOff += k; res.kgOff += k * ch.len * unitW(g.phi); g.offcuts[i] = L - k * ch.len; const u = res.used.find((x) => x.phi === g.phi); if (u) u.n += k; else res.used.push({ phi: g.phi, n: k }); }
        });
      });
    }
    res.fromNew = need;
    const per = Math.max(1, Math.floor((stock + EPS) / ch.len));
    res.newBars = Math.ceil(need / per);
    res.kgNew = need * ch.len * unitW(ch.phi);
    res.kgBuyNew = res.newBars * stock * unitW(ch.phi);
    res.kg = res.kgOff + res.kgNew;
    return res;
  }
  /* özet: net, satın alınan, fire (sehpalar dahil) */
  function summary(plan, chs, stock) {
    stock = stock || 12;
    let net = 0, buy = 0;
    plan.forEach((g) => { net += g.net * unitW(g.phi); buy += g.buy * unitW(g.phi); });
    const ch = chs || { kg: 0, kgBuyNew: 0, kgOff: 0 };
    const netAll = net + (ch.kg || 0), buyAll = buy + (ch.kgBuyNew || 0);
    return { net, buy, netAll, buyAll, waste: buyAll - netAll, wastePct: buyAll > 0 ? (buyAll - netAll) / buyAll * 100 : 0,
      wasteNoChair: buy - net, wastePctNoChair: buy > 0 ? (buy - net) / buy * 100 : 0 };
  }
  const api = { unitW, chairPhi, chairShape, grid, cutPlan, chairsFrom, summary };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.Sehpa = api;
})(typeof window !== 'undefined' ? window : globalThis);

    const Gpt = Vpt * gsEff;
    const GptReport = VptReport * gsEff;
    // taban ayağı üstündeki zemin
    const Vat = B * B * (T - T1) - A * A * (T - T1 - T2) - T2 * B1 * B1;
    const Gat = Vat * gsEff;
    return { tb, gcEff, gsEff, Vpad1, Vpad2, Vchim, Vb, Gb, prism, wedges, corners, cone, subChim, subPad2, subPad1,
      VptReport, VptFixed, Vpt, Gpt, GptReport, Vat, Gat, R: T * tb };
  }

  /* ---------------- kesit analizi: baca (N = 0) ---------------- */
  function ringBars(n, Acm, cc) {
    // n adet, 4 köşe + her kenarda eşit aralık; ordinat = basınç yüzeyinden uzaklık
    const per = n / 4;
    const s = Acm - 2 * cc;
    const pts = [];
    for (let i = 0; i <= per; i++) pts.push({ x: cc + (s * i) / per, y: cc });               // alt kenar
    for (let i = 1; i <= per; i++) pts.push({ x: cc + s, y: cc + (s * i) / per });            // sağ
    for (let i = per - 1; i >= 0; i--) pts.push({ x: cc + (s * i) / per, y: cc + s });        // üst
    for (let i = per - 1; i >= 1; i--) pts.push({ x: cc, y: cc + (s * i) / per });            // sol
    return pts;
  }
  function chimneyMu(Acm, cc, phiMm, n, fcd, fyd) {
    const a = barArea(phiMm), Es = 2.04e6, ecu = 0.0035;
    const pts = ringBars(n, Acm, cc);
    const ys = pts.map((p) => p.y);
    const f = (x) => {
      let F = 0.8 * Math.min(x, Acm / 0.8) * Acm * fcd;
      for (const y of ys) {
        const eps = (ecu * (x - y)) / x;
        F += Math.max(-fyd, Math.min(fyd, Es * eps)) * a;
      }
      return F;
    };
    let lo = 0.5, hi = 3 * Acm;
    for (let i = 0; i < 80; i++) { const mid = (lo + hi) / 2; if (f(mid) < 0) lo = mid; else hi = mid; }
    const x = (lo + hi) / 2;
    let M = 0.8 * Math.min(x, Acm / 0.8) * Acm * fcd * (Acm / 2 - 0.4 * Math.min(x, Acm / 0.8));
    for (const y of ys) {
      const eps = (ecu * (x - y)) / x;
      M += Math.max(-fyd, Math.min(fyd, Es * eps)) * a * (Acm / 2 - y);
    }
    return { Mu: M, x, nBars: pts.length, pts };
  }

  /* ---------------- kama çakışması: komşu iki ayağın zemin kamaları ----------------
     Plan kesitinde her yükseklikte kama = (B×B kare) ⊕ (r yarıçaplı daire), r = h·tanβ (h: taban ayağından yukarı).
     dx,dy: iki ayağın merkezleri arası mesafe. Dönüş: ortak hacim (m³). */
  function wedgeOverlap(B, T, tb, dx, dy) {
    const a = B / 2, R = T * tb;
    if (Math.abs(dx) >= 2 * (a + R) || Math.abs(dy) >= 2 * (a + R)) return 0;
    const NH = 16, NY = 48;
    let V = 0;
    for (let i = 0; i < NH; i++) {
      const r = ((i + 0.5) / NH) * R;
      const hw = (d) => { d = Math.abs(d); return d <= a ? a + r : d <= a + r ? a + Math.sqrt(r * r - (d - a) * (d - a)) : 0; };
      const y0 = Math.max(-(a + r), dy - (a + r)), y1 = Math.min(a + r, dy + a + r);
      if (y1 <= y0) continue;
      const st = (y1 - y0) / NY;
      let A = 0;
      for (let j = 0; j < NY; j++) {
        const y = y0 + (j + 0.5) * st, h1 = hw(y), h2 = hw(y - dy);
        const len = Math.min(h1, dx + h2) - Math.max(-h1, dx - h2);
        if (len > 0) A += len * st;
      }
      V += A * (T / NH);
    }
    return V;
  }

  /* ---------------- ana hesap ---------------- */
  function compute(inp) {
    const g = inp.geo, s = inp.soil, m = inp.mat, o = inp.opts, rb = inp.rebar;
    const { A, To, T1, T2, T, B, B1 } = g;
    const fcd = m.fck / m.gc, fyd = m.fy / m.gs;
    const ld = computeLoads(inp);
    const w = computeWeights(inp);
    const out = { ld, w, fcd, fyd };
    const Bc = B * 100, Ac = A * 100;
    const cosA = 1 / Math.sqrt(1 + ld.t * ld.t);

    /* 5 – uplift */
    const Rup = o.phi * (w.Gb + w.Gpt);
    out.uplift = { Lu: ld.Lu, Gb: w.Gb, Gpt: w.Gpt, R: Rup, FS: Rup / ld.Lu,
      FSreport: (o.phi * (w.Gb + w.GptReport)) / ld.Lu, FSfixed: (o.phi * (w.Gb + w.VptFixed * w.gsEff)) / ld.Lu,
      FSvertical: ld.Lu ? (o.phi * (w.Gb + w.Gpt)) / (ld.Lu * (inp.loads.mode === 'tower' ? 1 / ld.k : 1)) : 0 };

    /* 5b – kama çakışması (ayak aralığı girildiyse): aynı zemin iki ayağa birden sayılamaz.
       Rüzgârın vurduğu yüzde iki ayak birlikte çekilir → ortak hacmin yarısı her ayağın kama ağırlığından düşülür. */
    /* Gövde boyu (body extension) bazında: temel tüm gövdelerde aynıdır; alçak gövdede ayak aralığı dardır ama yükler de çok azdır.
       Ana satır = girdilerdeki (en yüksek gövde) yük ve ayak aralığı; diğer gövdeler loads.bodies listesinden (çekme yükü oranıyla ölçeklenir). */
    const lgx = +inp.loads.legX, lgy = +inp.loads.legY, mainZ = inp.loads.mode === 'tower' ? +inp.loads.Zu : +inp.loads.PuAx, cases = [];
    if (lgx > 0 && lgy > 0) cases.push({ name: '', main: true, lx: lgx, ly: lgy, ratio: 1 });
    (inp.loads.bodies || []).forEach((b) => { const lx = +b.legX, ly = +b.legY, z = +b.Z; if (lx > 0 && ly > 0 && z > 0 && mainZ > 0) cases.push({ name: b.name || '', main: false, lx, ly, ratio: z / mainZ }); });
    if (cases.length) {
      const rows = cases.map((c) => {
        const Vx = wedgeOverlap(B, T, w.tb, c.lx, 0), Vy = wedgeOverlap(B, T, w.tb, 0, c.ly), Vd = wedgeOverlap(B, T, w.tb, c.lx, c.ly);
        const Vmax = Math.max(Vx, Vy), dG = 0.5 * Vmax * w.gsEff, LuI = ld.Lu * c.ratio;
        return Object.assign({}, c, { Vx, Vy, Vd, Vmax, dG, Lu: LuI, FS: (o.phi * (w.Gb + w.Gpt - dG)) / LuI, collide: Math.min(c.lx, c.ly) < B + 0.05 });
      });
      const worst = rows.reduce((a, b) => (b.FS < a.FS ? b : a));
      out.group = { rows, worst, lx: worst.lx, ly: worst.ly, Vx: worst.Vx, Vy: worst.Vy, Vd: worst.Vd, Vmax: worst.Vmax, dG: worst.dG, FS: worst.FS, Lcrit: B + 2 * T * w.tb, collide: rows.some((c) => c.collide) };
    } else out.group = null;

    /* 6 – bearing */
    const armB = (T + To + 0.1) * 100;
    const Mx = ld.Vs.x * armB, My = ld.Vs.y * armB;
    const SG = ld.Lc + w.Gat + w.Gb;
    const Qo = SG / (Bc * Bc);
    const dp = ((Mx + My) * 6) / Math.pow(Bc, 3), dm = ((Mx - My) * 6) / Math.pow(Bc, 3);
    const Q1 = Qo + dm, Q2 = Qo + dp, Q3 = Qo - dm, Q4 = Qo - dp;
    out.bearing = { Mx, My, SG, ex: Mx / SG, ey: My / SG, Bsix: Bc / 6, Qo, dp, dm, Q1, Q2, Q3, Q4,
      Qmax: Math.max(Q1, Q2, Q3, Q4), Qmin: Math.min(Q1, Q2, Q3, Q4), qa: s.qa, qEdge: s.edge * s.qa };

    /* 7 – devrilme (ABD ocak sayfası 103-D-64) */
    const y = (B / 3) * cosA;
    const Lr = o.phi * w.Gpt / 2;
    const den = (2 / 3) * (B + T1);
    const Lox = (ld.Lu * y + ld.Vs.x * (T + To) - w.Gb * B / 3) / den;
    const Loy = (ld.Lu * y + ld.Vs.y * (T + To) - w.Gb * B / 3) / den;
    const LrRep = o.phi * w.GptReport / 2;
    out.overturn = { y, Lr, Lox, Loy, FSx: Lr / Lox, FSy: Lr / Loy, FSxReport: LrRep / Lox, FSyReport: LrRep / Loy, den };

    /* 8 – ayak donatısı (EC2 eğilme) */
    const c = o.coverPad;
    const flex = (Mu, bw, d) => {
      const K = Mu / (bw * d * d * fcd);
      const Kp = 0.21;
      let z = (d / 2) * (1 + Math.sqrt(Math.max(0, 1 - 3.53 * K)));
      z = Math.min(z, 0.95 * d);
      const As = Mu / (fyd * z);
      return { K, Kp, ok: K <= Kp, z, As };
    };
    // pad-1 alt (basınç)
    const dBot = T1 * 100 - c - 1.5 * rb.padBotPhi / 10;
    const Lcant = 0.5 * (Bc - B1 * 100);
    const Mxu = (Lcant * Lcant / 6) * (Q2 * (3 * Bc - Lcant) + Lcant * Q1);
    const Myu = (Lcant * Lcant / 6) * (Q2 * (3 * Bc - Lcant) + Lcant * Q3);
    const MuBot = Math.max(Mxu, Myu);
    out.padBot = { d: dBot, L: Lcant, Mxu, Myu, Mu: MuBot, ...flex(MuBot, Bc, dBot) };
    // pad-1 üst (çekme)
    const armU = (T + To) * 100 + o.armPadAllow;
    const Mxx = ld.Vs.x * armU, Myy = ld.Vs.y * armU; // report: Vx*(T+To) (çekme durumu kesmeleri aynı takım)
    const Quo = (ld.Lu - w.Gb) / (Bc * Bc - Ac * Ac);
    const Qu1 = Quo + ((Mxx - Myy) * 6) / Math.pow(Bc, 3), Qu2 = Quo + ((Mxx + Myy) * 6) / Math.pow(Bc, 3);
    const Qu3 = Quo - ((Mxx - Myy) * 6) / Math.pow(Bc, 3), Qu4 = Quo - ((Mxx + Myy) * 6) / Math.pow(Bc, 3);
    const Lu1 = 0.5 * (Bc - B1 * 100) + (T1 + T2) * 100 * Math.SQRT2 * ld.t;
    const MxuU = (Lu1 * Lu1 / 6) * (Qu2 * (3 * Bc - Lu1) + Lu1 * Qu1);
    const MyuU = (Lu1 * Lu1 / 6) * (Qu2 * (3 * Bc - Lu1) + Lu1 * Qu3);
    const MuTop = Math.max(MxuU, MyuU);
    const dTop = T1 * 100 - c - 1.5 * rb.padTopPhi / 10;
    out.padTop = { d: dTop, Quo, Qu1, Qu2, Qu3, Qu4, L: Lu1, Mu: MuTop, ...flex(MuTop, Bc, dTop) };
    // pad-2 üst (çekme)
    const Lu2 = 0.5 * (Bc - Ac) + (T1 + T2) * 100 * Math.SQRT2 * ld.t;
    const MxuP2 = (Lu2 * Lu2 / 6) * (Qu2 * (3 * Bc - Lu2) + Lu2 * Qu1);
    const MyuP2 = (Lu2 * Lu2 / 6) * (Qu2 * (3 * Bc - Lu2) + Lu2 * Qu3);
    const MuP2 = Math.max(MxuP2, MyuP2);
    const dP2 = (T1 + T2) * 100 - c - 1.5 * rb.pad2Phi / 10;
    out.pad2 = { d: dP2, L: Lu2, Mu: MuP2, ...flex(MuP2, B1 * 100, dP2) };
    // sağlanan donatı
    const Abot = rb.padBotN * barArea(rb.padBotPhi), Atop = rb.padTopN * barArea(rb.padTopPhi), A2 = rb.pad2N * barArea(rb.pad2Phi);
    out.padBot.Aprov = Abot; out.padTop.Aprov = Atop; out.pad2.Aprov = A2;
    out.padBot.util = out.padBot.As / Abot; out.padTop.util = out.padTop.As / Atop; out.pad2.util = out.pad2.As / A2;
    const Ag1 = T1 * 100 * Bc, Ag2 = T2 * 100 * B1 * 100;
    out.minSteel = { aci1: 0.0018 * Ag1, aci2: 0.0018 * Ag2, prov1: Abot + Atop, prov2: A2,
      ec1: 0.26 * 2.6 / 500 * Bc * dBot, ec2: 0.26 * 2.6 / 500 * B1 * 100 * dP2 };

    /* 9 – zımbalama */
    const dp2 = dP2;
    const u = 4 * Ac + 2 * PI * 2 * dp2;
    const Pr = ld.Lc / (Bc * Bc);
    const ApRep = 4 * Ac * 2 * dp2 + (PI * Math.pow(2 * dp2, 2)) / 4;
    const ApFull = Ac * Ac + 4 * Ac * 2 * dp2 + PI * Math.pow(2 * dp2, 2);
    const LpRep = ld.Lc - Pr * ApRep, LpFull = ld.Lc - Pr * ApFull;
    const kk = 1 + Math.sqrt(200 / (dp2 * 10));
    const fckMPa = m.fck / 10;
    const vRd = 0.035 * Math.pow(kk, 1.5) * Math.sqrt(fckMPa) * 10;
    out.punch = { d: dp2, u, Pr, ApRep, ApFull, LpRep, LpFull, vedRep: LpRep / (u * dp2), vedFull: LpFull / (u * dp2), k: kk, vRd };

    /* 3 – baca */
    const cc = o.coverChim + rb.stPhi / 10 + rb.chimPhi / 20;
    const armC = (T + To - T1 - T2) * 100 + o.armChimAllow;
    const MuxC = ld.Vch.x * armC, MuyC = ld.Vch.y * armC;
    const cap = chimneyMu(Ac, cc, rb.chimPhi, rb.chimN, fcd, fyd);
    const AsC = rb.chimN * barArea(rb.chimPhi);
    out.chimney = { arm: armC, Mux: MuxC, Muy: MuyC, Mu: cap.Mu, xNA: cap.x, ratioX: MuxC / cap.Mu, ratioY: MuyC / cap.Mu,
      util: MuxC / cap.Mu + MuyC / cap.Mu, As: AsC, pct: (AsC / (Ac * Ac)) * 100, AsMinACI: 0.01 * Ac * Ac,
      cc, stMax: Math.min(Ac * 10, 20 * rb.chimPhi, 300) };
    return out;
  }

  /* ---------------- otomatik donatı önerisi ---------------- */
  const PHI_LIST = [12, 14, 16, 18, 20, 22, 25];
  function pickMesh(AsReq, width_cm, cover, maxS, minS, wBar) {
    let best = null;
    for (const phi of PHI_LIST) {
      const a = barArea(phi);
      let n = Math.max(Math.ceil(AsReq / a), Math.ceil((width_cm - 2 * cover) / maxS) + 1, 3);
      for (; n < 80; n++) {
        const s = (width_cm - 2 * cover - phi / 10) / (n - 1);
        if (s >= minS) break;
      }
      const s = (width_cm - 2 * cover - phi / 10) / (n - 1);
      if (s < minS && n > 3) continue;
      const w = n * phi * phi;
      if (!best || w < best.w) best = { phi, n, s, w };
    }
    return best;
  }
  /* ---- alt/üst hasır eşleştirme ----
     spec = { reqAs(phi) → gereken As (cm²) ya da null, width (cm), cover (cm), maxS, minS (cm) }
     mode: 'free'  alt ve üst ayrı seçilir
           'eqN'   adetler eşit; daha zor hasır adedi belirler, diğerinin çapı gereken en küçük değere iner
           'eqPhi' çaplar eşit; her hasırın adedi kendi gereksinimine göre
           'eqPhiN' çap ve adet eşit: alt ve üst çubuklar birebir bağlanır */
  function meshRange(spec, phi) {
    const As = spec.reqAs(phi); if (As == null) return null;
    const span = spec.width - 2 * spec.cover, nMin = Math.max(Math.ceil(As / barArea(phi) - 1e-9), Math.ceil(span / spec.maxS) + 1, 3);
    const nMax = Math.floor((span - phi / 10) / spec.minS) + 1;
    if (nMin > nMax && nMin > 3) return null;
    return { nMin, nMax: Math.max(nMax, nMin) };
  }
  function meshBest(spec) {
    let best = null;
    for (const phi of PHI_LIST) { const r = meshRange(spec, phi); if (!r) continue; const w = r.nMin * phi * phi; if (!best || w < best.w) best = { phi, n: r.nMin, w }; }
    return best;
  }
  function padPairSelect(sb, st, mode) {
    const free = () => { const b = meshBest(sb), t = meshBest(st); return b && t ? { bot: { phi: b.phi, n: b.n }, top: { phi: t.phi, n: t.n } } : null; };
    if (!mode || mode === 'free') return free();
    const rb = PHI_LIST.map((p) => meshRange(sb, p)), rt = PHI_LIST.map((p) => meshRange(st, p));
    let best = null;
    const take = (w, bot, top) => { if (!best || w < best.w - 1e-9) best = { w, bot, top }; };
    if (mode === 'eqN') {
      for (let n = 3; n <= 120; n++) {
        const ib = rb.findIndex((r) => r && r.nMin <= n && n <= r.nMax), it = rt.findIndex((r) => r && r.nMin <= n && n <= r.nMax);   // en küçük uygun çap
        if (ib < 0 || it < 0) continue;
        take(n * (PHI_LIST[ib] ** 2 + PHI_LIST[it] ** 2), { phi: PHI_LIST[ib], n }, { phi: PHI_LIST[it], n });
      }
    } else if (mode === 'eqPhi') {
      PHI_LIST.forEach((p, i) => { if (rb[i] && rt[i]) take((rb[i].nMin + rt[i].nMin) * p * p, { phi: p, n: rb[i].nMin }, { phi: p, n: rt[i].nMin }); });
    } else if (mode === 'eqPhiN') {
      PHI_LIST.forEach((p, i) => { if (!rb[i] || !rt[i]) return; const n = Math.max(rb[i].nMin, rt[i].nMin); if (n <= Math.min(rb[i].nMax, rt[i].nMax)) take(2 * n * p * p, { phi: p, n }, { phi: p, n }); });
    }
    return best ? { bot: best.bot, top: best.top } : free();
  }
  /* eğilmeye göre gereken As (padMeshSelect ile aynı formül) */
  function flexSpec(Mu, widthCm, thickCm, cover, bw, fcd, fyd, minAs, maxS, minS) {
    return { width: widthCm, cover, maxS, minS, reqAs: (phi) => {
      const d = thickCm - cover - 1.5 * phi / 10; if (d <= 5) return null;
      const K = Mu / (bw * d * d * fcd); if (K > 0.21) return null;
      const z = Math.min(0.95 * d, (d / 2) * (1 + Math.sqrt(1 - 3.53 * K)));
      return Math.max(Mu / (fyd * z), minAs);
    } };
  }
  function autoRebar(inp) {
    const o = inp.opts, g = inp.geo;
    const tmp = JSON.parse(JSON.stringify(inp));
    // iterasyon: d, donatı çapına bağlı
    let rb = Object.assign({}, inp.rebar);
    let res;
    for (let it = 0; it < 4; it++) {
      tmp.rebar = rb;
      res = compute(tmp);
      const a1 = Math.max(res.padBot.As, 0.0009 * g.T1 * 100 * g.B * 100); // en az %0,09 (toplam %0,18'in yarısı)
      const a2 = Math.max(res.padTop.As, 0.0009 * g.T1 * 100 * g.B * 100);
      const a3 = Math.max(res.pad2.As, 0.0009 * g.T2 * 100 * g.B1 * 100);
      const pair = padPairSelect({ reqAs: () => a1, width: g.B * 100, cover: o.coverPad, maxS: 25, minS: 12 }, { reqAs: () => a2, width: g.B * 100, cover: o.coverPad, maxS: 30, minS: 12 }, o.meshPair);
      const m1 = pair ? pair.bot : pickMesh(a1, g.B * 100, o.coverPad, 25, 12), m2 = pair ? pair.top : pickMesh(a2, g.B * 100, o.coverPad, 30, 12);
      const m3 = pickMesh(a3, g.B1 * 100, o.coverPad, 30, 12);
      rb = Object.assign({}, rb, { padBotPhi: m1.phi, padBotN: m1.n, padTopPhi: m2.phi, padTopN: m2.n, pad2Phi: m3.phi, pad2N: m3.n });
    }
    // baca: en küçük çelik alanı ile hem eğilme etkileşimi ≤ 1 hem ≥ %1
    const Ac = g.A * 100;
    let bestC = null;
    for (const phi of [16, 18, 20, 22, 25, 28, 32]) {
      for (const n of [8, 12, 16, 20, 24]) {
        tmp.rebar = Object.assign({}, rb, { chimPhi: phi, chimN: n });
        const r = compute(tmp);
        const As = n * barArea(phi);
        const gap = (Ac - 2 * r.chimney.cc) / (n / 4);
        if (r.chimney.util <= 0.95 && As >= 0.01 * Ac * Ac && gap >= 8) {
          if (!bestC || As < bestC.As) bestC = { phi, n, As };
        }
      }
    }
    if (bestC) rb = Object.assign({}, rb, { chimPhi: bestC.phi, chimN: bestC.n });
    const stPhi = Math.max(6, Math.ceil(rb.chimPhi / 4 / 2) * 2);
    rb.stPhi = Math.max(stPhi, 8);
    rb.stS = Math.min(25, Math.floor(Math.min(Ac, 20 * rb.chimPhi / 10) / 5) * 5);
    return rb;
  }


  /* ---------------- stub + cleat yerleşimi (plan kesiti, baca merkezi orijin; x sağ, y yukarı, cm) ----------------
     Stub L profilinin KESİT AĞIRLIK MERKEZİ (atalet asal eksenlerinin kesişimi; eşit kollu L'de topuk sırtından e = (F²+F·t−t²)/(2(2F−t)), fileto ihmal)
     baca merkezindedir; topuk dış köşeye (+x, −y: eğim yönü) bakar.
     Cleat: köşebent parçası; dik kanadı stub ayağına cıvatalı (kalınlık t2), yatay kanadı betona doğru F2 kadar çıkar, ayak boyunca L2 genişliğindedir.
     Cleat'ler iki ayağa sırayla dağıtılır (A: −y yüzü, B: +x yüzü). cleatFace: 'outer' (dış yüz) | 'inner' (iç/içbükey yüz). */
  function cleatPlan(inp) {
    const st = inp.stub;
    if (!st) return null;
    const g = inp.geo, o = inp.opts, rb = inp.rebar, t = inp.loads.tanA;
    const cosT = 1 / Math.sqrt(1 + 2 * t * t), topC = (g.T + g.To) * 100, zbond = topC - (st.L1 / 10) * cosT, zmid = (topC + zbond) / 2;
    const F = st.F1 / 10, tt = st.t1 / 10, e = (F * F + F * tt - tt * tt) / (2 * (2 * F - tt)), f2 = st.F2 / 10, l2 = st.L2 / 10, face = st.cleatFace === 'inner' ? 'inner' : 'outer';

      if (!chimGroups[key]) { chimGroups[key] = { pos: pos++, kind: 'chim', bars: [], phi: b.phi, count: 0, cut: b.cut, shape: b.shape, desc: (diag ? 'Baca boyuna donatısı – köşe çubukları' : 'Baca boyuna donatısı – kenar çubukları') + (inclined ? ` (büküm ${(Math.round(b.shape.bends[0] * 10) / 10).toFixed(1)}°)` : ''), tags: [], diag }; groups.push(chimGroups[key]); }

      const tot = chs.reduce((a, x) => ({ kg: a.kg + x.kg, kgBuyNew: a.kgBuyNew + x.kgBuyNew, kgOff: a.kgOff + x.kgOff }), { kg: 0, kgBuyNew: 0, kgOff: 0 });
      cut = { plan, chairs: chs, stock, legs: NL, sum: SH.summary(plan, chs.length ? tot : null, stock) };
    }

    /* ---- beton / kazı / geri dolgu ---- */
    const tg = o.grobeton ? o.grobetonT / 100 : 0;
    const og = o.grobeton ? o.grobetonOver / 100 : 0;
    const w = o.workSpace / 100;
    const Vpad1 = out.w.Vpad1, Vpad2 = out.w.Vpad2, Vch = out.w.Vchim;

/* SVG çizimleri: kesit, plan, 3B kama, kontrol şemaları, donatı şekilleri */
(function (root) {
  'use strict';
  const LOC = () => (typeof window !== 'undefined' && window.I18N ? window.I18N.loc() : 'tr-TR');   // sayı biçimi seçili dile bağlı

  const C = { navy: '#1F4E78', blue: '#4C78A8', orange: '#F58518', green: '#54A24B', red: '#E45756', grey: '#9AA0A6',
    conc: '#C9CED4', soil: '#EFE4CF', soilD: '#7A5C2E', cone: '#E2D3B8', rebar: '#B03A2E' };
  const n1 = (x, d = 0) => Number(x).toLocaleString(LOC(), { minimumFractionDigits: d, maximumFractionDigits: d });

  const arrow = (x1, y1, x2, y2, col, w = 2) => {
    const a = Math.atan2(y2 - y1, x2 - x1), s = 7;

  /* ---------- stub / eğimli baca geometrisi (cm, ayak tabanından yukarı) ---------- */
  function stubInfo(inp) {

    const xo = (z) => (inc ? (z - z0) * t : 0);                          // baca ekseninin kayması (kesit düzleminde)

  function stubSvg(si, X, Z, sc, W) {
    if (!si.st) return '';

    let s = '';

        txt(X(-si.B / 2) - 8, Z(si.hA / 2) + 4, 'ayar taşı', { anchor: 'end', size: 10, fill: pc });
    }
    s += `<polygon points="${X(xs(zb) - hl)},${Z(zb)} ${X(xs(zb) + hr)},${Z(zb)} ${X(xs(zt) + hr)},${Z(zt)} ${X(xs(zt) - hl)},${Z(zt)}" fill="#7D8FA6" fill-opacity=".9" stroke="#1F3A5F" stroke-width="1.2"/>`;
    s += `<polygon points="${X(xs(zb) + hr - t1)},${Z(zb)} ${X(xs(zb) + hr)},${Z(zb)} ${X(xs(zt) + hr)},${Z(zt)} ${X(xs(zt) + hr - t1)},${Z(zt)}" fill="#1F3A5F"/>`;
    let outCage = false;
    cleats.forEach((c) => {
      if (c.leg === 'B') {          // +x yüzündeki cleat: yatay kanat kesit düzleminde görünür
        const dir = si.face === 'inner' ? -1 : 1, x0 = xs(c.z) + hr - (si.face === 'inner' ? t1 : 0), x1 = x0 + dir * F2, out = Math.abs(x1 - si.xo(c.z)) > si.cageHalf;
        outCage = outCage || out;
        s += `<line x1="${X(x0)}" y1="${Z(c.z)}" x2="${X(x1)}" y2="${Z(c.z - dir * F2 * si.t)}" stroke="${out ? '#B3261E' : '#1F3A5F'}" stroke-width="${Math.max(2.5, t2 * sc)}" stroke-linecap="butt"/>`;
      } else {                      // −y yüzündeki cleat: kesit düzleminin arkasında, L2 genişliğinde (kesikli)
        const xc = xs(c.z) + si.e - si.F / 2, w2 = si.l2 / 2, out = Math.abs(xc - w2 - si.xo(c.z)) > si.cageHalf || Math.abs(xc + w2 - si.xo(c.z)) > si.cageHalf;
        outCage = outCage || out;
        s += `<rect x="${X(xc - w2)}" y="${Z(c.z) - Math.max(2, t2 * sc) / 2}" width="${si.l2 * sc}" height="${Math.max(2, t2 * sc)}" fill="none" stroke="${out ? '#B3261E' : '#1F3A5F'}" stroke-width="1" stroke-dasharray="3 2"/>`;

    s += txt(lx0, Z(zt) + 4, `stub L${st.F1}×${st.F1}×${st.t1}`, { anchor: 'start', size: 10.5, fill: col, bold: true });
    s += txt(lx0, Z(zt) + 17, si.full ? `betonda ${Math.round((si.topC - zb) / si.cosT * 10)} mm (ankraj L1 = ${st.L1})` : `betonda ${st.L1} mm`, { anchor: 'start', size: 10, fill: col });

  /* ---------- stub–cleat plan kesiti (bacadan yatay kesit) ---------- */

    { const a = cg * 0.92 / Math.SQRT2; s += `<line x1="${X(-a)}" y1="${Y(a)}" x2="${X(a)}" y2="${Y(-a)}" stroke="#8A4FBF" stroke-width="1" stroke-dasharray="7 3 1 3"/><line x1="${X(-a)}" y1="${Y(-a)}" x2="${X(a)}" y2="${Y(a)}" stroke="#8A4FBF" stroke-width="1" stroke-dasharray="7 3 1 3"/>`; }

      txt(X(cp.ext / 2), yy - 4, `en uzak cleat ucu ${n1(cp.ext, 1)} cm`, { size: 10.5, fill: cp.ratio > 1 ? bad : col, bold: true });

    if (!inp.opts.chimMode || inp.opts.chimMode !== 'inclined') s += txt(bx, 374, 'Düşey baca: stub ekseni yükseklikle kayar; cleat’ler kendi kotlarındaki kaymayla çizilir.', { anchor: 'start', size: 9.5, fill: '#556' });

  }

  /* ---------- 3B donatı kafesi (döndürülebilir): beton, hasırlar, baca çubukları, etriyeler, stub ---------- */

    });

    for (let z = T1 + T2 + cs; z <= H - cs; z += sS) {

      pl(R, '#555', 1); pl([q, [q[0] + tail * 0.64, q[1] + tail * 0.77, z]], '#555', 1); pl([q, [q[0] + tail * 0.77, q[1] + tail * 0.64, z]], '#555', 1);

        [[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], [[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]],
        [[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], [[x0, y0, z0], [x0, y1, z0], [x0, y1, z1], [x0, y0, z1]]].forEach((q) => poly(q, fill, fo, stroke));

      const sh = (zmm) => (inc ? ax(zmm) : 0);                                  // cleat konumları cleatPlan'da düşey bacada zaten kaymayı içerir
      if (si.full) { const pw = si.plateW * 5, c0 = ax(zB); boxG(c0 - pw, c0 + pw, -c0 - pw, -c0 + pw, 0, zB, '#A39A86', 0.97, '#5A5444'); }

  /* ---------- 3B kama (döndürülebilir): view = {az, el, zoom}; az: gözlemcinin plandaki yönü (°), el: yükseklik açısı (°) ---------- */
  function iso(inp, out, view) {
    const v = Object.assign({ az: 45, el: 30, zoom: 1 }, view || {});
    const g = inp.geo, B = g.B, T = g.T, tb = out.w.tb, R = T * tb, h = B / 2;
    const W = 660, H = 380, ox = W / 2, oy = 190 - 8;
    const ph = rad(v.az), ee = rad(v.el), cp = Math.cos(ph), sp = Math.sin(ph), ce = Math.cos(ee), se = Math.sin(ee);
    const ext = (h + R) * Math.SQRT2 + 0.3, s = (200 / ext) * v.zoom, zc = (-T + g.To) / 2;
    // dünya (x, y, z↑, m) → ekran; gözlemci (cos az, sin az) yönünden bakar
    const P = (x, y, z) => { const d = x * cp + y * sp; return [ox + (x * sp - y * cp) * s, oy - ((z - zc) * ce - d * se) * s]; };
    const dep = (p) => p[0] * cp * ce + p[1] * sp * ce + p[2] * se;          // büyük = gözlemciye yakın
    const polys = [];
    const add = (pts, fill, op, stroke, bias) => polys.push({ pts: pts.map((p) => P(p[0], p[1], p[2])), fill, op, stroke, d: pts.reduce((a, p) => a + dep(p), 0) / pts.length + (bias || 0) });
    const rot = (p, k) => { let [x, y, z] = p; for (let i = 0; i < k; i++) [x, y] = [-y, x]; return [x, y, z]; };
    // yan kamalar
    for (let k = 0; k < 4; k++) {
      add([[-h, h, -T], [h, h, -T], [h, h + R, 0], [-h, h + R, 0]].map((p) => rot(p, k)), C.orange, 0.55, '#B35F00');
      add([[-h, h, 0], [h, h, 0], [h, h + R, 0], [-h, h + R, 0]].map((p) => rot(p, k)), C.orange, 0.25, '#B35F00');
    }
    // köşe koniler
    const N = 14;
    for (let k = 0; k < 4; k++) {
      const [cx, cy] = rot([h, h, 0], k);
      for (let i = 0; i < N; i++) {
        const a0 = rad(90 * i / N + 90 * k), a1 = rad(90 * (i + 1) / N + 90 * k);
        const p0 = [cx + R * Math.cos(a0), cy + R * Math.sin(a0), 0], p1 = [cx + R * Math.cos(a1), cy + R * Math.sin(a1), 0];
        add([[cx, cy, -T], p0, p1], C.green, 0.7, C.green);
        add([[cx, cy, 0], p0, p1], C.green, 0.3, C.green);
      }
    }
    // beton (6 yüz; boyama sırası derinliğe göre)
    const fills = '#B8BEC6';
    const box = (x0, x1, y0, y1, z0, z1) => {
      [[[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]],
        [[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], [[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]],
        [[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], [[x0, y0, z0], [x0, y1, z0], [x0, y1, z1], [x0, y0, z1]]].forEach((q) => add(q, fills, 1, '#444', 0.02));

      add(lo.map((q) => [q[0] + o2, q[1] - o2, zc1]), fills, 1, '#444', 0.02);                 // üst yüz
      for (let i = 0; i < 4; i++) { const p = lo[i], q = lo[(i + 1) % 4]; add([[p[0], p[1], zc0], [q[0], q[1], zc0], [q[0] + o2, q[1] - o2, zc1], [p[0] + o2, p[1] - o2, zc1]], fills, 1, '#444', 0.02); }
    } else box(-a, a, -a, a, -T + g.T1 + g.T2, g.To);

    }
    if (si.st) {
      // stub ekseni; beton içi kesikli, dışarı taşan kısım dolu
      const ax = (zc2) => si.xs((zc2 + T) * 100) / 100;     // zc2: zemin üstü (m) → ayak tabanından cm → eksen kayması (m)
      const zB = si.zb / 100 - T, zT0 = g.To, zT1 = si.zt / 100 - T;
      const pt = (zq) => P(ax(zq), -ax(zq), zq);
      if (si.full) { const w = si.plateW / 200, c0 = ax(zB); body += `<polygon points="${[[-1, -1], [1, -1], [1, 1], [-1, 1]].map((q) => P(c0 + q[0] * w, -c0 + q[1] * w, zB).join(',')).join(' ')}" fill="#A39A86" stroke="#5A5444" stroke-width="1"/>`; }
      body += `<polyline points="${pt(zB).join(',')} ${pt(zT0).join(',')}" fill="none" stroke="#1F3A5F" stroke-width="3" stroke-dasharray="6 3" opacity=".7"/>` +
        `<polyline points="${pt(zT0).join(',')} ${pt(zT1).join(',')}" fill="none" stroke="#1F3A5F" stroke-width="5"/>`;
    }
    body += `<polygon points="${[[-h - R, -h - R, 0], [h + R, -h - R, 0], [h + R, h + R, 0], [-h - R, h + R, 0]].map((p) => P(...p).join(',')).join(' ')}" fill="none" stroke="${C.soilD}" stroke-dasharray="5 3" stroke-width="1.2"/>`;
    // yön göstergesi: +x, +y eksen okları (köşede)
    const ax0 = [W - 70, H - 50];
    const axv = [[1, 0, 'x'], [0, 1, 'y']].map((q) => { const dx = (q[0] * sp - q[1] * cp) * 28, dy = (q[0] * cp + q[1] * sp) * se * 28; return arrow(ax0[0], ax0[1], ax0[0] + dx, ax0[1] + dy, '#667', 1.4) + txt(ax0[0] + dx * 1.3, ax0[1] + dy * 1.3 + 4, q[2], { size: 11, fill: '#445', bold: true }); }).join('');
    body += axv + txt(ax0[0], ax0[1] + 26, `az ${Math.round(((v.az % 360) + 360) % 360)}° · el ${Math.round(v.el)}°`, { size: 9.5, fill: '#778' });
    const lg = [[C.orange, `4 yan kama: ${n1(out.w.wedges, 2)} m³ (düz yüzey)`], [C.green, `4 köşe çeyrek koni: ${n1(out.w.corners, 2)} m³`], ['#888', 'beton temel (referans)']];
    body += lg.map((l, i) => `<rect x="12" y="${312 + i * 18}" width="12" height="12" fill="${l[0]}" fill-opacity=".7"/>` + txt(30, 322 + i * 18, l[1], { anchor: 'start', size: 11 })).join('');
    body += txt(330, 22, `Zemin kaması: iç prizma (B²·T = ${n1(out.w.prism, 2)} m³) + yan kamalar + köşe konileri`, { size: 12, fill: C.navy, bold: true });
    return svg(W, H, body);
  }
  const rad = (d) => (d * PI) / 180;

  /* ---------- kesit ---------- */
  function section(inp, out, rbd) {
    const g = inp.geo, o = inp.opts, rb = inp.rebar;
    const Bc = g.B * 100, B1c = g.B1 * 100, Ac = g.A * 100, T1c = g.T1 * 100, T2c = g.T2 * 100, Tc = g.T * 100, Toc = g.To * 100;
    const c = o.coverPad, tg = o.grobeton ? o.grobetonT : 0, og = o.grobeton ? o.grobetonOver : 0;
    const topPad = inp.stub ? Math.max(inp.stub.top, 500) / 10 + 12 : 25;     // stub betondan en az 50 cm taşar
    const sc = Math.min(520 / Bc, 400 / (Tc + Toc + topPad));
    const W = 760, H = 110 + (Tc + Toc + topPad) * sc + tg * sc + 80;
    const ox = 380;                              // orta eksen
    const zb = 110 + (Tc + Toc + topPad) * sc;       // ayak tabanı (px)
    const X = (x) => ox + x * sc, Z = (z) => zb - z * sc; // z: ayak tabanından yukarı (cm)
    const groundZ = Tc;
    let s = '';
    s += `<rect x="20" y="${Z(groundZ)}" width="${W - 40}" height="${Z(-tg - 60) - Z(groundZ)}" fill="${C.soil}"/>`;
    s += `<line x1="20" y1="${Z(groundZ)}" x2="${W - 20}" y2="${Z(groundZ)}" stroke="${C.soilD}" stroke-width="2"/>`;
    s += txt(60, Z(groundZ) - 6, 'zemin yüzeyi', { size: 10, fill: C.soilD });
    if (o.grobeton) s += `<rect x="${X(-Bc / 2 - og)}" y="${Z(0)}" width="${(Bc + 2 * og) * sc}" height="${tg * sc}" fill="#E7E2D3" stroke="#555" stroke-dasharray="4 2"/>` + txt(X(Bc / 2 + og) + 6, Z(-tg / 2) + 4, `grobeton ${tg} cm`, { anchor: 'start', size: 10 });
    const rect = (x0, x1, z0, z1, fill, st) => `<rect x="${X(x0)}" y="${Z(z1)}" width="${(x1 - x0) * sc}" height="${(z1 - z0) * sc}" fill="${fill}" stroke="${st || '#333'}" stroke-width="1.3"/>`;
    s += rect(-Bc / 2, Bc / 2, 0, T1c, C.conc);
    s += rect(-B1c / 2, B1c / 2, T1c, T1c + T2c, C.conc);
    const si = stubInfo(inp), inc = si.inc, xo = si.xo, zTopC = Tc + Toc, z0 = T1c + T2c;
    if (inc) s += `<polygon points="${X(-Ac / 2)},${Z(z0)} ${X(Ac / 2)},${Z(z0)} ${X(Ac / 2 + xo(zTopC))},${Z(zTopC)} ${X(-Ac / 2 + xo(zTopC))},${Z(zTopC)}" fill="${C.conc}" stroke="#333" stroke-width="1.3"/>`;
    else s += rect(-Ac / 2, Ac / 2, z0, zTopC, C.conc);
    // donatılar
    const stroke = (col, w) => `stroke="${col}" stroke-width="${Math.max(1.2, w * sc)}" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
    const phiB = rb.padBotPhi / 10, phiT = rb.padTopPhi / 10, phiD = rb.pad2Phi / 10;
    const hook = (phi, width, thick) => (o.hookMode === 'L' ? Math.min(o.hookPhi * phi, thick - 2 * c) : 0);
    // alt hasır X yönü (çizgi) ve Y yönü (kesit noktaları)
    const zX = c + phiB / 2, zY = c + phiB + phiB / 2;
    let hk = hook(phiB, Bc, T1c);
    s += `<path d="M ${X(-Bc / 2 + c)} ${Z(zX + hk)} L ${X(-Bc / 2 + c)} ${Z(zX)} L ${X(Bc / 2 - c)} ${Z(zX)} L ${X(Bc / 2 - c)} ${Z(zX + hk)}" ${stroke(C.rebar, phiB)}/>`;
    const nB = rb.padBotN, pB = (Bc - 2 * c - phiB) / (nB - 1);
    for (let i = 0; i < nB; i++) s += `<circle cx="${X(-Bc / 2 + c + phiB / 2 + i * pB)}" cy="${Z(zY)}" r="${Math.max(2, phiB / 2 * sc)}" fill="${C.rebar}"/>`;
    // üst hasır
    const zTx = T1c - c - phiT / 2, zTy = T1c - c - phiT - phiT / 2;
    hk = hook(phiT, Bc, T1c);
    s += `<path d="M ${X(-Bc / 2 + c)} ${Z(zTx - hk)} L ${X(-Bc / 2 + c)} ${Z(zTx)} L ${X(Bc / 2 - c)} ${Z(zTx)} L ${X(Bc / 2 - c)} ${Z(zTx - hk)}" ${stroke('#1E7B34', phiT)}/>`;
    const nT = rb.padTopN, pT = (Bc - 2 * c - phiT) / (nT - 1);
    for (let i = 0; i < nT; i++) s += `<circle cx="${X(-Bc / 2 + c + phiT / 2 + i * pT)}" cy="${Z(zTy)}" r="${Math.max(2, phiT / 2 * sc)}" fill="#1E7B34"/>`;
    // pad-2 üst
    const zDx = T1c + T2c - c - phiD / 2, zDy = zDx - phiD;
    hk = hook(phiD, B1c, T2c);
    s += `<path d="M ${X(-B1c / 2 + c)} ${Z(zDx - hk)} L ${X(-B1c / 2 + c)} ${Z(zDx)} L ${X(B1c / 2 - c)} ${Z(zDx)} L ${X(B1c / 2 - c)} ${Z(zDx - hk)}" ${stroke('#7B3FA0', phiD)}/>`;
    const nD = rb.pad2N, pD = (B1c - 2 * c - phiD) / (nD - 1);
    for (let i = 0; i < nD; i++) s += `<circle cx="${X(-B1c / 2 + c + phiD / 2 + i * pD)}" cy="${Z(zDy)}" r="${Math.max(2, phiD / 2 * sc)}" fill="#7B3FA0"/>`;
    // baca boyuna (kesit düzleminde iki yüz çubuğu) + ayaklar
    const cc = rbd ? rbd.pts : [];
    const half = Ac / 2 - (o.coverChim + rb.stPhi / 10 + rb.chimPhi / 20);
    const zbBar = c + (rb.padBotPhi + rb.padBotPhi) / 10, zTop = Tc + Toc - o.coverChimTop, foot = (rbd && rbd.bars.find((b) => b.mark === 'K1')) || null;
    const ft = foot ? Math.min(foot.tail, Bc / 2 - c - half - 2 - Math.abs(xo(zbBar))) : 20;
    [-1, 1].forEach((sg) => {
      const bx = sg * half + xo(zbBar);       // eğimli baca: çubuk ayaktan uca tek doğru (stub ile paralel)
      s += `<path d="M ${X(bx + sg * (ft + 3))} ${Z(zbBar)} L ${X(bx)} ${Z(zbBar)} L ${X(sg * half + xo(zTop))} ${Z(zTop)}" ${stroke('#C77700', rb.chimPhi / 10)}/>`;
    });
    // etriyeler
    const nSt = Math.floor(((Tc + Toc - T1c - T2c) - 2 * o.coverChim) / rb.stS) + 1;
    for (let i = 0; i < nSt; i++) {
      const z = T1c + T2c + o.coverChim + i * rb.stS;
      if (z > Tc + Toc - o.coverChim) break;
      s += `<line x1="${X(xo(z) - Ac / 2 + o.coverChim)}" y1="${Z(z)}" x2="${X(xo(z) + Ac / 2 - o.coverChim)}" y2="${Z(z)}" stroke="#555" stroke-width="1.1"/>`;
    }
    // stub ve cleat'ler (boyutlar girdilerden)
    s += stubSvg(si, X, Z, sc, W);
    // ölçüler
    s += dimH(X(-Bc / 2), X(Bc / 2), Z(-tg) + 26, `B = ${n1(Bc)} cm`, -2);
    s += dimH(X(-B1c / 2), X(B1c / 2), Z(T1c + T2c) - 12, `B1 = ${n1(B1c)}`);
    s += dimH(X(-Ac / 2 + xo(zTopC)), X(Ac / 2 + xo(zTopC)), Z(Tc + Toc) - 14, `A = ${n1(Ac)}`);
    s += dimV(X(Bc / 2) + 24, Z(0), Z(T1c), `T1=${n1(T1c)}`);
    s += dimV(X(Bc / 2) + 24, Z(T1c), Z(T1c + T2c), `T2=${n1(T2c)}`);
    s += dimV(X(Bc / 2) + 56, Z(0), Z(Tc), `T = ${n1(Tc)} cm`);
    s += dimV(X(Bc / 2) + 56, Z(Tc), Z(Tc + Toc), `To=${n1(Toc)}`);
    // açıklama
    const leg = [[C.rebar, `Ayak alt hasır ${rb.padBotN}Φ${rb.padBotPhi}/yön`], ['#1E7B34', `Ayak üst hasır ${rb.padTopN}Φ${rb.padTopPhi}/yön`], ['#7B3FA0', `2. ayak üst ${rb.pad2N}Φ${rb.pad2Phi}/yön`], ['#C77700', `Baca ${rb.chimN}Φ${rb.chimPhi}`], ['#555', `Etriye Φ${rb.stPhi}/${rb.stS}`]];
    if (si.st) leg.push(['#7D8FA6', `Stub L${si.st.F1}×${si.st.t1} · ${si.st.nCleat} cleat`]);
    if (inc) leg.push(['#C9CED4', `Baca eğimli: tanα = ${n1(si.t, 4)}`]);
    s += leg.map((l, i) => `<rect x="24" y="${24 + i * 18}" width="14" height="4" fill="${l[0]}"/>` + txt(44, 30 + i * 18, l[1], { anchor: 'start', size: 11 })).join('');
    s += txt(W - 20, 24, `pas payı: ayak ${c} cm, baca ${o.coverChim} cm`, { anchor: 'end', size: 11, fill: '#555' });
    return svg(W, H, s);
  }

  /* ---------- plan ---------- */
  function plan(inp, out, rbd) {
    const g = inp.geo, o = inp.opts, rb = inp.rebar;
    const Bc = g.B * 100, B1c = g.B1 * 100, Ac = g.A * 100, c = o.coverPad;
    const og = o.grobeton ? o.grobetonOver : 0;
    const W = 640, H = 620, sc = 440 / (Bc + 2 * og), ox = 320, oy = 310;
    const X = (x) => ox + x * sc, Y = (y) => oy - y * sc;
    let s = '';
    if (o.grobeton) s += `<rect x="${X(-Bc / 2 - og)}" y="${Y(Bc / 2 + og)}" width="${(Bc + 2 * og) * sc}" height="${(Bc + 2 * og) * sc}" fill="#F3EFE4" stroke="#777" stroke-dasharray="5 3"/>`;
    s += `<rect x="${X(-Bc / 2)}" y="${Y(Bc / 2)}" width="${Bc * sc}" height="${Bc * sc}" fill="${C.conc}" fill-opacity=".45" stroke="#333" stroke-width="1.5"/>`;
    s += `<rect x="${X(-B1c / 2)}" y="${Y(B1c / 2)}" width="${B1c * sc}" height="${B1c * sc}" fill="none" stroke="#555" stroke-dasharray="6 3" stroke-width="1.3"/>`;
    const phiB = rb.padBotPhi / 10, pB = (Bc - 2 * c - phiB) / (rb.padBotN - 1);
    for (let i = 0; i < rb.padBotN; i++) {
      const p = -Bc / 2 + c + phiB / 2 + i * pB;
      s += `<line x1="${X(-Bc / 2 + c)}" y1="${Y(p)}" x2="${X(Bc / 2 - c)}" y2="${Y(p)}" stroke="${C.rebar}" stroke-width="1.2"/>`;
      s += `<line x1="${X(p)}" y1="${Y(-Bc / 2 + c)}" x2="${X(p)}" y2="${Y(Bc / 2 - c)}" stroke="${C.rebar}" stroke-width="1.2" stroke-opacity=".55"/>`;
    }
    const phiT = rb.padTopPhi / 10, pT = (Bc - 2 * c - phiT) / (rb.padTopN - 1);
    for (let i = 0; i < rb.padTopN; i++) {
      const p = -Bc / 2 + c + phiT / 2 + i * pT;
      s += `<line x1="${X(-Bc / 2 + c)}" y1="${Y(p)}" x2="${X(Bc / 2 - c)}" y2="${Y(p)}" stroke="#1E7B34" stroke-width="1" stroke-dasharray="7 4"/>`;
      s += `<line x1="${X(p)}" y1="${Y(-Bc / 2 + c)}" x2="${X(p)}" y2="${Y(Bc / 2 - c)}" stroke="#1E7B34" stroke-width="1" stroke-dasharray="7 4" stroke-opacity=".55"/>`;
    }
    const phiD = rb.pad2Phi / 10, pD = (B1c - 2 * c - phiD) / (rb.pad2N - 1);
    for (let i = 0; i < rb.pad2N; i++) {
      const p = -B1c / 2 + c + phiD / 2 + i * pD;
      s += `<line x1="${X(-B1c / 2 + c)}" y1="${Y(p)}" x2="${X(B1c / 2 - c)}" y2="${Y(p)}" stroke="#7B3FA0" stroke-width="1.6"/>`;
      s += `<line x1="${X(p)}" y1="${Y(-B1c / 2 + c)}" x2="${X(p)}" y2="${Y(B1c / 2 - c)}" stroke="#7B3FA0" stroke-width="1.6" stroke-opacity=".6"/>`;
    }
    // baca
    s += `<rect x="${X(-Ac / 2)}" y="${Y(Ac / 2)}" width="${Ac * sc}" height="${Ac * sc}" fill="#fff" stroke="#111" stroke-width="2"/>`;
    s += `<rect x="${X(-Ac / 2 + o.coverChim)}" y="${Y(Ac / 2 - o.coverChim)}" width="${(Ac - 2 * o.coverChim) * sc}" height="${(Ac - 2 * o.coverChim) * sc}" fill="none" stroke="#555" stroke-width="1.3"/>`;
    const si0 = stubInfo(inp), zbPlan = c + (rb.padBotPhi + rb.padBotPhi) / 10;
    (rbd ? rbd.bars.filter((b) => b.group === 'baca' && b.xy) : []).forEach((b) => {
      s += `<circle cx="${X(b.xy.x)}" cy="${Y(b.xy.y)}" r="${Math.max(3, rb.chimPhi / 20 * sc)}" fill="#C77700"/>` + txt(X(b.xy.x), Y(b.xy.y) - 6, b.mark, { size: 8.5 });
      const d = b.footDir;
      const ux = d.includes('+x') ? 1 : d.includes('−x') ? -1 : 0, uy = d.includes('+y') ? 1 : d.includes('−y') ? -1 : 0, nn = Math.hypot(ux, uy) || 1;
      const L = Math.max(b.tail, 5);
      const sh = si0.inc ? si0.xo(zbPlan) : 0;      // çubuk ayak kotunda eğimle kaymış (+x, −y)
      s += arrow(X(b.xy.x + sh), Y(b.xy.y - sh), X(b.xy.x + sh + ux / nn * L), Y(b.xy.y - sh + uy / nn * L), '#C77700', 1.2);
    });
    const si = stubInfo(inp);
    if (si.inc) {
      // eğimli baca: üst yüzün plandaki yeri (kesikli), stub ekseni oku
      const off = si.xo(si.topC);
      s += `<rect x="${X(-Ac / 2 + off)}" y="${Y(Ac / 2 - off)}" width="${Ac * sc}" height="${Ac * sc}" fill="none" stroke="#1F4E78" stroke-width="1.6" stroke-dasharray="6 3"/>` +
        arrow(X(0), Y(0), X(off), Y(-off), '#1F4E78', 1.6) + txt(X(off + Ac / 2) + 6, Y(-off - Ac / 2) + 14, 'baca üstü (eğimli)', { anchor: 'start', size: 10.5, fill: '#1F4E78' });
    }
    s += dimH(X(-Bc / 2), X(Bc / 2), Y(-Bc / 2) + 28 + og * sc, `B = ${n1(Bc)} cm`);
    s += dimH(X(-Ac / 2), X(Ac / 2), Y(Ac / 2) - 10, `A=${n1(Ac)}`);
    const leg = [[C.rebar, `Alt hasır: ${rb.padBotN}Φ${rb.padBotPhi} (s≈${n1(pB, 1)} cm)`], ['#1E7B34', `Üst hasır: ${rb.padTopN}Φ${rb.padTopPhi} (s≈${n1(pT, 1)} cm) – kesik çizgi`], ['#7B3FA0', `2. ayak: ${rb.pad2N}Φ${rb.pad2Phi} (s≈${n1(pD, 1)} cm)`], ['#C77700', 'Baca donatısı ve ayak yönü (ok)']];
    s += leg.map((l, i) => `<rect x="20" y="${20 + i * 18}" width="14" height="4" fill="${l[0]}"/>` + txt(40, 26 + i * 18, l[1], { anchor: 'start', size: 11 })).join('');
    return svg(W, H, s);
  }

  /* ---------- zemin / su altı şeması ---------- */
  function submerged(inp, out) {
    const sub = inp.soil.sub;
    const W = 640, H = 270;
    let s = `<rect x="10" y="60" width="300" height="160" fill="${C.soil}" stroke="${C.soilD}"/>` + `<rect x="330" y="60" width="300" height="160" fill="${C.soil}" stroke="${C.soilD}"/>`;
    s += `<rect x="330" y="110" width="300" height="110" fill="#8EC5E8" fill-opacity=".55"/>` + `<line x1="330" y1="110" x2="630" y2="110" stroke="#2E7DB0" stroke-width="2" stroke-dasharray="6 3"/>` + txt(560, 104, 'yeraltı suyu seviyesi', { size: 10.5, fill: '#2E7DB0' });
    [10, 330].forEach((x0) => { s += `<rect x="${x0 + 125}" y="150" width="50" height="46" fill="#B8BEC6" stroke="#333"/><rect x="${x0 + 140}" y="60" width="20" height="90" fill="#B8BEC6" stroke="#333"/>`; });
    s += txt(160, 40, 'Kuru zemin', { size: 13, bold: true, fill: C.navy });
    s += txt(160, 240, `γ zemin = ${n1(inp.soil.gdry)} daN/m³ · γ beton = ${n1(inp.mat.gcDens)}`, { size: 11 });
    s += txt(480, 40, 'Suya doygun zemin (C4.2)', { size: 13, bold: true, fill: C.navy });
    s += txt(480, 240, `γ' = γsat − γw = ${n1(inp.soil.gsat)} − ${n1(1000)} = ${n1(inp.soil.gsat - 1000)} · beton ${n1(inp.mat.gcDens - 1000)}`, { size: 11 });
    s += arrow(320 + 40, 200, 320 + 40, 150, '#2E7DB0', 2.5) + txt(375, 150, 'kaldırma', { size: 10, fill: '#2E7DB0', anchor: 'start' });
    s += arrow(380, 130, 380, 175, '#888', 0);
    return svg(W, H, s);
  }

  /* ---------- kontrol şemaları (küçük) ---------- */
  function schemeUplift(out) {
    return svg(260, 190, `<rect x="30" y="140" width="200" height="30" fill="#B8BEC6" stroke="#333"/><rect x="115" y="40" width="30" height="100" fill="#B8BEC6" stroke="#333"/>` +
      `<polygon points="30,140 230,140 250,60 10,60" fill="${C.cone}" fill-opacity=".6" stroke="${C.soilD}" stroke-dasharray="4 3"/>` +
      arrow(130, 38, 130, 4, C.red, 3) + txt(165, 16, `Lu=${n1(out.ld.Lu)}`, { fill: C.red, size: 11, anchor: 'start', bold: true }) +
      arrow(60, 84, 60, 128, C.green, 3) + txt(70, 100, `Gpt=${n1(out.w.Gpt)}`, { size: 10, fill: '#1E7B34', anchor: 'start' }) +
      arrow(130, 160, 130, 186, C.blue, 0) + txt(130, 183, `Gb=${n1(out.w.Gb)}`, { size: 10, fill: C.blue }));
  }
  function schemeGroup(out, inp) {
    const g = out.group, B = inp.geo.B, R = inp.geo.T * out.w.tb;
    if (!g) return '';
    const W = g.lx + B + 2 * R, H = g.ly + B + 2 * R, sc = Math.min(230 / W, 150 / H), ox = 130 - (g.lx * sc) / 2, oy = 90 - (g.ly * sc) / 2;
    let s = '';
    [[0, 0], [1, 0], [0, 1], [1, 1]].forEach((p) => {
      const cx = ox + p[0] * g.lx * sc, cy = oy + p[1] * g.ly * sc, hw = (B / 2 + R) * sc;
      s += `<rect x="${cx - hw}" y="${cy - hw}" width="${2 * hw}" height="${2 * hw}" rx="${R * sc}" fill="${C.cone}" fill-opacity=".38" stroke="${C.soilD}" stroke-dasharray="4 3"/>`;
    });
    [[0, 0], [1, 0], [0, 1], [1, 1]].forEach((p) => {
      const cx = ox + p[0] * g.lx * sc, cy = oy + p[1] * g.ly * sc;
      s += `<rect x="${cx - (B / 2) * sc}" y="${cy - (B / 2) * sc}" width="${B * sc}" height="${B * sc}" fill="#B8BEC6" stroke="#333"/><circle cx="${cx}" cy="${cy}" r="2.5" fill="#333"/>`;
    });
    s += txt(130, 12, `X = ${n1(g.lx, 2)} m · Y = ${n1(g.ly, 2)} m`, { size: 10 }) + txt(130, 184, `çakışan hacim X ${n1(g.Vx, 1)} · Y ${n1(g.Vy, 1)} m³`, { size: 10, fill: g.FS >= 1 ? '#1E7B34' : C.red, bold: true });
    return svg(260, 190, s);
  }
  function schemeBearing(out) {

  /* ---------- duyarlılık grafiği: bir parametreyi tara, doluluk çizgileri + uygun aralık ---------- */

    for (let i = 0; i <= nt; i++) { const v = x0 + ((x1 - x0) * i) / nt; s += `<line x1="${X(v)}" y1="${H - mb}" x2="${X(v)}" y2="${H - mb + 4}" stroke="#667"/>` + txt(X(v), H - mb + 16, n1(v * unitScale, unitScale === 1 ? 1 : 0), { size: 10.5, fill: '#445' }); }

  /* Gereken-boyut eğrisi: pts = [{x, y|null, concrete}], cur = {x, y}; sx/sy: model→gösterim çarpanı */

    for (let i = 0; i <= 5; i++) {
      const yv = y0 + ((y1 - y0) * i) / 5, yy = Y(yv), cv = c0 + ((c1 - c0) * i) / 5;

    }

    s += txt((ml + W - mr) / 2, H - mb + 34, `${xl} (${xu})`, { size: 11.5, bold: true, fill: '#1F4E78' });
    s += txt(14, (mt + H - mb) / 2, `gereken ${yl} (${yu})`, { size: 11.5, bold: true, fill: '#1F4E78', rot: -90 }) + txt(W - 12, (mt + H - mb) / 2, 'beton (m³ / ayak)', { size: 11.5, bold: true, fill: '#C26A00', rot: 90 });

    const mn = ok.reduce((a, b) => (b.concrete < a.concrete ? b : a));

    if (cur.x >= x0 && cur.x <= x1) s += `<circle cx="${X(cur.x)}" cy="${Y(cur.y)}" r="6" fill="${cur.bad ? '#C00000' : '#111'}" stroke="#fff" stroke-width="2"/>` + txt(X(cur.x), Y(cur.y) - 11, 'mevcut tasarım', { size: 10.5, bold: true });

<script>
/* A3 yatay paftalar (SVG, birim mm).  Pafta-1: yerleşim, kesitler, 3B, poz listesi, notlar.  Pafta-2: donatı çizelgesi ve büküm bilgileri. */
(function (root) {
  'use strict';

    cols.forEach((c, i) => {
      if (i) s += L(x0 + i * cw, y0 + 22, x0 + i * cw, y0 + h, 0.2);
      s += T(x0 + i * cw + 1.5, y0 + 25.2, c[0], { size: 1.7, fill: '#666' }) + T(x0 + i * cw + 1.5, y0 + 31.5, c[1], { size: 2.6, bold: true });
    });
    s += T(x0 + 2, y0 + h - 1.2, extra.doc, { size: 1.8, fill: '#666' });
    s += '</svg>';
    return s;
  }

  /* ----------- 3B donatı kafesi ----------- */
  function iso3d(inp, out, rbd, x0, y0, w, h, pr) {
    const g = inp.geo, o = inp.opts, rb = inp.rebar;
    const B = g.B * 1000, B1 = g.B1 * 1000, A = g.A * 1000, T1 = g.T1 * 1000, T2 = g.T2 * 1000, Tt = g.T * 1000, To = g.To * 1000, c = o.coverPad * 10;
    const H = Tt + To;
    const gr = B / 2 + 250;
    const stTop3 = inp.stub ? Math.max(inp.stub.top, 500) : 0;
    const s = Math.min((w - 8) / (3.464 * gr), (h - 16) / (2 * gr + H + stTop3));
    const ox = x0 + w / 2, oy = y0 + 10 + (gr + H + stTop3) * s;
    const P = (x, y, z) => [ox + (x - y) * 0.866 * s, oy + ((x + y) * 0.5 - z) * s];
    let svg = '';
    const box = (hx, hy, z0, z1, fill, fo) => {
      const top = [P(-hx, -hy, z1), P(hx, -hy, z1), P(hx, hy, z1), P(-hx, hy, z1)];
      const xf = [P(hx, -hy, z0), P(hx, hy, z0), P(hx, hy, z1), P(hx, -hy, z1)];
      const yf = [P(-hx, hy, z0), P(hx, hy, z0), P(hx, hy, z1), P(-hx, hy, z1)];
      return PG(xf, { fill, fo, stroke: '#666', w: 0.18 }) + PG(yf, { fill, fo, stroke: '#666', w: 0.18 }) + PG(top, { fill, fo: fo * 0.7, stroke: '#666', w: 0.18 });
    };
    // zemin seviyesi çerçevesi
    svg += PG([P(-gr, -gr, Tt), P(gr, -gr, Tt), P(gr, gr, Tt), P(-gr, gr, Tt)], { fill: '#EFE4CF', fo: 0.35, stroke: C.soil, w: 0.2 });
    svg += T(P(gr, -gr, Tt)[0] - 2, P(gr, -gr, Tt)[1] - 1.2, 'zemin ±0,00', { anchor: 'end', size: 2, fill: C.soil });
    if (o.grobeton) { const gh = B / 2 + o.grobetonOver * 10, tg = o.grobetonT * 10; svg += box(gh, gh, -tg, 0, '#E7E2D3', 0.6); }
    const si = Dw.stubInfo(inp), inc = si.inc, tl = inp.loads.tanA;
    const lean = (z) => (inc ? (z - (T1 + T2)) * tl : 0);                       // baca ekseninin her düzlemdeki kayması (mm); yön (+x, −y)
    svg += box(B / 2, B / 2, 0, T1, '#DDE1E6', 0.55) + box(B1 / 2, B1 / 2, T1, T1 + T2, '#DDE1E6', 0.55);
    if (inc) {
      const a = A / 2, z0 = T1 + T2, d = lean(H), fl = '#DDE1E6';
      svg += PG([P(a, -a, z0), P(a, a, z0), P(a + d, a - d, H), P(a + d, -a - d, H)], { fill: fl, fo: 0.55, stroke: '#666', w: 0.18 }) +
        PG([P(-a, a, z0), P(a, a, z0), P(a + d, a - d, H), P(-a + d, a - d, H)], { fill: fl, fo: 0.55, stroke: '#666', w: 0.18 }) +
        PG([P(-a + d, -a - d, H), P(a + d, -a - d, H), P(a + d, a - d, H), P(-a + d, a - d, H)], { fill: fl, fo: 0.4, stroke: '#666', w: 0.18 });
    } else svg += box(A / 2, A / 2, T1 + T2, H, '#DDE1E6', 0.55);
    const bw = (phi) => Math.max(0.28, (phi * 1) * s);
    const hookLen = (phi, th) => (o.hookMode === 'L' ? Math.min(o.hookPhi * phi, th - 2 * c) : 0);
    const mesh = (n, phi, width, zA, zB, dirDown, col, th) => {
      let q = '';
      const pitch = (width - 2 * c - phi) / (n - 1), hk = hookLen(phi, th), sg = dirDown ? -1 : 1;
      for (let i = 0; i < n; i++) {
        const p = -width / 2 + c + phi / 2 + i * pitch;
        q += PL([P(-width / 2 + c, p, zA + sg * hk), P(-width / 2 + c, p, zA), P(width / 2 - c, p, zA), P(width / 2 - c, p, zA + sg * hk)], { stroke: col, w: bw(phi) });
        q += PL([P(p, -width / 2 + c, zB + sg * hk), P(p, -width / 2 + c, zB), P(p, width / 2 - c, zB), P(p, width / 2 - c, zB + sg * hk)], { stroke: col, w: bw(phi) });
      }
      return q;
    };
    const pb = rb.padBotPhi, pt = rb.padTopPhi, p2 = rb.pad2Phi;
    svg += mesh(rb.padBotN, pb, B, c + pb / 2, c + pb * 1.5, false, C.bot, T1);
    svg += mesh(rb.padTopN, pt, B, T1 - c - pt / 2, T1 - c - pt * 1.5, true, C.top, T1);
    svg += mesh(rb.pad2N, p2, B1, T1 + T2 - c - p2 / 2, T1 + T2 - c - p2 * 1.5, true, C.p2, T2);
    // sehpalar (Π): S1 alt hasır üstünde → taban ayağı üst hasırını, S2 üst hasır üstünde → 2. ayak hasırını taşır
    let chairPt = null;
    rbd.bars.filter((b) => b.group === 'sehpa' && b.grid).forEach((b) => {
      const L = b.shape.legs.map((x) => x * 10), ft = L[0], hh = L[1], a = L[2] / 2;
      const side = b.mark === 'S2' ? B1 : B, z0 = b.mark === 'S2' ? T1 - c : c + 2 * pb, nx = b.grid.nx, ny = b.grid.ny, dx = side / nx, dy = side / ny;
      for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
        const xc = -side / 2 + dx * (i + 0.5), y = -side / 2 + dy * (j + 0.5);
        svg += PL([P(xc - a - ft, y, z0), P(xc - a, y, z0), P(xc - a, y, z0 + hh), P(xc + a, y, z0 + hh), P(xc + a, y, z0), P(xc + a + ft, y, z0)], { stroke: '#138D90', w: bw(b.phi) });
        if (b.mark === 'S1' && i === 0 && j === ny - 1) chairPt = P(xc - a, y, z0 + hh * 0.6);
      }
    });
    // baca çubukları + etriyeler
    const zb = c + pb * 2, zt = H - o.coverChimTop * 10;
    const half = A / 2 - (o.coverChim * 10 + rb.stPhi + rb.chimPhi / 2);
    (rbd.bars.filter((b) => b.group === 'baca' && b.pos && b.mark[0] === 'K')).forEach((b) => {
      const px = b.xy.x * 10, py = b.xy.y * 10;
      const d = b.footDir, ux = d.includes('+x') ? 1 : d.includes('−x') ? -1 : 0, uy = d.includes('+y') ? 1 : d.includes('−y') ? -1 : 0, nn = Math.hypot(ux, uy) || 1;
      const ft = (b.tail * 10) + R.rcOf(b.phi, o) * 10;
      const lb = lean(zb);      // çubuk ayaktan uca tek doğru
      const pts = [P(px + lb + ux / nn * ft, py - lb + uy / nn * ft, zb), P(px + lb, py - lb, zb), P(px + lean(zt), py - lean(zt), zt)];
      svg += PL(pts, { stroke: C.chim, w: bw(rb.chimPhi) });
    });
    const sS = rb.stS * 10, cs = o.coverChim * 10, hch = H - T1 - T2;
    for (let z = T1 + T2 + cs; z <= H - cs; z += sS) {
      const a = A / 2 - cs, d = lean(z);
      svg += PL([P(-a + d, -a - d, z), P(a + d, -a - d, z), P(a + d, a - d, z), P(-a + d, a - d, z), P(-a + d, -a - d, z)], { stroke: C.st, w: 0.2 });
    }
    // stub: beton içi kesikli, taşan kısım dolu (raporun boyutlarıyla)
    if (si.st) {
      const ax = (zmm) => si.xs(zmm / 10) * 10, zB = si.zb * 10, zT0 = H, zT1 = si.zt * 10;
      const pt = (zz) => P(ax(zz), -ax(zz), zz);
      if (si.full) { const w = si.plateW * 5, c0 = ax(zB); svg += PG([[-1, -1], [1, -1], [1, 1], [-1, 1]].map((q) => P(c0 + q[0] * w, -c0 + q[1] * w, zB)), { fill: '#A39A86', stroke: '#5A5444', w: 0.2 }); }
      svg += PL([pt(zB), pt(zT0)], { stroke: '#1F3A5F', w: Math.max(0.5, si.st.F1 * 0.45 * s), dash: '3 1.5' }) + PL([pt(zT0), pt(zT1)], { stroke: '#1F3A5F', w: Math.max(0.6, si.st.F1 * 0.45 * s) });
      svg += T(pt(zT1)[0] + 2, pt(zT1)[1] + 1, `stub L${si.st.F1}×${si.st.t1} · ${si.st.nCleat} cleat`, { size: 2, fill: '#1F3A5F' });
    }
    // balonlar
    const bl = pr; // {chimCorner, chimSide, stir, bot, top, p2} poz numaraları
    const b1 = P(-B / 2 + c, -B / 2 + 4 * (B / 2 - c) / 6, c + pb / 2), b2 = P(B / 2 - c, -B / 2 + c + 5, T1 - c - pt / 2), b3 = P(B1 / 2 - c, 0, T1 + T2 - c - p2 / 2);
    svg += balloon(x0 + 9, y0 + h - 12, bl.bot, b1[0] + 0.3, b1[1]) + balloon(x0 + w - 8, y0 + h - 30, bl.top, b2[0], b2[1]) + balloon(x0 + w - 8, y0 + h * 0.52, bl.p2, b3[0], b3[1]);
    const kc = rbd.bars.find((b) => b.pos === bl.chimCorner && b.mark[0] === 'K'), ks = rbd.bars.find((b) => b.pos === bl.chimSide && b.mark[0] === 'K');
    if (kc) { const p = P(kc.xy.x * 10 + lean(H - 600), kc.xy.y * 10 - lean(H - 600), H - 600); svg += balloon(x0 + 10, y0 + h * 0.3, bl.chimCorner, p[0], p[1]); }
    if (ks) { const p = P(ks.xy.x * 10 + lean(H - 1400), ks.xy.y * 10 - lean(H - 1400), H - 1400); svg += balloon(x0 + w - 12, y0 + h * 0.22, bl.chimSide, p[0], p[1]); }
    const ez = T1 + T2 + cs + 2 * sS, pa = P(A / 2 - cs + lean(ez), A / 2 - cs - lean(ez), ez);
    svg += balloon(x0 + w - 8, y0 + h * 0.36, bl.stir, pa[0], pa[1]);
    if (chairPt && bl.chair) svg += balloon(x0 + 9, y0 + h * 0.62, bl.chair, chairPt[0], chairPt[1]);
    return svg;
  }


  /* ----------- etriye detayları (1/5) ----------- */
  function stirrupDetails(inp, x0, yA, yB) {
    const o = inp.opts, rb = inp.rebar, D = 5, cs = o.coverChim * 10, ph = rb.stPhi, pb = rb.chimPhi, win = 130;
    const k = R.mandrelFactor(ph, o), rc = (k * ph) / 2 + ph / 2, iS = cs + ph / 2, tail = Math.max(10 * ph, 70);
    let s = '';
    /* DETAY 1: köşe + boyuna çubuk */
    const X = (v) => x0 + v / D, Y = (v) => yA + v / D;
    s += T(x0, yA - 3, 'DETAY 1 – KÖŞE  (1/5)', { size: 2.4, bold: true });
    s += PL([[X(win), Y(0)], [X(0), Y(0)], [X(0), Y(win)]], { w: 0.5 });
    s += `<path d="M ${X(win)} ${Y(iS)} L ${X(iS + rc)} ${Y(iS)} A ${(rc / D).toFixed(2)} ${(rc / D).toFixed(2)} 0 0 0 ${X(iS)} ${Y(iS + rc)} L ${X(iS)} ${Y(win)}" fill="none" stroke="${C.st}" stroke-width="${(ph / D).toFixed(2)}"/>`;
    const cc = cs + ph + pb / 2;
    s += CI(X(cc), Y(cc), pb / 2 / D, { fill: C.chim, stroke: '#7a4800', w: 0.15 });
    s += dimH(X(0), X(cs), Y(win * 0.55), '', true) + T(X(cs / 2), Y(win * 0.55) - 1.1, f(cs), { size: 1.8, anchor: 'middle' });
    s += T(X(win) + 1.5, Y(iS) + 0.8, `etriye Φ${ph}: et kalınlığı ${f(ph)} mm`, { size: 1.7 });
    s += T(X(win) + 1.5, yA + 21.6, `boyuna çubuk Φ${pb}`, { size: 1.7 });
    s += T(X(win) + 1.5, yA + 25, `D = ${f(k, 1)}Φ = ${f(k * ph)} mm · pas payı ${f(cs)}`, { size: 1.7 });
    /* DETAY 2: 135° kanca */
    const Y2 = (v) => yB + v / D, yb = 70;
    s += T(x0, yB - 3, 'DETAY 2 – 135° KANCA  (1/5)', { size: 2.4, bold: true });
    s += PL([[X(win), Y2(0)], [X(0), Y2(0)], [X(0), Y2(win)]], { w: 0.5 });
    const cx = iS + rc, ex = cx + rc * Math.SQRT1_2, ey = yb - rc * Math.SQRT1_2, tx = ex + tail * Math.SQRT1_2, ty = ey + tail * Math.SQRT1_2;
    s += `<path d="M ${X(iS)} ${Y2(win)} L ${X(iS)} ${Y2(yb)} A ${(rc / D).toFixed(2)} ${(rc / D).toFixed(2)} 0 0 1 ${X(ex)} ${Y2(ey)} L ${X(tx)} ${Y2(ty)}" fill="none" stroke="${C.st}" stroke-width="${(ph / D).toFixed(2)}"/>`;
    s += T(X(win) + 1.5, Y2(30), `kanca açısı 135°`, { size: 1.9 }) + T(X(win) + 1.5, Y2(30) + 3.5, `uç boyu ≥ 10Φ = ${f(tail)} mm`, { size: 1.9 });
    return s;
  }

  /* ----------- ana pafta 1 ----------- */
  function pos(rbd) {
    const gr = rbd.groups;
    return {
      bot: (gr.find((g) => g.meshKey === 'A') || {}).pos, top: (gr.find((g) => g.meshKey === 'B') || {}).pos, p2: (gr.find((g) => g.meshKey === 'D') || {}).pos,
      chimCorner: (gr.find((g) => g.kind === 'chim' && g.diag) || {}).pos, chimSide: (gr.find((g) => g.kind === 'chim' && !g.diag) || gr.find((g) => g.kind === 'chim') || {}).pos,
      stir: (gr.find((g) => g.kind === 'stir') || {}).pos,
      chair: (gr.find((g) => g.kind === 'chair' && g.tags[0] === 'S1') || gr.find((g) => g.kind === 'chair') || {}).pos,
    };
  }

  function sheet1(inp, out, rbd, meta, total) {
    const g = inp.geo, o = inp.opts, rb = inp.rebar, ps = pos(rbd);
    const B = g.B * 1000, B1 = g.B1 * 1000, A = g.A * 1000, T1 = g.T1 * 1000, T2 = g.T2 * 1000, Tt = g.T * 1000, To = g.To * 1000, c = o.coverPad * 10;
    const og = o.grobeton ? o.grobetonOver * 10 : 0, tg = o.grobeton ? o.grobetonT * 10 : 0;
    const stTop = inp.stub ? Math.max(inp.stub.top, 500) : 0;      // stub betondan en az 500 mm taşar
    const S = pickScale(Math.max((B + 2 * og) / 108, (Tt + To + tg + stTop) / 118));
    let s = '';

    /* --- PLAN --- */
    const cx = 80, cy = 84, X = (x) => cx + x / S, Y = (y) => cy - y / S;
    s += viewTitle(12, 16, 'PLAN', `Temel planı ve donatı yerleşimi  ·  1/${S}`);
    if (o.grobeton) s += RC(X(-B / 2 - og), Y(B / 2 + og), (B + 2 * og) / S, (B + 2 * og) / S, { dash: '2 1', w: 0.2, stroke: '#777', fill: '#F4F0E4' });
    s += RC(X(-B / 2), Y(B / 2), B / S, B / S, { w: 0.4, fill: C.conc });
    const bwid = (phi) => Math.max(0.2, phi / S);
    const nb = rb.padBotN, pb = rb.padBotPhi, pitchB = (B - 2 * c - pb) / (nb - 1);
    for (let i = 0; i < nb; i++) { const p = -B / 2 + c + pb / 2 + i * pitchB; s += L(X(-B / 2 + c), Y(p), X(B / 2 - c), Y(p), bwid(pb), C.bot) + L(X(p), Y(-B / 2 + c), X(p), Y(B / 2 - c), bwid(pb), C.bot); }
    const nt = rb.padTopN, pt = rb.padTopPhi, pitchT = (B - 2 * c - pt) / (nt - 1);
    for (let i = 0; i < nt; i++) { const p = -B / 2 + c + pt / 2 + i * pitchT; s += L(X(-B / 2 + c), Y(p), X(B / 2 - c), Y(p), bwid(pt), C.top, '1.4 0.8') + L(X(p), Y(-B / 2 + c), X(p), Y(B / 2 - c), bwid(pt), C.top, '1.4 0.8'); }
    s += RC(X(-B1 / 2), Y(B1 / 2), B1 / S, B1 / S, { w: 0.3, dash: '2.5 1', stroke: '#555' });
    const n2 = rb.pad2N, p2 = rb.pad2Phi, pitch2 = (B1 - 2 * c - p2) / (n2 - 1);
    for (let i = 0; i < n2; i++) { const p = -B1 / 2 + c + p2 / 2 + i * pitch2; s += L(X(-B1 / 2 + c), Y(p), X(B1 / 2 - c), Y(p), bwid(p2), C.p2) + L(X(p), Y(-B1 / 2 + c), X(p), Y(B1 / 2 - c), bwid(p2), C.p2); }
    s += RC(X(-A / 2), Y(A / 2), A / S, A / S, { w: 0.5, fill: '#fff' });
    { const sp = Dw.stubInfo(inp); if (sp.inc) { const off = sp.xo(sp.topC) * 10; s += RC(X(-A / 2 + off), Y(A / 2 - off), A / S, A / S, { w: 0.25, dash: '2 1', stroke: '#1F4E78' }) + L(X(0), Y(0), X(off), Y(-off), 0.25, '#1F4E78') + T(X(off + A / 2) + 1, Y(-off - A / 2) + 3, 'baca üstü (eğimli)', { size: 1.9, fill: '#1F4E78' }); } }
    const cs = o.coverChim * 10;
    s += RC(X(-A / 2 + cs + rb.stPhi / 2), Y(A / 2 - cs - rb.stPhi / 2), (A - 2 * cs - rb.stPhi) / S, (A - 2 * cs - rb.stPhi) / S, { w: Math.max(0.25, rb.stPhi / S), stroke: C.st });
    rbd.bars.filter((b) => b.xy && b.group === 'baca' && b.mark[0] === 'K').forEach((b) => { s += CI(X(b.xy.x * 10), Y(b.xy.y * 10), Math.max(0.6, rb.chimPhi / S / 2), { fill: C.chim, stroke: C.chim, w: 0.1 }); });
    // eksenler
    s += L(X(-B / 2 - og - 6), Y(0), X(B / 2 + og + 6), Y(0), 0.15, '#999', '6 1 1 1') + L(X(0), Y(-B / 2 - og - 6), X(0), Y(B / 2 + og + 6), 0.15, '#999', '6 1 1 1');
    // kesit işareti A-A
    const ay = Y(0);
    s += L(X(-B / 2 - og - 4), ay, X(-B / 2 - og + 4), ay, 0.5) + T(X(-B / 2 - og - 8), ay + 1.2, 'A', { size: 3.2, bold: true, anchor: 'middle' }) + T(X(B / 2 + og + 8), ay + 1.2, 'A', { size: 3.2, bold: true, anchor: 'middle' });
    // ölçüler
    s += dimH(X(-B / 2), X(B / 2), Y(-B / 2 - og) + 8, `B = ${f(B)}`, false);
    s += dimH(X(-B1 / 2), X(B1 / 2), Y(-B / 2 - og) + 15, `B1 = ${f(B1)}`, false);
    s += dimH(X(-A / 2), X(A / 2), Y(B / 2 + og) - 7, `A = ${f(A)}`);
    if (o.grobeton) s += T(X(-B / 2 - og) + 0.5, Y(B / 2 + og) - 1, `grobeton +${f(og)} mm / ${f(tg)} mm`, { size: 1.8, fill: '#666' });
    // balonlar (yatay kılavuz çizgileri)
    const Ba = (bx, by, p, tx, ty) => balloon(bx, by, p, tx, ty);
    const yB = Y(-B / 2 + c + pb / 2 + 2 * pitchB), yT = Y(-B / 2 + c + pt / 2 + 8 * pitchT), y2 = Y(-B1 / 2 + c + p2 / 2 + 1 * pitch2);
    s += Ba(21, yB, ps.bot, X(-B / 2 + c), yB) + T(21, yB + 6.6, `${rb.padBotN}Φ${pb}/yön`, { size: 2, anchor: 'middle' });
    s += Ba(21, yT, ps.top, X(-B / 2 + c), yT) + T(21, yT + 6.6, `${rb.padTopN}Φ${pt}/yön`, { size: 2, anchor: 'middle' });
    s += Ba(139, y2, ps.p2, X(B1 / 2 - c), y2) + T(139, y2 + 6.6, `${rb.pad2N}Φ${p2}/yön`, { size: 2, anchor: 'middle' });
    const kc = rbd.bars.find((b) => b.pos === ps.chimCorner && b.mark[0] === 'K'), ks = rbd.bars.filter((b) => b.pos === ps.chimSide && b.mark[0] === 'K' && b.xy.x > 0).sort((a, b) => b.xy.y - a.xy.y)[0];
    if (kc) { const yy = Y(kc.xy.y * 10); s += Ba(21, yy, ps.chimCorner, X(kc.xy.x * 10) - 0.6, yy) + T(21, yy + 6.6, 'köşe baca çubuğu', { size: 1.9, anchor: 'middle' }); }
    if (ks) { const yy = Y(ks.xy.y * 10); s += Ba(139, yy, ps.chimSide, X(ks.xy.x * 10) + 0.6, yy) + T(139, yy + 6.6, 'kenar baca çubuğu', { size: 1.9, anchor: 'middle' }); }
    s += Ba(80, 21, ps.stir, X(0), Y(A / 2 - cs)) + T(85, 22.4, `etriye Φ${rb.stPhi}/${f(rb.stS * 10)} mm`, { size: 2, anchor: 'start' });

    /* --- KESİT A-A --- */
    const sx = 212, base = 32 + (Tt + To + stTop) / S + 0;
    const SX = (x) => sx + x / S, SZ = (z) => base - z / S;
    const si = Dw.stubInfo(inp), inc = si.inc, xoM = (z) => si.xo(z / 10) * 10, xsM = (z) => si.xs(z / 10) * 10;   // mm

  /* ----------- şekil çizimi (mm) ----------- */

      const s = a * k;

        T(x + 6 + s / 2, y + 3 + s + 3.2, `${f(a)} × ${f(a)}  ·  kanca 135°  ·  uç ${f(sh.legs[0] * 10)}`, { size: 1.9, anchor: 'middle' });
