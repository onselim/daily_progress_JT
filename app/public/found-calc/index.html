      s += shapeMM({ shape: gr.shape }, cxs[3], yy, 82, rh);
      s += T(cxs[4] + 1.5, yy + rh / 2 + 1, `${f(gr.cut * 10)} mm`, { size: 2.6, bold: true }) + T(cxs[5] + 1.5, yy + rh / 2 + 1, `${f(gr.totalLen, 2)} m`, { size: 2.6 }) + T(cxs[6] + 1.5, yy + rh / 2 + 1, `${f(gr.weight, 1)} kg`, { size: 2.6 });
      const d = gr.desc, parts = [];
      let cur = ''; d.split(' ').forEach((wd) => { if ((cur + ' ' + wd).length > 56) { parts.push(cur); cur = wd; } else cur = (cur + ' ' + wd).trim(); }); parts.push(cur);
      parts.concat([`Σ ölçü ${f(gr.shape.legs.reduce((a, b) => a + b, 0) * 10)} − büküm ${f(gr.bars[0].ded * 10)} = ${f(gr.cut * 10)} mm`, `Etiket: ${gr.tags.length > 6 ? gr.tags.slice(0, 6).join(',') + '…' : gr.tags.join(',')}`]).forEach((p, j) => { const gap = kH < 1 ? 3.2 : 3.8, nl = Math.min(4, Math.floor((rh - 2.5) / gap) + 1); if (j < nl) s += T(cxs[7] + 1.5, yy + 4 + j * gap, p, { size: kH < 1 ? 1.9 : 2 }); });
      tot += gr.totalLen; totW += gr.weight;
    });
    const yEnd = y0 + 7 + rbd.groups.reduce((a, g2) => a + rhOf(g2), 0);
    s += RC(12, yEnd, 288, 7, { fill: '#F3F6FA', w: 0.3 }) + T(cxs[3] + 1.5, yEnd + 4.7, 'TOPLAM (1 temel)', { size: 2.4, bold: true }) + T(cxs[5] + 1.5, yEnd + 4.7, `${f(tot, 1)} m`, { size: 2.4, bold: true }) + T(cxs[6] + 1.5, yEnd + 4.7, `${f(totW, 1)} kg`, { size: 2.4, bold: true });

    /* --- baca çubukları tek tek --- */
    const by = Math.max(yEnd + 14, 175);
    s += viewTitle(12, by, 'BACA ÇUBUKLARI – TEK TEK', 'Her çubuğun konumu, ayak yönü, bacak boyları ve büküm açıları');
    const kc = [['ETİKET', 16], ['POZ', 12], ['KONUM (x, y) mm', 36], ['AYAK YÖNÜ', 22], ['BACAKLAR (dış ölçü mm)', 70], ['BÜKÜM AÇILARI', 32], ['KESİM mm', 22]];
    let kx = 12; const kxs = kc.map((c) => { const v = kx; kx += c[1]; return v; });
    s += RC(12, by + 7, 210, 6, { fill: '#E8EDF3', w: 0.25 });
    kc.forEach((c, i) => { s += T(kxs[i] + 1.2, by + 11.2, c[0], { size: 1.9, bold: true }); });
    const kb = rbd.bars.filter((b) => b.mark[0] === 'K');
    const rowH = Math.min(5, (250 - (by + 13)) / Math.max(kb.length, 1));
    kb.forEach((b, i) => {
      const yy = by + 13 + i * rowH;
      s += RC(12, yy, 210, rowH, { w: 0.15 });
      const cells = [b.mark, String(b.pos), `${f(b.xy.x * 10)}, ${f(b.xy.y * 10)}`, b.footDir, b.shape.legs.map((x) => f(x * 10)).join(' + '), b.shape.bends.map((a) => f(a, 1) + '°').join(' · '), f(b.cut * 10)];
      cells.forEach((cell, j) => { s += T(kxs[j] + 1.2, yy + rowH * 0.7, cell, { size: 1.9 }); });
    });

    /* --- sağ sütun: miktarlar --- */
    const rx = 308;
    const cn = rbd.conc, so = out;
    s += viewTitle(rx, 24, 'BETON VE KAZI');
    const Q = [
      ['Taban ayağı betonu', `${f(cn.Vpad1, 2)} m³`], ['2. ayak betonu', `${f(cn.Vpad2, 2)} m³`], ['Baca betonu', `${f(cn.Vch, 2)} m³`], ['Yapısal beton (1 temel)', `${f(cn.Vtot, 2)} m³`],
      ['Grobeton', `${f(cn.Vgrob, 2)} m³`], ['Kazı (1 temel)', `${f(cn.Vexc, 1)} m³`], ['Geri dolgu (yaklaşık)', `${f(cn.Vback, 1)} m³`], ['1 direk (×4): beton', `${f(cn.Vtot * 4, 1)} m³`], ['1 direk (×4): kazı', `${f(cn.Vexc * 4, 1)} m³`],
    ];
    Q.forEach((q, i) => { s += RC(rx, 29 + i * 6, 102, 6, { w: 0.2 }) + T(rx + 2, 33.2 + i * 6, q[0], { size: 2.3 }) + T(rx + 100, 33.2 + i * 6, q[1], { size: 2.3, anchor: 'end', bold: i === 3 }); });
    s += viewTitle(rx, 90, 'DONATI – ÇAPA GÖRE');
    const byPhi = Object.keys(rbd.byPhi).sort((a, b) => a - b);
    byPhi.forEach((p, i) => {
      const len = rbd.groups.filter((g2) => g2.phi === +p).reduce((a, g2) => a + g2.totalLen, 0);
      s += RC(rx, 95 + i * 6, 102, 6, { w: 0.2 }) + T(rx + 2, 99.2 + i * 6, `Φ${p}`, { size: 2.3 }) + T(rx + 40, 99.2 + i * 6, `${f(len, 1)} m`, { size: 2.3, anchor: 'end' }) + T(rx + 100, 99.2 + i * 6, `${f(rbd.byPhi[p], 1)} kg`, { size: 2.3, anchor: 'end' });
    });
    const yt = 95 + byPhi.length * 6;
    s += RC(rx, yt, 102, 6, { fill: '#F3F6FA', w: 0.25 }) + T(rx + 2, yt + 4.2, 'Toplam (1 temel)', { size: 2.3, bold: true }) + T(rx + 100, yt + 4.2, `${f(rbd.steelLeg, 1)} kg`, { size: 2.3, anchor: 'end', bold: true });
    s += T(rx + 2, yt + 10.5, `1 direk: ${f(rbd.steelLeg * 4, 0)} kg  ·  ${f(rbd.steelLeg / cn.Vtot, 0)} kg/m³`, { size: 2.2 });
    /* --- büküm payı açıklaması --- */
    const ey = yt + 22;
    s += viewTitle(rx, ey, 'BÜKÜM PAYI NASIL HESAPLANDI?');
    const ex = rbd.bars.find((b) => b.mark === 'K1') || rbd.bars[0];
    const phi = ex.phi, k = R.mandrelFactor(phi, o), rc = R.rcOf(phi, o), d90 = R.bendDed(phi, o, 90);
    const lines = [
      'Dış ölçüler köşelerde bükümün dış yüzlerinin kesişiminden',
      'ölçülür; bu yüzden çubuğun gerçek boyu ölçü toplamından küçüktür.',
      'Kesim boyu = Σ dış ölçü − Σ büküm payı',
      'Büküm payı(θ) = 2·(rc + Φ/2)·tan(θ/2) − rc·θ',
      'rc = D/2 + Φ/2   ·   D: büküm iç çapı (Φ≤16: 4Φ, Φ>16: 7Φ)',
      `Örnek Φ${phi}: D = ${f(k, 1)}Φ = ${f(k * phi, 0)} mm,  rc = ${f(rc * 10, 1)} mm`,
      `90° büküm payı = ${f(d90 * 10, 1)} mm`,
      `Poz ${ex.pos}: ${f(ex.sumLegs * 10)} − ${f(ex.ded * 10, 1)} = ${f(ex.cut * 10, 1)} mm`,
    ];
    lines.forEach((l, i) => { s += T(rx, ey + 6 + i * 4.4, l, { size: 2.1 }); });
    return frame(s, meta, 2, total, 'DONATI ÇİZELGESİ VE MİKTARLAR', { scale: 'ölçeksiz', doc: `Direk: ${meta.tower} · Zemin sınıfı: ${meta.cls}` });
  }

  /* ===================== Pafta-3 (hesap çizelgesi) ve Pafta-4 (sunum paftası) ===================== */
  const NAVY = '#0E2237', TEAL = '#12B5A2', TEALD = '#0B7F73', AMBER = '#F2A33A', GREY = '#9AA9BA', COR = '#D9573A';
  const TXN = (s) => (typeof window !== 'undefined' && window.I18N && window.I18N.curCode ? window.I18N.tr(s, window.I18N.curCode()) : s);   // şimdi çevir (satır kırılacak metinler için)
  const TN = (x, y, s, o) => T(x, y, s, o).replace('<text ', '<text data-nolang="1" ');                                                    // markup bu metni yeniden çevirmez
  const wrapTx = (s, max) => { const out = []; let cur = ''; s.split(' ').forEach((t) => { if ((cur + ' ' + t).trim().length > max && cur) { out.push(cur); cur = t; } else cur = (cur + ' ' + t).trim(); }); if (cur) out.push(cur); return out; };
  const band = (x, y, w, t) => RC(x, y, w, 6, { fill: NAVY, stroke: NAVY }) + T(x + 2, y + 4.3, t, { size: 3, bold: true, fill: '#fff' });
  const ptitle = (x, y, t, sub) => T(x, y, t, { size: 4, bold: true, fill: NAVY }) + (sub ? T(x, y + 4, sub, { size: 2.2, fill: '#667' }) : '') + L(x, y + (sub ? 6 : 2), x + 40, y + (sub ? 6 : 2), 0.6, TEAL);
  const tbl = (x, y, widths, rows, o2 = {}) => {
    let t = '', yy = y; const rh = o2.rh || 5;
    rows.forEach((r, ri) => {
      let xx = x; if (ri % 2 === 0) t += RC(x, yy - rh + 1.3, widths.reduce((a, b) => a + b, 0), rh, { fill: '#F3F6FA', stroke: '#F3F6FA', w: 0 });
      r.forEach((c, ci) => { t += T(ci === 0 ? xx + 1.5 : xx + widths[ci] - 1.5, yy, String(c), { size: o2.size || 2.5, bold: o2.boldCol === ci, anchor: ci === 0 ? 'start' : 'end' }); xx += widths[ci]; });
      yy += rh;
    });
    return t;
  };
  const PCT = (v) => (LOC().indexOf('tr') === 0 ? `%${f(v)}` : `${f(v)}%`);   // yüzde işareti Türkçede başta, diğer dillerde sonda
  const wd = (s, size) => s.length * size * 0.56;                 // yaklaşık metin genişliği (mm)

  /* Karşılaştırma için referans (rapor) tasarımı: meta.ref = {geo, concrete, steel, excavation, grobeton, cost, fails[]} */
  function costOf(d, price) { const p = price || { beton: 100, demir: 1, kazi: 6, grobeton: 80 }; return d.concrete * p.beton + d.steel * p.demir + d.excavation * p.kazi + d.grobeton * p.grobeton; }

  function sheetCalc(inp, out, rbd, meta, total) {
    const o = out, ld = o.ld, w = o.w, g = inp.geo, chk = E.checkList(inp, o), by = Object.fromEntries(chk.map((c) => [c.key, c])), sc = inp.stub ? E.stubCheck(inp, o) : null;
    let s = '';
    s += band(11, 12, 130, '1  TASARIM ESASLARI');
    const L1 = [['Direk · zemin', meta.tower, meta.clsName || meta.cls]];
    if (inp.loads.mode === 'tower') L1.push(['Çekme (Z, X, Y)', f(inp.loads.Zu, 1), `${f(inp.loads.Xu, 1)} / ${f(inp.loads.Yu, 1)} kN`], ['Basınç (Z, X, Y)', f(inp.loads.Zc, 1), `${f(inp.loads.Xc, 1)} / ${f(inp.loads.Yc, 1)} kN`]);
    else L1.push(['Çekme P (eksen)', `${f(inp.loads.PuAx)} daN`, ''], ['Basınç P (eksen)', `${f(inp.loads.PcAx)} daN`, '']);
    L1.push(['Bacak eğimi tanα', f(ld.t, 4), `k = ${f(ld.k, 4)}`], ['Çarpanlı çekme Lu', `${f(ld.Lu)} daN`, `ER × ${f(inp.opts.erFactor, 2)}`], ['Çarpanlı basınç Lc', `${f(ld.Lc)} daN`, `ER × ${f(inp.opts.erFactor, 2)}`],
      ['Zemin kesmesi Vs (x / y)', `${f(ld.Vs.x)} daN`, `${f(ld.Vs.y)} daN`], ['İzin verilen basınç qa', `${f(inp.soil.qa, 2)} daN/cm²`, `kenar × ${f(inp.soil.edge, 2)}`], ['Zemin γ · kama açısı β', `${f(inp.soil.gdry)} daN/m³`, `${f(inp.soil.beta)}°`], ['Beton fck · çelik fy', `${f(inp.mat.fck)} daN/cm²`, `${f(inp.mat.fy)} daN/cm²`]);
    s += tbl(11, 22, [60, 35, 35], L1);

    s += band(150, 12, 130, '2  GEOMETRİ VE AĞIRLIKLAR');
    s += tbl(150, 22, [60, 35, 35], [
      ['Taban ayağı B · derinlik T', `${f(g.B, 2)} m`, `${f(g.T, 2)} m`], ['Taban ayağı kalınlığı T1', `${f(g.T1, 2)} m`, ''], ['2. ayak B1 · T2', `${f(g.B1, 2)} m`, `${f(g.T2, 2)} m`], ['Baca A · zemin üstü To', `${f(g.A, 2)} m`, `${f(g.To, 2)} m`],
      ['Beton hacmi Vb', `${f(w.Vb, 2)} m³`, ''], ['Beton ağırlığı Gb', `${f(w.Gb)} daN`, ''], ['Kama hacmi Vpt', `${f(w.Vpt, 2)} m³`, inp.opts.pad1Subtract ? '(1. ayak düşülür)' : '(rapor yöntemi)'], ['Kama ağırlığı Gpt', `${f(w.Gpt)} daN`, ''],
      ['Taban ayağı üstü zemin Gat', `${f(w.Gat)} daN`, ''], ['Kama izi B + 2·T·tanβ', `${f(g.B + 2 * g.T * w.tb, 2)} m`, o.group ? `ayak aralığı ${f(Math.min(o.group.lx, o.group.ly), 2)} m` : ''],
    ]);

    s += band(289, 12, 122, '3  TASARIMLARIN KARŞILAŞTIRMASI (ayak başına)');
    const ref = meta.ref, cur = Object.assign({ geo: g, concrete: rbd.conc.Vtot, steel: rbd.steelLeg, excavation: rbd.conc.Vexc, grobeton: rbd.conc.Vgrob }, meta.refCur || {}), curFails = chk.filter((c) => !c.ok).length;
    if (ref) {
      const cc = costOf(cur, meta.price), rc = costOf(ref, meta.price), rg = ref.geo;
      s += tbl(289, 22, [46, 38, 38], [
        ['', 'Rapor tasarımı', 'Bu tasarım'], ['B × T (m)', `${f(rg.B, 2)} × ${f(rg.T, 2)}`, `${f(g.B, 2)} × ${f(g.T, 2)}`], ['T1 / T2 (m)', `${f(rg.T1, 2)} / ${f(rg.T2, 2)}`, `${f(g.T1, 2)} / ${f(g.T2, 2)}`], ['B1 · A (m)', `${f(rg.B1, 2)} · ${f(rg.A, 2)}`, `${f(g.B1, 2)} · ${f(g.A, 2)}`],
        ['Beton (m³)', f(ref.concrete, 2), f(cur.concrete, 2)], ['Donatı (kg)', f(ref.steel), f(cur.steel)], ['Kazı (m³)', f(ref.excavation, 1), f(cur.excavation, 1)], ['Maliyet endeksi', f(rc), f(cc)],
        ['Kontroller', ref.fails && ref.fails.length ? `${ref.fails.length} sağlanmıyor` : 'hepsi sağlanıyor', curFails ? `${curFails} sağlanmıyor` : 'hepsi sağlanıyor'],
      ], { boldCol: 2 });
      s += TN(291, 22 + 9 * 5 + 1, wrapTx(TXN('Karşılaştırma ikisi için de otomatik donatı seçimiyle yapılmıştır.'), 70)[0], { size: 2.1, fill: '#667' });
    } else s += wrapTx(TXN('Bu direk ve zemin sınıfı için karşılaştırılacak bir rapor tasarımı tanımlı değil.'), 52).map((ln, i) => TN(291, 25 + i * 4, ln, { size: 2.6, fill: '#445' })).join('');

    s += band(11, 74, 400, '4  TASARIM KONTROLLERİ');
    const W = [10, 56, 130, 62, 62, 34, 46], hd = ['No.', 'Kontrol', 'Esas', 'Talep', 'Kapasite', 'Doluluk', 'Sonuç'];
    let xx = 11; hd.forEach((h, i) => { s += T(xx + (i >= 3 ? W[i] - 1.5 : 1.5), 84, h, { size: 2.4, bold: true, anchor: i >= 3 ? 'end' : 'start', fill: '#445' }); xx += W[i]; });
    s += L(11, 86, 411, 86, 0.4, NAVY);
    const unit = (v, u, d = 2) => `${f(v, d)} ${u}`;
    const spec = [
      ['uplift', 'Zemin kaması + beton ağırlığı: R = φ(Gb + Gpt) ≥ Lu', unit(o.uplift.Lu, 'daN', 0), unit(o.uplift.R, 'daN', 0)],
      ['bearAvg', 'Qo = (Lc + Gat + Gb) / B² ≤ qa', unit(o.bearing.Qo, 'daN/cm²'), unit(inp.soil.qa, 'daN/cm²')],
      ['bearEdge', `Qmax = Qo ± 6M/B³ ≤ ${f(inp.soil.edge, 2)} qa`, unit(o.bearing.Qmax, 'daN/cm²'), unit(o.bearing.qEdge, 'daN/cm²')],
      ['bearMin', 'Qmin = Qo − 6M/B³ ≥ 0', unit(o.bearing.Qmin, 'daN/cm²'), '≥ 0'],
      ['ovx', 'FS = Lr / Lo,x (ABD sayfası 103-D-64), Lr = φ·Gpt/2', `FS ${f(o.overturn.FSx, 3)}`, `≥ ${f(1, 2)}`],
      ['ovy', 'FS = Lr / Lo,y', `FS ${f(o.overturn.FSy, 3)}`, `≥ ${f(1, 2)}`],
      ['punch', 'Baca çevresinde v_Ed ≤ v_Rd (rapor esası)', unit(o.punch.vedRep, 'daN/cm²'), unit(o.punch.vRd, 'daN/cm²')],
      ['padBot', 'Gereken As (baca yüzünde eğilme) ≤ mevcut As', unit(o.padBot.As, 'cm²', 1), unit(o.padBot.Aprov, 'cm²', 1)],
      ['padTop', 'Gereken As (uplift eğilmesi) ≤ mevcut As', unit(o.padTop.As, 'cm²', 1), unit(o.padTop.Aprov, 'cm²', 1)],
      ['pad2', 'Gereken As ≤ mevcut As', unit(o.pad2.As, 'cm²', 1), unit(o.pad2.Aprov, 'cm²', 1)],
      ['chim', 'Mux/Mu + Muy/Mu ≤ 1 (kesit analizi, N = 0)', f(o.chimney.util, 2), `≤ ${f(1, 2)}`],
      ['chimMin', 'Mevcut As ≥ baca alanının %1’i (ACI)', unit(o.chimney.AsMinACI, 'cm²', 1), unit(o.chimney.As, 'cm²', 1)],
      ['minSteel', 'Mevcut As ≥ %0,18 (ACI)', unit(o.minSteel.aci1, 'cm²', 1), unit(o.minSteel.prov1, 'cm²', 1)],
      ['stub', 'Belirleyen: stub kesiti, aderans, cleat ezilmesi, cıvata', by.stub ? PCT(by.stub.v * 100) : '', `≤ ${PCT(100)}`],
      ['stubFit', 'Gereken gömülme ≤ mevcut', sc ? unit(sc.need, 'mm', 0) : '', sc ? unit(sc.Lavail, 'mm', 0) : ''],
      ['stubCage', 'Cleat ucu ≤ kafes yarı genişliği', sc ? unit(sc.cleatExt, 'cm', 1) : '', sc ? unit(sc.cageHalf, 'cm', 1) : ''],
      ['group', 'Komşu ayak kamaları çakışması: FS = φ(Gb + Gpt − ΔG) / Lu', o.group ? unit(o.group.Vmax, 'm³') : '', o.group ? `FS ${f(o.group.FS, 3)}` : ''],
    ].filter((r) => by[r[0]]);
    spec.forEach((r, ri) => {
      const c = by[r[0]], y = 91.5 + ri * 5.4, tight = c.v >= 0.95;
      if (ri % 2 === 0) s += RC(11, y - 3.9, 400, 5.4, { fill: '#F3F6FA', stroke: '#F3F6FA', w: 0 });
      const cells = [String(ri + 1), c.n, r[1], r[2], r[3], PCT(c.v * 100), c.ok ? 'UYGUN' : 'YETERSİZ']; let x = 11;
      cells.forEach((tx, i) => { s += T(x + (i >= 3 ? W[i] - 1.5 : 1.5), y, tx, { size: 2.5, bold: i === 1 || i === 6, anchor: i >= 3 ? 'end' : 'start', fill: i === 5 ? (tight ? '#9A5B00' : TEALD) : i === 6 ? (c.ok ? TEALD : COR) : '#111' }); x += W[i]; });
    });
    const yEnd = 91.5 + spec.length * 5.4 - 3.9;
    s += L(11, yEnd, 411, yEnd, 0.4, NAVY);

    const yq = Math.max(yEnd + 8, 188);
    s += band(11, yq, 130, '5  METRAJ (ayak başına)');
    s += tbl(11, yq + 10, [60, 35, 35], [
      ['1. ayak betonu', `${f(rbd.conc.Vpad1, 2)} m³`, ''], ['2. ayak betonu', `${f(rbd.conc.Vpad2, 2)} m³`, ''], ['Baca betonu', `${f(rbd.conc.Vch, 2)} m³`, ''],
      ['Yapısal beton', `${f(rbd.conc.Vtot, 2)} m³`, `× 4 = ${f(rbd.conc.Vtot * 4, 1)} m³`], ['Grobeton', `${f(rbd.conc.Vgrob, 2)} m³`, `× 4 = ${f(rbd.conc.Vgrob * 4, 1)} m³`], ['Kazı', `${f(rbd.conc.Vexc, 1)} m³`, `× 4 = ${f(rbd.conc.Vexc * 4, 1)} m³`],
      ['Donatı – ayaklar', `${f(rbd.steelPad)} kg`, ''], ['Donatı – baca', `${f(rbd.steelChim)} kg`, ''], ...(rbd.steelChair ? [['Donatı – sehpa', `${f(rbd.steelChair)} kg`, '']] : []), ['Donatı – toplam', `${f(rbd.steelLeg)} kg`, `× 4 = ${f(rbd.steelLeg * 4)} kg`],
    ]);
    s += band(150, yq, 261, '6  NOTLAR VE KABULLER');
    const tight = chk.filter((c) => c.v >= 0.95).length, notes = [
      `Hesap temel hesap aracıyla yapıldı: rapor yükleri ve zemin değerleri; bacak eğimi çekme ve basınca uygulandı, eksenel yüklerde ER çarpanı ${f(inp.opts.erFactor, 2)}.`,
      inp.opts.pad1Subtract ? `Uplift’te kama hacminden birinci ayak düşüldü (beton olarak bir kez sayılır). Rapor yöntemi (iki kez sayar) aynı tasarımda FS ${f(o.uplift.FSreport, 2)} gösterirdi.` : `Rapor yöntemi kullanıldı: birinci ayak hem beton hem zemin olarak sayılıyor; düzeltilmiş yöntemle FS ${f(o.uplift.FSfixed, 2)} olur.`,
      'Ayak kalınlığı ve donatı araç tarafından otomatik seçilmiştir; donatı ayrıntıları 1. ve 2. paftadadır.',
      o.group ? `Komşu ayakların zemin kamaları en kötü gövde için kontrol edildi: FS ${f(o.group.FS, 3)}.` : 'Ayak aralığı girilmediği için komşu ayakların kama çakışması kontrol edilmedi.',
      `Doluluğu %95 ve üzeri olan ${f(tight)} kontrolde ek rezerv yoktur; zemin değerleri sahada doğrulanmalıdır.`,

    ];

<script>
/* Tasarım gezgini çözücüleri: tek tasarım değerlendirme, parametre taraması, en az beton/donatı/kazı arama */
(function (root) {
  'use strict';
  const E = typeof require !== 'undefined' ? require('./engine.js') : root.Engine;
  const R = typeof require !== 'undefined' ? require('./rebar.js') : root.Rebar;

  const getp = (o, p) => p.split('.').reduce((a, k) => a[k], o);
  function withParams(inp, params) {
    const c = { loads: inp.loads, geo: Object.assign({}, inp.geo), soil: Object.assign({}, inp.soil), mat: inp.mat, opts: inp.opts, rebar: inp.rebar, stub: inp.stub };
    for (const k in params) { const [a, b] = k.split('.'); c[a][b] = params[k]; }
    return c;
  }

  /* Bir geometri için: ayak/baca donatısı otomatik seçilir, tüm kontroller yapılır. */
  function evalDesign(inp0) {
    const g = inp0.geo, o = inp0.opts, m = inp0.mat;
    let out = E.compute(inp0);
    const Bc = g.B * 100, B1c = g.B1 * 100, c = o.coverPad;
    const minA1 = 0.0009 * g.T1 * 100 * Bc, minA2 = 0.0009 * g.T2 * 100 * B1c;
    const pair = E.padPairSelect(E.flexSpec(out.padBot.Mu, Bc, g.T1 * 100, c, Bc, out.fcd, out.fyd, minA1, 25, 12), E.flexSpec(out.padTop.Mu, Bc, g.T1 * 100, c, Bc, out.fcd, out.fyd, minA1, 30, 12), o.meshPair);
    const m1 = pair && pair.bot, m2 = pair && pair.top;
    const m3 = E.padMeshSelect(out.pad2.Mu, B1c, (g.T1 + g.T2) * 100, c, B1c, out.fcd, out.fyd, minA2, 30, 12);
    if (!m1 || !m2 || !m3) return { ok: false, reason: 'Ayak kalınlığı eğilmeye yetmiyor (K > K′) veya donatı aralığı sığmıyor', out };
    const ch = E.chimneyAuto(inp0, out);
    if (!ch) return { ok: false, reason: 'Baca eğilmesi için uygun donatı bulunamadı', out };
    const rb = Object.assign({}, inp0.rebar, { padBotPhi: m1.phi, padBotN: m1.n, padTopPhi: m2.phi, padTopN: m2.n, pad2Phi: m3.phi, pad2N: m3.n,
      chimPhi: ch.phi, chimN: ch.n, stPhi: ch.stPhi, stS: Math.min(25, Math.floor(Math.min(g.A * 100, 2 * ch.phi) / 5) * 5) });
    const inp = Object.assign({}, inp0, { rebar: rb });
    out = E.compute(inp);
    const chk = E.checkList(inp, out);
    const rbd = R.buildRebar(inp, out);
    const gov = chk.reduce((a, b) => (b.v > a.v ? b : a), chk[0]);
    const chk2 = chk.filter((x) => x.key !== 'stubCage');          // baca genişliğine (A) bağlı cleat kontrolü hariç
    const gov2 = chk2.reduce((a, b) => (b.v > a.v ? b : a), chk2[0]);
    return { ok: chk.every((x) => x.ok), okNoCage: chk2.every((x) => x.ok), gov2, out, rb, chk, gov, concrete: rbd.conc.Vtot, excavation: rbd.conc.Vexc, steel: rbd.steelLeg, grobeton: rbd.conc.Vgrob, inp };
  }

  /* Tek parametreyi tara; diğerleri sabit. */
  function sweep(inp, key, lo, hi, n) {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const val = lo + ((hi - lo) * i) / n;
      const p = {}; p[key] = val;
      if (key === 'geo.B1' && val > inp.geo.B - 0.1) { pts.push({ val, skip: true }); continue; }
      if (key === 'geo.B' && inp.geo.B1 > val - 0.1) p['geo.B1'] = Math.max(0.5, val - 0.1);
      const d = evalDesign(withParams(inp, p));
      const u = {};
      if (d.chk) d.chk.forEach((x) => { u[x.key] = x.v; });
      else if (d.out) {
        const o = d.out; u.uplift = 1 / o.uplift.FS; u.bearAvg = o.bearing.Qo / inp.soil.qa; u.bearEdge = o.bearing.Qmax / o.bearing.qEdge; u.ovx = 1 / o.overturn.FSx; u.ovy = 1 / o.overturn.FSy; u.punch = o.punch.vedRep / o.punch.vRd; u.flex = 1.5;
      }
      u.flex = d.out ? Math.max(d.out.padBot.K, d.out.padTop.K, d.out.pad2.K) / 0.21 : 1.5;   // eğilme kesit kapasitesi (K/K′): donatıyla düzeltilemeyen sınır
      pts.push({ val, ok: !!d.ok, u, d });
    }
    return pts;
  }

  /* Serbest parametreler üzerinde ızgara araması. free: [{key, lo, hi, step}] */
  function optimize(inp, free, opt, onProgress) {
    opt = opt || {};
    const maxEval = opt.maxEval || 6000;
    // ızgara boyutu
    let steps = free.map((f) => f.step);
    const count = () => free.reduce((a, f, i) => a * (Math.floor((f.hi - f.lo) / steps[i] + 1e-9) + 1), 1);
    let guard = 0;
    while (count() > maxEval && guard++ < 20) steps = steps.map((s) => s * 1.25);
    const axes = free.map((f, i) => { const a = []; for (let v = f.lo; v <= f.hi + 1e-9; v += steps[i]) a.push(Math.round(v * 10000) / 10000); return a; });
    const combos = [];
    const rec = (i, cur) => { if (i === axes.length) { combos.push(Object.assign({}, cur)); return; } axes[i].forEach((v) => { cur[free[i].key] = v; rec(i + 1, cur); }); };
    rec(0, {});
    const price = Object.assign({ beton: 100, demir: 1.0, kazi: 6, grobeton: 80 }, opt.price || {});
    const feas = [];
    let idx = 0;
    return new Promise((resolve) => {
      const tick = () => {
        const end = Math.min(idx + 150, combos.length);
        for (; idx < end; idx++) {
          const p = combos[idx];
          if (p['geo.B1'] != null && (p['geo.B1'] > (p['geo.B'] != null ? p['geo.B'] : inp.geo.B) - 0.2)) continue;
          if (p['geo.B'] != null && p['geo.B1'] == null && inp.geo.B1 > p['geo.B'] - 0.2) continue;
          const d = evalDesign(withParams(inp, p));
          if (d.ok) feas.push({ p, concrete: d.concrete, excavation: d.excavation, steel: d.steel, grobeton: d.grobeton, gov: d.gov, rb: d.rb,
            cost: d.concrete * price.beton + d.steel * price.demir + d.excavation * price.kazi + d.grobeton * price.grobeton, geo: d.inp.geo });
        }
        if (onProgress) onProgress(idx / combos.length);
        if (idx < combos.length) setTimeout(tick, 0); else {
          const by = (k) => feas.slice().sort((a, b) => a[k] - b[k]);
          resolve({ total: combos.length, feasible: feas.length, steps, minConcrete: by('concrete')[0], minSteel: by('steel')[0], minExc: by('excavation')[0], minCost: by('cost')[0], list: by(opt.objective || 'concrete').slice(0, 12), price });
        }
      };
      tick();
    });
  }

  /* Gereken-boyut: X sabitken tüm kriterleri sağlayan en küçük Y.
     Y yukarı doğru taranır (adım yStep), ilk uygun değer bulununca yTol'a kadar iki aralıkta daraltılır. */
  function minY(inp, xKey, x, yKey, yLo, yHi, yStep, yTol) {
    const design = (y) => {
      const p = {}; p[xKey] = x; p[yKey] = y;
      const B = p['geo.B'] != null ? p['geo.B'] : inp.geo.B, B1 = p['geo.B1'] != null ? p['geo.B1'] : inp.geo.B1;
      if (B1 > B - 0.1) { if (p['geo.B1'] != null) return null; p['geo.B1'] = Math.max(0.5, B - 0.1); }
      return evalDesign(withParams(inp, p));
    };
    const noCage = xKey !== 'geo.A' && yKey !== 'geo.A';          // B, T… eğrileri cleat–kafes kontrolünden bağımsız (A'ya bağlı)
    const good = (d) => (noCage ? d.okNoCage : d.ok);
    let prev = null, hit = null, last = null;
    for (let y = yLo; y <= yHi + 1e-9; y += yStep) {
      const d = design(y); if (!d) continue; last = d;
      if (good(d)) { hit = { y, d }; break; }
      prev = y;
    }
    if (!hit) return { x, y: null, reason: last ? failNames(last) : '' };
    let lo = prev != null ? prev : hit.y, hi = hit.y, best = hit.d;
    while (prev != null && hi - lo > yTol) { const m = (lo + hi) / 2, d = design(m); if (d && good(d)) { hi = m; best = d; } else lo = m; }
    return { x, y: hi, atLo: prev == null, d: best, concrete: best.concrete, excavation: best.excavation, steel: best.steel, gov: noCage ? best.gov2 : best.gov, geo: best.inp.geo, rb: best.rb };
  }

  function fieldHtml(fd) {
    if (fd.show && !fd.show(S)) return '';
    if (fd.bodies) {
      const bd = S.loads.bodies || [], ip = (i, k, v, st) => `<input type="number" data-bd="${i}.${k}" step="${st}" value="${v == null || v === 0 ? '' : v}" style="width:100%">`;
      return `<div class="hint" style="grid-column:1/3"><b>Diğer gövde boyları (body extension):</b> her biri için ayak aralığı ve çekme yükü. Temel tüm gövdelerde aynı olduğundan kontrol her gövde için ayrı yapılır; alçak gövdede ayak aralığı dardır ama yükler de çok daha azdır. Yukarıdaki yük ve aralık en yüksek gövdeye aittir.</div>` +
        `<div style="grid-column:1/3"><table><tr><th>Gövde</th><th>Aralık X (m)</th><th>Aralık Y (m)</th><th>Çekme yükü Z (${tw(S) ? 'kN' : 'daN'})</th><th></th></tr>` +
        bd.map((b, i) => `<tr><td><input type="text" data-bd="${i}.name" value="${escH(b.name || '')}" style="width:100%" translate="no"></td><td>${ip(i, 'legX', b.legX, 0.1)}</td><td>${ip(i, 'legY', b.legY, 0.1)}</td><td>${ip(i, 'Z', b.Z, 'any')}</td><td><button class="btn" data-act="bodyDel" data-i="${i}">Sil</button></td></tr>`).join('') +
        `</table><button class="btn" data-act="bodyAdd">Gövde ekle</button></div>`;
    }
    if (fd.note) return `<div class="hint">${fd.note}</div>`;
    if (fd.suggest) return `<div class="hint"><b>Öneri (rapor kabulleri):</b> seçili sınıfın değerlerini geri yükler. Zemin etüdüyle değiştirin.<br>` +
      Object.keys(soilAll()).map((c) => `<button class="btn" data-act="soil" data-v="${escH(c)}"><span translate="no">${escH(c)}</span></button>`).join(' ') + ` <button class="btn p" data-act="soilFill">Bu değerleri kütüphaneye kaydet</button><br><span id="soilNote"></span></div>`;
    if (fd.cover) return `<div class="hint"><b>Pas payı önerisi:</b> grobeton varsa 5 cm, doğrudan zemine dökümde 7,5 cm (EC2 4.4.1.3: zemine bitişik betonda artırılmış pas payı). Baca/etriye için 5–7,5 cm.<br>` +
      `<button class="btn" data-act="cover" data-v="5">Grobetonlu: 5 cm</button> <button class="btn" data-act="cover" data-v="7.5">Zemine döküm: 7,5 cm</button></div>`;
    const v = get(S, fd.k);
    const ta = tipAttr(fd.k);
    if (fd.t === 'txt') return `<div class="f ${fd.w2 ? 'w2' : ''}"${ta}><label>${fd.label}</label><input type="text" data-k="${fd.k}" value="${v == null ? '' : String(v).replace(/"/g, '&quot;')}"></div>`;
    if (fd.t === 'chk') return `<label class="f chk"${ta}><input type="checkbox" data-k="${fd.k}" ${v ? 'checked' : ''}> ${fd.label}</label>`;
    if (fd.t === 'sel') return `<div class="f ${fd.w2 ? 'w2' : ''}"${ta}><label>${fd.label}</label><select data-k="${fd.k}">${fd.opts.map((o) => `<option value="${o[0]}" ${String(o[0]) === String(v) ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></div>`;
    return `<div class="f"${ta}><label><span>${fd.label}</span><span class="u">${fd.unit || ''}</span></label><input type="number" data-k="${fd.k}" step="${fd.step || 'any'}" value="${v}"></div>` +
      (fd.hint ? `<div class="hint" style="grid-column:1/3">${fd.hint}</div>` : '');
  }
  function tabGirdi() {
    return `<p class="note" style="margin:0 0 10px">Tüm girdiler bu sekmede. Değer değiştirdiğinizde hesap anında yenilenir; sonucu <b>Tasarım</b> sekmesinde görürsünüz. Direk tipi ve zemin sınıfı üstteki seçim kutularından yüklenir.</p>` + saveBar() +
      `<div class="igrid">` + SCHEMA.map((sec, si) => {
        const op = OPEN[si] != null ? OPEN[si] : sec.open;
        return `<details class="isec" ${op ? 'open' : ''} data-s="${si}"><summary>${sec.title}</summary><div class="fields">${sec.fields.map(fieldHtml).join('')}</div></details>`;
      }).join('') + `</div>`;
  }
  function renderSide() { if (TAB === 'girdi') renderTab(); }

  /* ---------------- hesap ---------------- */
  function recalc() {
    OUT = E.compute(S);
    RBD = R.buildRebar(S, OUT);
    persist();
    renderChips();
    if (TAB === 'girdi' && SHOWN === 'girdi') return;  // girdi kutuları yerinde kalsın
    if (TAB === 'tasarim' && SHOWN === 'tasarim') gzUpdate(); else renderTab();
  }
  function renderChips() {
    const c = checks(OUT);
    const bad = c.filter((x) => !x.ok).length;
    const gov = c.reduce((a, b) => (b.v > a.v ? b : a), c[0]);
    $('#chips').innerHTML = `<span class="chip ${bad ? 'bad' : 'ok'}">${bad ? bad + ' kontrol sağlanmıyor' : 'tüm kontroller sağlanıyor'}</span>` +
      `<span class="chip">belirleyici: <span>${gov.n}</span> (%${f(gov.v * 100)})</span>` +
      `<span class="chip">beton ${f(RBD.conc.Vtot * 4, 1)} m³ · demir ${f(RBD.steelLeg * 4)} kg · kazı ${f(RBD.conc.Vexc * 4, 1)} m³ /direk</span>`;
    renderDesignUi();
  }

  function checks(o) { return E.checkList(S, o); }

  /* ---------------- sekme yardımcıları ---------------- */
  const badge = (ok, txt) => `<div class="res ${ok ? 'ok' : 'bad'}">${ok ? '✔' : '✘'} ${txt}</div>`;
  const rows = (arr) => `<table>${arr.map((r) => r.head ? `<tr><th colspan="3">${r.head}</th></tr>` :
    `<tr class="${r.cls || ''}"><td>${r[0]}</td><td class="f2">${r[1] || ''}</td><td class="r">${r[2] == null ? '' : r[2]}</td></tr>`).join('')}</table>`;
  const card = (no, title, aim, fig, body, res, wide) => `<section class="card"><h3><span class="no">${no}</span>${title}</h3>` +
    `<p class="aim"><b>Amaç:</b> ${aim}</p><div class="two ${wide ? 'wide' : ''}"><div>${fig || ''}</div><div>${body}${res || ''}</div></div></section>`;

  /* ---------------- ÖZET ---------------- */
  function tabOzet() {
    const c = checks(OUT);
    const gov = c.reduce((a, b) => (b.v > a.v ? b : a), c[0]);
    const up = OUT.uplift, w = OUT.w;
    const P = towerAll()[S.tower], rep = P && P.report && P.report[S.cls];
    let h = '';
    if (!S.opts.pad1Subtract) h += `<div class="warnbox"><b>Rapor yöntemi seçili.</b> Kama hacminde 1. ayak (T1·B² = ${f(w.subPad1, 2)} m³) zemin sayılmıyor ama beton olarak da sayılıyor. Düzeltilmiş uplift emniyeti: <b>${f(up.FSfixed, 3)}</b> (rapor yöntemi ${f(up.FSreport, 3)}). Girdiler sekmesinde “Hesap kabulleri”nden değiştirin.</div>`;
    h += `<section class="card"><h3>Kontrol özeti</h3><table><tr><th>Kontrol</th><th>Sonuç</th><th>Doluluk</th><th></th></tr>` +
      c.map((x) => `<tr class="${x === gov ? 'gov' : ''}"><td>${x.n}${x === gov ? ' <b style="color:#C25E00">(belirleyici)</b>' : ''}</td><td>${x.txt}</td>` +
        `<td style="width:170px"><div class="bar"><i class="${x.v > 1 ? 'over' : x.v > 0.9 ? 'hi' : ''}" style="width:${Math.min(100, x.v * 100)}%"></i></div></td><td class="r">%${f(x.v * 100)} ${x.ok ? '✔' : '✘'}</td></tr>`).join('') + `</table>` +
      `<p class="note">Doluluk = yük/kapasite. Belirleyici kriter en yüksek dolulukla çalışan kontrol; temeli o büyütür veya küçültür. Zımbalama için rapordaki (ihtiyatlı) alan kullanılıyor; tam geometrik alanla ${f(OUT.punch.vedFull, 2)} daN/cm².</p></section>`;
    h += `<div class="grid2"><section class="card"><h3>Miktarlar (direk başına, 4 ayak)</h3>${rows([
      ['Beton (yapısal)', '4 × ' + f(RBD.conc.Vtot, 2) + ' m³', f(RBD.conc.Vtot * 4, 1) + ' m³'],
      ['Grobeton', '', f(RBD.conc.Vgrob * 4, 1) + ' m³'],
      ['Kazı', `${f(RBD.conc.Bexc, 2)}×${f(RBD.conc.Bexc, 2)}×${f(RBD.conc.Dexc, 2)} m`, f(RBD.conc.Vexc * 4, 1) + ' m³'],
      ['Donatı', `${f(RBD.steelLeg, 0)} kg/ayak`, f(RBD.steelLeg * 4, 0) + ' kg'],
      ['Donatı oranı', '', f(RBD.steelLeg / RBD.conc.Vtot, 0) + ' kg/m³'],
    ])}</section>`;
    h += `<section class="card"><h3>Uplift emniyeti: üç yöntem</h3>${rows([
      ['Seçili yöntem', S.opts.pad1Subtract ? 'pad-1 düşülür' : 'rapor yöntemi', `<b>${f(up.FS, 3)}</b>`],
      ['Rapor yöntemi', 'pad-1 hem beton hem zemin', f(up.FSreport, 3)],
      ['Düzeltilmiş', 'pad-1 hacmi zeminden düşülür', f(up.FSfixed, 3)],
    ])}<p class="note">Fark = T1·B²·γzemin = ${f(w.subPad1 * w.gsEff)} daN. Bu fark devrilme kontrolünü de etkiler (direnç Gpt/2).</p></section></div>`;
    if (rep) {
      const cmp = (n, a, b, d = 0) => `<tr><td>${n}</td><td class="r">${f(b, d)}</td><td class="r">${f(a, d)}</td><td class="r">${b ? f((a / b - 1) * 100, 1) + ' %' : ''}</td></tr>`;
      h += `<section class="card"><h3>Raporla karşılaştırma (${P.name}, ${S.cls})</h3><table><tr><th>Büyüklük</th><th class="r">Rapor</th><th class="r">Bu araç</th><th class="r">Fark</th></tr>` +
        (rep.Gb ? cmp('Beton ağırlığı Gb (daN)', w.Gb, rep.Gb) : '') + (rep.Gpt ? cmp('Kama ağırlığı Gpt (daN) – rapor yöntemi', w.GptReport, rep.Gpt) : '') +
        (rep.Gat ? cmp('Ayak üstü zemin Gat (daN)', w.Gat, rep.Gat) : '') + (rep.FSup ? cmp('Uplift FS – rapor yöntemi', up.FSreport, rep.FSup, 3) : '') +
        (rep.Qo ? cmp('Ortalama basınç Qo', OUT.bearing.Qo, rep.Qo, 2) : '') + (rep.Qmax ? cmp('Köşe basıncı Qmax', OUT.bearing.Qmax, rep.Qmax, 2) : '') +
        (rep.FSox ? cmp('Devrilme FS (x) – rapor yöntemi', OUT.overturn.FSxReport, rep.FSox, 2) : '') + (rep.FSoy ? cmp('Devrilme FS (y) – rapor yöntemi', OUT.overturn.FSyReport, rep.FSoy, 2) : '') +
        (rep.concrete ? cmp('Beton (m³/ayak)', RBD.conc.Vtot, rep.concrete, 2) : '') + (rep.exc ? cmp('Kazı (m³/ayak, B²·T)', RBD.conc.VexcReport, rep.exc, 1) : '') +
        (rep.steel ? cmp('Donatı, sehpa hariç (kg/ayak)', RBD.steelLeg - (RBD.steelChair || 0), rep.steel) : '') + `</table><p class="note">Küçük farklar: rapordaki bazı ara değerler yuvarlanmış; donatı toplamı bu araçta kanca/büküm paylarıyla yeniden hesaplanır (raporda döküm yok). Rapor sınıflarında C2 undercut’lu olduğundan karşılaştırma yapılmaz.</p></section>`;
    }
    return h;
  }

  /* ---------------- HESAP ADIMLARI ---------------- */
  function tabAdim() {
    const o = OUT, w = o.w, ld = o.ld, g = S.geo, so = S.soil, up = o.uplift, b = o.bearing, ov = o.overturn;
    const P = towerAll()[S.tower], rep = P && P.report && P.report[S.cls];
    let h = `<p class="note">Her kart: <b>amaç</b> → şema → sayılarla hesap → sonuç. Sayılar sol paneldeki girdilerden canlı hesaplanır.</p>`;

    /* 1 Yükler */
    const t = ld.t;
    const loadRows = S.loads.mode === 'tower' ? [
      { head: 'Direk programının verdiği (kartezyen, kN)' },
      ['Çekme: Z, X, Y', '', `${f(S.loads.Zu, 2)} · ${f(S.loads.Xu, 2)} · ${f(S.loads.Yu, 2)}`],
      ['Basınç: Z, X, Y', '', `${f(S.loads.Zc, 2)} · ${f(S.loads.Xc, 2)} · ${f(S.loads.Yc, 2)}`],
      { head: 'Eğik eksene çevirme' },
      ['Eğim çarpanı k = √(1+2·tan²α)', `tanα = ${f(t, 5)}`, f(ld.k, 5)],
      ['P çekme = Z × ' + (S.opts.useVertical ? '1 (dikey seçili)' : 'k'), `${f(S.loads.Zu * 100)} daN`, f(ld.Pu) + ' daN'],
      ['P basınç = Z × k', `${f(S.loads.Zc * 100)} daN`, f(ld.Pc) + ' daN'],
      ['Artık kesme (zemin, basınç satırı): V = X − Z·tanα', `${f(S.loads.Xc, 2)} − ${f(S.loads.Zc * t, 2)} kN`, `Vx ${f(ld.Vs.x)} · Vy ${f(ld.Vs.y)} daN`],
      ['Artık kesme (baca, çekme satırı)', `${f(S.loads.Xu, 2)} − ${f(S.loads.Zu * t, 2)} kN`, `Vx ${f(ld.Vch.x)} · Vy ${f(ld.Vch.y)} daN`],
    ] : [
      ['Eksen yükü çekme / basınç', 'girdi', `${f(ld.Pu)} / ${f(ld.Pc)} daN`],
      ['Kesme (zemin) / (baca)', 'girdi', `${f(ld.Vs.x)}, ${f(ld.Vs.y)} / ${f(ld.Vch.x)}, ${f(ld.Vch.y)} daN`],
    ];
    h += card(1, 'Yükler: kartezyenden eğik eksene', 'Direk programı her bacak için yatay (X, Y) ve dikey (Z) kuvvetleri verir. Stub ve temel ise bacağın <b>eğik ekseni</b> boyunca çalışır; yük bu eksene çevrilir ve şartname gereği %10 büyütülür. Kesme kuvvetleri büyütülmez.',
      D.schemeLoads(), rows(loadRows.concat([{ head: 'Temel yükleri' }, ['Lu = ' + f(S.opts.erFactor, 2) + ' × P çekme', '', `<b>${f(ld.Lu)} daN</b>`], ['Lc = ' + f(S.opts.erFactor, 2) + ' × P basınç', '', `<b>${f(ld.Lc)} daN</b>`]])), '');

    /* 2 zemin ve malzeme */
    h += card(2, 'Zemin ve birim ağırlıklar (kuru / su altı)', 'Uplift’e karşı koyan ağırlıktır. Zemin su altındaysa her cisim, yer değiştirdiği suyun ağırlığı (1000 daN/m³) kadar hafifler (Arşimet): zemin γsat → γsat − 1000, beton 2400 → 1400 daN/m³. Bu yüzden suya doygun sınıflarda direnç düşer ve temel büyür.',
      D.submerged(S, o), rows([
        ['Taşıma gücü qa / kenarda', '', `${f(so.qa, 2)} / ${f(b.qEdge, 2)} daN/cm²`],
        ['Zemin birim ağırlığı (etkin)', so.sub ? `${f(so.gsat)} − ${f(E.GW)}` : 'kuru', `<b>${f(w.gsEff)} daN/m³</b>`],
        ['Beton yoğunluğu (etkin)', so.sub ? `${f(S.mat.gcDens)} − ${f(E.GW)}` : '', `<b>${f(w.gcEff)} daN/m³</b>`],
        ['Kama açısı β', `tanβ = ${f(w.tb, 4)}`, f(so.beta) + '°'],
        ['fcd = fck/γc', `${f(S.mat.fck)}/${f(S.mat.gc, 2)}`, f(o.fcd) + ' daN/cm²'],
        ['fyd = fy/γs', `${f(S.mat.fy)}/${f(S.mat.gs, 2)}`, f(o.fyd) + ' daN/cm²'],
      ]), so.sub ? '<div class="res warn">Su altı seçili: ağırlıklar kaldırma kuvveti kadar azaltıldı.</div>' : '', true);

    /* 3 beton */
    h += card(3, 'Betonun hacmi ve ağırlığı', 'Temelin kendi ağırlığı uplift’e karşı direncin küçük ama kesin parçasıdır. Üç parça ayrı hesaplanır: taban ayağı, 2. ayak, baca.',
      D.schemeUplift(o), rows([
        ['Taban ayağı: T1·B²', `${f(g.T1, 2)} × ${f(g.B, 2)}²`, f(w.Vpad1, 2) + ' m³'],
        ['2. ayak: T2·B1²', `${f(g.T2, 2)} × ${f(g.B1, 2)}²`, f(w.Vpad2, 2) + ' m³'],
        ['Baca: A²·(T+To−T1−T2)', `${f(g.A, 2)}² × ${f(g.T + g.To - g.T1 - g.T2, 2)}`, f(w.Vchim, 2) + ' m³'],
        { cls: 'tot', 0: 'Toplam beton Vb', 1: '', 2: f(w.Vb, 2) + ' m³' },
        ['Gb = Vb × γc', `${f(w.Vb, 2)} × ${f(w.gcEff)}`, `<b>${f(w.Gb)} daN</b>`],
      ].map((r) => (r.cls ? [r[0], r[1], r[2], r.cls] && { cls: 'tot', 0: r[0], 1: r[1], 2: r[2] } : r))), '');

    /* 4 kama */
    const kr = [
      ['① Prizma: B²·T', `${f(g.B, 2)}² × ${f(g.T, 2)}`, f(w.prism, 2)],
      ['② 4 yan kama: 2·B·T²·tanβ', `2 × ${f(g.B, 2)} × ${f(g.T, 2)}² × ${f(w.tb, 4)}`, f(w.wedges, 2)],
      ['③ 4 köşe çeyrek koni: (π/3)·T³·tan²β', `π/3 × ${f(g.T, 2)}³ × ${f(w.tb, 4)}²`, f(w.corners, 2)],
      { cls: 'tot', 0: 'Kama toplam (①+②+③)', 1: 'R = T·tanβ = ' + f(w.R, 2) + ' m', 2: f(w.cone, 2) },
      ['− Baca: A²·(T−T1−T2)', '', '− ' + f(w.subChim, 2)],
      ['− 2. ayak: T2·B1²', '', '− ' + f(w.subPad2, 2)],
      { cls: 'tot', 0: 'Vpt – rapor yöntemi', 1: '1. ayak düşülmemiş', 2: f(w.VptReport, 2) },
      [S.opts.pad1Subtract ? '− 1. ayak: T1·B² (düzeltme)' : '1. ayak: düşülmedi (rapor)', 'zemin olmayan yer', S.opts.pad1Subtract ? '− ' + f(w.subPad1, 2) : '–'],
      { cls: 'tot', 0: 'Vpt – kullanılan', 1: '', 2: f(w.Vpt, 2) + ' m³' },
      ['Gpt = Vpt × γzemin', `${f(w.Vpt, 2)} × ${f(w.gsEff)}`, `<b>${f(w.Gpt)} daN</b>`],
      { head: 'Ayak üstündeki zemin (bearing için)' },
      ['Vat = B²(T−T1) − A²(T−T1−T2) − T2·B1²', '', f(w.Vat, 2) + ' m³'],
      ['Gat = Vat × γzemin', '', `<b>${f(w.Gat)} daN</b>`],
    ].map((r) => (r.cls ? { cls: 'tot', 0: r[0] || r['0'], 1: r['1'], 2: r['2'] } : r));
    h += card(4, 'Zemin kaması: parça parça', 'Çekme yükü temeli yukarı çekerken, temelin üstündeki kesik koni biçimli zemin kütlesi de kalkar; ağırlığı dirence katılır. Yan yüzler düz (prizmatik kama), köşeler konik (çeyrek koni). Kamanın içinde beton da olduğu için, betonun kapladığı hacim zemin ağırlığından düşülmelidir.',
      D.iso(S, o), rows(kr), S.opts.pad1Subtract ? '<div class="res ok">Düzeltilmiş yöntem: 3 beton parçanın hepsi kamadan düşüldü.</div>' :
        `<div class="res warn">Rapor yöntemi: 1. ayak (${f(w.subPad1, 2)} m³ ≈ ${f(w.subPad1 * w.gsEff)} daN) kamadan düşülmediği için hem beton hem zemin olarak sayılıyor.</div>`, true);

    /* 5 uplift */
    h += card(5, 'Uplift (sökülme) kontrolü', 'Temel yukarı çekilince yerinden kalkar mı? Direnç: betonun ağırlığı + zemin kamasının ağırlığı. Yük zaten çarpanlı olduğu için emniyet katsayısı ≥ 1,0 aranır (raporda direnç tarafında ek çarpan yok).',
      D.schemeUplift(o), rows([
        ['Direnç R = φ·(Gb + Gpt)', `${f(S.opts.phi, 2)} × (${f(w.Gb)} + ${f(w.Gpt)})`, f(up.R) + ' daN'],
        ['Çekme yükü Lu', '', f(up.Lu) + ' daN'],
        { cls: 'tot', 0: 'FS = R / Lu', 1: '', 2: f(up.FS, 3) },
        ['  rapor yöntemi (pad-1 sayılır)', '', f(up.FSreport, 3)],
        ['  düzeltilmiş (pad-1 düşülür)', '', f(up.FSfixed, 3)],
      ].map((r) => (r.cls ? { cls: 'tot', 0: r[0], 1: r[1], 2: r[2] } : r))), badge(up.FS >= 1, `Uplift ${up.FS >= 1 ? 'sağlanıyor' : 'sağlanmıyor'}: FS = ${f(up.FS, 3)}`));

    /* 5b kama çakışması */
    if (o.group) {
      const gp = o.group;
      h += card('5b', 'Kama çakışması (komşu ayaklar)', 'Komşu ayakların zemin kamaları üst üste biniyorsa aynı zemin iki ayağa birden sayılamaz. Rüzgârın vurduğu yüzde iki ayak birlikte çekilir; ortak hacim ikiye bölünür ve her ayağın kama ağırlığından düşülür.',
        D.schemeGroup(o, S), rows([
          ['Çakışma eşiği: ayak aralığı < B + 2·T·tanβ', '', f(gp.Lcrit, 2) + ' m'],
          { head: 'Gövde boyu bazında: aralık X × Y, yük oranı, çakışan hacim, FS (grup) = φ·(Gb + Gpt − ΔG) / Lu' },
        ].concat(gp.rows.map((r) => ({ cls: r === gp.worst ? 'tot' : '', 0: r.main ? 'Ana gövde (en yüksek)' : '<span translate="no">' + escH(r.name || '–') + '</span>', 1: `${f(r.lx, 2)} × ${f(r.ly, 2)} m · yük ×${f(r.ratio, 2)} · çakışan ${f(r.Vmax, 1)} m³`, 2: f(r.FS, 3) })), [
          ['En kritik gövdede her ayaktan düşülen ağırlık ΔG = ½·Vçak·γ', '', f(gp.dG) + ' daN'],
        ]).map((r) => (r.cls ? { cls: 'tot', 0: r[0], 1: r[1], 2: r[2] } : r))), (gp.collide ? '<div class="warnbox">Ayak aralığı pedlerin genişliğine çok yakın: pedler birbirine çarpıyor.</div>' : '') + badge(gp.FS >= 1, `Çakışma sonrası uplift ${gp.FS >= 1 ? 'sağlanıyor' : 'sağlanmıyor'}: FS = ${f(gp.FS, 3)}`));
    } else h += `<div class="note">Kama çakışma kontrolü için Girdiler sekmesinde ayak aralığını (X, Y) girin. Çakışma, aralık ${f(w.Lcrit == null ? S.geo.B + 2 * S.geo.T * w.tb : w.Lcrit, 2)} m değerinden küçükse başlar.</div>`;

    /* 6 bearing */
    h += card(6, 'Bearing: zemin basıncı', 'Temelin altındaki zemin, basınç yükünü ve yatay kuvvetin yarattığı eğilmeyi taşıyabilir mi? Ortalama basınç qa’yı, köşe basıncı 1,25·qa’yı aşmamalı ve köşelerde çekme (negatif basınç) olmamalıdır.',
      D.schemeBearing(o), rows([
        ['Momentler: M = V·(T+To+0,1)', `Vx=${f(ld.Vs.x)}, Vy=${f(ld.Vs.y)}`, `${f(b.Mx)} / ${f(b.My)} daN·cm`],
        ['ΣG = Lc + Gat + Gb', `${f(ld.Lc)} + ${f(w.Gat)} + ${f(w.Gb)}`, f(b.SG) + ' daN'],
        ['Dışmerkezlik e = M/ΣG', `B/6 = ${f(b.Bsix, 1)} cm`, `${f(b.ex, 1)} / ${f(b.ey, 1)} cm`],
        ['Ortalama basınç Qo = ΣG/B²', '', `<b>${f(b.Qo, 2)}</b> ≤ ${f(so.qa, 2)} daN/cm²`],
        ['Moment payı (Mx±My)·6/B³', '', `${f(b.dp, 3)} / ${f(b.dm, 3)}`],
        ['Q1, Q2, Q3, Q4', '', `${f(b.Q1, 2)} · ${f(b.Q2, 2)} · ${f(b.Q3, 2)} · ${f(b.Q4, 2)}`],
        ['En büyük / en küçük', '', `${f(b.Qmax, 2)} ≤ ${f(b.qEdge, 2)} · ${f(b.Qmin, 2)} ≥ 0`],
      ]), badge(b.Qo <= so.qa && b.Qmax <= b.qEdge && b.Qmin >= 0, `Bearing ${b.Qo <= so.qa && b.Qmax <= b.qEdge && b.Qmin >= 0 ? 'sağlanıyor' : 'sağlanmıyor'}`));

    /* 7 devrilme */
    h += card(7, 'Devrilme', 'Çekme ve yatay kuvvet temeli ayağın bir köşesi (A) etrafında devirmeye çalışır. Direnç, zemin kamasının yarısı (Gpt/2); deviren kuvvet Lu·y + V·(T+To) − Gb·B/3 momentinin kolu ⅔(B+T1)’e bölünmesiyle bulunur (eski ABD ocak sayfası 103-D-64).',
      D.schemeOverturn(o), rows([
        ['y = B/3·cosα', `${f(g.B, 2)}/3 × ${f(1 / Math.sqrt(1 + t * t), 4)}`, f(ov.y, 3) + ' m'],
        ['Direnç Lr = φ·Gpt/2', `${f(S.opts.phi, 2)} × ${f(w.Gpt)}/2`, f(ov.Lr) + ' daN'],
        ['Lox = [Lu·y + Vx(T+To) − Gb·B/3] / ⅔(B+T1)', `[${f(ld.Lu)}·${f(ov.y, 2)} + ${f(ld.Vs.x)}·${f(g.T + g.To, 2)} − ${f(w.Gb)}·${f(g.B / 3, 2)}]/${f(ov.den, 3)}`, f(ov.Lox) + ' daN'],
        ['Loy (Vy ile)', '', f(ov.Loy) + ' daN'],
        { cls: 'tot', 0: 'FS x · FS y', 1: 'rapor yöntemi: ' + f(ov.FSxReport, 3) + ' · ' + f(ov.FSyReport, 3), 2: `${f(ov.FSx, 3)} · ${f(ov.FSy, 3)}` },
      ].map((r) => (r.cls ? { cls: 'tot', 0: r[0], 1: r[1], 2: r[2] } : r))), badge(ov.FSx >= 1 && ov.FSy >= 1, `Devrilme ${ov.FSx >= 1 && ov.FSy >= 1 ? 'sağlanıyor' : 'sağlanmıyor'}`));

    /* 8 ayak donatısı */
    const fl = (x) => `K = ${f(x.K, 3)} (≤ ${f(x.Kp, 2)}) · z = ${f(x.z, 1)} cm`;
    h += card(8, 'Ayak donatısı (eğilme – Eurocode 2)', 'Ayak, zeminin aşağıdan itmesiyle (basınç durumu) ve çekmede bacağın yukarıdan çekmesiyle konsol gibi eğilir. Eğilme momentinden gereken donatı K = Mu/(b·d²·fcd), z = d/2·[1+√(1−3,53K)] ≤ 0,95d, As = Mu/(fyd·z) ile bulunur; seçilen donatı bunu karşılamalıdır.',
      D.schemeFlex(), rows([
        { head: 'Ayak alt (basınç durumu)' },
        ['d = T1 − pas − 1,5Φ', `${f(g.T1 * 100)} − ${f(S.opts.coverPad, 1)} − 1,5×${f(S.rebar.padBotPhi / 10, 1)}`, f(o.padBot.d, 1) + ' cm'],
        ['Konsol L = ½(B−B1) · Mu', `L = ${f(o.padBot.L, 0)} cm`, f(o.padBot.Mu) + ' daN·cm'],
        ['Gereken As · seçilen', fl(o.padBot), `${f(o.padBot.As, 1)} · ${f(o.padBot.Aprov, 1)} cm² (${S.rebar.padBotN}Φ${S.rebar.padBotPhi})`],
        { head: 'Ayak üst (çekme durumu)' },
        ['d · L · Mu', `d = ${f(o.padTop.d, 1)}, L = ${f(o.padTop.L, 0)} cm`, f(o.padTop.Mu) + ' daN·cm'],
        ['Gereken As · seçilen', fl(o.padTop), `${f(o.padTop.As, 1)} · ${f(o.padTop.Aprov, 1)} cm² (${S.rebar.padTopN}Φ${S.rebar.padTopPhi})`],
        { head: '2. ayak üst (çekme durumu)' },
        ['d · L · Mu', `d = ${f(o.pad2.d, 1)}, L = ${f(o.pad2.L, 0)} cm`, f(o.pad2.Mu) + ' daN·cm'],
        ['Gereken As · seçilen', fl(o.pad2), `${f(o.pad2.As, 1)} · ${f(o.pad2.Aprov, 1)} cm² (${S.rebar.pad2N}Φ${S.rebar.pad2Phi})`],
        { head: 'En az donatı' },
        ['ACI 0,18%·Ag (ayak / 2. ayak)', `EC2 0,26·fctm/fyk·b·d: ${f(o.minSteel.ec1, 1)} / ${f(o.minSteel.ec2, 1)} cm²`, `${f(o.minSteel.aci1, 1)} / ${f(o.minSteel.aci2, 1)} cm²`],
      ]), badge(o.padBot.util <= 1 && o.padTop.util <= 1 && o.pad2.util <= 1 && o.minSteel.prov1 >= o.minSteel.aci1, 'Ayak donatısı: ' + (o.padBot.util <= 1 && o.padTop.util <= 1 && o.pad2.util <= 1 ? 'yeterli' : 'yetersiz – donatıyı artırın veya “Otomatik öner”')));

    /* 9 zımbalama */
    const pn = o.punch;
    h += card(9, 'Zımbalama', 'Baca, yükü ayağa verirken ayağı bir zımba gibi delmeye çalışır. Bacadan 2d uzaktaki kritik çevrede kayma gerilmesi, betonun en az kayma dayanımını aşmamalıdır (EC2 tipi).',
      D.schemePunch(), rows([
        ['d = T1+T2 − pas − 1,5Φ', '', f(pn.d, 1) + ' cm'],
        ['Kritik çevre u = 4A + 2π(2d)', '', f(pn.u, 0) + ' cm'],
        ['Net basınç Pr = Lc/B²', '', f(pn.Pr, 3) + ' daN/cm²'],
        ['Alan (rapordaki) Ap · Lp = Lc − Pr·Ap', `Ap = ${f(pn.ApRep, 0)} cm²`, f(pn.LpRep, 0) + ' daN'],
        ['Gerilme Ved = Lp/(u·d)', 'rapor yöntemi', `<b>${f(pn.vedRep, 2)}</b> daN/cm²`],
        ['  tam geometrik alanla', `Ap = ${f(pn.ApFull, 0)} cm²`, f(pn.vedFull, 2) + ' daN/cm²'],
        ['VRd = 0,035·k^1,5·√fck', `k = ${f(pn.k, 3)}`, `${f(pn.vRd, 2)} daN/cm²`],
      ]), badge(pn.vedRep <= pn.vRd, `Zımbalama ${pn.vedRep <= pn.vRd ? 'sağlanıyor' : 'sağlanmıyor'}: %${f(pn.vedRep / pn.vRd * 100)}`));

    /* 10 baca */
    const ch = o.chimney;
    h += card(10, 'Baca donatısı ve etriye', 'Baca, stub’ın yükü ayağa ilettiği sütundur. Eksenel yükü stub taşır; bacaya kalan iş yatay kesmelerin yarattığı eğilmedir. Seçilen boyuna donatının eğilme kapasitesi (kesit analizi, N = 0) uygulanan momente oranlanır; iki eksen için doğrusal etkileşim (EN 1992-1-1 5.8.9) ≤ 1 olmalıdır.',
      D.schemeChimney(), rows([
        ['Moment kolu (ayak üstü → baca üstü + ek)', `${f(S.opts.armChimAllow)} cm ek`, f(ch.arm, 0) + ' cm'],
        ['Mux = Vx·kol · Muy = Vy·kol', `Vx=${f(ld.Vch.x)}, Vy=${f(ld.Vch.y)}`, `${f(ch.Mux)} · ${f(ch.Muy)} daN·cm`],
        ['Donatı As', `${S.rebar.chimN}Φ${S.rebar.chimPhi}`, `${f(ch.As, 1)} cm² (%${f(ch.pct, 2)})`],
        ['Moment kapasitesi Mu (kesit analizi)', `tarafsız eksen x = ${f(ch.xNA, 1)} cm`, f(ch.Mu) + ' daN·cm'],
        { cls: 'tot', 0: 'Etkileşim Mux/Mu + Muy/Mu', 1: '', 2: f(ch.util, 2) },
        ['En az %1 donatı (ACI)', '', `${f(ch.AsMinACI, 1)} cm² ≤ ${f(ch.As, 1)}`],
        ['Etriye Φ' + S.rebar.stPhi + ' / ' + S.rebar.stS + ' cm', `en fazla min(A, 20Φ, 30) = ${f(Math.min(S.geo.A * 1000, 20 * S.rebar.chimPhi, 300) / 10, 0)} cm`, S.rebar.stS <= Math.min(S.geo.A * 100, 20 * S.rebar.chimPhi / 10, 30) ? '✔' : '✘'],
      ].map((r) => (r.cls ? { cls: 'tot', 0: r[0], 1: r[1], 2: r[2] } : r))), badge(ch.util <= 1 && ch.As >= ch.AsMinACI, `Baca: eğilme %${f(ch.util * 100)}${ch.As >= ch.AsMinACI ? '' : ' · en az donatı sağlanmıyor'}`) +
        '<p class="note">Rapor R′=0,12 abağını kullanıyor; burada gerçek çubuk konumlarıyla kesit analizi yapılıyor (daha ihtiyatlı).</p>');

    /* 11 stub ve cleat */
    const sc = E.stubCheck(S, o), st = S.stub;
    if (sc) {
      const pc = (x) => `${x <= 1 ? '✔' : '✘'} %${f(x * 100)}`;
      h += card(11, 'Stub ve cleat ankrajı', 'Stub, direk ayağından gelen eksenel yükü betona iletir. Yük üç yoldan taşınır: stub yüzeyi ile beton arasındaki aderans, cleat açılarının betona ezilmesi (bearing) ve cleat–stub cıvataları. Her birinin kapasitesi eksenel yükten büyük olmalıdır (rapor: ANSI/ASCE 10-97).',
        '', rows([
          ['f′c = fck/γc · fa = 1,19·f′c', '', `${f(sc.fa / 1.19, 0)} · ${f(sc.fa, 0)} daN/cm²`],
          ['Aderans gerilmesi fb = 0,28·√f′c(MPa)', '', f(sc.fb, 2) + ' daN/cm²'],
          ['Stub çeliği Sfb = fy/1,1 (S355)', '', f(sc.Sfb, 0) + ' daN/cm²'],
          ['Eksenel yük P = max(Pc, Pu)', `Pc = ${f(sc.CN)}, Pu = ${f(sc.TN)} (×1,1 yok)`, f(sc.P) + ' daN'],
          ['Profil alanı An', `L${st.F1}×${st.F1}×${st.t1}, r1 = ${st.r1}`, f(sc.An, 2) + ' cm²'],
          ['Gereken Amin = Pu/Sfb + V/(0,75·Sfb)', `V = ${f(sc.VN)} daN`, `${f(sc.Amin, 2)} cm² · ${pc(sc.r.area)}`],
          ['Aderans Bc = lb·L1·fb', `lb = ${f(st.lb)} mm, L1 = ${f(st.L1)} mm`, `${f(sc.Bc)} daN · ${pc(sc.r.bond)}`],
          ['Cleat etkin genişliği Le = t2 + r1 + 0,5·t2·√(Sfb/fa)', '', f(sc.Le, 1) + ' mm'],
          ['Ezilme alanı Aa = L2·Le·N', `${st.L2}·${f(sc.Le, 1)}·${st.nCleat}`, f(sc.Aa, 0) + ' cm²'],
          ['Ezilme kapasitesi Gc = Aa·fa', '', `${f(sc.Gc)} daN · ${pc(sc.r.bear)}`],
          [`Cıvata kapasitesi Sb = ${st.nBolt}·(π/4·d²)·3840`, `M${st.dBolt}, 8.8`, `${f(sc.Sb)} daN · ${pc(sc.r.bolt)}`],
          ['Stub alt ucu (ayak tabanından)', `eksen ${f(st.L1)} mm × cos = ${f(st.L1 * sc.cosT)} mm düşey`, `${f(sc.zBottom, 0)} cm`],
          ['Betona sığma', S.stub.toBottom !== false ? `ayak tabanından beton üstüne ${f(sc.Lavail)} mm` : `2. ayak üstünden beton üstüne ${f(sc.Lavail)} mm`, pc(sc.r.fit)],
          ['Cleat kafese sığma: F1/2 + F2 ≤ A/2 − pas − etriye − çubuk', `${f(sc.cleatExt, 1)} ≤ ${f(sc.cageHalf, 1)} cm (gereken A ≥ ${f(sc.Areq, 2)} m)`, pc(sc.r.cage)],
        ]), badge(Math.max(sc.r.bond, sc.r.bear, sc.r.bolt, sc.r.area, sc.r.fit, sc.r.cage) <= 1, 'Stub ankrajı ' + (Math.max(sc.r.bond, sc.r.bear, sc.r.bolt, sc.r.area, sc.r.fit, sc.r.cage) <= 1 ? 'sağlanıyor' : 'sağlanmıyor')) +
        (S.loads.mode === 'tower' && S.tower === 'B30' ? '<p class="note">B-30 raporu stub sayfasında eğim katsayısını (×1,02234) bir kez daha uyguluyor (basınç 152.989 → 156.408 daN). Burada uygulanmıyor; rapordaki üç kapasite aynen çıkıyor, oranlar %2,2 daha rahat.</p>' : '') +
        '<p class="note">Rapor Amin değeri (B-30: 38,37 cm²) bu formülün girdilerinden yeniden üretilemedi; burada Pu ve V ile hesaplanır. Cleat–stub detay çevresi lb girdi olarak alınır.</p>');
    }
    return h;
  }

  /* ---------------- 12 m KESİM PLANI VE SEHPA (1 direk = 4 ayak) ---------------- */
  function cutCard() {
    const c = RBD.cut; if (!c) return '';
    const sm = c.sum, uw = (p) => (p * p) / 162.2;
    let h = `<section class="card"><h3>${f(c.stock)} m boydan kesim planı ve sehpa (1 direk = ${c.legs} ayak)</h3><p class="aim"><b>Amaç:</b> Donatıyı ${f(c.stock)} m’lik ticari boylardan en az fireyle kesmek ve üst hasırları taşıyan sehpaları önce bu kesimden artan parçalardan üretmek.</p>` +
      `<table><tr><th>Çap</th><th class="r">Net boy (m)</th><th class="r">${f(c.stock)} m çubuk</th><th class="r">Satın alma (kg)</th><th class="r">Fire (m)</th><th class="r">Fire</th><th>En uzun artan parçalar (m)</th></tr>` +
      c.plan.map((g) => `<tr><td>Φ${g.phi}</td><td class="r">${f(g.net, 1)}</td><td class="r">${f(g.bars)}</td><td class="r">${f(g.buy * uw(g.phi), 0)}</td><td class="r">${f(g.waste, 1)}</td><td class="r">%${f(g.waste / g.buy * 100, 1)}</td><td>${g.bins.map((b) => b.free).filter((x) => x > 0.3).sort((a, b) => b - a).slice(0, 6).map((x) => f(x, 2)).join(' · ') || '–'}</td></tr>`).join('') + `</table>`;
    if (c.chairs.length) {
      h += `<h3 style="margin-top:12px">Sehpalar</h3><table><tr><th>Poz</th><th>Tanım</th><th>Şekil</th><th class="r">Φ</th><th class="r">Yükseklik (cm)</th><th class="r">Açınım (cm)</th><th class="r">Adet / ayak</th><th class="r">Adet / direk</th><th class="r">Firelerden</th><th class="r">Yeni çubuktan</th><th class="r">kg / direk</th></tr>` +
        c.chairs.map((x) => { const b = RBD.bars.find((y) => y.mark === x.mark); return `<tr><td><b>${b.pos}</b></td><td>${b.desc}<div class="note">${f(x.grid.nx)} × ${f(x.grid.ny)} ızgara, aralık ${f(x.grid.sx, 2)} m · ${f(b.count / (x.grid.sx * x.grid.sy * x.grid.n), 2)} adet/m²</div></td><td><div class="shape">${D.barShape(b, 180, 80)}</div></td><td class="r">${b.phi}</td><td class="r">${f(x.hC, 1)}</td><td class="r">${f(b.cut, 1)}</td><td class="r">${f(b.count)}</td><td class="r">${f(x.n)}</td><td class="r"><b>${f(x.fromOff)}</b></td><td class="r">${f(x.fromNew)}${x.newBars ? ` <span class="note">(${f(x.newBars)} × ${f(c.stock)} m)</span>` : ''}</td><td class="r">${f(x.kg, 1)}</td></tr>`; }).join('') + `</table>`;
    }
    h += `<div class="kpis" style="margin-top:10px"><div class="kpi"><b>${f(sm.netAll)} kg</b><span>net donatı / direk${c.chairs.length ? ' (sehpa dahil)' : ''}</span></div><div class="kpi"><b>${f(sm.buyAll)} kg</b><span>satın alınacak (${f(c.stock)} m boy)</span></div>` +
      `<div class="kpi ${sm.wastePct > 10 ? 'bad' : 'ok'}"><b>%${f(sm.wastePct, 1)}</b><span>fire (${f(sm.waste)} kg)</span></div>` + (c.chairs.some((x) => x.fromOff) ? `<div class="kpi ok"><b>%${f(sm.wastePctNoChair, 1)} → %${f(sm.wastePct, 1)}</b><span>sehpalar firelerden yapılınca</span></div>` : '') + `</div>` +
      `<p class="note">Parçalar her çap için en uzundan başlayarak çubuklara yerleştirilir (en sıkı yerleşim); sehpalar çapı yeterli (≥ sehpa çapı) ve boyu yeten artan parçalardan kesilir. Birden çok direk birlikte kesilirse fire daha da düşer.</p></section>`;
    return h;
  }

  /* ---------------- BÜKÜM LİSTESİ ---------------- */
  function tabBukum() {
    const bars = RBD.bars;
    const nb = (b) => b.shape.bends.map((a) => f(a, 1) + '°').join(' · ') || '–';
    const sum = Object.keys(RBD.byPhi).map((p) => ({ phi: +p, kg: RBD.byPhi[p], len: bars.filter((b) => b.phi === +p).reduce((a, b) => a + b.totalLen, 0) })).sort((a, b) => a.phi - b.phi);
    let h = `<section class="card"><h3>Kesim ve büküm özeti (1 ayak)</h3><table><tr><th>Çap</th><th class="r">Toplam boy (m)</th><th class="r">Ağırlık (kg)</th><th class="r">12 m çubuk (yaklaşık)</th></tr>` +
      sum.map((x) => `<tr><td>Φ${x.phi}</td><td class="r">${f(x.len, 1)}</td><td class="r">${f(x.kg, 1)}</td><td class="r">${f(Math.ceil(x.len / 12 * 1.05))}</td></tr>`).join('') +
      `<tr class="tot"><td>Toplam</td><td class="r">${f(sum.reduce((a, b) => a + b.len, 0), 1)}</td><td class="r">${f(RBD.steelLeg, 1)}</td><td></td></tr></table>` +
      `<p class="note">Kesim boyu = Σ dış ölçü − Σ büküm payı. Büküm iç çapı: Φ≤16 → ${S.opts.mandrelSmall}Φ, Φ>16 → ${S.opts.mandrelBig}Φ. Bir direkte 4 ayak olduğundan adetleri ×4 alın. <button class="btn" data-act="csv">CSV indir</button></p></section>`;
    h += cutCard();
    const exA = bars.find((b) => b.mark === 'A1'), exK = bars.find((b) => b.mark === 'K1'), exE = bars.find((b) => b.mark === 'E1');
    const exl = (b, name) => {
      const phi = b.phi, ph = phi / 10, k = R.mandrelFactor(phi, S.opts), rc = R.rcOf(phi, S.opts), d90 = R.bendDed(phi, S.opts, 90);
      const dets = b.shape.bends.map((a) => `${f(a, 1)}° → ${f(R.bendDed(phi, S.opts, a), 2)} cm`).join(' + ');
      return `<tr><td><b>${name}</b> (Φ${phi})</td><td>D = ${k}Φ = ${f(k * ph, 1)} cm · rc = D/2 + Φ/2 = ${f(rc, 2)} cm · 90° payı = 2(rc+Φ/2) − rc·π/2 = ${f(d90, 2)} cm</td>` +
        `<td>Σ ölçü = ${b.shape.legs.map((x) => f(x, 1)).join(' + ')} = ${f(b.sumLegs, 1)} cm; bükümler: ${dets} = ${f(b.ded, 1)} cm<br><b>Kesim = ${f(b.sumLegs, 1)} − ${f(b.ded, 1)} = ${f(b.cut, 1)} cm</b></td></tr>`;
    };
    h += `<section class="card"><h3>Büküm payı nasıl hesaplanır?</h3><p class="aim"><b>Amaç:</b> Çubuk bükülünce dış ölçüler toplamı gerçek çelik boyundan büyük olur (köşede çelik “kısalır”). Dış ölçü toplamından bükümün payı çıkarılarak doğru kesim boyu bulunur. Bükülme çapı büyüdükçe pay da büyür; bu yüzden Φ>16 çubuklarda 7Φ, Φ≤16 çubuklarda 4Φ iç çap kullanılır.</p>` +
      `<table><tr><th>Çubuk</th><th>Büküm geometrisi</th><th>Kesim boyu</th></tr>${exA ? exl(exA, 'Hasır çubuğu ' + exA.mark) : ''}${exK ? exl(exK, 'Baca çubuğu ' + exK.mark) : ''}${exE ? exl(exE, 'Etriye') : ''}</table>` +
      `<p class="note">Formül: büküm payı(θ) = 2·(rc + Φ/2)·tan(θ/2) − rc·θ. Dış ölçü, bükümün dış yüzlerinin kesişim noktasından ölçülür; kancalarda uç düz kısım (kanca boyu) bükümden sonra ölçülür.</p></section>`;
    h += `<section class="card"><h3>Donatı listesi</h3><table><tr><th>Poz</th><th>Etiket</th><th>Tanım</th><th>Şekil (dış ölçüler cm, bükümler °)</th><th class="r">Φ</th><th class="r">Adet</th><th>Bacaklar (cm)</th><th>Büküm açıları</th><th class="r">Büküm payı</th><th class="r">Kesim boyu (cm)</th><th class="r">Toplam (m)</th><th class="r">kg</th></tr>` +
      bars.map((b) => `<tr><td><b>${b.pos}</b></td><td>${b.mark}</td><td>${b.desc}</td><td><div class="shape">${D.barShape(b)}</div></td><td class="r">${b.phi}</td><td class="r">${b.count}</td>` +
        `<td>${b.shape.legs.map((x) => f(x, 1)).join(' + ')}</td><td>${nb(b)}</td><td class="r">${f(b.ded, 1)}</td><td class="r"><b>${f(b.cut, 1)}</b></td><td class="r">${f(b.totalLen, 2)}</td><td class="r">${f(b.weight, 1)}</td></tr>`).join('') + `</table>` +

  /* ---- gereken-boyut eğrisi: X değişirken Y en az ne olmalı ---- */
  const dimOf = (k) => DIMS.find((d) => d.k === k);
  function frRange(dx) {
    const F = GZ.fr;
    if (F.xLo == null || F.xHi == null || F.xFor !== dx.k) { F.xLo = dx.rng[0]; F.xHi = dx.rng[1]; F.xFor = dx.k; }
    return [F.xLo, F.xHi];
  }
  function frontierCard() {
    const F = GZ.fr, dx = dimOf(F.x), r = frRange(dx), opt = (sel) => DIMS.map((d) => `<option value="${d.k}" ${d.k === sel ? 'selected' : ''}>${d.n}</option>`).join('');
    return `<section class="card" id="gz-frcard"><h3>Gereken boyut eğrisi – “şu derinlikte taban genişliği ne olmalı?”</h3><p class="aim"><b>Amaç:</b> Bir parametreyi (örn. derinlik T) değiştirirken, <b>tüm tasarım kriterlerini sağlamak için</b> diğer parametrenin (örn. taban genişliği B) en az ne olması gerektiğini görmek. Mavi çizgi her T için gereken en küçük B’dir; çizginin üstü uygun bölgedir. Turuncu çizgi o tasarımın beton hacmidir, işaretli nokta <b>en az betonlu</b> kombinasyondur (optimum). Diğer boyutlar Tasarım sekmesindeki değerlerinde sabit kalır; her noktada ayak ve baca donatısı otomatik seçilir.</p>` +
      `<div class="gzrow" style="grid-template-columns:1.3fr 1.3fr 1fr 1fr 110px"><label class="nm">Değiştireceğiniz (X)<select data-gzfr="x" style="width:100%">${opt(F.x)}</select></label><label class="nm">Gereken (Y)<select data-gzfr="y" style="width:100%">${opt(F.y)}</select></label>` +
      `<label class="nm">X en küçük (${dx.unit})<input type="number" data-gzfr="xLo" value="${r[0]}" style="width:100%"></label><label class="nm">X en büyük (${dx.unit})<input type="number" data-gzfr="xHi" value="${r[1]}" style="width:100%"></label><button class="btn p" data-act="gzFront">Eğriyi çiz</button></div>` +
      `<div class="prog"><i id="gz-fprog"></i></div><div id="gz-front" style="margin-top:8px">${F.res ? frontierHtml(F.res) : '<p class="note">“Eğriyi çiz”e basın (birkaç saniye sürer).</p>'}</div></section>`;
  }
  function cageNote() {
    const sc = E.stubCheck(S, OUT);
    return sc && sc.r.cage > 1 ? `<p class="note" style="color:#A12622">Not: “Cleat donatı kafesine sığma” kontrolü baca genişliğine (A) bağlıdır, B ve T ile değişmez; şimdiki A = ${f(S.geo.A * 1000, 0)} mm için sağlanmıyor (A ≥ ${f(Math.ceil(sc.Areq * 100) * 10, 0)} mm gerekir). Bu eğri o kontrol hariç hesaplanmıştır.</p>` : '';
  }
  const frSig = (xk, yk) => { const om = (obj, pre) => { const c = Object.assign({}, obj); [xk, yk].forEach((k) => { if (k.indexOf(pre + '.') === 0) delete c[k.slice(pre.length + 1)]; }); return c; }; return JSON.stringify({ g: om(S.geo, 'geo'), so: om(S.soil, 'soil'), l: S.loads, o: S.opts, m: S.mat, st: S.stub }); };
  function frontierHtml(R) {
    const dx = dimOf(R.x), dy = dimOf(R.y), sx = dx.mm ? 1000 : 1, sy = dy.mm ? 1000 : 1, fx = (v) => f(v * sx, dx.mm ? 0 : 1), fy = (v) => f(v * sy, dy.mm ? 0 : 1);
    const ok = R.pts.filter((p) => p.y != null), nm1 = (d) => (d.k === 'soil.beta' ? 'β' : d.k.split('.')[1]);
    if (!ok.length) return `<div class="res bad">Taranan aralıkta hiçbir ${dx.n} değeri için ${dy.n}, aranan sınırlar içinde tüm kriterleri sağlamıyor. Sınırlayıcı: ${[...new Set(R.pts.map((p) => p.reason).filter(Boolean))].slice(0, 3).join(' · ') || '–'}.</div>`;
    const mn = ok.reduce((a, b) => (b.concrete < a.concrete ? b : a));
    const stale = R.sig && R.sig !== frSig(R.x, R.y);
    let h = (stale ? '<div class="res warn">Girdiler değişti: bu eğri eski değerlerle hesaplanmıştı. “Eğriyi çiz”e basarak yenileyin.</div>' : '') + D.frontierChart(R.pts, { x: get(S, R.x), y: get(S, R.y), bad: checks(OUT).some((c) => !c.ok) }, dx.n, dy.n, sx, sy, dx.unit, dy.unit);

    if (ok.length < R.pts.length) h += `<p class="note">Kırmızı işaretli X değerlerinde, aranan Y aralığında kriterler sağlanamadı (${[...new Set(R.pts.filter((p) => p.y == null).map((p) => p.reason).filter(Boolean))].slice(0, 2).join(', ')}).</p>`;
    h += cageNote();
    h += `<div style="max-height:340px;overflow:auto;margin-top:8px"><table><tr><th class="r">${nm1(dx)} (${dx.unit})</th><th class="r">gereken ${nm1(dy)} (${dy.unit})</th><th class="r">Beton m³</th><th class="r">Kazı m³</th><th class="r">Donatı kg</th><th>Belirleyici</th><th></th></tr>` +
      R.pts.map((p, i) => p.y == null ? `<tr style="color:#A12622"><td class="r">${fx(p.x)}</td><td class="r" colspan="5">sağlanamıyor – ${p.reason || ''}</td><td></td></tr>` :
        `<tr${p === mn ? ' class="tot"' : ''}><td class="r">${fx(p.x)}</td><td class="r"><b>${fy(p.y)}</b>${p.atLo ? ' (alt sınır)' : ''}</td><td class="r">${f(p.concrete, 2)}</td><td class="r">${f(p.excavation, 1)}</td><td class="r">${f(p.steel, 0)}</td><td>${p.gov.n} %${f(p.gov.v * 100)}</td><td><button class="btn" data-act="gzFrApply" data-i="${i}">uygula</button></td></tr>`).join('') + `</table></div>`;

  function gzFront() {

    SV.frontier(S, F.x, xs, F.y, yLo, yHi, yStep, yTol, (p) => { if (prog) prog.style.width = Math.round(p * 100) + '%'; }).then((pts) => {
      F.res = { x: F.x, y: F.y, pts, sig: frSig(F.x, F.y) }; if (prog) prog.style.width = '100%'; box.innerHTML = frontierHtml(F.res);
    });
  }
  function gzFrApply(i) {

  }
  /* Tasarım sekmesi: şu anki boyutlara göre B ve T için gereken en küçük değer (canlı, diğerleri sabit) */
  let reqTimer = null;
  function reqHint() {
    const box = $('#gz-req'); if (!box) return;
    const gs = GZ.step / 1000;
    const row = (lab, key, other, lo, hi) => {
      const x = get(S, other), raw = SV.minY(S, other, x, key, lo, hi, 0.1, 0.01), cur = get(S, key);
      if (raw.y == null) return `<tr><td>${lab}</td><td class="r" colspan="3" style="color:#A12622">bu aralıkta sağlanamıyor (${raw.reason || '–'})</td></tr>`;
      const g = SV.minY(S, other, x, key, Math.ceil(lo / gs - 1e-9) * gs, hi, gs, gs * 1.5);
      const need = Math.round((g.y != null ? Math.round(g.y / gs) * gs : Math.ceil(raw.y / gs - 1e-9) * gs) * 1000) / 1000, curMm = Math.round(cur * 1000), needMm = Math.round(need * 1000);
      const under = curMm < needMm, over = curMm >= needMm + GZ.step - 0.5;      // over design: gereken yuvarlak değerin en az bir adım üstünde

      return `<tr><td>${lab}</td><td class="r"><b>${f(needMm, 0)} mm</b> <span class="note">(hesaplanan en az ${f(Math.round(raw.y * 1000), 0)} mm)</span></td><td class="r" style="color:${under ? '#A12622' : over ? '#8A5A00' : '#1B6B3F'}">${st}</td><td>${curMm !== needMm ? `<button class="btn" data-act="reqApply" data-k="${key}" data-v="${need}">uygula</button>` : ''}</td></tr>`;
    };
    box.innerHTML = cageNote() + '<table>' + row('Gereken en küçük taban genişliği B (T sabit)', 'geo.B', 'geo.T', 1.5, 6) + row('Gereken en küçük derinlik T (B sabit)', 'geo.T', 'geo.B', 1.5, 6.5) + '</table>';
  }

      const j = JSON.parse(text), arr = Array.isArray(j) ? j : j.designs; let n = 0; const ids = [];
      arr.forEach((x) => {
        if (!x || !x.name || !validState(x.s)) return;
        const same = DESLIB.find((y) => y.id === x.id);
        if (same && skey(same.s) === skey(normState(x.s))) { ids.push(same.id); return; }
        const id = same || !x.id ? newId() : String(x.id);
        DESLIB.push({ id, name: uniqueName(String(x.name) + (same ? ' (içe aktarılan)' : '')), note: String(x.note || ''), savedAt: x.savedAt || new Date().toISOString(), updatedAt: x.updatedAt || new Date().toISOString(), s: normState(x.s) }); ids.push(id); n++;
      });
      if (!ids.length) throw new Error('bos');
      saveDesLib(); renderDesignUi(true);
      if (openAfter) { dsnOpen(ids[0], true); return; }
      DESMSG = { t: n ? 'İçe aktarıldı.' : 'Yeni kayıt bulunamadı (aynı kayıtlar zaten var).', ok: n > 0 }; renderTab();
    } catch (e) {
      if (openAfter) toast('Dosya açılamadı: geçerli bir tasarım dosyası değil.', false); else { DESMSG = { t: 'Dosya okunamadı.', ok: false }; renderTab(); }
    }
  }
  function desImport(file, openAfter) { const rd = new FileReader(); rd.onload = () => desImportText(rd.result, openAfter); rd.readAsText(file); }
  const FILETYPES = [{ description: 'Temel hesap tasarımı (.json)', accept: { 'application/json': ['.json'] } }];
  /* güncel tasarımı bilgisayara dosya olarak kaydet (Chrome/Edge: klasör ve ad seçilir; diğer tarayıcılarda indirilenler klasörüne iner) */
  async function dsnSaveFile() {
    const r = curRec(), now = new Date().toISOString();
    const rec = { id: r ? r.id : newId(), name: r ? r.name : defaultName(), note: r ? (r.note || '') : '', savedAt: r ? r.savedAt : now, updatedAt: now, s: snap() };
    const base = rec.name.replace(/[^\p{L}\p{N}\-]+/gu, '_'), body = JSON.stringify({ app: 'temel-hesap', version: 1, designs: [rec] }, null, 1);
    if (window.showSaveFilePicker) {
      try { const h = await window.showSaveFilePicker({ suggestedName: base + '.json', types: FILETYPES }); const w = await h.createWritable(); await w.write(body); await w.close(); toast('Dosyaya kaydedildi:', h.name); }
      catch (e) { if (e && e.name !== 'AbortError') toast('Dosya kaydedilemedi.', false); }
    } else { desExport([rec], base); toast('Dosya indirilenler klasörüne indirildi:', base + '.json'); }
  }
  /* bilgisayardan bir tasarım dosyası aç */
  async function dsnOpenFile() {
    if (window.showOpenFilePicker) {
      try { const [h] = await window.showOpenFilePicker({ types: FILETYPES }); desImportText(await (await h.getFile()).text(), true); }
      catch (e) { if (e && e.name !== 'AbortError') toast('Dosya açılamadı: geçerli bir tasarım dosyası değil.', false); }
    } else { const fi = $('#desOpenFile'); if (fi) fi.click(); }
  }
  const saveBar = () => `<div class="sbar"><button class="btn p" data-act="dsnSaveDlg">💾 Bu tasarımı kaydet</button></div>`;
  function tabKayit() {
    const list = desSorted(), cur = curRec(), d = dirty();
    const rows = list.map((r) => {
      const s = r.s, sm = sumOf(s), open = r.id === CURID;
      const chk = sm.ok ? (sm.bad ? `<span style="color:#A12622;font-weight:600">✘ ${sm.bad}</span>` : '<span style="color:#1B6B3F;font-weight:600">✔</span>') : '–';
      return `<tr class="${open ? 'tot' : ''}"><td><b translate="no">${escH(r.name)}</b>${r.note ? `<div class="note" translate="no">${escH(r.note)}</div>` : ''}</td>` +
        `<td>${towerCell(s.tower)} · <span translate="no">${escH(s.cls)}</span></td><td class="r">${f(s.geo.B, 2)} × ${f(s.geo.T, 2)}</td>` +
        `<td class="r">${sm.ok ? f(sm.conc, 1) : '–'}</td><td class="r">${sm.ok ? f(sm.steel, 0) : '–'}</td><td class="r">${sm.ok ? f(sm.exc, 1) : '–'}</td><td>${chk}</td>` +
        `<td style="font-size:12px;color:var(--mut)">${new Date(r.updatedAt || r.savedAt || Date.now()).toLocaleString(LOC(), { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' })}</td>` +
        `<td>${open ? `<b style="color:#1B6B3F">Açık</b>${d ? ' <span style="color:#C25E00">· değişti</span>' : ''}` : ''}</td>` +
        `<td style="min-width:170px;line-height:2"><button class="btn p" data-act="dsnOpen" data-id="${escH(r.id)}">Aç</button> <button class="btn" data-act="dsnDup" data-id="${escH(r.id)}">Kopyala</button> <button class="btn" data-act="dsnEdit" data-id="${escH(r.id)}">Adı düzenle</button> <button class="btn" data-act="dsnExport" data-id="${escH(r.id)}">İndir</button> <button class="btn" data-act="dsnDel" data-id="${escH(r.id)}">Sil</button></td></tr>`;
    }).join('');
    return `<section class="card"><h3>Kayıtlı tasarımlar</h3><p class="aim"><b>Amaç:</b> Güncel tasarımı (direk, zemin, yükler, stub, boyutlar, donatı ve ayarlar) bir adla kaydedip sonra tek tıkla yeniden açmak. Benzer tasarımlar için aynı girdileri tekrar girmeyin: bir kaydı açın, değiştirin ve “Güncelle” ya da “Yeni kayıt olarak kaydet” deyin. Kayıtlar bu tarayıcıda saklanır; başka bilgisayara taşımak için indirin ve içe aktarın.</p>` +
      `<div id="desMsg">${DESMSG ? `<div class="res ${DESMSG.ok ? 'ok' : 'bad'}">${DESMSG.t}</div>` : ''}</div>` +
      `<div class="sbar"><button class="btn p" data-act="dsnSaveDlg">💾 Güncel tasarımı kaydet</button><button class="btn" data-act="dsnSaveFile" title="Güncel tasarımı bilgisayarınızda istediğiniz klasöre dosya olarak kaydeder">💻 Dosyaya kaydet</button><button class="btn" data-act="dsnOpenFile" title="Bilgisayarınızdan bir tasarım dosyası açar">💻 Dosyadan aç</button>${cur ? `<span class="note">Açık kayıt: <b translate="no">${escH(cur.name)}</b>${d ? ' · değişiklik var' : ''}</span>` : ''}</div>` +
      (list.length ? `<div style="overflow-x:auto"><table><tr><th>Ad</th><th>Direk · zemin</th><th class="r">B × T (m)</th><th class="r">Beton (m³)</th><th class="r">Donatı (kg)</th><th class="r">Kazı (m³)</th><th>Kontroller</th><th>Kayıt</th><th>Durum</th><th></th></tr>${rows}</table></div><p class="note">Beton, donatı ve kazı direk başınadır (4 ayak). “Kontroller” sütunu kayıttaki tasarımın sağlanmayan kontrol sayısını gösterir.</p>` : '<p class="note">Henüz kayıtlı tasarım yok. Üstteki Kaydet düğmesiyle güncel tasarımı kaydedin.</p>') +
      `<div class="btnrow" style="margin-top:8px"><button class="btn" data-act="desExportAll">Tümünü indir</button><button class="btn" data-act="desImport">İçe aktar</button><input type="file" id="desFile" accept=".json,application/json" style="display:none"></div></section>`;
  }
  function detachDesign() { if (CURID) { setCur(null); renderDesignUi(true); } }
  const guardDirty = () => !(CURID && dirty()) || confirm(I18N.tr('Açık tasarımda kaydedilmemiş değişiklikler var. Yine de başka bir direk ya da zemin yüklensin mi?'));
  const TABS = [['girdi', 'Girdiler', tabGirdi], ['tasarim', 'Tasarım', tabTasarim], ['opt', 'Optimizasyon', tabOpt], ['adim', 'Hesap adımları', tabHesap], ['liste', 'Donatı ve metraj', tabListe], ['pafta', 'Paftalar (A3)', tabPafta], ['kayit', 'Kayıtlı tasarımlar', tabKayit], ['direk', 'Direk kütüphanesi', tabDirek], ['zemin', 'Zemin kütüphanesi', tabZemin], ['dil', '🌐 Dil / Language', tabDil]];
  function renderTabs() {
    $('#tabs').innerHTML = TABS.map((t) => `<button data-tab="${t[0]}" class="${t[0] === TAB ? 'on' : ''}">${t[1]}</button>`).join('');
  }
  function renderTab() {

    const cur = TABS.find((t) => t[0] === TAB);
    $('#t-' + TAB).innerHTML = cur[2]();
    renderTabs();
    if (TAB === 'tasarim') gzUpdate();
    if (TAB === 'opt') gzSweep();
    const sn = $('#soilNote'); if (sn) sn.textContent = (soilAll()[S.cls] || {}).note || '';
    window.scrollTo(0, keepY);
  }
  function csv() {
    const L = [['Poz', 'Tanım', 'Çap mm', 'Adet', 'Bacaklar cm', 'Bükümler °', 'Kesim boyu cm', 'Toplam m', 'kg'].map((x) => I18N.tr(x))];
    RBD.bars.forEach((b) => L.push([b.mark, I18N.tr(b.desc), b.phi, b.count, b.shape.legs.map((x) => x.toFixed(1)).join('+'), b.shape.bends.join('/'), b.cut.toFixed(1), b.totalLen.toFixed(2), b.weight.toFixed(1)]));
    const blob = new Blob(['﻿' + L.map((r) => r.map((x) => '"' + String(x).replace(/"/g, '""') + '"').join(';')).join('\n')], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'donati_listesi.csv'; a.click();
  }

  /* ---------------- açıklama kutusu (metin seçili dile çevrilir) ---------------- */
  let TIPEL = null, TIPON = null;
  function tipShow(el, e) {
    if (!TIPEL) { TIPEL = document.createElement('div'); TIPEL.id = 'tip'; TIPEL.setAttribute('data-nolang', '1'); document.body.appendChild(TIPEL); }
    if (TIPON !== el) { TIPON = el; TIPEL.innerHTML = `<div>${escH(I18N.tr(el.getAttribute('data-tip')))}</div>` + (window.TipFig ? window.TipFig.fig(el.getAttribute('data-tipk')) : ''); TIPEL.style.display = 'block'; }
    const w = TIPEL.offsetWidth, h = TIPEL.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
    let x = e.clientX + 16, y = e.clientY + 18;
    if (x + w > vw - 8) x = Math.max(8, e.clientX - w - 12);
    if (y + h > vh - 8) y = Math.max(8, e.clientY - h - 12);
    TIPEL.style.left = x + 'px'; TIPEL.style.top = y + 'px';
  }
  const tipHide = () => { TIPON = null; if (TIPEL) TIPEL.style.display = 'none'; };

  document.addEventListener('mousedown', tipHide); document.addEventListener('scroll', tipHide, true);

  /* ---------------- olaylar ---------------- */
  document.addEventListener('input', (e) => {
    if (e.target.dataset && e.target.dataset.dl) { DLG[e.target.dataset.dl] = e.target.value; return; }
    if (e.target.dataset && e.target.dataset.tf) { const t = e.target, k = t.dataset.tf; const v = t.type === 'checkbox' ? t.checked : (t.type === 'number' ? parseFloat(t.value) : t.value); if (t.type === 'number' && !isFinite(v)) return; set(TOWERFORM, k, v); if (k === 'loads.mode') { loadDefaults(v); renderTab(); } return; }
    if (e.target.dataset && e.target.dataset.cs) { const k = e.target.dataset.cs; CAGESEL[k] = e.target.value; if (k === 'pos') CAGESEL.tag = ''; cageApplySel(); const bx = $('#cageSel'); if (bx) bx.innerHTML = cageSelHtml(); viewDraw('cage3d'); return; }
    if (e.target.dataset && e.target.dataset.sf) { const k = e.target.dataset.sf; SOILFORM[k] = e.target.type === 'checkbox' ? e.target.checked : (e.target.type === 'number' ? parseFloat(e.target.value) : e.target.value); return; }
    if (e.target.dataset && e.target.dataset.paf) { PAF[e.target.dataset.paf] = e.target.value; SHEET = 1; renderTab(); return; }
    if (e.target.dataset && e.target.dataset.bd) { const m = e.target.dataset.bd.split('.'), b = (S.loads.bodies || [])[+m[0]]; if (!b) return; b[m[1]] = m[1] === 'name' ? e.target.value : (parseFloat(e.target.value) || 0); recalc(); return; }
    const k = e.target.dataset && e.target.dataset.k;
    if (!k) return;
    let v = e.target.type === 'checkbox' ? e.target.checked : e.target.type === 'number' ? parseFloat(e.target.value) : e.target.value;  // metin/seçim: olduğu gibi

    recalc();
  });
  document.addEventListener('click', (e) => {
    const mb = e.target.closest('[data-gzmode]');
    if (mb) { const k = mb.dataset.gzmode, m = GZ.mode[k] || 'manual'; GZ.mode[k] = m === 'manual' ? 'lock' : m === 'lock' ? 'auto' : 'manual'; renderTab(); return; }
    const lb = e.target.closest('[data-lang]');
    if (lb) { I18N.setLang(lb.dataset.lang); return; }
    const t = e.target.closest('[data-tab]');
    if (t) { TAB = t.dataset.tab; renderTab(); window.scrollTo(0, 0); return; }
    const a = e.target.closest('[data-act]');
    if (!a) return;
    if (a.dataset.act === 'dsnSaveDlg') dlgOpen('save');
    if (a.dataset.act === 'dsnSaveFile') dsnSaveFile();
    if (a.dataset.act === 'dsnOpenFile') dsnOpenFile();
    if (a.dataset.act === 'dlgNew') dlgCommit(true);
    if (a.dataset.act === 'dlgUpdate') dlgCommit(false);
    if (a.dataset.act === 'dlgOk') dlgCommit(false);
    if (a.dataset.act === 'dlgFile') { dlgCommit(false); if (!DLG.mode) dsnSaveFile(); }

    if (a.dataset.act === 'soil') { applyClass(a.dataset.v); $('#selClass').value = S.cls; renderSide(); recalc(); }

    if (a.dataset.act === 'towerSave') towerSave();
    if (a.dataset.act === 'towerNew') { tfSet(tfNew()); TOWERMSG = null; renderTab(); }
    if (a.dataset.act === 'towerFill') { tfSet({ orig: null, name: '', loads: clone(S.loads), stub: clone(S.stub), geo: GEOKEYS.reduce((g, k) => { g[k] = S.geo[k]; return g; }, {}) }); loadDefaults(TOWERFORM.loads.mode); TOWERMSG = null; renderTab(); }

    if (a.dataset.act === 'bodyAdd') { (S.loads.bodies = S.loads.bodies || []).push({ name: '', legX: 0, legY: 0, Z: 0 }); renderTab(); }

    if (a.dataset.act === 'soilExport') soilExport();

    if (a.dataset.act === 'gzSolve') gzSolve();

  });
  document.addEventListener('click', (e) => { if (e.target.id === 'dlg') dlgClose(); });      // diyaloğun dışına tıklayınca kapanır
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 's') { e.preventDefault(); if (!DLG.mode) dlgOpen('save'); return; }
    if (!DLG.mode) return;
    if (e.key === 'Escape') dlgClose();

  document.addEventListener('change', (e) => { if (e.target.id === 'soilFile' && e.target.files[0]) soilImport(e.target.files[0]); if (e.target.id === 'towerFile' && e.target.files[0]) towerImport(e.target.files[0]); });
  document.addEventListener('toggle', (e) => { const d = e.target; if (d && d.dataset && d.dataset.s != null && d.tagName === 'DETAILS') OPEN[d.dataset.s] = d.open; }, true);

  $('#selTower').addEventListener('change', (e) => {
    const v = e.target.value; if (v === 'custom') { S.tower = 'custom'; persist(); return; }

  });
  $('#selClass').addEventListener('change', (e) => {
    const cls = e.target.value, sl = soilAll()[cls];

    if (S.tower === 'custom' || (sl && !sl.builtin)) { applyClass(cls); } else { if (!guardDirty()) { e.target.value = S.cls; return; } detachDesign(); loadPreset(S.tower, cls); }      // kendi zemin tipleri geometriyi sıfırlamaz

  });

  /* ---------------- başlat ---------------- */
  init();
  fillTowerSelect();
  fillClassSelect();
  $('#selTower').value = S.tower; $('#selClass').value = S.cls;
  renderSide();
  recalc();
  I18N.onChange(() => { renderTabs(); renderTab(); recalc(); });
  I18N.init();
  window.__S = () => S; window.__OUT = () => OUT; window.__RBD = () => RBD;
})();
